<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050914" />
  <meta name="robots" content="noindex" />
  <title>LexiGo — восстановление подключения</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); background: #050914; color: #f7f9ff; }
    main { width: min(560px, 100%); padding: clamp(24px, 6vw, 36px); border: 1px solid #2b3854; border-radius: 24px; background: #0c1324; box-shadow: 0 24px 80px rgba(0, 0, 0, 0.32); }
    .mark { width: 52px; height: 52px; display: grid; place-items: center; margin-bottom: 20px; border: 1px solid #64748b; border-radius: 16px; font-size: 28px; font-weight: 800; }
    small { color: #9fb0cc; letter-spacing: 0.14em; font-weight: 700; }
    h1 { margin: 12px 0; font-size: clamp(30px, 8vw, 46px); line-height: 1.08; }
    p { margin: 0; color: #b9c5d9; font-size: 17px; line-height: 1.65; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    button, a { min-height: 46px; display: inline-flex; align-items: center; justify-content: center; padding: 0 18px; border-radius: 13px; font: inherit; font-weight: 750; text-decoration: none; cursor: pointer; }
    button { border: 0; background: #f7f9ff; color: #07101f; }
    a { border: 1px solid #52617d; color: #f7f9ff; }
    button:focus-visible, a:focus-visible { outline: 3px solid #8ec5ff; outline-offset: 3px; }
    #connection { display: block; margin-top: 18px; color: #8fa0bd; }
  </style>
</head>
<body>
  <main role="main">
    <div class="mark" aria-hidden="true">!</div>
    <small>БЕЗОПАСНОЕ ВОССТАНОВЛЕНИЕ</small>
    <h1 id="title">LexiGo временно недоступен</h1>
    <p id="description">Не удалось получить актуальную страницу. Сохранённые ответы и прогресс находятся на сервере. Повторите подключение после восстановления сети.</p>
    <div class="actions">
      <button id="retry" type="button">Повторить загрузку</button>
      <a href="/">На главную</a>
    </div>
    <span id="connection" role="status" aria-live="polite"></span>
  </main>
  <script>
    (() => {
      "use strict";
      const parameters = new URLSearchParams(window.location.search);
      const reason = parameters.get("reason");
      const rawReturn = parameters.get("return");
      let returnTarget = "/";

      if (rawReturn) {
        try {
          const candidate = new URL(rawReturn, window.location.origin);
          if (candidate.origin === window.location.origin && candidate.pathname !== "/offline.html") {
            candidate.searchParams.delete("__lexigo_build");
            returnTarget = candidate.pathname + candidate.search + candidate.hash;
          }
        } catch {
          returnTarget = "/";
        }
      }

      if (reason === "stale-build") {
        document.getElementById("title").textContent = "Обновляем LexiGo до актуальной версии";
        document.getElementById("description").textContent = "Браузер повторно получил страницу предыдущей версии. Автоматическое обновление остановлено, чтобы не создать цикл перезагрузки. Текущий маршрут сохранён.";
      }

      const connection = document.getElementById("connection");
      const updateConnection = () => {
        connection.textContent = navigator.onLine
          ? "Соединение доступно. Можно повторить загрузку."
          : "Нет подключения к сети. LexiGo повторит переход после восстановления соединения.";
      };
      const retry = () => window.location.replace(returnTarget);

      document.getElementById("retry").addEventListener("click", retry);
      window.addEventListener("online", retry, { once: true });
      window.addEventListener("offline", updateConnection);
      updateConnection();
    })();
  </script>
</body>
</html>
