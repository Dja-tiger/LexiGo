<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#10211d" />
  <meta name="robots" content="noindex" />
  <title>LexiGo — восстановление подключения</title>
  <link rel="stylesheet" href="/offline.css" />
</head>
<body>
  <main role="main">
    <div class="mark" aria-hidden="true">!</div>
    <small>БЕЗОПАСНОЕ ВОССТАНОВЛЕНИЕ</small>
    <h1 id="title">LexiGo временно недоступен</h1>
    <p id="description">Не удалось получить актуальную страницу. Сохранённые ответы и прогресс находятся на сервере. Повторите подключение после восстановления сети.</p>
    <div class="actions">
      <button id="retry" type="button">Повторить загрузку</button>
      <a href="/">На главную</a>
    </div>
    <span id="connection" role="status" aria-live="polite"></span>
  </main>
  <script src="/offline.js" defer></script>
</body>
</html>
