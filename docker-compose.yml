name: lexigo-local

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lexigo}
      POSTGRES_USER: ${POSTGRES_USER:-lexigo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lexigo_local_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lexigo} -d ${POSTGRES_DB:-lexigo}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.0-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgres://${POSTGRES_USER:-lexigo}:${POSTGRES_PASSWORD:-lexigo_local_password}@postgres:5432/${POSTGRES_DB:-lexigo}?sslmode=disable
      REDIS_ADDR: redis:6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/lexigo", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://api:8080
    environment:
      API_INTERNAL_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
