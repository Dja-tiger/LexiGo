openapi: 3.1.0
info:
  title: LexiGo API
  version: 0.8.0
  description: API персонального тренажёра технического английского.
servers:
  - url: http://localhost:8080
    description: local
paths:
  /health/live:
    get:
      operationId: live
      tags: [health]
      responses:
        "200":
          description: Процесс работает.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /health/ready:
    get:
      operationId: ready
      tags: [health]
      responses:
        "200":
          description: PostgreSQL и Redis доступны.
        "503":
          description: Одна из зависимостей недоступна.
  /api/v1/catalog/metadata:
    get:
      operationId: catalogMetadata
      tags: [catalog]
      summary: Публичные агрегаты и версия каталога.
      parameters:
        - in: header
          name: If-None-Match
          schema:
            type: string
      responses:
        "200":
          description: Актуальный snapshot каталога.
          headers:
            ETag:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogMetadata"
        "304":
          description: Версия каталога не изменилась.
  /api/v1/auth/register:
    post:
      operationId: register
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Пользователь создан. Refresh-сессия установлена через HttpOnly cookie, CSRF-токен — через отдельную readable cookie.
          headers:
            Set-Cookie:
              description: Cookies lexigo_refresh и lexigo_csrf.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Авторизация выполнена. Refresh-сессия установлена через HttpOnly cookie.
          headers:
            Set-Cookie:
              description: Cookies lexigo_refresh и lexigo_csrf.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Запросить одноразовую ссылку восстановления пароля.
      description: Ответ одинаков для существующего и отсутствующего аккаунта и не раскрывает регистрацию email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "202":
          description: Запрос принят. Письмо отправляется только для существующего аккаунта.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [auth]
      summary: Установить новый пароль по одноразовому токену.
      description: Успешная операция отзывает все refresh-сессии пользователя.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
      responses:
        "204":
          description: Пароль изменён, токен использован, активные сессии отозваны.
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      tags: [auth]
      description: Ротирует refresh token из HttpOnly cookie и выдаёт новый access token. Тело запроса отсутствует.
      security:
        - refreshCookie: []
          csrfHeader: []
      responses:
        "200":
          description: Сессия обновлена, refresh token и CSRF token ротированы через Set-Cookie.
          headers:
            Set-Cookie:
              description: Обновлённые cookies lexigo_refresh и lexigo_csrf.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      description: Отзывает всё семейство refresh-токенов текущего устройства и удаляет session cookies.
      security:
        - refreshCookie: []
          csrfHeader: []
      responses:
        "204":
          description: Сессия отозвана или уже недействительна; cookies удалены.
          headers:
            Set-Cookie:
              description: Expired cookies lexigo_refresh и lexigo_csrf.
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/me:
    get:
      operationId: me
      tags: [users]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Текущий пользователь.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/words:
    get:
      operationId: listWords
      tags: [learning]
      summary: Paginated catalog assigned to the current user.
      security:
        - bearerAuth: []
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [word, phrase, all], default: word } }
        - { name: source, in: query, schema: { type: string, enum: [mixed, noun, verb, adjective, phrases, daily-life, travel, data-engineering, backend] } }
        - { name: topic, in: query, schema: { type: string, maxLength: 120 } }
        - { name: query, in: query, schema: { type: string, maxLength: 120 } }
        - { name: status, in: query, schema: { type: string, enum: [new, learning, review, mastered] } }
        - { name: sort, in: query, schema: { type: string, enum: [default, az, za], default: default } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        "200":
          description: One bounded catalog page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/words/due:
    get:
      operationId: listDueWords
      tags: [learning]
      summary: Paginated items whose review time has arrived.
      security:
        - bearerAuth: []
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [word, phrase, all], default: word } }
        - { name: source, in: query, schema: { type: string, enum: [mixed, noun, verb, adjective, phrases, daily-life, travel, data-engineering, backend] } }
        - { name: topic, in: query, schema: { type: string, maxLength: 120 } }
        - { name: query, in: query, schema: { type: string, maxLength: 120 } }
        - { name: status, in: query, schema: { type: string, enum: [new, learning, review, mastered] } }
        - { name: sort, in: query, schema: { type: string, enum: [default, az, za], default: default } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        "200":
          description: One bounded due page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/words/{wordID}:
    get:
      operationId: getWord
      tags: [learning]
      summary: Full catalog card assigned to the current user.
      security:
        - bearerAuth: []
      parameters:
        - name: wordID
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Full word or term card with the current learning status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserWord"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Catalog item is not assigned to the current user.
  /api/v1/words/{wordID}/review:
    post:
      operationId: reviewWord
      tags: [learning]
      security:
        - bearerAuth: []
      parameters:
        - name: wordID
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "200":
          description: Результат сохранён, рассчитана следующая дата повторения.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Слово не назначено текущему пользователю.
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/lessons/preview:
    post:
      operationId: previewLesson
      tags: [learning]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonPreviewRequest"
      responses:
        "200":
          description: Детерминированный состав будущего урока без создания session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonPreview"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/lessons:
    post:
      operationId: createLesson
      tags: [learning]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonCreateRequest"
      responses:
        "201":
          description: Создан новый серверный урок с version=1.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonSession"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/lessons/active:
    get:
      operationId: getActiveLesson
      tags: [learning]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Snapshot активного урока и фактическая серверная позиция.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonSession"
        "404":
          description: Активный урок отсутствует.
  /api/v1/lessons/{lessonID}:
    delete:
      operationId: discardLesson
      tags: [learning]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LessonID"
        - name: If-Match
          in: header
          required: true
          description: Текущая lesson version, например `"3"`.
          schema:
            type: string
      responses:
        "204":
          description: Урок сброшен; version атомарно увеличена.
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: If-Match не содержит положительную lesson version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "428":
          description: If-Match отсутствует.
  /api/v1/lessons/{lessonID}/words/{wordID}/review:
    post:
      operationId: reviewLessonWord
      tags: [learning]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LessonID"
        - name: wordID
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonReviewRequest"
      responses:
        "200":
          description: Review и переход к следующей серверной позиции сохранены атомарно.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonReviewResult"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/progress:
    get:
      operationId: getProgress
      tags: [learning]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TimezoneOffsetMinutes"
      responses:
        "200":
          description: Текущий прогресс, очередь и серии занятий.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/progress/goal:
    put:
      operationId: setDailyGoal
      tags: [learning]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TimezoneOffsetMinutes"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalRequest"
      responses:
        "200":
          description: Дневная цель сохранена; возвращён обновлённый прогресс.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: lexigo_refresh
      description: HttpOnly refresh token cookie. Browser JavaScript не имеет к ней доступа.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Значение readable cookie lexigo_csrf для double-submit CSRF validation.
  parameters:
    LessonID:
      name: lessonID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TimezoneOffsetMinutes:
      name: timezoneOffsetMinutes
      in: query
      required: false
      description: Значение JavaScript Date.getTimezoneOffset; используется для дневной статистики.
      schema:
        type: integer
        minimum: -840
        maximum: 840
        default: 0
  responses:
    BadRequest:
      description: Запрос содержит некорректный JSON, недействительный или использованный reset token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Превышен лимит запросов для IP и endpoint.
      headers:
        Retry-After:
          schema: { type: integer, const: 60 }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Неверные учётные данные или токен.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Запрос не прошёл origin или CSRF validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Конфликт уникальности.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Ошибка валидации.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    CatalogMetadata:
      type: object
      required: [catalogVersion, updatedAt, totals, sources, topics]
      properties:
        catalogVersion: { type: string }
        updatedAt: { type: string, format: date-time }
        totals: { $ref: "#/components/schemas/CatalogTotals" }
        sources: { $ref: "#/components/schemas/CatalogSourceTotals" }
        topics:
          type: array
          items: { $ref: "#/components/schemas/CatalogTopicTotal" }
    CatalogTotals:
      type: object
      required: [items, words, phrases]
      properties:
        items: { type: integer, minimum: 0 }
        words: { type: integer, minimum: 0 }
        phrases: { type: integer, minimum: 0 }
    CatalogSourceTotals:
      type: object
      required: [mixed, noun, verb, adjective, phrases, dailyLife, travel, dataEngineering, backend]
      properties:
        mixed: { type: integer, minimum: 0 }
        noun: { type: integer, minimum: 0 }
        verb: { type: integer, minimum: 0 }
        adjective: { type: integer, minimum: 0 }
        phrases: { type: integer, minimum: 0 }
        dailyLife: { type: integer, minimum: 0 }
        travel: { type: integer, minimum: 0 }
        dataEngineering: { type: integer, minimum: 0 }
        backend: { type: integer, minimum: 0 }
    CatalogTopicTotal:
      type: object
      required: [topic, count, words, phrases]
      properties:
        topic: { type: string }
        count: { type: integer, minimum: 0 }
        words: { type: integer, minimum: 0 }
        phrases: { type: integer, minimum: 0 }
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          examples: [ok]
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
          maxLength: 72
        displayName:
          type: string
          minLength: 2
          maxLength: 80
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          description: Ответ endpoint не раскрывает, зарегистрирован ли адрес.
    PasswordResetConfirmRequest:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          description: Одноразовый base64url bearer token из письма.
        newPassword:
          type: string
          minLength: 10
          maxLength: 72
    AcceptedResponse:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean
          const: true
    AuthResponse:
      type: object
      required: [user, tokens]
      properties:
        user:
          $ref: "#/components/schemas/User"
        tokens:
          $ref: "#/components/schemas/TokenPair"
    TokenPair:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
          description: Короткоживущий bearer token. Клиент хранит его только в памяти процесса.
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          description: Срок действия access token в секундах.
    User:
      type: object
      required: [id, email, displayName, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
    CatalogPage:
      type: object
      required: [items, count, total, page, pageSize, totalPages, hasPrevious, hasNext]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/UserWord"
        count: { type: integer, minimum: 0, maximum: 100 }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        totalPages: { type: integer, minimum: 0 }
        hasPrevious: { type: boolean }
        hasNext: { type: boolean }
    UserWord:
      type: object
      required: [id, lemma, translation, status, dueAt]
      properties:
        id:
          type: integer
          format: int64
        lemma:
          type: string
        translation:
          type: string
        phonetic:
          type: string
        partOfSpeech:
          type: string
        topic:
          type: string
        aliases:
          type: array
          items:
            type: string
        examples:
          type: array
          items:
            type: string
        note:
          type: string
        status:
          type: string
          enum: [new, learning, review, mastered]
        easiness:
          type: number
        intervalDays:
          type: integer
        repetitions:
          type: integer
        dueAt:
          type: string
          format: date-time
        lastReviewedAt:
          type: [string, "null"]
          format: date-time
    ReviewRequest:
      type: object
      required: [rating, timezoneOffsetMinutes]
      properties:
        rating:
          type: string
          enum: [again, almost, known]
        responseMs:
          type: integer
          minimum: 0
          maximum: 3600000
        answerMode:
          type: string
          enum: [study, recall, choice]
        correct:
          type: [boolean, "null"]
          description: Objective correctness for recall/choice. Must be null or omitted for study.
        answerRevealed:
          type: [boolean, "null"]
          description: Whether the answer was visible before persistence. Required as true for study.
        timezoneOffsetMinutes:
          type: integer
          minimum: -840
          maximum: 840
    ReviewResult:
      type: object
      required: [wordId, status, easiness, intervalDays, repetitions, dueAt, lastReviewedAt]
      properties:
        wordId:
          type: integer
          format: int64
        status:
          type: string
          enum: [learning, review, mastered]
        easiness:
          type: number
        intervalDays:
          type: integer
        repetitions:
          type: integer
        dueAt:
          type: string
          format: date-time
        lastReviewedAt:
          type: string
          format: date-time
    LessonCreateRequest:
      type: object
      required: [source, studyMode, lessonSize]
      properties:
        source: { type: string }
        studyMode:
          type: string
          enum: [study, recall, choice]
        lessonSize:
          type: string
          enum: ["15", "30", "60"]
        topic:
          type: string
          maxLength: 120
          description: Optional exact topic filter for the server lesson composer.
        wordIds:
          description: Optional explicit selection for a bounded manual lesson. Omit to use the server composer.
          type: array
          minItems: 1
          maxItems: 60
          uniqueItems: true
          items:
            type: integer
            format: int64
    LessonPreviewRequest:
      type: object
      required: [source, studyMode, lessonSize]
      properties:
        source: { type: string }
        studyMode:
          type: string
          enum: [study, recall, choice]
        lessonSize:
          type: string
          enum: ["15", "30", "60"]
        topic:
          type: string
          maxLength: 120
    LessonComposition:
      type: object
      required: [total, words, phrases, due, new, scheduled, availableWords, availablePhrases]
      properties:
        total: { type: integer, minimum: 0 }
        words: { type: integer, minimum: 0 }
        phrases: { type: integer, minimum: 0 }
        due: { type: integer, minimum: 0 }
        new: { type: integer, minimum: 0 }
        scheduled: { type: integer, minimum: 0 }
        availableWords: { type: integer, minimum: 0 }
        availablePhrases: { type: integer, minimum: 0 }
        fallback:
          type: string
          enum: [words_only, phrases_only, empty]
    LessonPreview:
      type: object
      required: [source, studyMode, lessonSize, composition]
      properties:
        source: { type: string }
        studyMode:
          type: string
          enum: [study, recall, choice]
        lessonSize: { type: string }
        composition:
          $ref: "#/components/schemas/LessonComposition"
    LessonItem:
      type: object
      required: [position, id, kind, lemma, translation, phonetic, partOfSpeech, topic, examples, note, status]
      properties:
        position: { type: integer, minimum: 0 }
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [word, phrase] }
        slug: { type: string }
        lemma: { type: string }
        translation: { type: string }
        phonetic: { type: string }
        partOfSpeech: { type: string }
        topic: { type: string }
        aliases:
          type: array
          items: { type: string }
        examples:
          type: array
          items: { type: string }
        note: { type: string }
        status: { type: string, enum: [new, learning, review, mastered] }
        rating:
          type: [string, "null"]
          enum: [again, almost, known, null]
        reviewedAt:
          type: [string, "null"]
          format: date-time
    LessonSession:
      type: object
      required: [id, source, studyMode, lessonSize, currentIndex, version, status, items, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        source: { type: string }
        studyMode:
          type: string
          enum: [study, recall, choice]
        lessonSize: { type: string }
        currentIndex: { type: integer, minimum: 0 }
        version:
          type: integer
          format: int64
          minimum: 1
          description: Monotonic optimistic-concurrency version.
        status:
          type: string
          enum: [active, completed, discarded]
        items:
          type: array
          items:
            $ref: "#/components/schemas/LessonItem"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LessonReviewRequest:
      allOf:
        - $ref: "#/components/schemas/ReviewRequest"
        - type: object
          required: [lessonVersion]
          properties:
            lessonVersion:
              type: integer
              format: int64
              minimum: 1
    LessonReviewResult:
      allOf:
        - $ref: "#/components/schemas/ReviewResult"
        - type: object
          required: [lessonId, lessonCurrentIndex, lessonVersion, lessonCompleted, lessonReviewedItems, lessonSkippedItems, lessonTotalItems]
          properties:
            lessonId: { type: string, format: uuid }
            lessonCurrentIndex: { type: integer, minimum: 0 }
            lessonVersion: { type: integer, format: int64, minimum: 1 }
            lessonCompleted: { type: boolean }
            lessonReviewedItems: { type: integer, minimum: 0 }
            lessonSkippedItems: { type: integer, minimum: 0 }
            lessonTotalItems: { type: integer, minimum: 1 }
    GoalRequest:
      type: object
      required: [dailyGoal]
      properties:
        dailyGoal:
          type: integer
          minimum: 5
          maximum: 200
    ProgressSummary:
      type: object
      required:
        - dueNow
        - dueWords
        - duePhrases
        - totalWords
        - totalPhrases
        - newWords
        - learningWords
        - reviewWords
        - masteredWords
        - masteredPhrases
        - reviewsToday
        - successfulToday
        - objectiveReviewsToday
        - objectiveSuccessfulToday
        - reviewsTotal
        - dailyGoal
        - currentStreak
        - longestStreak
        - retainedItemsWeek
        - retainedWordsWeek
        - retainedPhrasesWeek
        - eventSchemaVersion
        - modes
      properties:
        dueNow: { type: integer }
        dueWords: { type: integer }
        duePhrases: { type: integer }
        totalWords: { type: integer }
        totalPhrases: { type: integer }
        newWords: { type: integer }
        learningWords: { type: integer }
        reviewWords: { type: integer }
        masteredWords: { type: integer }
        masteredPhrases: { type: integer }
        reviewsToday:
          type: integer
          description: All persisted learning activity, including study exposure.
        successfulToday:
          type: integer
          description: Rolling-deployment compatibility aggregate; use objectiveSuccessfulToday for accurate recall analytics.
        objectiveReviewsToday:
          type: integer
          description: Verified schema-v2 recall and choice attempts; study and legacy events are excluded.
        objectiveSuccessfulToday:
          type: integer
        reviewsTotal: { type: integer }
        dailyGoal: { type: integer }
        currentStreak: { type: integer }
        longestStreak: { type: integer }
        retainedItemsWeek: { type: integer }
        retainedWordsWeek: { type: integer }
        retainedPhrasesWeek: { type: integer }
        eventSchemaVersion:
          type: integer
          const: 2
        modes:
          $ref: "#/components/schemas/ProgressModes"
        nextDueAt:
          type: [string, "null"]
          format: date-time
    ModeProgress:
      type: object
      required: [attemptsToday, successfulToday, attemptsTotal, successfulTotal]
      properties:
        attemptsToday: { type: integer }
        successfulToday: { type: integer }
        attemptsTotal: { type: integer }
        successfulTotal: { type: integer }
    ProgressModes:
      type: object
      required: [study, recall, choice, legacy]
      properties:
        study:
          $ref: "#/components/schemas/ModeProgress"
        recall:
          $ref: "#/components/schemas/ModeProgress"
        choice:
          $ref: "#/components/schemas/ModeProgress"
        legacy:
          $ref: "#/components/schemas/ModeProgress"
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            field:
              type: string
              description: Опциональное стабильное имя поля формы, связанное с ошибкой.
              enum: [email, password, displayName, passwordConfirmation, token]
