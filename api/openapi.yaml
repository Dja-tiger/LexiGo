openapi: 3.1.0
info:
  title: LexiGo API
  version: 0.2.0
  description: API персонального тренажёра технического английского.
servers:
  - url: http://localhost:8080
    description: local
paths:
  /health/live:
    get:
      operationId: live
      tags: [health]
      responses:
        "200":
          description: Процесс работает.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /health/ready:
    get:
      operationId: ready
      tags: [health]
      responses:
        "200":
          description: PostgreSQL и Redis доступны.
        "503":
          description: Одна из зависимостей недоступна.
  /api/v1/auth/register:
    post:
      operationId: register
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Пользователь создан.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Авторизация выполнена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Токены обновлены с обязательной ротацией refresh token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Refresh token отозван или уже недействителен.
  /api/v1/me:
    get:
      operationId: me
      tags: [users]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Текущий пользователь.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/words/due:
    get:
      operationId: listDueWords
      tags: [learning]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 30
      responses:
        "200":
          description: Слова, срок повторения которых наступил.
          content:
            application/json:
              schema:
                type: object
                required: [items, count]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserWord"
                  count:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/words/{wordID}/review:
    post:
      operationId: reviewWord
      tags: [learning]
      security:
        - bearerAuth: []
      parameters:
        - name: wordID
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "200":
          description: Результат сохранён, рассчитана следующая дата повторения.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Слово не назначено текущему пользователю.
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/progress:
    get:
      operationId: getProgress
      tags: [learning]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TimezoneOffsetMinutes"
      responses:
        "200":
          description: Текущий прогресс, очередь и серии занятий.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/progress/goal:
    put:
      operationId: setDailyGoal
      tags: [learning]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TimezoneOffsetMinutes"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalRequest"
      responses:
        "200":
          description: Дневная цель сохранена; возвращён обновлённый прогресс.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TimezoneOffsetMinutes:
      name: timezoneOffsetMinutes
      in: query
      required: false
      description: Значение JavaScript Date.getTimezoneOffset; используется для дневной статистики.
      schema:
        type: integer
        minimum: -840
        maximum: 840
        default: 0
  responses:
    Unauthorized:
      description: Неверные учётные данные или токен.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Конфликт уникальности.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Ошибка валидации.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          examples: [ok]
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
          maxLength: 72
        displayName:
          type: string
          maxLength: 100
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    AuthResponse:
      type: object
      required: [user, tokens]
      properties:
        user:
          $ref: "#/components/schemas/User"
        tokens:
          $ref: "#/components/schemas/TokenPair"
    TokenPair:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          description: Срок действия access token в секундах.
    User:
      type: object
      required: [id, email, displayName, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
    UserWord:
      type: object
      required: [id, lemma, translation, status, dueAt]
      properties:
        id:
          type: integer
          format: int64
        lemma:
          type: string
        translation:
          type: string
        phonetic:
          type: string
        partOfSpeech:
          type: string
        topic:
          type: string
        examples:
          type: array
          items:
            type: string
        note:
          type: string
        status:
          type: string
          enum: [new, learning, review, mastered]
        easiness:
          type: number
        intervalDays:
          type: integer
        repetitions:
          type: integer
        dueAt:
          type: string
          format: date-time
        lastReviewedAt:
          type: [string, "null"]
          format: date-time
    ReviewRequest:
      type: object
      required: [rating, timezoneOffsetMinutes]
      properties:
        rating:
          type: string
          enum: [again, almost, known]
        responseMs:
          type: integer
          minimum: 0
          maximum: 3600000
        answerMode:
          type: string
          enum: [recall, choice]
        correct:
          type: [boolean, "null"]
        timezoneOffsetMinutes:
          type: integer
          minimum: -840
          maximum: 840
    ReviewResult:
      type: object
      required: [wordId, status, easiness, intervalDays, repetitions, dueAt, lastReviewedAt]
      properties:
        wordId:
          type: integer
          format: int64
        status:
          type: string
          enum: [learning, review, mastered]
        easiness:
          type: number
        intervalDays:
          type: integer
        repetitions:
          type: integer
        dueAt:
          type: string
          format: date-time
        lastReviewedAt:
          type: string
          format: date-time
    GoalRequest:
      type: object
      required: [dailyGoal]
      properties:
        dailyGoal:
          type: integer
          minimum: 5
          maximum: 200
    ProgressSummary:
      type: object
      required:
        - dueNow
        - totalWords
        - newWords
        - learningWords
        - reviewWords
        - masteredWords
        - reviewsToday
        - successfulToday
        - reviewsTotal
        - dailyGoal
        - currentStreak
        - longestStreak
      properties:
        dueNow:
          type: integer
        totalWords:
          type: integer
        newWords:
          type: integer
        learningWords:
          type: integer
        reviewWords:
          type: integer
        masteredWords:
          type: integer
        reviewsToday:
          type: integer
        successfulToday:
          type: integer
        reviewsTotal:
          type: integer
        dailyGoal:
          type: integer
        currentStreak:
          type: integer
        longestStreak:
          type: integer
        nextDueAt:
          type: [string, "null"]
          format: date-time
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
