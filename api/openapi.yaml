        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonPreviewRequest"
      responses:
        "200":
          description: Детерминированный состав будущего урока без создания session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonPreview"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/AuthenticationUnavailable"
  /api/v1/lessons:
    post:
      operationId: createLesson
      tags: [learning]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonCreateRequest"
      responses:
        "201":
          description: Создан новый серверный урок с version=1.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonSession"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/AuthenticationUnavailable"
  /api/v1/lessons/active:
    get:
      operationId: getActiveLesson
      tags: [learning]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Snapshot активного урока и фактическая серверная позиция.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonSession"
        "404":
          description: Активный урок отсутствует.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/AuthenticationUnavailable"
  /api/v1/lessons/{lessonID}:
    delete:
      operationId: discardLesson
      tags: [learning]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LessonID"
        - name: If-Match
          in: header
          required: true
          description: Текущая lesson version, например `"3"`.
          schema:
            type: string
      responses:
        "204":
          description: Урок сброшен; version атомарно увеличена.
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: If-Match не содержит положительную lesson version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "428":
          description: If-Match отсутствует.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/AuthenticationUnavailable"
  /api/v1/lessons/{lessonID}/words/{wordID}/review:
    post:
      operationId: reviewLessonWord
      tags: [learning]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LessonID"
        - name: wordID
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonReviewRequest"
      responses:
        "200":
          description: Review и переход к следующей серверной позиции сохранены атомарно.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonReviewResult"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/AuthenticationUnavailable"
  /api/v1/lessons/{lessonID}/result-action:
    post:
      operationId: recordLessonResultAction
      tags: [learning, analytics]
      summary: Сохранить первое действие пользователя с результата завершённого урока.
      description: Authenticated idempotent retention evidence. Повторные отправки для того же user/lesson не переписывают первый выбор и не изменяют learning state.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LessonID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonResultActionRequest"
      responses:
        "204":
          description: Первое действие сохранено или ранее уже было сохранено для этого пользователя и урока.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Завершённый урок не найден у текущего пользователя.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/AuthenticationUnavailable"
  /api/v1/progress:
    get:
      operationId: getProgress
      tags: [learning]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TimezoneOffsetMinutes"
      responses:
        "200":
          description: Текущий прогресс, очередь и серии занятий.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/AuthenticationUnavailable"
  /api/v1/progress/goal:
    put:
      operationId: setDailyGoal
      tags: [learning]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TimezoneOffsetMinutes"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalRequest"
      responses:
        "200":
          description: Дневная цель сохранена; возвращён обновлённый прогресс.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/AuthenticationUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT содержит auth_version. Каждый защищённый запрос fail-closed сверяет его с PostgreSQL; stale epoch возвращает 401, недоступное хранилище — 503.
    refreshCookie:
      type: apiKey
      in: cookie
      name: lexigo_refresh
      description: HttpOnly refresh token cookie. Browser JavaScript не имеет к ней доступа.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Значение readable cookie lexigo_csrf для double-submit CSRF validation.
  parameters:
    LessonID:
      name: lessonID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TimezoneOffsetMinutes:
      name: timezoneOffsetMinutes
      in: query
      required: false
      description: Значение JavaScript Date.getTimezoneOffset; используется для дневной статистики.
      schema:
        type: integer
        minimum: -840
        maximum: 840
        default: 0
  responses:
    BadRequest:
      description: Запрос содержит некорректный JSON, недействительный или использованный reset token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Превышен лимит запросов для IP и endpoint.
      headers:
        Retry-After:
          schema: { type: integer, const: 60 }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Неверные учётные данные, подпись/TTL токена или устаревший credential epoch.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Запрос не прошёл origin или CSRF validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Конфликт уникальности.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Ошибка валидации.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AuthenticationUnavailable:
      description: Авторитетная проверка credential epoch временно недоступна; запрос не передаётся приложению.
      headers:
        Retry-After:
          schema: { type: integer, const: 1 }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    ProductJourneyEvent:
      type: object
      additionalProperties: false
      required: [appVersion, fromRoute, toRoute, intent, backtrack, deviceClass, browserFamily, displayMode]
      properties:
        appVersion:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '^[A-Za-z0-9._-]+$'
        fromRoute:
          type: string
          enum: [/, /learn, /dictionary, /phrases, /progress, /profile, /lesson, /word, /phrase, /privacy, /terms, /legal, /not-found]
        toRoute:
          type: string
          enum: [/, /learn, /dictionary, /phrases, /progress, /profile, /lesson, /word, /phrase, /privacy, /terms, /legal, /not-found]
        intent:
          type: string
          enum:
            - primary_navigation
            - home_next_action
            - home_configure_lesson
            - home_find_material
            - catalog_switch
            - catalog_open_detail
            - catalog_configure_lesson
            - lesson_start
            - lesson_exit
            - authentication
            - browser_history
            - in_app_navigation
        backtrack:
          type: boolean
        deviceClass:
          type: string
          enum: [mobile, tablet, desktop]
        browserFamily:
          type: string
          enum: [chromium, webkit, firefox, other]
        displayMode:
          type: string
          enum: [browser, standalone, fullscreen, minimal-ui, unknown]
    PerformanceRUMReport:
      type: object
      additionalProperties: false
      required: [appVersion, route, deviceClass, browserFamily, displayMode, samples]
      properties:
        appVersion:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '^[A-Za-z0-9._-]+$'
        route:
          type: string
          enum: [/, /learn, /dictionary, /phrases, /progress, /profile, /lesson, /word, /phrase, /privacy, /terms, /legal, /not-found]
        deviceClass:
          type: string
          enum: [mobile, tablet, desktop]
        browserFamily:
          type: string
          enum: [chromium, webkit, firefox, other]
        displayMode:
          type: string
          enum: [browser, standalone, fullscreen, minimal-ui, unknown]
        samples:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: "#/components/schemas/PerformanceRUMSample"
    PerformanceRUMSample:
      type: object
      additionalProperties: false
      required: [name, value, rating, navigationType]
      properties:
        name:
          type: string
          enum:
            - CLS
            - LCP
            - INP
            - FCP
            - TTFB
            - NEXT_HYDRATION
            - NEXT_ROUTE_CHANGE
            - NEXT_RENDER
            - LONG_TASK_COUNT
            - LONG_TASK_TOTAL
            - LONG_TASK_MAX
            - OBSERVER_CALLBACK_TOTAL
            - OBSERVER_CALLBACK_MAX
            - ACTION_START_LESSON
            - ACTION_REVIEW_ANSWER
        value:
          type: number
          minimum: 0
          maximum: 600000
        rating:
          type: string
          enum: [good, needs-improvement, poor, unknown]
        navigationType:
          type: string
          enum: [navigate, reload, back-forward, back-forward-cache, prerender, restore, unknown]
    CatalogMetadata:
      type: object
      required: [catalogVersion, updatedAt, totals, sources, topics]
      properties:
