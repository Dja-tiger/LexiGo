          type: string
          enum: [next_lesson, due_review, home, progress, stay]
          description: First action actually selected from the completed Lesson Result.
    GoalRequest:
      type: object
      required: [dailyGoal]
      properties:
        dailyGoal:
          type: integer
          minimum: 5
          maximum: 200
    ProgressSummary:
      type: object
      required:
        - dueNow
        - dueWords
        - duePhrases
        - totalWords
        - totalPhrases
        - newWords
        - learningWords
        - reviewWords
        - masteredWords
        - masteredPhrases
        - reviewsToday
        - successfulToday
        - objectiveReviewsToday
        - objectiveSuccessfulToday
        - reviewsTotal
        - dailyGoal
        - currentStreak
        - longestStreak
        - retainedItemsWeek
        - retainedWordsWeek
        - retainedPhrasesWeek
        - eventSchemaVersion
        - modes
      properties:
        dueNow: { type: integer }
        dueWords: { type: integer }
        duePhrases: { type: integer }
        totalWords: { type: integer }
        totalPhrases: { type: integer }
        newWords: { type: integer }
        learningWords: { type: integer }
        reviewWords: { type: integer }
        masteredWords: { type: integer }
        masteredPhrases: { type: integer }
        reviewsToday:
          type: integer
          description: All persisted learning activity, including study exposure.
        successfulToday:
          type: integer
          description: Rolling-deployment compatibility aggregate; use objectiveSuccessfulToday for accurate objective analytics.
        objectiveReviewsToday:
          type: integer
          description: Verified schema-v2 recall, choice and listening attempts; study and legacy events are excluded.
        objectiveSuccessfulToday:
          type: integer
          description: Verified successful schema-v2 recall, choice and listening attempts in the user's local day.
        reviewsTotal: { type: integer }
        dailyGoal: { type: integer }
        currentStreak: { type: integer }
        longestStreak: { type: integer }
        retainedItemsWeek: { type: integer }
        retainedWordsWeek: { type: integer }
        retainedPhrasesWeek: { type: integer }
        eventSchemaVersion:
          type: integer
          const: 2
        modes:
          $ref: "#/components/schemas/ProgressModes"
        nextDueAt:
          type: [string, "null"]
          format: date-time
    ModeProgress:
      type: object
      required: [attemptsToday, successfulToday, attemptsTotal, successfulTotal]
      properties:
        attemptsToday: { type: integer }
        successfulToday: { type: integer }
        attemptsTotal: { type: integer }
        successfulTotal: { type: integer }
    ProgressModes:
      type: object
      required: [study, recall, choice, listening, legacy]
      properties:
        study:
          $ref: "#/components/schemas/ModeProgress"
        recall:
          $ref: "#/components/schemas/ModeProgress"
        choice:
          $ref: "#/components/schemas/ModeProgress"
        listening:
          $ref: "#/components/schemas/ModeProgress"
        legacy:
          $ref: "#/components/schemas/ModeProgress"
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            field:
              type: string
              description: Опциональное стабильное имя поля формы, связанное с ошибкой.
              enum: [email, password, displayName, passwordConfirmation, token, lemma, translation, phonetic, partOfSpeech, topic, note, cloze, clozeAnswer, version, items]
