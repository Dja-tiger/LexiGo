openapi: 3.1.0
info:
  title: LexiGo API
  version: 0.4.0
  description: API персонального тренажёра технического английского.
servers:
  - url: http://localhost:8080
    description: local
paths:
  /health/live:
    get:
      operationId: live
      tags: [health]
      responses:
        "200":
          description: Процесс работает.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /health/ready:
    get:
      operationId: ready
      tags: [health]
      responses:
        "200":
          description: PostgreSQL и Redis доступны.
        "503":
          description: Одна из зависимостей недоступна.
  /api/v1/auth/register:
    post:
      operationId: register
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Пользователь создан. Refresh-сессия установлена через HttpOnly cookie, CSRF-токен — через отдельную readable cookie.
          headers:
            Set-Cookie:
              description: Cookies lexigo_refresh и lexigo_csrf.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Авторизация выполнена. Refresh-сессия установлена через HttpOnly cookie.
          headers:
            Set-Cookie:
              description: Cookies lexigo_refresh и lexigo_csrf.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      tags: [auth]
      description: Ротирует refresh token из HttpOnly cookie и выдаёт новый access token. Тело запроса отсутствует.
      security:
        - refreshCookie: []
          csrfHeader: []
      responses:
        "200":
          description: Сессия обновлена, refresh token и CSRF token ротированы через Set-Cookie.
          headers:
            Set-Cookie:
              description: Обновлённые cookies lexigo_refresh и lexigo_csrf.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      description: Отзывает всё семейство refresh-токенов текущего устройства и удаляет session cookies.
      security:
        - refreshCookie: []
          csrfHeader: []
      responses:
        "204":
          description: Сессия отозвана или уже недействительна; cookies удалены.
          headers:
            Set-Cookie:
              description: Expired cookies lexigo_refresh и lexigo_csrf.
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/me:
    get:
      operationId: me
      tags: [users]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Текущий пользователь.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/words/due:
    get:
      operationId: listDueWords
      tags: [learning]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 30
      responses:
        "200":
          description: Слова, срок повторения которых наступил.
          content:
            application/json:
              schema:
                type: object
                required: [items, count]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserWord"
                  count:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/words/{wordID}/review:
    post:
      operationId: reviewWord
      tags: [learning]
      security:
        - bearerAuth: []
      parameters:
        - name: wordID
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "200":
          description: Результат сохранён, рассчитана следующая дата повторения.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Слово не назначено текущему пользователю.
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/progress:
    get:
      operationId: getProgress
      tags: [learning]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TimezoneOffsetMinutes"
      responses:
        "200":
          description: Текущий прогресс, очередь и серии занятий.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/progress/goal:
    put:
      operationId: setDailyGoal
      tags: [learning]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TimezoneOffsetMinutes"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalRequest"
      responses:
        "200":
          description: Дневная цель сохранена; возвращён обновлённый прогресс.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: lexigo_refresh
      description: HttpOnly refresh token cookie. Browser JavaScript не имеет к ней доступа.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Значение readable cookie lexigo_csrf для double-submit CSRF validation.
  parameters:
    TimezoneOffsetMinutes:
      name: timezoneOffsetMinutes
      in: query
      required: false
      description: Значение JavaScript Date.getTimezoneOffset; используется для дневной статистики.
      schema:
        type: integer
        minimum: -840
        maximum: 840
        default: 0
  responses:
    Unauthorized:
      description: Неверные учётные данные или токен.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Запрос не прошёл origin или CSRF validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Конфликт уникальности.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Ошибка валидации.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          examples: [ok]
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
          maxLength: 72
        displayName:
          type: string
          maxLength: 100
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AuthResponse:
      type: object
      required: [user, tokens]
      properties:
        user:
          $ref: "#/components/schemas/User"
        tokens:
          $ref: "#/components/schemas/TokenPair"
    TokenPair:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
          description: Короткоживущий bearer token. Клиент хранит его только в памяти процесса.
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          description: Срок действия access token в секундах.
    User:
      type: object
      required: [id, email, displayName, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
    UserWord:
      type: object
      required: [id, lemma, translation, status, dueAt]
      properties:
        id:
          type: integer
          format: int64
        lemma:
          type: string
        translation:
          type: string
        phonetic:
          type: string
        partOfSpeech:
          type: string
        topic:
          type: string
        examples:
          type: array
          items:
            type: string
        note:
          type: string
        status:
          type: string
          enum: [new, learning, review, mastered]
        easiness:
          type: number
        intervalDays:
          type: integer
        repetitions:
          type: integer
        dueAt:
          type: string
          format: date-time
        lastReviewedAt:
          type: [string, "null"]
          format: date-time
    ReviewRequest:
      type: object
      required: [rating, timezoneOffsetMinutes]
      properties:
        rating:
          type: string
          enum: [again, almost, known]
        responseMs:
          type: integer
          minimum: 0
          maximum: 3600000
        answerMode:
          type: string
          enum: [study, recall, choice]
        correct:
          type: [boolean, "null"]
          description: Objective correctness for recall/choice. Must be null or omitted for study.
        answerRevealed:
          type: [boolean, "null"]
          description: Whether the answer was visible before persistence. Required as true for study.
        timezoneOffsetMinutes:
          type: integer
          minimum: -840
          maximum: 840
    ReviewResult:
      type: object
      required: [wordId, status, easiness, intervalDays, repetitions, dueAt, lastReviewedAt]
      properties:
        wordId:
          type: integer
          format: int64
        status:
          type: string
          enum: [learning, review, mastered]
        easiness:
          type: number
        intervalDays:
          type: integer
        repetitions:
          type: integer
        dueAt:
          type: string
          format: date-time
        lastReviewedAt:
          type: string
          format: date-time
    GoalRequest:
      type: object
      required: [dailyGoal]
      properties:
        dailyGoal:
          type: integer
          minimum: 5
          maximum: 200
    ProgressSummary:
      type: object
      required:
        - dueNow
        - dueWords
        - duePhrases
        - totalWords
        - totalPhrases
        - newWords
        - learningWords
        - reviewWords
        - masteredWords
        - masteredPhrases
        - reviewsToday
        - successfulToday
        - objectiveReviewsToday
        - objectiveSuccessfulToday
        - reviewsTotal
        - dailyGoal
        - currentStreak
        - longestStreak
        - retainedItemsWeek
        - retainedWordsWeek
        - retainedPhrasesWeek
        - eventSchemaVersion
        - modes
      properties:
        dueNow: { type: integer }
        dueWords: { type: integer }
        duePhrases: { type: integer }
        totalWords: { type: integer }
        totalPhrases: { type: integer }
        newWords: { type: integer }
        learningWords: { type: integer }
        reviewWords: { type: integer }
        masteredWords: { type: integer }
        masteredPhrases: { type: integer }
        reviewsToday:
          type: integer
          description: All persisted learning activity, including study exposure.
        successfulToday:
          type: integer
          description: Compatibility alias for objectiveSuccessfulToday.
        objectiveReviewsToday:
          type: integer
          description: Recall, choice and legacy attempts; study is excluded.
        objectiveSuccessfulToday:
          type: integer
        reviewsTotal: { type: integer }
        dailyGoal: { type: integer }
        currentStreak: { type: integer }
        longestStreak: { type: integer }
        retainedItemsWeek: { type: integer }
        retainedWordsWeek: { type: integer }
        retainedPhrasesWeek: { type: integer }
        eventSchemaVersion:
          type: integer
          const: 2
        modes:
          $ref: "#/components/schemas/ProgressModes"
        nextDueAt:
          type: [string, "null"]
          format: date-time
    ModeProgress:
      type: object
      required: [attemptsToday, successfulToday, attemptsTotal, successfulTotal]
      properties:
        attemptsToday: { type: integer }
        successfulToday: { type: integer }
        attemptsTotal: { type: integer }
        successfulTotal: { type: integer }
    ProgressModes:
      type: object
      required: [study, recall, choice, legacy]
      properties:
        study:
          $ref: "#/components/schemas/ModeProgress"
        recall:
          $ref: "#/components/schemas/ModeProgress"
        choice:
          $ref: "#/components/schemas/ModeProgress"
        legacy:
          $ref: "#/components/schemas/ModeProgress"
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
