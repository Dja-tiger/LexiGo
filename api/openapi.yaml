openapi: 3.1.0
info:
  title: LexiGo API
  version: 0.18.0
  description: API персонального тренажёра технического английского.
servers:
  - url: http://localhost:8080
    description: local
paths:
  /health/live:
    get:
      operationId: live
      tags: [health]
      responses:
        "200":
          description: Процесс работает.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /health/ready:
    get:
      operationId: ready
      tags: [health]
      responses:
        "200":
          description: PostgreSQL и Redis доступны.
        "503":
          description: Одна из зависимостей недоступна.
  /api/v1/catalog/metadata:
    get:
      operationId: catalogMetadata
      tags: [catalog]
      summary: Публичные агрегаты и версия каталога.
      parameters:
        - in: header
          name: If-None-Match
          schema:
            type: string
      responses:
        "200":
          description: Актуальный snapshot каталога.
          headers:
            ETag:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogMetadata"
        "304":
          description: Версия каталога не изменилась.
  /api/v1/catalog/words:
    get:
      operationId: listPublicCatalogWords
      tags: [catalog]
      summary: Paginated public content-only word catalog.
      description: Публичная проекция слов без user_words, learning status, scheduler state и истории повторений. Query-параметр status намеренно не поддерживается и возвращает 422.
      parameters:
        - { name: source, in: query, schema: { type: string, enum: [mixed, noun, verb, adjective, daily-life, travel, data-engineering, backend, academic-technical-english] } }
        - { name: topic, in: query, schema: { type: string, maxLength: 120 } }
        - { name: query, in: query, schema: { type: string, maxLength: 120 } }
        - { name: q, in: query, deprecated: true, description: Compatibility alias for query., schema: { type: string, maxLength: 120 } }
        - { name: sort, in: query, schema: { type: string, enum: [default, az, za], default: default } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        "200":
          description: One bounded public catalog page with content-only items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCatalogPage"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          description: Внутренняя ошибка чтения публичного каталога.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/catalog/words/{wordID}:
    get:
      operationId: getPublicCatalogWord
      tags: [catalog]
      summary: Public content-only word card.
      description: Возвращает только общие данные каталога и никогда не включает персональный status или SRS-поля.
      parameters:
        - name: wordID
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Public word card without personalized learning state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCatalogWord"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          description: Catalog word does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Внутренняя ошибка чтения публичной карточки.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/performance/rum:
    post:
      operationId: reportPerformanceRUM
      tags: [performance]
      summary: Принять анонимный пакет performance-метрик.
      description: Принимает только allow-listed агрегаты без user ID, IP, raw URL, query, referrer, cookie, session ID и raw User-Agent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerformanceRUMReport"
      responses:
        "202":
          description: Пакет принят и сохранён.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: Внутренняя ошибка сохранения без раскрытия деталей инфраструктуры.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/security/csp-report:
    post:
      operationId: reportContentSecurityPolicyViolation
      tags: [security]
      summary: Принять browser CSP violation без query, fragment, script sample и иных потенциальных secrets в operational log.
      requestBody:
        required: true
        content:
          application/csp-report:
            schema:
              type: object
              additionalProperties: true
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "204":
          description: Санитизированные metadata нарушения записаны в structured log.
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationError"
        "415":
          description: Content-Type должен быть `application/csp-report` или `application/json`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: Fail-closed rate limiter недоступен; report отброшен без влияния на пользовательский запрос.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/product/journey:
    post:
      operationId: reportProductJourney
      tags: [analytics]
      summary: Принять анонимный переход между allow-listed экранами.
      description: Событие не содержит user ID, session ID, IP, raw URL, query, referrer, search text, cookie или raw User-Agent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductJourneyEvent"
      responses:
        "202":
          description: Переход принят и сохранён.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: Внутренняя ошибка сохранения без раскрытия деталей инфраструктуры.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/register:
    post:
      operationId: register
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Пользователь создан. Refresh-сессия установлена через HttpOnly cookie, CSRF-токен — через отдельную readable cookie.
          headers:
            Set-Cookie:
              description: Cookies lexigo_refresh и lexigo_csrf.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Авторизация выполнена. Refresh-сессия установлена через HttpOnly cookie.
          headers:
            Set-Cookie:
              description: Cookies lexigo_refresh и lexigo_csrf.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Запросить одноразовую ссылку восстановления пароля.
      description: Ответ одинаков для существующего и отсутствующего аккаунта и не раскрывает регистрацию email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "202":
          description: Запрос принят. Письмо отправляется только для существующего аккаунта.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [auth]
      summary: Установить новый пароль по одноразовому токену.
      description: Успешная операция отзывает все refresh-сессии пользователя.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
      responses:
        "204":
          description: Пароль изменён, токен использован, активные сессии отозваны.
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      tags: [auth]
      description: Ротирует refresh token из HttpOnly cookie и выдаёт новый access token. Тело запроса отсутствует.
      security:
        - refreshCookie: []
          csrfHeader: []
      responses:
        "200":
          description: Сессия обновлена, refresh token и CSRF token ротированы через Set-Cookie.
          headers:
            Set-Cookie:
              description: Обновлённые cookies lexigo_refresh и lexigo_csrf.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      description: Отзывает всё семейство refresh-токенов текущего устройства и удаляет session cookies.
      security:
        - refreshCookie: []
          csrfHeader: []
      responses:
        "204":
          description: Сессия отозвана или уже недействительна; cookies удалены.
          headers:
            Set-Cookie:
              description: Expired cookies lexigo_refresh и lexigo_csrf.
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/auth/sessions:
    get:
      operationId: listAccountSessions
      tags: [account]
      summary: Получить активные refresh-token families пользователя.
      security:
        - bearerAuth: []
          refreshCookie: []
      responses:
        "200":
          description: Активные устройства; ровно одна запись может быть текущей.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/AccountSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/AuthenticationUnavailable"
  /api/v1/auth/sessions/revoke-others:
    post:
      operationId: revokeOtherAccountSessions
      tags: [account]
      summary: Завершить все refresh-сессии, кроме текущей family.
      security:
        - bearerAuth: []
          refreshCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReauthenticationRequest"
      responses:
        "200":
          description: Остальные сессии отозваны, credential epoch увеличен; текущей family выдан replacement access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/AuthenticationUnavailable"
  /api/v1/auth/password:
    put:
      operationId: changeAccountPassword
      tags: [account]
      summary: Изменить пароль и завершить остальные refresh-сессии.
      security:
        - bearerAuth: []
          refreshCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Пароль и credential epoch изменены, password-reset tokens аннулированы; текущей family выдан replacement access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/AuthenticationUnavailable"
  /api/v1/auth/audit-events:
    get:
      operationId: listAccountAuditEvents
      tags: [account]
      summary: Последние security audit events текущего пользователя.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: До 50 последних критичных событий.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/AccountAuditEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/AuthenticationUnavailable"
  /api/v1/account/export:
    post:
      operationId: exportAccountData
      tags: [account]
      summary: Скачать versioned JSON с основными персональными и учебными данными.
      security:
        - bearerAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReauthenticationRequest"
      responses:
        "200":
          description: Машиночитаемый export без password hashes и token secrets.
          headers:
            Content-Disposition:
              schema: { type: string }
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountExport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/AuthenticationUnavailable"
  /api/v1/account:
    delete:
      operationId: deleteAccount
      tags: [account]
      summary: Необратимо удалить аккаунт и каскадно зависимые пользовательские данные.
      security:
        - bearerAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountRequest"
      responses:
        "204":
          description: Аккаунт удалён; cookies очищены, browser cache/storage получают Clear-Site-Data.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/AuthenticationUnavailable"
  /api/v1/account/email-change/request:
    post:
      operationId: requestAccountEmailChange
      tags: [account]
      summary: Отправить одноразовую verification link на новый email.
      description: Raw token передаётся только во fragment URL и не сохраняется в PostgreSQL.
      security:
        - bearerAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailChangeRequest"
      responses:
        "202":
          description: Одноразовая ссылка отправлена на новый адрес.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/AuthenticationUnavailable"
  /api/v1/account/email-change/confirm:
    post:
      operationId: confirmAccountEmailChange
      tags: [account]
      summary: Подтвердить новый email одноразовым bearer token.
      description: Transaction меняет login identifier, использует token, отзывает все refresh-сессии и пишет audit event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailChangeConfirmRequest"
      responses:
        "204":
          description: Email изменён; session cookies очищены.
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/me:
    get:
      operationId: me
      tags: [users]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Текущий пользователь.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/AuthenticationUnavailable"
  /api/v1/words:
    get:
      operationId: listWords
      tags: [learning]
      summary: Paginated catalog assigned to the current user.
      security:
        - bearerAuth: []
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [word, phrase, all], default: word } }
        - { name: source, in: query, schema: { type: string, enum: [mixed, noun, verb, adjective, phrases, daily-life, travel, data-engineering, backend] } }
        - { name: topic, in: query, schema: { type: string, maxLength: 120 } }
        - { name: query, in: query, schema: { type: string, maxLength: 120 } }
        - { name: status, in: query, schema: { type: string, enum: [new, learning, review, mastered] } }
        - { name: sort, in: query, schema: { type: string, enum: [default, az, za], default: default } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        "200":
          description: One bounded catalog page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/AuthenticationUnavailable"
  /api/v1/words/due:
    get:
      operationId: listDueWords
      tags: [learning]
      summary: Paginated items whose review time has arrived.
      security:
        - bearerAuth: []
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [word, phrase, all], default: word } }
        - { name: source, in: query, schema: { type: string, enum: [mixed, noun, verb, adjective, phrases, daily-life, travel, data-engineering, backend] } }
        - { name: topic, in: query, schema: { type: string, maxLength: 120 } }
        - { name: query, in: query, schema: { type: string, maxLength: 120 } }
        - { name: status, in: query, schema: { type: string, enum: [new, learning, review, mastered] } }
        - { name: sort, in: query, schema: { type: string, enum: [default, az, za], default: default } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        "200":
          description: One bounded due page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/AuthenticationUnavailable"
  /api/v1/words/custom/export:
    get:
      operationId: exportCustomGlossary
      tags: [learning]
      summary: Export private custom words as a portable versioned glossary.
      description: Returns only content owned by the current account. Database IDs, owner identity, scheduler state, due timestamps and review history are intentionally excluded. The response is deterministic and non-cacheable.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Versioned content-only glossary for the current account. An account with no private custom words receives items=[].
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomGlossaryExport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/AuthenticationUnavailable"
  /api/v1/words/custom/import:
    post:
      operationId: importCustomGlossary
      tags: [learning]
      summary: Atomically import a bounded private custom-word glossary.
      description: Version 1 accepts 1-100 content items in at most 256 KiB of JSON. The complete payload is normalized and validated before persistence. The batch is committed in one PostgreSQL transaction; any current-owner duplicate or storage failure leaves zero partial word or scheduler rows. IDs, owner identity, scheduler state, due timestamps and review history are not accepted as import data.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomGlossaryImportRequest"
      responses:
        "201":
          description: Every glossary item was created for the current account and enrolled exactly once into the existing user_words scheduler with fresh defaults.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomGlossaryImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The payload contains an equivalent duplicate, or at least one equivalent custom word already exists for the current account. No items are imported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/AuthenticationUnavailable"
  /api/v1/words/custom:
    post:
      operationId: createCustomWord
      tags: [learning]
      summary: Create one private custom word and enroll it in the existing scheduler.
      description: Whitespace is normalized, unknown fields are rejected, and duplicate lemma/translation pairs are detected case-insensitively within the current account. Internal ownership/storage fields are never exposed.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomWordRequest"
      responses:
        "201":
          description: Custom word persisted and enrolled for the current user with normal user_words scheduler defaults.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserWord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: An equivalent custom word already exists for the current account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                duplicate:
                  value:
                    error:
                      code: custom_word_duplicate
                      message: an equivalent custom word already exists for the current account
                      field: lemma
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/AuthenticationUnavailable"
  /api/v1/words/custom/{wordID}:
    delete:
      operationId: deleteCustomWord
      tags: [learning]
      summary: Delete one custom word owned by the current account.
      description: Missing, shared, and another account's private word intentionally return the same 404. If the word belongs to an active lesson, that lesson is discarded before dependent learning rows are cascade-deleted.
      security:
        - bearerAuth: []
      parameters:
        - name: wordID
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "204":
          description: Owner-scoped custom word and dependent scheduler, review, and lesson references were deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Custom word is absent, shared, or belongs to another account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/AuthenticationUnavailable"
  /api/v1/phrases/custom:
    post:
      operationId: createCustomPhrase
      tags: [learning]
      summary: Create one private custom phrase and enroll it in the existing scheduler.
      description: The server normalizes whitespace, validates exactly one cloze blank marker, fixes partOfSpeech to phrase, and generates a globally unique canonical slug. The client cannot choose ownership, source, kind, partOfSpeech or slug.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomPhraseRequest"
      responses:
        "201":
          description: Owner-scoped phrase persisted and enrolled once with normal user_words scheduler defaults.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserWord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: An equivalent normalized custom item already exists for the current account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                duplicate:
                  value:
                    error:
                      code: custom_phrase_duplicate
                      message: an equivalent custom item already exists for the current account
                      field: lemma
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/AuthenticationUnavailable"
  /api/v1/phrases/custom/{phraseID}:
    delete:
      operationId: deleteCustomPhrase
      tags: [learning]
      summary: Delete one custom phrase owned by the current account.
      description: Missing, shared, and another account's private phrase intentionally return the same 404. If the phrase belongs to an active lesson, that lesson is discarded before dependent learning rows are cascade-deleted.
      security:
        - bearerAuth: []
      parameters:
        - name: phraseID
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "204":
          description: Owner-scoped custom phrase and dependent scheduler, review, and lesson references were deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Custom phrase is absent, shared, or belongs to another account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/AuthenticationUnavailable"
  /api/v1/phrases/{slug}:
    get:
      operationId: getPhraseBySlug
      tags: [learning]
      summary: Full phrase card assigned to the current user, addressed by canonical slug.
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
            pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      responses:
        "200":
          description: Full phrase card with the current user learning status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserWord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Slug is invalid, absent, or the phrase is not assigned to the current user.
        "503":
          $ref: "#/components/responses/AuthenticationUnavailable"
  /api/v1/words/{wordID}:
    get:
      operationId: getWord
      tags: [learning]
      summary: Full catalog card assigned to the current user.
      security:
        - bearerAuth: []
      parameters:
        - name: wordID
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Full word or term card with the current learning status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserWord"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Catalog item is not assignedен текущему пользователю.
        "503":
          $ref: "#/components/responses/AuthenticationUnavailable"
  /api/v1/words/{wordID}/review:
    post:
      operationId: reviewWord
      tags: [learning]
      security:
        - bearerAuth: []
      parameters:
        - name: wordID
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "200":
          description: Результат сохранён, рассчитана следующая дата повторения.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Слово не назначено текущему пользователю.
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/AuthenticationUnavailable"
  /api/v1/words/{wordID}/answer-suggestions:
    post:
      operationId: submitAnswerSuggestion
      tags: [learning]
      summary: Submit a server-rejected answer to the moderation queue without changing learning state.
      security:
        - bearerAuth: []
      parameters:
        - name: wordID
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerSuggestionRequest"
      responses:
        "202":
          description: Suggestion was accepted for moderation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerSuggestion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Learning item is not assigned to the current user.
        "409":
          description: The referenced review was not a server-rejected objective attempt.
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/AuthenticationUnavailable"
  /api/v1/admin/answer-suggestions:
    get:
      operationId: listAnswerSuggestionsForModeration
      tags: [moderation]
      summary: Read one bounded page of answer suggestions with decision context.
      description: Requires a bearer-authenticated account whose current normalized email is present in the server-side content-admin allowlist.
      security:
        - bearerAuth: []
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, accepted, rejected], default: pending } }
        - { name: exerciseKind, in: query, schema: { type: string, enum: [translation, cloze] } }
        - { name: itemQuery, in: query, schema: { type: string, maxLength: 120 } }
        - { name: createdBefore, in: query, schema: { type: string, format: date-time } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: Keyset-paginated moderation context. Raw learner answers are never cacheable.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Authenticated account is not present in the content-admin allowlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/AuthenticationUnavailable"
  /api/v1/admin/answer-suggestions/metrics:
    get:
      operationId: getAnswerSuggestionModerationMetrics
      tags: [moderation]
      summary: Read bounded queue age, outcome and retention metrics.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current content-moderation operational metrics.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationMetrics"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Authenticated account is not present in the content-admin allowlist.
        "503":
          $ref: "#/components/responses/AuthenticationUnavailable"
  /api/v1/admin/answer-suggestions/{suggestionID}/decision:
    post:
      operationId: decideAnswerSuggestion
      tags: [moderation]
      summary: Atomically accept or reject one pending suggestion.
      description: A terminal decision never changes the referenced review event or historical scheduler state. Accept appends only a normalized-unique curated answer.
      security:
        - bearerAuth: []
      parameters:
        - name: suggestionID
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationDecisionRequest"
      responses:
        "200":
          description: Decision, optimistic version and accepted-answer mutation result.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationDecisionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Authenticated account is not present in the content-admin allowlist.
        "404":
          description: Suggestion does not exist.
        "409":
          description: Suggestion is already terminal or expectedVersion is stale.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/AuthenticationUnavailable"
  /api/v1/lessons/preview:
