name: Self-hosted runner smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/self-hosted-runner-smoke.yml

permissions:
  contents: read

concurrency:
  group: self-hosted-runner-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Selectel runner smoke (${{ matrix.slot }})
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        slot: [1, 2, 3]
    env:
      SMOKE_SLOT: ${{ matrix.slot }}
      BARRIER_DIR: /tmp/lexigo-runner-smoke-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Verify host
        shell: bash
        run: |
          set -Eeuo pipefail

          test "$(id -un)" = "github-runner"
          test "$(uname -m)" = "x86_64"

          docker version
          docker compose version

          printf '\n=== RUNNER ===\n'
          printf 'name=%s slot=%s\n' "$RUNNER_NAME" "$SMOKE_SLOT"

          printf '\n=== CPU ===\n'
          nproc

          printf '\n=== MEMORY ===\n'
          free -h

          printf '\n=== DISK ===\n'
          df -h /

      - name: Require three concurrent runners
        shell: bash
        run: |
          set -Eeuo pipefail

          install -d -m 0755 "$BARRIER_DIR"
          marker="$BARRIER_DIR/ready-${SMOKE_SLOT}-${RUNNER_NAME}"
          : > "$marker"

          for attempt in $(seq 1 90); do
            ready_count="$(find "$BARRIER_DIR" -maxdepth 1 -type f -name 'ready-*' | wc -l)"

            if [ "$ready_count" -eq 3 ]; then
              printf 'Three runners reached the barrier concurrently:\n'
              find "$BARRIER_DIR" -maxdepth 1 -type f -name 'ready-*' -printf '%f\n' | sort
              exit 0
            fi

            sleep 1
          done

          printf 'Expected 3 concurrent runners, observed:\n' >&2
          find "$BARRIER_DIR" -maxdepth 1 -type f -name 'ready-*' -printf '%f\n' | sort >&2 || true
          exit 1

      - name: Verify Docker services and port isolation
        shell: bash
        run: |
          set -Eeuo pipefail

          postgres="runner-smoke-postgres-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SMOKE_SLOT}"
          redis="runner-smoke-redis-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SMOKE_SLOT}"

          docker rm -f "$postgres" "$redis" >/dev/null 2>&1 || true

          docker run --detach \
            --name "$postgres" \
            --env POSTGRES_DB=lexigo_test \
            --env POSTGRES_USER=lexigo \
            --env POSTGRES_PASSWORD=lexigo_test \
            --health-cmd='pg_isready -U lexigo -d lexigo_test' \
            --health-interval=2s \
            --health-timeout=3s \
            --health-retries=30 \
            --publish 127.0.0.1::5432 \
            postgres:18.4-alpine

          docker run --detach \
            --name "$redis" \
            --health-cmd='redis-cli ping' \
            --health-interval=2s \
            --health-timeout=3s \
            --health-retries=30 \
            --publish 127.0.0.1::6379 \
            redis:8.0-alpine

          for container in "$postgres" "$redis"; do
            for attempt in $(seq 1 60); do
              status="$(docker inspect --format '{{.State.Health.Status}}' "$container")"

              if [ "$status" = healthy ]; then
                break
              fi

              if [ "$status" = unhealthy ]; then
                docker logs "$container"
                exit 1
              fi

              sleep 1
            done

            test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy
          done

          docker exec "$postgres" pg_isready -U lexigo -d lexigo_test
          test "$(docker exec "$redis" redis-cli ping)" = PONG

          postgres_host_ip="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "5432/tcp") 0).HostIp}}' "$postgres")"
          postgres_host_port="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "5432/tcp") 0).HostPort}}' "$postgres")"
          redis_host_ip="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "6379/tcp") 0).HostIp}}' "$redis")"
          redis_host_port="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "6379/tcp") 0).HostPort}}' "$redis")"

          test "$postgres_host_ip" = 127.0.0.1
          test "$redis_host_ip" = 127.0.0.1
          test -n "$postgres_host_port"
          test -n "$redis_host_port"
          test "$postgres_host_port" != "$redis_host_port"

          printf 'postgres=127.0.0.1:%s redis=127.0.0.1:%s\n' \
            "$postgres_host_port" \
            "$redis_host_port"

          printf '\n=== CONCURRENT RESOURCE SNAPSHOT ===\n'
          uptime
          free -h
          docker stats --no-stream

      - name: Cleanup smoke resources
        if: always()
        shell: bash
        run: |
          docker rm -f \
            "runner-smoke-postgres-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SMOKE_SLOT}" \
            "runner-smoke-redis-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SMOKE_SLOT}" \
            >/dev/null 2>&1 || true

          rm -f -- "$BARRIER_DIR/ready-${SMOKE_SLOT}-${RUNNER_NAME}"
          rmdir "$BARRIER_DIR" >/dev/null 2>&1 || true
