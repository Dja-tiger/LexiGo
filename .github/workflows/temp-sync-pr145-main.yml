name: Temporary PR 145 branch sync

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-main:
    if: github.head_ref == 'codex/issue-65-reduced-motion'
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      FEATURE_BRANCH: codex/issue-65-reduced-motion
    steps:
      - name: Clone feature branch into isolated runner temp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          workdir="${RUNNER_TEMP}/lexigo-pr145-sync-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$workdir"
          git clone \
            --branch "$FEATURE_BRANCH" \
            --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$workdir"
          printf 'SYNC_WORKDIR=%s\n' "$workdir" >> "$GITHUB_ENV"

      - name: Merge current main and remove temporary workflow
        run: |
          set -eu
          cd "$SYNC_WORKDIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff --no-commit FETCH_HEAD
          rm .github/workflows/temp-sync-pr145-main.yml
          git add -A
          git diff --cached --check
          git commit -m "chore: sync reduced-motion branch with current main"
          git push origin "HEAD:${FEATURE_BRANCH}"

      - name: Cleanup isolated runner temp
        if: always()
        run: |
          if [ -n "${SYNC_WORKDIR:-}" ] && [ -d "$SYNC_WORKDIR" ]; then
            rm -rf "$SYNC_WORKDIR"
          fi
