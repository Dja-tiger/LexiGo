name: Issue 54 UI repair controller

on:
  pull_request_target:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: issue-54-ui-repair-controller
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.pull_request.number == 110 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/issue-54-catalog-pagination'
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/issue-54-catalog-pagination
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply bounded global hydration and browser regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              content = target.read_text(encoding="utf-8")
              matches = content.count(old)
              if matches != 1:
                  raise SystemExit(f"{path}: expected one match, found {matches}: {old[:140]!r}")
              target.write_text(content.replace(old, new, 1), encoding="utf-8")

          app = "frontend/components/lexigo-premium-app.tsx"
          replace_once(app, dedent("""\
            type CatalogBrowseQuery = {
              topic?: string;
              query?: string;
              sort?: CatalogSortMode;
            };
          """), dedent("""\
            type CatalogBrowseQuery = {
              topic?: string;
              query?: string;
              sort?: CatalogSortMode;
            };

            type PhraseCatalogOptions = {
              page: number;
              topic: string;
              query: string;
              sort: CatalogSortMode;
            };
          """))
          replace_once(app, "function mixedLessonFallbackMessage(lesson: LessonSessionResponse): string {\n", dedent("""\
            function phraseCatalogRequestKey(options: PhraseCatalogOptions): string {
              return [options.page, options.topic, options.query, options.sort].join("\\u001f");
            }

            function mixedLessonFallbackMessage(lesson: LessonSessionResponse): string {
          """))
          replace_once(app, dedent("""\
              const lessonAdvanceRef = useRef<HTMLButtonElement | null>(null);
              const navigationRef = useRef(navigation);
          """), dedent("""\
              const lessonAdvanceRef = useRef<HTMLButtonElement | null>(null);
              const phraseCatalogRequestKeyRef = useRef("");
              const navigationRef = useRef(navigation);
          """))
          replace_once(app, "    options: { page: number; topic: string; query: string; sort: CatalogSortMode },\n", "    options: PhraseCatalogOptions,\n")
          replace_once(app, dedent("""\
              ): Promise<Session | null> => {
                setPhraseCatalogStatus(loadingResourceStatus());
                try {
          """), dedent("""\
              ): Promise<Session | null> => {
                const requestKey = phraseCatalogRequestKey(options);
                phraseCatalogRequestKeyRef.current = requestKey;
                setPhraseCatalogStatus(loadingResourceStatus());
                try {
          """))

          target = Path(app)
          content = target.read_text(encoding="utf-8")
          start = content.index("  const loadPhraseCatalogResource = useCallback")
          end = content.index("  const loadActiveLessonResource = useCallback", start)
          chunk = content[start:end]
          old_abort = "      if (signal?.aborted) return null;\n"
          new_abort = dedent("""\
                  if (signal?.aborted) {
                    if (phraseCatalogRequestKeyRef.current === requestKey) phraseCatalogRequestKeyRef.current = "";
                    return null;
                  }
          """)
          if chunk.count(old_abort) != 2:
              raise SystemExit(f"phrase catalog abort checks: {chunk.count(old_abort)}")
          content = content[:start] + chunk.replace(old_abort, new_abort) + content[end:]
          target.write_text(content, encoding="utf-8")

          replace_once(app, dedent("""\
                  setPhraseCatalogStatus(idleResourceStatus());
                  void Promise.all([
                    loadProgressResource(activeSession, controller.signal, false),
                    loadActiveLessonResource(activeSession, controller.signal, false),
                  ]).then((sessions) => {
          """), dedent("""\
                  setPhraseCatalogStatus(idleResourceStatus());
                  phraseCatalogRequestKeyRef.current = "";
                  void Promise.all([
                    loadProgressResource(activeSession, controller.signal, false),
                    loadPhraseCatalogResource(activeSession, {
                      page: 1,
                      topic: phraseTopic,
                      query: phraseSearch,
                      sort: phraseSortMode,
                    }, controller.signal, false),
                    loadActiveLessonResource(activeSession, controller.signal, false),
                  ]).then((sessions) => {
          """))
          replace_once(app, dedent("""\
                loadActiveLessonResource,
                loadProgressResource,
              ]);

              useEffect(() => {
                if (!session || navigation.view !== "phrases" || navigation.detail) return;
                const controller = new AbortController();
                const timer = window.setTimeout(() => {
                  void loadPhraseCatalogResource(session, {
                    page: phrasePage,
                    topic: phraseTopic,
                    query: phraseSearch,
                    sort: phraseSortMode,
                  }, controller.signal);
                }, 0);
          """), dedent("""\
                loadActiveLessonResource,
                loadPhraseCatalogResource,
                loadProgressResource,
                phraseSearch,
                phraseSortMode,
                phraseTopic,
              ]);

              useEffect(() => {
                if (!session || hydratedUserID !== session.user.id || navigation.view !== "phrases" || navigation.detail) return;
                const options = {
                  page: phrasePage,
                  topic: phraseTopic,
                  query: phraseSearch,
                  sort: phraseSortMode,
                } satisfies PhraseCatalogOptions;
                if (phraseCatalogRequestKeyRef.current === phraseCatalogRequestKey(options)) return;
                const controller = new AbortController();
                const timer = window.setTimeout(() => {
                  void loadPhraseCatalogResource(session, options, controller.signal);
                }, 0);
          """))
          replace_once(app, dedent("""\
              }, [
                loadPhraseCatalogResource,
                navigation.detail,
          """), dedent("""\
              }, [
                hydratedUserID,
                loadPhraseCatalogResource,
                navigation.detail,
          """))

          accessibility = "frontend/e2e/accessibility-keyboard.spec.ts"
          replace_once(accessibility, '  const firstPhrase = page.locator(".lx-phrase-grid > button").first();\n', '  const firstPhrase = page.locator(".lx-phrase-grid > [role=listitem] > button").first();\n')

          async_states = "frontend/e2e/async-states.spec.ts"
          replace_once(async_states, '  await expect(empty).toContainText("В этой теме пока нет фраз");\n  await expect(empty.getByRole("button", { name: "Показать все темы" })).toBeVisible();\n', '  await expect(empty).toContainText("По заданным условиям фразы не найдены");\n  await expect(empty.getByRole("button", { name: "Сбросить фильтры" })).toBeVisible();\n')

          ownership = "frontend/e2e/ui-ownership.spec.ts"
          replace_once(ownership, dedent("""\
                if ((path === "/api/v1/words" || path === "/api/v1/words/due") && url.searchParams.get("kind") === "phrase") {
                  await route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify({ items: PHRASES, count: PHRASES.length }) });
                  return;
                }
          """), dedent("""\
                if ((path === "/api/v1/words" || path === "/api/v1/words/due") && url.searchParams.get("kind") === "phrase") {
                  const sort = url.searchParams.get("sort") ?? "default";
                  const items = [...PHRASES];
                  if (sort === "az") items.sort((left, right) => left.lemma.localeCompare(right.lemma, "en"));
                  if (sort === "za") items.sort((left, right) => right.lemma.localeCompare(left.lemma, "en"));
                  await route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify({
                    items,
                    count: items.length,
                    total: items.length,
                    page: 1,
                    pageSize: 48,
                    totalPages: 1,
                    hasPrevious: false,
                    hasNext: false,
                  }) });
                  return;
                }
          """))
          replace_once(ownership, '  return page.locator(".lx-phrase-grid > button strong").allTextContents();\n', '  return page.locator(".lx-phrase-grid > [role=listitem] > button strong").allTextContents();\n')
          replace_once(ownership, '  expect(await phrasePrompts(page)).toEqual(["alpha pipeline", "Build release", "Zulu cache"]);\n', '  await expect.poll(() => phrasePrompts(page)).toEqual(["alpha pipeline", "Build release", "Zulu cache"]);\n')
          replace_once(ownership, '  expect(await phrasePrompts(page)).toEqual(["alpha pipeline", "Build release", "Zulu cache"]);\n', '  await expect.poll(() => phrasePrompts(page)).toEqual(["alpha pipeline", "Build release", "Zulu cache"]);\n')
          replace_once(ownership, '  expect(await phrasePrompts(page)).toEqual(["alpha pipeline", "Build release", "Zulu cache"]);\n', '  await expect.poll(() => phrasePrompts(page)).toEqual(["alpha pipeline", "Build release", "Zulu cache"]);\n')
          replace_once(ownership, '  expect(await phrasePrompts(page)).toEqual(["Zulu cache", "Build release", "alpha pipeline"]);\n', '  await expect.poll(() => phrasePrompts(page)).toEqual(["Zulu cache", "Build release", "alpha pipeline"]);\n')
          PY

      - name: Verify frontend static gates
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm run test

      - name: Publish UI repair
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "LexiGo CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            frontend/components/lexigo-premium-app.tsx \
            frontend/e2e/accessibility-keyboard.spec.ts \
            frontend/e2e/async-states.spec.ts \
            frontend/e2e/ui-ownership.spec.ts
          git diff --cached --check
          git commit -m "fix(catalog): hydrate one bounded phrase page globally"
          git push origin HEAD:agent/issue-54-catalog-pagination
