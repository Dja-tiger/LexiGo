name: Temporary Issue 651 Stage 4 exact rewrite

on:
  push:
    branches:
      - feat/issue-651-bounded-manual-workload

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v7
        with:
          ref: feat/issue-651-bounded-manual-workload
          fetch-depth: 1

      - name: Apply exact anchored replacements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path("api/openapi.yaml"): [
                  (
                      "description: Catalog item is not assignedен текущему пользователю.",
                      "description: Catalog item is not assigned to the current user.",
                  ),
              ],
              Path("frontend/e2e/learn-browser-zoom.spec.ts"): [
                  (
                      'lessonSize: input.lessonSize ?? "30",',
                      'lessonSize: input.lessonSize ?? "15",',
                  ),
                  (
                      'await expect(currentParameters).toContainText("30 элементов");',
                      'await expect(currentParameters).toContainText("15 элементов");',
                  ),
              ],
          }

          for path, anchored_replacements in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in anchored_replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(
                          f"{path}: expected exactly one anchor {old!r}, found {count}"
                      )
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Verify bounded diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            "api/openapi.yaml"
            "frontend/e2e/learn-browser-zoom.spec.ts"
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected changed paths:\n%s\n' "${changed[*]}" >&2
            exit 1
          fi
          git diff -- api/openapi.yaml frontend/e2e/learn-browser-zoom.spec.ts

      - name: Commit exact rewrite
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/openapi.yaml frontend/e2e/learn-browser-zoom.spec.ts
          git commit -m "fix(learning): reconcile stage 4 large-file contracts"
          git push origin HEAD:feat/issue-651-bounded-manual-workload
