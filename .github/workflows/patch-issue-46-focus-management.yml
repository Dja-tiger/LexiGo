name: Patch issue 46 focus management

on:
  push:
    branches:
      - fix/issue-46-route-focus-management

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[issue-46-patched]') }}
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-46-route-focus-management
          fetch-depth: 0
      - name: Apply accessibility navigation architecture
        run: |
          python3 - <<'PY'
          from pathlib import Path

