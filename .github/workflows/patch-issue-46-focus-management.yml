name: Patch issue 46 focus management

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.head.ref, 'patched') }}
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply focus management patch
        run: python3 scripts/ci/patch-issue-46.py
      - name: Commit patched files and remove temporary tooling
        run: |
          git rm scripts/ci/patch-issue-46.py .github/workflows/patch-issue-46-focus-management.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/components/lexigo-premium-app.tsx frontend/e2e/accessibility-keyboard.spec.ts
          git commit -m "feat(a11y): manage focus across screen transitions [issue-46-patched]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
