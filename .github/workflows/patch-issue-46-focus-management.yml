              if (!currentItem || currentRating || reviewInFlightRef.current) return;'''))

          replacements.append((
          '''    reviewInFlightRef.current = true;
              setReviewing(true);
              setError("");
              try {''',
          '''    reviewInFlightRef.current = true;
              setReviewing(true);
