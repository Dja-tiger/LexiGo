name: Repair dictionary PWA fixture

on:
  push:
    branches:
      - agent/issue-178-academic-technical-english

permissions:
  contents: write

jobs:
  repair:
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/issue-178-academic-technical-english
          fetch-depth: 0
      - name: Repair fixture and push
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('frontend/e2e/dictionary-pwa.spec.ts')
          text = path.read_text()
          replacements = {
              '      page = Number(url.searchParams.get("page") ?? "1");': '      const page = Number(url.searchParams.get("page") ?? "1");',
              'getByRole("combobobox"': 'getByRole("combobox"',
              '.scrollIntoViewIfNeded()': '.scrollIntoViewIfNeeded()',
          }
          changed = False
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
                  changed = True
          if 'academicTechnicalEnglish: 0' not in text:
              old = 'dataEngineering: 0, backend: 60 }'
              if old not in text:
                  raise SystemExit('catalog metadata fixture marker not found')
              text = text.replace(old, 'dataEngineering: 0, backend: 60, academicTechnicalEnglish: 0 }')
              changed = True
          if not changed:
              raise SystemExit(0)
          path.write_text(text)
          PY

          if git diff --quiet -- frontend/e2e/dictionary-pwa.spec.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/e2e/dictionary-pwa.spec.ts
          git commit -m "test(frontend): repair dictionary PWA fixture"
          git push origin HEAD:agent/issue-178-academic-technical-english
