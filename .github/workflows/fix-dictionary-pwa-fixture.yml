name: Finalize dictionary PWA fixture repair

on:
  push:
    branches:
      - agent/issue-178-academic-technical-english

permissions:
  contents: write

jobs:
  repair:
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/issue-178-academic-technical-english
          fetch-depth: 0
      - name: Restore locator copy and remove temporary workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('frontend/e2e/dictionary-pwa.spec.ts')
          text = path.read_text()
          replacements = {
              'Настроить урок по текущей выборие': 'Настроить урок по текущей выборке',
              'Соберите один фукусированный урок': 'Соберите один сфокусированный урок',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing corrupted locator: {old}')
              text = text.replace(old, new)
          if 'academicTechnicalEnglish: 0' not in text:
              raise SystemExit('academic metadata fixture is missing')
          path.write_text(text)
          PY

          rm .github/workflows/fix-dictionary-pwa-fixture.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/e2e/dictionary-pwa.spec.ts .github/workflows/fix-dictionary-pwa-fixture.yml
          git commit -m "test(frontend): finalize dictionary PWA metadata fixture"
          git push origin HEAD:agent/issue-178-academic-technical-english
