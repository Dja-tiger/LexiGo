name: Apply Issue 60 patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened

permissions:
  contents: write

jobs:
  apply:
    name: Apply and verify
    if: github.head_ref == 'agent/issue-60-answer-judgement'
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/issue-60-answer-judgement
          fetch-depth: 0

      - name: Apply deterministic patch
        run: |
          set -Eeuo pipefail
          if ! python3 scripts/issue60_apply.py > issue60-patch.log 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add issue60-patch.log
            git commit -m "chore(issue-60): persist patch diagnostic"
            git push origin HEAD:agent/issue-60-answer-judgement
            exit 1
          fi
          tail -n 5 issue60-patch.log

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: false

      - name: Format and verify backend
        working-directory: backend
        run: |
          set -Eeuo pipefail
          gofmt -w internal/learning internal/words integration/answer_judgement_test.go
          go mod verify
          go test -count=1 ./internal/learning ./internal/words
          go vet ./internal/learning ./internal/words

      - name: Verify frontend contracts
        working-directory: frontend
        run: |
          set -Eeuo pipefail
          bash ../scripts/ci/frontend-container.sh prepare
          cleanup() {
            bash ../scripts/ci/frontend-container.sh cleanup >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          bash ../scripts/ci/frontend-container.sh exec npm ci --no-audit --no-fund
          bash ../scripts/ci/frontend-container.sh exec npm run lint
          bash ../scripts/ci/frontend-container.sh exec npm run typecheck
          bash ../scripts/ci/frontend-container.sh exec npm run test
          bash ../scripts/ci/frontend-container.sh exec npm run build

      - name: Verify generated diff
        run: |
          set -Eeuo pipefail
          git diff --check
          test -f backend/integration/answer_judgement_test.go
          grep -q 'submittedAnswer' frontend/components/lexigo-premium-app.tsx
          grep -q 'effective_rating' backend/internal/learning/repository.go
          grep -q '/answer-suggestions' api/openapi.yaml

      - name: Commit verified implementation
        run: |
          set -Eeuo pipefail
          rm -f scripts/issue60_apply.py .github/workflows/issue-60-apply.yml issue60-patch.log
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(learning): separate correctness from confidence"
          git push origin HEAD:agent/issue-60-answer-judgement
