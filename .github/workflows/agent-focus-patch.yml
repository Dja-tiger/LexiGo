name: Agent Focus Patch

on:
  push:
    branches:
      - agent/issue-53-offline-review-outbox

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[agent-patch]') }}
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/issue-53-offline-review-outbox
          fetch-depth: 0

      - name: Apply exact focus transition patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("frontend/components/lexigo-premium-app.tsx")
          source = path.read_text(encoding="utf-8")
          start = source.index("  async function rateCurrent(")
          end = source.index("\n  function renderHeader()", start)
          block = source[start:end]

          replacements = (
              (
                  '    reviewInFlightRef.current = true;\n'
                  '    setReviewing(true);\n'
                  '    setError("");\n'
                  '    try {\n',
                  '    reviewInFlightRef.current = true;\n'
                  '    setReviewing(true);\n'
                  '    setError("");\n'
                  '    let reviewPersisted = false;\n'
                  '    try {\n',
                  "rateCurrent start",
              ),
              (
                  '      setSession(result.activeSession);\n'
                  '      setRatings((current) => ({ ...current, [currentItem.id]: rating }));\n'
                  '      if (restoreFocusAfterSave) {\n'
                  '        window.requestAnimationFrame(() => lessonAdvanceRef.current?.focus({ preventScroll: true }));\n'
                  '      }\n'
                  '      setServerLessonCompleted(result.data.lessonCompleted);\n',
                  '      setSession(result.activeSession);\n'
                  '      setRatings((current) => ({ ...current, [currentItem.id]: rating }));\n'
                  '      reviewPersisted = true;\n'
                  '      setServerLessonCompleted(result.data.lessonCompleted);\n',
                  "successful review state",
              ),
              (
                  '    } finally {\n'
                  '      reviewInFlightRef.current = false;\n'
                  '      setReviewing(false);\n'
                  '    }\n',
                  '    } finally {\n'
                  '      reviewInFlightRef.current = false;\n'
                  '      setReviewing(false);\n'
                  '      if (reviewPersisted && restoreFocusAfterSave) {\n'
                  '        window.requestAnimationFrame(() => lessonAdvanceRef.current?.focus({ preventScroll: true }));\n'
                  '      }\n'
                  '    }\n',
                  "rateCurrent finally",
              ),
          )

          for old, new, label in replacements:
              count = block.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {label} block, found {count}")
              block = block.replace(old, new, 1)

          path.write_text(source[:start] + block + source[end:], encoding="utf-8")
          PY

      - name: Commit patch
        run: |
          if git diff --quiet -- frontend/components/lexigo-premium-app.tsx; then
            echo "Focus patch is already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/components/lexigo-premium-app.tsx
          git commit -m "fix(a11y): focus lesson advance after review settles [agent-patch]"
          git push origin HEAD:agent/issue-53-offline-review-outbox
