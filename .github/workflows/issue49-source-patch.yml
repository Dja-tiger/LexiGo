name: Issue 49 source patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Reuse validated timezone formatter
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("frontend/lib/calendar-reminder.ts")
          source = path.read_text()
          old = '''function dateFormatter(timeZone: string): Intl.DateTimeFormat {
            const normalized = normalizeCalendarTimeZone(timeZone);
            const cached = dateFormatterCache.get(normalized);
            if (cached) return cached;
            const formatter = new Intl.DateTimeFormat("en-GB", {
              timeZone: normalized,
          '''
          new = '''function dateFormatter(timeZone: string): Intl.DateTimeFormat {
            const cached = dateFormatterCache.get(timeZone);
            if (cached) return cached;
            const formatter = new Intl.DateTimeFormat("en-GB", {
              timeZone,
          '''
          if source.count(old) != 1:
              raise SystemExit("expected dateFormatter block was not found exactly once")
          source = source.replace(old, new)
          source = source.replace("dateFormatterCache.set(normalized, formatter);", "dateFormatterCache.set(timeZone, formatter);", 1)
          path.write_text(source)
          PY
          rm .github/workflows/issue49-source-patch.yml
      - name: Commit focused source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/lib/calendar-reminder.ts .github/workflows/issue49-source-patch.yml
          git commit -m "perf(calendar): reuse validated timezone formatter"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
