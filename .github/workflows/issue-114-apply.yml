name: Apply Issue 114 patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened

permissions:
  contents: write

jobs:
  apply:
    name: Apply and verify
    if: github.head_ref == 'agent/issue-114-phrase-slug-deep-links'
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 60
    env:
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.61.1-noble
      FRONTEND_CI_VOLUME: lexigo-issue114-${{ github.run_id }}-${{ github.run_attempt }}
      APP_BUILD_ID: ${{ github.sha }}
      NEXT_PUBLIC_RUM_SAMPLE_RATE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/issue-114-phrase-slug-deep-links
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: false

      - name: Apply deterministic patch
        run: |
          set -Eeuo pipefail
          python3 scripts/issue114_fixup.py
          if ! python3 scripts/issue114_apply.py > issue114-patch.txt 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f issue114-patch.txt
            git commit -m "chore(issue-114): persist patch diagnostic"
            git push origin HEAD:agent/issue-114-phrase-slug-deep-links
            exit 1
          fi
          tail -n 5 issue114-patch.txt

      - name: Verify backend
        working-directory: backend
        run: |
          set -Eeuo pipefail
          gofmt -w internal/words internal/server integration/phrase_slug_lookup_test.go
          go mod verify
          go test -count=1 ./internal/words ./internal/server
          go vet ./internal/words ./internal/server

      - name: Verify frontend and route regressions
        working-directory: frontend
        run: |
          set -Eeuo pipefail
          bash ../scripts/ci/frontend-container.sh prepare
          cleanup() {
            bash ../scripts/ci/frontend-container.sh cleanup >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          bash ../scripts/ci/frontend-container.sh exec npm ci --no-audit --no-fund
          bash ../scripts/ci/frontend-container.sh exec npm run lint
          bash ../scripts/ci/frontend-container.sh exec npm run typecheck
          bash ../scripts/ci/frontend-container.sh exec npm run test
          bash ../scripts/ci/frontend-container.sh exec npm run build
          bash ../scripts/ci/frontend-container.sh exec npx playwright test e2e/app-router-routes.spec.ts --project=desktop-chromium --project=ios-webkit

      - name: Verify generated diff
        run: |
          set -Eeuo pipefail
          git diff --check
          grep -q 'GET /api/v1/phrases/{slug}' backend/internal/server/server.go
          grep -q 'getPhraseBySlug' api/openapi.yaml
          grep -q 'loadPhraseDetailResource' frontend/components/lexigo-premium-app.tsx
          grep -q 'backend phrase links open in a new tab' frontend/e2e/app-router-routes.spec.ts

      - name: Commit verified implementation
        run: |
          set -Eeuo pipefail
          rm -f scripts/issue114_apply.py scripts/issue114_fixup.py .github/workflows/issue-114-apply.yml issue114-patch.txt
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(catalog): support phrase deep links by slug"
          git push origin HEAD:agent/issue-114-phrase-slug-deep-links
