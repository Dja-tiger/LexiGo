name: Migrate CI to GitHub-hosted runners

on:
  push:
    branches:
      - ci/github-hosted-public-repo
    paths:
      - ".github/workflows/migrate-public-hosted-runners.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: migrate-public-hosted-runners
  cancel-in-progress: true

jobs:
  migrate:
    name: Apply hosted runner profile
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ci/github-hosted-public-repo
          fetch-depth: 0

      - name: Rewrite runner policy
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          from __future__ import annotations

          from pathlib import Path
          from textwrap import dedent

          root = Path.cwd()
          expression = "$" + "{{ vars.CI_RUNNER || 'ubuntu-latest' }}"

          def replace_exact(text: str, old: str, new: str, expected: int, label: str) -> str:
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f"{label}: expected {expected} occurrence(s), found {actual}")
              return text.replace(old, new)

          ci_path = root / ".github/workflows/ci.yml"
          ci = ci_path.read_text(encoding="utf-8")

          cleanup_marker = "\n  ci-resource-cleanup:\n"
          if ci.count(cleanup_marker) != 1:
              raise SystemExit("ci.yml: expected one self-hosted ci-resource-cleanup job")
          ci = ci.split(cleanup_marker, 1)[0].rstrip() + "\n"

          self_hosted_block = dedent("""\
              runs-on:
                - self-hosted
                - linux
                - x64
                - lexigo-ci
          """)
          self_hosted_block = "\n".join("    " + line if line else line for line in self_hosted_block.splitlines()) + "\n"
          hosted_runner = f"    runs-on: {expression}\n"
          ci = replace_exact(ci, self_hosted_block, hosted_runner, 6, "ci.yml runner blocks")

          browser_serialization = dedent("""\
                # The runner services share one resource-constrained physical host.
                # Serialize browser suites so Next.js servers and Playwright workers do
                # not compete for the same CPU and memory pool.
                max-parallel: 1
          """)
          ci = replace_exact(ci, browser_serialization, "", 1, "ci.yml browser serialization")

          build_serialization = dedent("""\
                # BuildKit jobs share one resource-constrained self-hosted host.
                # Serialize image builds to prevent host-wide memory pressure and runner loss.
                max-parallel: 1
          """)
          ci = replace_exact(ci, build_serialization, "", 1, "ci.yml container serialization")

          frontend_anchor = dedent("""\
                - uses: actions/checkout@v7

                - name: Prepare isolated frontend workspace
          """)
          frontend_replacement = dedent("""\
                - uses: actions/checkout@v7

                - name: Validate CI runner policy
                  run: python3 ../scripts/ci/runner_policy_test.py

                - name: Prepare isolated frontend workspace
          """)
          if ci.count(frontend_anchor) < 1:
              raise SystemExit("ci.yml: frontend-core checkout anchor was not found")
          ci = ci.replace(frontend_anchor, frontend_replacement, 1)
          ci_path.write_text(ci, encoding="utf-8")

          storage_path = root / ".github/workflows/actions-storage-cleanup.yml"
          storage = storage_path.read_text(encoding="utf-8")
          storage = replace_exact(storage, self_hosted_block, hosted_runner, 2, "storage cleanup runner blocks")

          policy_path = '      - "scripts/ci/actions_storage_policy_test.py"\n'
          storage = replace_exact(
              storage,
              policy_path,
              policy_path + '      - "scripts/ci/runner_policy_test.py"\n',
              2,
              "storage cleanup path filters",
          )

          policy_step = dedent("""\
                - name: Validate Actions storage policy
                  run: python3 scripts/ci/actions_storage_policy_test.py
          """)
          runner_step = dedent("""\

                - name: Validate CI runner policy
                  run: python3 scripts/ci/runner_policy_test.py
          """)
          storage = replace_exact(storage, policy_step, policy_step + runner_step, 2, "storage validation steps")
          storage_path.write_text(storage, encoding="utf-8")

          runner_cleanup_path = root / ".github/workflows/runner-resource-cleanup.yml"
          runner_cleanup = runner_cleanup_path.read_text(encoding="utf-8")
          scheduled_trigger = dedent("""\
          on:
            schedule:
              - cron: "17 2 * * *"
            workflow_dispatch:
          """)
          manual_trigger = dedent("""\
          on:
            # Dormant while CI uses GitHub-hosted runners. Restore a schedule only
            # after CI_RUNNER is switched back to the self-hosted lexigo-ci pool.
            workflow_dispatch:
          """)
          runner_cleanup = replace_exact(runner_cleanup, scheduled_trigger, manual_trigger, 1, "runner cleanup schedule")
          runner_cleanup_path.write_text(runner_cleanup, encoding="utf-8")

          policy_test = dedent("""\
          #!/usr/bin/env python3
          \"\"\"Regression contract for the active GitHub Actions runner profile.\"\"\"

          from __future__ import annotations

          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[2]
          WORKFLOWS = ROOT / ".github" / "workflows"
          HOSTED_RUNNER = "__RUNNER_EXPRESSION__"


          def require(condition: bool, message: str, violations: list[str]) -> None:
              if not condition:
                  violations.append(message)


          def main() -> None:
              violations: list[str] = []

              ci = (WORKFLOWS / "ci.yml").read_text(encoding="utf-8")
              require(ci.count(HOSTED_RUNNER) == 6, "ci.yml: expected six configurable hosted runner jobs", violations)
              require("self-hosted" not in ci, "ci.yml: hard-coded self-hosted labels are forbidden", violations)
              require("max-parallel: 1" not in ci, "ci.yml: hosted matrices must not be serialized", violations)
              require("ci-resource-cleanup:" not in ci, "ci.yml: shared-host cleanup job must be absent", violations)

              storage = (WORKFLOWS / "actions-storage-cleanup.yml").read_text(encoding="utf-8")
              require(storage.count(HOSTED_RUNNER) == 2, "storage cleanup: expected two configurable hosted jobs", violations)
              require("self-hosted" not in storage, "storage cleanup must not require Selectel", violations)

              runner_cleanup = (WORKFLOWS / "runner-resource-cleanup.yml").read_text(encoding="utf-8")
              require("schedule:" not in runner_cleanup, "scheduled Selectel cleanup must remain disabled", violations)
              require("workflow_dispatch:" in runner_cleanup, "manual Selectel cleanup entry point is required", violations)

              if violations:
                  raise SystemExit("\\n".join(violations))
              print("Validated GitHub-hosted CI profile with unrestricted matrices")


          if __name__ == "__main__":
              main()
          """).replace("__RUNNER_EXPRESSION__", f"runs-on: {expression}")
          (root / "scripts/ci/runner_policy_test.py").write_text(policy_test, encoding="utf-8")

          documentation = dedent("""\
          # GitHub Actions runner policy

          ## Active profile: public repository

          LexiGo uses standard GitHub-hosted Linux runners for build, test, browser and container jobs while the repository is public. Standard GitHub-hosted runner minutes are free for public repositories.

          Runner selection is configurable through the repository variable `CI_RUNNER`. When it is unset, the workflow falls back to `ubuntu-latest`. Browser suites and API/web image builds run as normal parallel matrix jobs without a shared-host `max-parallel: 1` throttle.

          GitHub-hosted jobs use isolated ephemeral virtual machines. The former final `ci-resource-cleanup` job was removed because it cannot clean Docker resources created on other hosted VMs and is unnecessary after VM disposal. Per-job cleanup remains for deterministic logs and local failure handling.

          `Actions storage cleanup` also uses GitHub-hosted runners. Artifact uploads remain failure-oriented, non-blocking and retained for no more than three days. Public runner minutes are free, but artifact and package storage still require the bounded-storage policy.

          ## Dormant self-hosted profile

          `Self-hosted runner smoke` and manual `Runner resource cleanup` remain available. The daily Selectel cleanup schedule is disabled while CI does not use the physical host.

          To return after the repository becomes private:

          1. Start and verify the Selectel services carrying the `lexigo-ci` label.
          2. Run `Self-hosted runner smoke` and require all slots to pass.
          3. Set the repository Actions variable `CI_RUNNER` to `lexigo-ci`.
          4. Re-enable the schedule in `runner-resource-cleanup.yml` through a reviewed PR.
          5. Confirm a full CI run, both container builds and cleanup behavior.

          Do not point a public repository at persistent self-hosted infrastructure.
          """)
          (root / "docs/github-actions-runners.md").write_text(documentation, encoding="utf-8")
          PY

          rm -- .github/workflows/migrate-public-hosted-runners.yml
          python3 scripts/ci/runner_policy_test.py
          python3 scripts/ci/actions_storage_policy_test.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "ci: use GitHub-hosted runners for public repository"
          git push origin HEAD:ci/github-hosted-public-repo
