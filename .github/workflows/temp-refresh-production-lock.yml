name: Temporary production lock refresh

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.head_ref == 'codex/security-production-dependency-audit'
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      NODE_IMAGE: node:22.16.0-bookworm-slim
      SECURITY_BRANCH: codex/security-production-dependency-audit
    steps:
      - name: Clone security branch into isolated runner temp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          workdir="${RUNNER_TEMP}/lexigo-lock-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$workdir"
          git clone \
            --branch "$SECURITY_BRANCH" \
            --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$workdir"
          printf 'SECURITY_WORKDIR=%s\n' "$workdir" >> "$GITHUB_ENV"

      - name: Refresh lockfile and run frontend core gate
        run: |
          mkdir -p "$SECURITY_WORKDIR/frontend/ci-artifacts"
          docker run --rm \
            -e APP_BUILD_ID="${GITHUB_SHA}" \
            -e NEXT_PUBLIC_RUM_SAMPLE_RATE=1 \
            -v "$SECURITY_WORKDIR/frontend:/workspace" \
            -w /workspace \
            "$NODE_IMAGE" \
            bash -lc '
              set -euo pipefail
              {
                npm install --package-lock-only --ignore-scripts --no-audit --no-fund
                npm ci --no-audit --no-fund
                npm ls next postcss sharp
                npm audit --omit=dev --audit-level=high
                npm run lint
                npm run typecheck
                npm run test
                npm run build
              } 2>&1 | tee ci-artifacts/security-core.log
            '

      - name: Upload security core diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-core-diagnostics-${{ github.run_id }}
          path: ${{ env.SECURITY_WORKDIR }}/frontend/ci-artifacts
          if-no-files-found: error
          retention-days: 7

      - name: Commit generated lockfile and remove temporary workflow
        run: |
          set -eu
          cd "$SECURITY_WORKDIR"
          rm .github/workflows/temp-refresh-production-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json .github/workflows/temp-refresh-production-lock.yml
          git diff --cached --check
          git commit -m "chore(security): refresh production dependency lock"
          git push origin "HEAD:${SECURITY_BRANCH}"

      - name: Cleanup isolated runner temp
        if: always()
        run: |
          if [ -n "${SECURITY_WORKDIR:-}" ] && [ -d "$SECURITY_WORKDIR" ]; then
            docker run --rm \
              -v "$SECURITY_WORKDIR:/workspace" \
              alpine:3.20 \
              sh -lc 'rm -rf /workspace/frontend/node_modules /workspace/frontend/.next'
            rm -rf "$SECURITY_WORKDIR"
          fi
