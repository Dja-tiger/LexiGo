name: Temporary production lock refresh

on:
  push:
    branches:
      - codex/security-production-dependency-audit

permissions:
  contents: write

jobs:
  refresh-lock:
    if: contains(github.event.head_commit.message, '[refresh-lock]')
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      NODE_IMAGE: node:22.16.0-bookworm-slim
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: codex/security-production-dependency-audit
          fetch-depth: 0

      - name: Refresh lockfile and run frontend core gate
        run: |
          docker run --rm \
            -e APP_BUILD_ID="${GITHUB_SHA}" \
            -e NEXT_PUBLIC_RUM_SAMPLE_RATE=1 \
            -v "$PWD/frontend:/workspace" \
            -w /workspace \
            "$NODE_IMAGE" \
            sh -lc '
              set -eu
              npm install --package-lock-only --ignore-scripts --no-audit --no-fund
              npm ci --no-audit --no-fund
              npm ls next postcss sharp
              npm audit --omit=dev --audit-level=high
              npm run lint
              npm run typecheck
              npm run test
              npm run build
            '

      - name: Commit generated lockfile and remove temporary workflow
        run: |
          rm .github/workflows/temp-refresh-production-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json .github/workflows/temp-refresh-production-lock.yml
          git diff --cached --check
          git commit -m "chore(security): refresh production dependency lock"
          git push origin HEAD:codex/security-production-dependency-audit
