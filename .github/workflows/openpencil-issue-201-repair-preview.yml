name: OpenPencil issue 201 repair preview

on:
  push:
    branches:
      - design/issue-201-first-use-openpencil
    paths:
      - .github/workflows/openpencil-issue-201-repair-preview.yml

permissions:
  contents: read
  actions: read

jobs:
  repair:
    if: github.ref == 'refs/heads/design/issue-201-first-use-openpencil'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      OPENPENCIL_IMAGE: ghcr.io/zseven-w/openpencil-web:v0.8.2@sha256:e13982f18ba3f87ef422c84738be261a337ceccd877aff6ea69a16354fce9775
      PREVIEW_ARTIFACT_ID: '9262389740'
      PREVIEW_GENERATED_SHA: 14093098dc988c59f351390bcef0dd23e45df91a9ca473d7e54759856ed76ec8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download reviewed OpenPencil preview artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/op201-artifact" .tmp/openpencil-issue-201-repair
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$PREVIEW_ARTIFACT_ID/zip" \
            -o "$RUNNER_TEMP/op201-preview.zip"
          unzip -q "$RUNNER_TEMP/op201-preview.zip" -d "$RUNNER_TEMP/op201-artifact"
          test "$(sha256sum "$RUNNER_TEMP/op201-artifact/generated.op" | awk '{print $1}')" = "$PREVIEW_GENERATED_SHA"

      - name: Start repaired preview MCP
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/openpencil-201-repair-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$root/worktree/design/openpencil" "$root/state" "$root/backups"
          cp "$RUNNER_TEMP/op201-artifact/generated.op" "$root/worktree/design/openpencil/LexiGo Design System.op"
          cp 'design/openpencil/LexiGo Design Tokens.json' "$root/worktree/design/openpencil/LexiGo Design Tokens.json"
          export OPENPENCIL_WORKTREE="$root/worktree"
          export OPENPENCIL_STATE_DIR="$root/state"
          export OPENPENCIL_BACKUP_DIR="$root/backups"
          export OPENPENCIL_UID="$(id -u)"
          export OPENPENCIL_GID="$(id -g)"
          export OPENPENCIL_BACKUP_KEEP=1
          export OPENPENCIL_MCP_PORT="$((47000 + GITHUB_RUN_ID % 1000))"
          export OPENPENCIL_COMPOSE_PROJECT="lexigo-op-201-repair-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "OPENPENCIL_WORKTREE=$OPENPENCIL_WORKTREE"
            echo "OPENPENCIL_STATE_DIR=$OPENPENCIL_STATE_DIR"
            echo "OPENPENCIL_BACKUP_DIR=$OPENPENCIL_BACKUP_DIR"
            echo "OPENPENCIL_UID=$OPENPENCIL_UID"
            echo "OPENPENCIL_GID=$OPENPENCIL_GID"
            echo "OPENPENCIL_BACKUP_KEEP=$OPENPENCIL_BACKUP_KEEP"
            echo "OPENPENCIL_MCP_PORT=$OPENPENCIL_MCP_PORT"
            echo "OPENPENCIL_COMPOSE_PROJECT=$OPENPENCIL_COMPOSE_PROJECT"
          } >> "$GITHUB_ENV"
          docker pull "$OPENPENCIL_IMAGE"
          docker compose -p "$OPENPENCIL_COMPOSE_PROJECT" -f deploy/openpencil/compose.yml --profile agent up -d mcp
          python3 - <<'PY'
          import json, os, time, urllib.request
          url=f"http://127.0.0.1:{os.environ['OPENPENCIL_MCP_PORT']}/mcp"
          body=json.dumps({"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"lexigo-201-repair","version":"1"}}}).encode()
          for _ in range(90):
              try:
                  req=urllib.request.Request(url,data=body,headers={"Content-Type":"application/json"},method="POST")
                  with urllib.request.urlopen(req,timeout=2) as r: payload=json.loads(r.read().decode())
                  if "result" in payload: break
              except Exception: time.sleep(1)
          else: raise SystemExit("MCP readiness timeout")
          PY

      - name: Repair layout semantically and render evidence
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path

          OUT=Path('.tmp/openpencil-issue-201-repair')
          PAGE='figma-page-17'
          url=f"http://127.0.0.1:{os.environ['OPENPENCIL_MCP_PORT']}/mcp"
          rid=10
          def rpc(method,params):
              global rid; rid+=1
              req=urllib.request.Request(url,data=json.dumps({'jsonrpc':'2.0','id':rid,'method':method,'params':params},ensure_ascii=False).encode(),headers={'Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=30) as r: p=json.loads(r.read().decode())
              if 'error' in p: raise RuntimeError(p['error'])
              return p
          def tool(name,args):
              p=rpc('tools/call',{'name':name,'arguments':args}); r=p['result']; text='\n'.join(i.get('text','') for i in r.get('content',[]) if 'text' in i)
              if r.get('isError'): raise RuntimeError(f'{name}: {text}')
              try: return json.loads(text)
              except Exception: return text
          pages=tool('list_pages',{})['pages']; tool('set_active_page',{'index':next(i for i,p in enumerate(pages) if p['id']==PAGE)})

          # Mobile resume: reserve two lines for title, move rule/card/resume note,
          # then keep all three self-mark actions + skip + primary action visible.
          repairs={
            'n69': {'height':68}, 'n70': {'y':250,'height':42}, 'n71': {'y':306}, 'n83': {'y':470},
            'n74': {'y':546}, 'n76': {'y':600}, 'n78': {'y':654}, 'n80': {'y':714}, 'n81': {'y':744},
            'n229': {'height':68}, 'n230': {'y':250,'height':42}, 'n231': {'y':306}, 'n243': {'y':470},
            'n234': {'y':546}, 'n236': {'y':600}, 'n238': {'y':654}, 'n240': {'y':714}, 'n241': {'y':744},
            # Desktop onboarding: two-line title gets a real text box; body and panel move below it.
            'n303': {'height':92,'fontSize':36}, 'n304': {'y':238,'height':42}, 'n305': {'y':306,'height':540},
            'n475': {'height':92,'fontSize':36}, 'n476': {'y':238,'height':42}, 'n477': {'y':306,'height':540},
            # Desktop Guest Home hero: reduce display size and separate description from headline.
            'n325': {'width':620,'height':126,'fontSize':40}, 'n326': {'y':340,'width':570,'height':72},
            'n497': {'width':620,'height':126,'fontSize':40}, 'n498': {'y':340,'width':570,'height':72},
          }
          for node,data in repairs.items(): tool('update_node',{'nodeId':node,'pageId':PAGE,'data':json.dumps(data,separators=(',',':'))})

          roots={
            'resume-mobile-light':'n62','resume-mobile-dark':'n222',
            'onboarding-desktop-light':'n299','onboarding-desktop-dark':'n471',
            'guest-desktop-light':'n321','guest-desktop-dark':'n493',
          }
          manifest={'repairs':repairs,'screens':{}}
          for key,node in roots.items():
              shot=tool('get_screenshot',{'nodeId':node}); png=base64.b64decode(shot['image_base64']); (OUT/f'{key}.png').write_bytes(png)
              manifest['screens'][key]={'nodeId':node,'sha256':hashlib.sha256(png).hexdigest()}
          generated=Path(os.environ['OPENPENCIL_WORKTREE'])/'design/openpencil/LexiGo Design System.op'
          manifest['repairedSha256']=hashlib.sha256(generated.read_bytes()).hexdigest()
          (OUT/'repaired.op').write_bytes(generated.read_bytes())
          (OUT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'repairedSha256':manifest['repairedSha256'],'screens':manifest['screens']},indent=2))
          PY

      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openpencil-issue-201-repair-${{ github.sha }}
          path: .tmp/openpencil-issue-201-repair/
          if-no-files-found: error
          retention-days: 3

      - name: Cleanup
        if: always()
        run: |
          set +e
          docker compose -p "$OPENPENCIL_COMPOSE_PROJECT" -f deploy/openpencil/compose.yml --profile agent down --volumes --remove-orphans
          rm -rf "$OPENPENCIL_WORKTREE" "$OPENPENCIL_STATE_DIR" "$OPENPENCIL_BACKUP_DIR"
