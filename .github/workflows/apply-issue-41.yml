name: Apply Issue 41

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'fix/issue-41-catalog-metadata' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-41-catalog-metadata
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply deterministic patch
        run: |
          set -o pipefail
          { python scripts/apply_issue_41.py
            gofmt -w backend/internal/words/metadata.go backend/internal/words/metadata_http.go backend/internal/words/metadata_test.go backend/integration/catalog_metadata_test.go
            git diff --check
          } 2>&1 | tee issue41.log
      - name: Verify backend
        working-directory: backend
        run: |
          set -o pipefail
          { go test ./internal/words ./internal/server
            go test -run '^$' -tags=integration ./integration
          } 2>&1 | tee -a ../issue41.log
      - name: Verify frontend
        working-directory: frontend
        run: |
          set -o pipefail
          { npm ci --no-audit --no-fund
            npm run lint
            npm run typecheck
            npm test
            npm run build
          } 2>&1 | tee -a ../issue41.log
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: issue-41-apply-diagnostics
          path: issue41.log
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api backend frontend docs/catalog-metadata.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(catalog): use backend metadata for product counters"
          git push origin HEAD:fix/issue-41-catalog-metadata
