name: Apply Issue 41

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.head_ref == 'fix/issue-41-catalog-metadata' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-41-catalog-metadata
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply deterministic product patch
        run: |
          set -o pipefail
          {
            sed -i '/^[[:space:]]*setCatalogMetadataStatus("loading");$/d' scripts/apply_issue_41.py
            python3 scripts/apply_issue_41.py
            gofmt -w backend/internal/words backend/integration/catalog_metadata_test.go
            git diff --check
          } 2>&1 | tee issue41.log
      - name: Verify backend compile and unit contracts
        working-directory: backend
        run: |
          set -o pipefail
          {
            go test ./internal/words ./internal/server
            go test -run '^$' -tags=integration ./integration
          } 2>&1 | tee -a ../issue41.log
      - name: Verify frontend static gates
        working-directory: frontend
        run: |
          set -o pipefail
          {
            npm ci --no-audit --no-fund
            npm run lint
            npm run typecheck
            npm test
            npm run build
          } 2>&1 | tee -a ../issue41.log
      - name: Upload apply diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: issue-41-apply-diagnostics
          path: issue41.log
      - name: Commit product-only diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api backend frontend
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(catalog): consume authoritative metadata counters"
          git push origin HEAD:fix/issue-41-catalog-metadata
