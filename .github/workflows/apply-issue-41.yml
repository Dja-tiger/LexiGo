name: Apply Issue 41

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'fix/issue-41-catalog-metadata' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lexigo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lexigo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/lexigo_test?sslmode=disable
      TEST_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-41-catalog-metadata
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply deterministic patch
        run: |
          python scripts/apply_issue_41.py
          gofmt -w backend/internal/words/metadata.go backend/internal/words/metadata_http.go backend/internal/words/metadata_test.go backend/integration/catalog_metadata_test.go
          git diff --check
      - name: Verify backend
        working-directory: backend
        run: |
          go test ./internal/words ./internal/server
          go test -race -tags=integration ./integration -run TestCatalogMetadataIsPublicCacheableAndTracksCatalogChanges -count=1
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api backend frontend docs/catalog-metadata.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(catalog): use backend metadata for product counters"
          git push origin HEAD:fix/issue-41-catalog-metadata
