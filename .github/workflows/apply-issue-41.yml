name: Apply Issue 41

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.head_ref == 'fix/issue-41-catalog-metadata' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-41-catalog-metadata
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply deterministic product patch
        run: |
          python scripts/apply_issue_41.py
          gofmt -w backend/internal/words backend/integration/catalog_metadata_test.go
          git diff --check
      - name: Verify backend compile and unit contracts
        working-directory: backend
        run: |
          go test ./internal/words ./internal/server
          go test -run '^$' -tags=integration ./integration
      - name: Verify frontend static gates
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Commit product-only diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api backend frontend
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(catalog): consume authoritative metadata counters"
          git push origin HEAD:fix/issue-41-catalog-metadata
