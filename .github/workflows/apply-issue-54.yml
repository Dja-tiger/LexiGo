name: Apply Issue 54

on:
  push:
    branches:
      - agent/issue-54-catalog-pagination

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/issue-54-catalog-pagination
      - name: Apply bounded catalog pagination
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .github/scripts
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          payload = """"""
          target = Path('.github/scripts/apply_issue54.py')
          target.write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          python .github/scripts/apply_issue54.py
          gofmt -w \
            backend/internal/words/repository.go \
            backend/internal/words/http.go \
            backend/internal/learning/lesson.go \
            backend/internal/learning/lesson_http.go \
            backend/internal/learning/lesson_composer.go \
            backend/internal/learning/lesson_repository.go \
            backend/integration/catalog_pagination_test.go
          git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm --force .github/workflows/apply-issue-54.yml .github/scripts/apply_issue54.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m 'feat(catalog): paginate large vocabulary views'
          git push origin HEAD:agent/issue-54-catalog-pagination
