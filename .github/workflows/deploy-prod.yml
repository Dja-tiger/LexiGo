name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable image tag, normally a main commit SHA"
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read
  issues: write

jobs:
  deploy:
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Deploy production
        id: deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/deploy-over-ssh.sh prod "$IMAGE_TAG"

      - name: Report production deployment
        if: always()
        uses: actions/github-script@v9
        env:
          DEPLOY_STATUS: ${{ job.status }}
          IMAGE_SHA: ${{ inputs.image_tag }}
          RUN_ID: ${{ github.run_id }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOY_LOG: ${{ runner.temp }}/lexigo-prod-deploy.log
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync(process.env.DEPLOY_LOG)
              ? fs.readFileSync(process.env.DEPLOY_LOG, 'utf8').slice(-10000)
              : 'deploy log was not created';
            const body = [
              '# LexiGo production deployment',
              '',
              `## Production: **${process.env.DEPLOY_STATUS}**`,
              `- image SHA: \`${process.env.IMAGE_SHA}\``,
              `- run_id: \`${process.env.RUN_ID}\``,
              `- deploy: \`${process.env.DEPLOY_OUTCOME}\``,
              '',
              '```text',
              log,
              '```'
            ].join('\n');
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 12,
              body
            });

      - name: Cleanup deployment log
        if: always()
        run: rm -f -- "$RUNNER_TEMP/lexigo-prod-deploy.log"
