name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable image tag, normally a main commit SHA"
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read
  issues: write

jobs:
  deploy:
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 40
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Verify Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -Eeuo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"
          RESPONSE="$response" python3 - <<'PY'
          import json
          import os
          payload = json.loads(os.environ["RESPONSE"])
          if payload.get("success") is not True or payload.get("result", {}).get("status") != "active":
              raise SystemExit("Cloudflare API token is not active")
          PY

      - name: Deploy production
        id: deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/deploy-over-ssh.sh prod "$IMAGE_TAG"

      - name: Verify public production endpoints
        id: public_smoke
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
        run: |
          set -Eeuo pipefail
          set -o pipefail
          bash scripts/ci/public-smoke.sh "$PUBLIC_URL" "$API_PUBLIC_URL" \
            2>&1 | tee -a "$RUNNER_TEMP/lexigo-prod-deploy.log"

      - name: Report production deployment
        if: always()
        uses: actions/github-script@v9
        env:
          DEPLOY_STATUS: ${{ job.status }}
          IMAGE_SHA: ${{ inputs.image_tag }}
          RUN_ID: ${{ github.run_id }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          PUBLIC_SMOKE_OUTCOME: ${{ steps.public_smoke.outcome }}
          DEPLOY_LOG: ${{ runner.temp }}/lexigo-prod-deploy.log
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync(process.env.DEPLOY_LOG)
              ? fs.readFileSync(process.env.DEPLOY_LOG, 'utf8').slice(-12000)
              : 'deploy log was not created';
            const body = [
              '# LexiGo production deployment',
              '',
              `## Production: **${process.env.DEPLOY_STATUS}**`,
              `- image SHA: \`${process.env.IMAGE_SHA}\``,
              `- run_id: \`${process.env.RUN_ID}\``,
              `- deploy: \`${process.env.DEPLOY_OUTCOME}\``,
              `- public smoke: \`${process.env.PUBLIC_SMOKE_OUTCOME}\``,
              '',
              '```text',
              log,
              '```'
            ].join('\n');
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 12,
              body
            });

      - name: Cleanup deployment log
        if: always()
        run: rm -f -- "$RUNNER_TEMP/lexigo-prod-deploy.log"
