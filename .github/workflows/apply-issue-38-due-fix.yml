name: Apply Issue 38 Due Fix

on:
  push:
    branches: [fix/issue-38-study-review-mode]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[issue-38-due-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-38-study-review-mode
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: backend/go.sum
      - name: Preserve due schedule for existing study items
        run: |
          python scripts/apply_issue_38_due_fix.py
          gofmt -w backend/internal/learning backend/integration
          git diff --check
      - name: Verify learning package
        working-directory: backend
        run: go test ./internal/learning/...
      - name: Commit due-schedule correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "[issue-38-due-fix] preserve objective due schedule during study"
          git push origin HEAD:fix/issue-38-study-review-mode
