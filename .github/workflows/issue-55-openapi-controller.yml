name: Issue 55 OpenAPI controller

on:
  pull_request_target:
    types: [synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  integrate:
    if: github.event.pull_request.number == 111
    runs-on: [self-hosted, linux, x64, lexigo-ci]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/issue-55-real-dictionary-catalog
          fetch-depth: 0
      - name: Update OpenAPI
        run: |
          python3 scripts/issue55_openapi.py
          git rm scripts/issue55_openapi.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/openapi.yaml
          git diff --cached --check
          git commit -m 'docs(api): describe dictionary filters and item detail'
          git push origin HEAD:agent/issue-55-real-dictionary-catalog
      - name: Remove controller
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/issue-55-openapi-controller.yml
          git commit -m 'chore(ci): remove issue 55 OpenAPI controller [skip ci]'
          git push origin HEAD:main
