name: Repair Lesson Result integration

on:
  pull_request:
    paths:
      - .github/workflows/fix-lesson-result-lint.yml

permissions:
  contents: write

jobs:
  repair:
    name: Repair canonical Lesson Result sources
    if: github.event.pull_request.head.ref == 'agent/issue-194-lesson-result'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/issue-194-lesson-result
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Repair exact integration defects
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('frontend/components/lexigo-premium-app.tsx')
          app = app_path.read_text()
          broken = '  lesson@riorityDescription,'
          fixed = '  lessonPriorityDescription,'
          if app.count(broken) != 1:
              raise RuntimeError(f'expected one corrupted lesson priority import, found {app.count(broken)}')
          app_path.write_text(app.replace(broken, fixed, 1))

          spec_path = Path('frontend/e2e/next-lesson-progression.spec.ts')
          spec = spec_path.read_text()
          old = 'const WORDS = BLOCKS.flat().map(({ position: _position, ...item }) => item);'
          new = '''const WORDS = BLOCKS.flat().map(({ position, ...item }) => {
            void position;
            return item;
          });'''
          if spec.count(old) != 1:
              raise RuntimeError(f'expected one WORDS projection, found {spec.count(old)}')
          spec_path.write_text(spec.replace(old, new, 1))
          PY

      - name: Commit clean repair
        run: |
          set -Eeuo pipefail
          rm .github/workflows/fix-lesson-result-lint.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(frontend): repair Lesson Result integration sources'
          git push origin HEAD:agent/issue-194-lesson-result
