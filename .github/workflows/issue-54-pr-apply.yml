name: Apply Issue 54 CI fixes

on:
  push:
    branches: [agent/issue-54-catalog-pagination]

permissions:
  contents: write

jobs:
  fix:
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply CI and accessibility fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              content = target.read_text(encoding='utf-8')
              if content.count(old) != 1:
                  raise SystemExit(f'{path}: matches={content.count(old)} for {old[:90]!r}')
              target.write_text(content.replace(old, new, 1), encoding='utf-8')

          app = 'frontend/components/lexigo-premium-app.tsx'
          replace_once(app, '''  prepareWordItems,
  takeLessonBlock,
''', '')
          replace_once(app, '''  const lessonAdvanceRef = useRef<HTMLButtonElement | null>(null);
  const phraseListScrollRef = useRef<NavigationScrollPosition>({ x: 0, y: 0 });
''', '''  const lessonAdvanceRef = useRef<HTMLButtonElement | null>(null);
''')
          replace_once(app, '''      setProgress(null);
      setActiveLesson(null);
      setPhraseCatalog(DEFAULT_PHRASE_CATALOG);
      void Promise.all([
''', '''      setProgress(null);
      setActiveLesson(null);
      setPhraseCatalog([]);
      setPhraseCatalogPageInfo(paginateCatalogEntries(DEFAULT_PHRASE_CATALOG, 1).info);
      setPhrasePage(1);
      setPhraseCatalogStatus(idleResourceStatus());
      void Promise.all([
''')
          replace_once(app, '      let currentSession = activeSession;\n', '      const currentSession = activeSession;\n')
          replace_once(app, '''  function openPhraseDetail(phrase: LearningItem) {
    phraseListScrollRef.current = { x: window.scrollX, y: window.scrollY };
    navigate({ view: "phrases", detail: itemKey(phrase) });
  }

  function backToPhraseCatalog() {
    navigate({ view: "phrases" }, true, { scroll: phraseListScrollRef.current });
  }
''', '''  function openPhraseDetail(phrase: LearningItem) {
    navigate({ view: "phrases", detail: itemKey(phrase) });
  }

  function backToPhraseCatalog() {
    const destination = navigationTabs.destination("phrases");
    navigate({ view: "phrases" }, true, { scroll: destination.scroll });
  }
''')

          test = 'frontend/e2e/catalog-pagination.spec.ts'
          replace_once(test, '''  const requestedLimits: number[] = [];
  await installAPI(context, requestedLimits);
  const errors = captureErrors(page);
''', '''  const requestedLimits: number[] = [];
  await context.addInitScript(() => {
    const updateMaximum = () => {
      const current = document.querySelectorAll(".lx-phrase-grid [role=listitem]").length;
      const previous = Number(document.documentElement.dataset.lexigoMaxCatalogItems ?? "0");
      document.documentElement.dataset.lexigoMaxCatalogItems = String(Math.max(previous, current));
    };
    new MutationObserver(updateMaximum).observe(document, { childList: true, subtree: true });
  });
  await installAPI(context, requestedLimits);
  const errors = captureErrors(page);
''')
          replace_once(test, '''  expect(requestedLimits.length).toBeGreaterThan(0);
  expect(requestedLimits.every((limit) => limit <= 48)).toBe(true);
''', '''  expect(requestedLimits.length).toBeGreaterThan(0);
  expect(requestedLimits.every((limit) => limit <= 48)).toBe(true);
  expect(await page.evaluate(() => Number(document.documentElement.dataset.lexigoMaxCatalogItems ?? "0"))).toBeLessThanOrEqual(48);
''')

          replace_once('frontend/app/catalog-pagination.css', '''.lx-phrase-grid > [role="listitem"] {
  display: contents;
}
''', '''.lx-phrase-grid > [role="listitem"] {
  min-width: 0;
}

.lx-phrase-grid > [role="listitem"] > button {
  width: 100%;
  height: 100%;
}
''')

          replace_once('backend/integration/catalog_pagination_test.go', '''		insert into words (lemma, translation, part_of_speech, topic, examples, note, source, kind, slug)
		select format('page phrase %s', lpad(series::text, 3, '0')),
		       format('страничная фраза %s', series),
		       'phrase',
		       'Pagination Test',
		       '[]'::jsonb,
		       '',
		       'integration-pagination',
		       'phrase',
		       format('page-phrase-%s', lpad(series::text, 3, '0'))
''', '''		insert into words (lemma, translation, part_of_speech, topic, examples, note, source, kind, slug, cloze, cloze_answer)
		select format('page phrase %s', lpad(series::text, 3, '0')),
		       format('страничная фраза %s', series),
		       'phrase',
		       'Pagination Test',
		       '[]'::jsonb,
		       '',
		       'integration-pagination',
		       'phrase',
		       format('page-phrase-%s', lpad(series::text, 3, '0')),
		       format('page phrase _____ %s', lpad(series::text, 3, '0')),
		       'test'
''')
          PY
          gofmt -w backend/integration/catalog_pagination_test.go
      - name: Verify backend compilation and unit tests
        working-directory: backend
        run: |
          go test ./...
          go test -run '^$' -tags=integration ./integration
      - name: Verify frontend quality gates
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm run test
      - name: Commit fixes and remove workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "LexiGo CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/issue-54-pr-apply.yml
          git add backend/integration/catalog_pagination_test.go frontend/components/lexigo-premium-app.tsx frontend/e2e/catalog-pagination.spec.ts frontend/app/catalog-pagination.css
          git diff --cached --check
          git commit -m "fix(catalog): satisfy bounded rendering gates"
          git push origin HEAD:agent/issue-54-catalog-pagination
