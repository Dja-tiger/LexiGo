name: Bootstrap Issue 54 from PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/issue-54-catalog-pagination'
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: backend/go.sum
      - name: Apply implementation from bootstrap script
        shell: bash
        run: |
          set -Eeuo pipefail
          if git log -1 --pretty=%s | grep -q '^feat(catalog): paginate large catalog views$'; then
            echo 'Implementation is already applied.'
            exit 0
          fi
          rm -f .github/scripts/issue54-bootstrap-error.txt
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/issue-54-apply.yml').read_text(encoding='utf-8').splitlines()
          start = workflow.index("          python3 - <<'PY'") + 1
          end = workflow.index('          PY', start)
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end]) + '\n'
          script = script.replace('if text.count(old) != 1:', 'if text.count(old) < 1:')
          Path('/tmp/issue-54-apply.py').write_text(script, encoding='utf-8')
          PY
          if ! python3 /tmp/issue-54-apply.py > /tmp/issue-54-apply.log 2>&1; then
            mkdir -p .github/scripts
            tail -n 80 /tmp/issue-54-apply.log > .github/scripts/issue54-bootstrap-error.txt
            git config user.name "LexiGo CI"
            git config user.email "actions@users.noreply.github.com"
            git add .github/scripts/issue54-bootstrap-error.txt
            git commit -m "chore: capture issue 54 bootstrap error"
            git push origin HEAD:agent/issue-54-catalog-pagination
            exit 1
          fi
          gofmt -w backend/internal/words/repository.go backend/internal/words/http.go backend/internal/words/metadata.go backend/internal/learning/lesson.go backend/internal/learning/lesson_http.go backend/internal/learning/lesson_composer.go backend/internal/learning/lesson_repository.go backend/integration/catalog_pagination_test.go
      - name: Backend unit tests
        working-directory: backend
        run: go test ./...
      - name: Frontend type and unit tests
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run test
      - name: Commit implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- backend frontend api docs; then
            echo 'No implementation diff to commit.'
            exit 0
          fi
          git config user.name "LexiGo CI"
          git config user.email "actions@users.noreply.github.com"
          git add backend frontend api docs
          git diff --cached --check
          git commit -m "feat(catalog): paginate large catalog views"
          git push origin HEAD:agent/issue-54-catalog-pagination
