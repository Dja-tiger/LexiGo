name: Cleanup Issue 54 bootstrap

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'agent/issue-54-catalog-pagination'
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Remove bootstrap artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "LexiGo CI"
          git config user.email "actions@users.noreply.github.com"
          git rm --ignore-unmatch --force \
            .github/scripts/issue54-bootstrap-error.txt \
            .github/scripts/issue54.payload.00 \
            .github/scripts/issue54.payload.01 \
            .github/scripts/issue54.payload.02 \
            .github/scripts/issue54.payload.03 \
            .github/scripts/issue54.payload.ready \
            .github/workflows/apply-issue-54-pr.yml \
            .github/workflows/apply-issue-54.yml \
            .github/workflows/issue-54-apply.yml \
            .github/workflows/issue-54-pr-apply.yml \
            .issue-54-trigger \
            frontend/tsconfig.tsbuildinfo
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Bootstrap artifacts already removed.'
            exit 0
          fi
          git commit -m "chore: remove issue 54 bootstrap artifacts"
          git push origin HEAD:agent/issue-54-catalog-pagination
