name: Refine issue 46 route focus

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refine:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.head.sha, 'issue-46-refined') }}
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Refine focus transfer and route announcement observability
        run: python3 scripts/ci/refine-issue-46.py
      - name: Commit refinement and remove temporary tooling
        run: |
          git rm scripts/ci/refine-issue-46.py .github/workflows/refine-issue-46-focus.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/components/lexigo-premium-app.tsx
          git commit -m "fix(a11y): preserve focus after review updates [issue-46-refined]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
