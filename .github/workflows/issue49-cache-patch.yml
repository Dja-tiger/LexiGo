name: Issue 49 cache patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Bound generated timezone definitions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("frontend/lib/calendar-reminder.ts")
          source = path.read_text()
          old_constants = '''const TIME_ZONE_YEARS_AHEAD = 10;
          const dateFormatterCache = new Map<string, Intl.DateTimeFormat>();
          const timeZoneLinesCache = new Map<string, string[]>();'''
          new_constants = '''const TIME_ZONE_YEARS_AHEAD = 10;
          const TIME_ZONE_LINES_CACHE_LIMIT = 32;
          const dateFormatterCache = new Map<string, Intl.DateTimeFormat>();
          const timeZoneLinesCache = new Map<string, string[]>();'''
          old_set = '''  timeZoneLinesCache.set(cacheKey, lines);
            return lines;'''
          new_set = '''  if (timeZoneLinesCache.size >= TIME_ZONE_LINES_CACHE_LIMIT) {
              const oldestKey = timeZoneLinesCache.keys().next().value;
              if (oldestKey !== undefined) timeZoneLinesCache.delete(oldestKey);
            }
            timeZoneLinesCache.set(cacheKey, lines);
            return lines;'''
          if source.count(old_constants) != 1 or source.count(old_set) != 1:
              raise SystemExit("expected timezone cache blocks were not found exactly once")
          source = source.replace(old_constants, new_constants).replace(old_set, new_set)
          path.write_text(source)
          PY
          rm .github/workflows/issue49-cache-patch.yml
      - name: Commit focused cache patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/lib/calendar-reminder.ts .github/workflows/issue49-cache-patch.yml
          git commit -m "perf(calendar): bound generated timezone cache"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
