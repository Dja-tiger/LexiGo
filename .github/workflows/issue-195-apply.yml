name: Issue 195 apply

on:
  push:
    branches:
      - agent/issue-195-progress-evidence

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/issue-195-progress-evidence
      - name: Apply deterministic progress evidence patch
        run: python3 scripts/issue195_apply_bootstrap.py
      - name: Commit production slice
        run: |
          set -Eeuo pipefail
          git config user.name "Dja-tiger"
          git config user.email "117261349+Dja-tiger@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(progress): add retained-learning evidence"
          git push origin HEAD:agent/issue-195-progress-evidence
