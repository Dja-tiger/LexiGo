name: Issue 55 typecheck updater
on:
  pull_request_target:
    types: [synchronize]
permissions:
  contents: write
jobs:
  update:
    if: github.event.pull_request.number == 111
    runs-on: [self-hosted, linux, x64, lexigo-ci]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/issue-55-real-dictionary-catalog
          fetch-depth: 0
      - run: python3 scripts/issue55_fix_typecheck.py
      - run: |
          git rm scripts/issue55_fix_typecheck.py
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add frontend/components/dictionary-catalog.tsx
          git commit -m 'fix(dictionary): narrow remote detail state'
          git push origin HEAD:agent/issue-55-real-dictionary-catalog
