name: Go formatting diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  gofmt-diagnostics:
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: false
      - name: Capture unformatted files
        run: |
          gofmt -l ./backend | tee gofmt-files.txt
      - name: Upload formatting diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: gofmt-files
          path: gofmt-files.txt
          if-no-files-found: error
          retention-days: 1
      - name: Fail when formatting is required
        run: test ! -s gofmt-files.txt
