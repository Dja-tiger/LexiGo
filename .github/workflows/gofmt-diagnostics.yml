name: Scoped Go formatting autofix

on:
  pull_request:

permissions:
  contents: write

jobs:
  gofmt-autofix:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/issue-57-account-management'
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: false
      - name: Format identified files
        run: |
          gofmt -w \
            backend/integration/account_privacy_test.go \
            backend/internal/account/model.go \
            backend/internal/account/service.go \
            backend/internal/account/service_test.go
      - name: Commit formatting-only changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/integration/account_privacy_test.go \
            backend/internal/account/model.go \
            backend/internal/account/service.go \
            backend/internal/account/service_test.go
          git commit -m "style(go): apply gofmt to account changes"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
