name: Issue 36 Lint Diagnostics

on:
  push:
    branches: [fix/issue-36-react-owned-ui]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Capture ESLint output
        id: lint
        continue-on-error: true
        run: npm run lint > eslint.log 2>&1
      - uses: actions/upload-artifact@v7
        with:
          name: issue-36-eslint-log
          path: frontend/eslint.log
          if-no-files-found: error
          retention-days: 1
      - name: Preserve lint result
        if: steps.lint.outcome == 'failure'
        run: exit 1
