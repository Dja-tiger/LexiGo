name: Fix issue 46 browser assertions

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Correct responsive and reduced-motion assertions
        run: python3 scripts/ci/fix-issue-46-browser-tests.py
      - name: Commit correction and remove temporary tooling
        run: |
          git rm scripts/ci/fix-issue-46-browser-tests.py .github/workflows/fix-issue-46-browser-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/e2e/route-focus-management.spec.ts
          git commit -m "test(a11y): stabilize responsive route focus assertions [issue-46-browser]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
