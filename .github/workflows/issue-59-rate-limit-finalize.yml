name: Issue 59 rate limit finalize

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/issue-59-performance-budgets
      - name: Finalize contract and formatting
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "docs/performance-observability.md",
              "`post /api/v1/performance/rum` is public because guest sessions also affect release quality. The endpoint is same-origin protected, limited to 120 requests per minute per source address, accepts at most 32 KiB, and stores at most 16 samples per report.",
              "`post /api/v1/performance/rum` is public because guest sessions also affect release quality. The endpoint is same-origin protected, limited to 120 requests per minute per source address, accepts at most 32 KiB, and stores at most 16 samples per report. Its limiter is fail-closed: when Redis is unavailable, telemetry returns `503` instead of creating an unbounded PostgreSQL write path. Authentication and account endpoints retain their existing fail-open policy so a Redis incident does not block core account operations.",
          )
          replace_once(
              "api/openapi.yaml",
              '''        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: Внутренняя ошибка сохранения без раскрытия деталей инфраструктуры.''',
              '''        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: Redis rate limiter недоступен; пакет не передан в PostgreSQL.
          headers:
            Retry-After:
              schema: { type: integer, const: 60 }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Внутренняя ошибка сохранения без раскрытия деталей инфраструктуры.''',
          )
          PY

          gofmt -w \
            backend/internal/ratelimit/limiter.go \
            backend/internal/ratelimit/limiter_test.go \
            backend/internal/server/server.go
          rm .github/workflows/issue-59-rate-limit-finalize.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(performance): make public telemetry throttling fail closed"
          git push origin HEAD:agent/issue-59-performance-budgets
