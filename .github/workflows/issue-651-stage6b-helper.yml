name: Issue 651 Stage 6b helper

on:
  push:
    branches:
      - feat/issue-651-process-analytics

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: feat/issue-651-process-analytics
      - name: Apply bounded process analytics slice
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              return text.replace(old, new, 1)

          model_path = Path("backend/internal/learning/model.go")
          model = model_path.read_text()
          model = replace_once(
              model,
              'type ScenarioRecommendationReason string\n',
              '''type ProcessRetentionEvidence struct {\n\tAttempts   int `json:"attempts"`\n\tSuccessful int `json:"successful"`\n\tRate       int `json:"rate"`\n}\n\ntype LearningProcessEvidence struct {\n\tWeekStart            string                   `json:"weekStart"`\n\tWeekEnd              string                   `json:"weekEnd"`\n\tNewLearned           int                      `json:"newLearned"`\n\tDueReviewed          int                      `json:"dueReviewed"`\n\tRemediationReviewed  int                      `json:"remediationReviewed"`\n\tReviewBacklog        int                      `json:"reviewBacklog"`\n\tLapses               int                      `json:"lapses"`\n\tRetention            ProcessRetentionEvidence `json:"retention"`\n}\n\ntype ScenarioRecommendationReason string\n''',
              "model process types",
          )
          model = replace_once(
              model,
              '\tWeekly                   WeeklyProgressEvidence   `json:"weekly"`\n\tScenarios                ScenarioProgressEvidence `json:"scenarios"`\n',
              '\tWeekly                   WeeklyProgressEvidence   `json:"weekly"`\n\tProcesses                LearningProcessEvidence  `json:"processes"`\n\tScenarios                ScenarioProgressEvidence `json:"scenarios"`\n',
              "model progress field",
          )
          model_path.write_text(model)

          repo_path = Path("backend/internal/learning/repository.go")
          repo = repo_path.read_text()
          init_anchor = '''\tresult := ProgressSummary{\n\t\tEventSchemaVersion: 2,\n\t\tWeekly: WeeklyProgressEvidence{\n\t\t\tTrend:      make([]DailyRecallEvidence, 0, 7),\n\t\t\tWeakTopics: make([]TopicEvidence, 0, 3),\n\t\t},\n\t}\n'''
          init_replacement = '''\tresult := ProgressSummary{\n\t\tEventSchemaVersion: 2,\n\t\tWeekly: WeeklyProgressEvidence{\n\t\t\tTrend:      make([]DailyRecallEvidence, 0, 7),\n\t\t\tWeakTopics: make([]TopicEvidence, 0, 3),\n\t\t},\n\t\tProcesses: LearningProcessEvidence{\n\t\t\tWeekStart: weekStartLocal.Format("2006-01-02"),\n\t\t\tWeekEnd:   weekStartLocal.AddDate(0, 0, 6).Format("2006-01-02"),\n\t\t},\n\t}\n'''
          repo = replace_once(repo, init_anchor, init_replacement, "repository process init")

          review_anchor = '''\tif err := r.pool.QueryRow(ctx, `\n\t\twith events as (\n'''
          process_query = '''\tif err := r.pool.QueryRow(ctx, `\n\t\tselect count(*)::int\n\t\tfrom user_words\n\t\twhere user_id = $1::uuid\n\t\t  and status <> 'new'\n\t\t  and due_at <= now()\n\t`, userID).Scan(&result.Processes.ReviewBacklog); err != nil {\n\t\treturn ProgressSummary{}, fmt.Errorf("query process review backlog: %w", err)\n\t}\n\n\tif err := r.pool.QueryRow(ctx, `\n\t\tselect count(distinct word_id) filter (\n\t\t           where reviewed_at >= $2 and reviewed_at < $3\n\t\t             and event_schema_version = 2\n\t\t             and session_kind = 'study'\n\t\t             and selection_reason = 'new'\n\t\t             and effective_rating = 'known'\n\t\t             and (correct is true or correct is null)\n\t\t       )::int,\n\t\t       count(*) filter (\n\t\t           where reviewed_at >= $2 and reviewed_at < $3\n\t\t             and event_schema_version = 2\n\t\t             and session_kind = 'review'\n\t\t       )::int,\n\t\t       count(*) filter (\n\t\t           where reviewed_at >= $2 and reviewed_at < $3\n\t\t             and event_schema_version = 2\n\t\t             and session_kind = 'remediation'\n\t\t       )::int,\n\t\t       count(*) filter (\n\t\t           where reviewed_at >= $2 and reviewed_at < $3\n\t\t             and event_schema_version = 2\n\t\t             and session_kind = 'review'\n\t\t             and effective_rating = 'again'\n\t\t       )::int,\n\t\t       count(*) filter (\n\t\t           where reviewed_at >= $2 and reviewed_at < $3\n\t\t             and event_schema_version = 2\n\t\t             and session_kind = 'review'\n\t\t             and answer_mode in ('recall', 'listening')\n\t\t             and correct is not null\n\t\t       )::int,\n\t\t       count(*) filter (\n\t\t           where reviewed_at >= $2 and reviewed_at < $3\n\t\t             and event_schema_version = 2\n\t\t             and session_kind = 'review'\n\t\t             and answer_mode in ('recall', 'listening')\n\t\t             and correct is true\n\t\t       )::int\n\t\tfrom review_events\n\t\twhere user_id = $1::uuid\n\t`, userID, weekStartUTC, nextWeekUTC).Scan(\n\t\t&result.Processes.NewLearned,\n\t\t&result.Processes.DueReviewed,\n\t\t&result.Processes.RemediationReviewed,\n\t\t&result.Processes.Lapses,\n\t\t&result.Processes.Retention.Attempts,\n\t\t&result.Processes.Retention.Successful,\n\t); err != nil {\n\t\treturn ProgressSummary{}, fmt.Errorf("query learning process evidence: %w", err)\n\t}\n\tresult.Processes.Retention.Rate = percentage(\n\t\tresult.Processes.Retention.Successful,\n\t\tresult.Processes.Retention.Attempts,\n\t)\n\n'''
          repo = replace_once(repo, review_anchor, process_query + review_anchor, "repository process query")
          repo = replace_once(
              repo,
              "\t\t  and current_review.answer_mode = 'recall'\n",
              "\t\t  and current_review.answer_mode = 'recall'\n\t\t  and (current_review.session_kind = 'review' or current_review.session_kind is null)\n",
              "retained current process guard",
          )
          repo = replace_once(
              repo,
              "\t\t\t  and previous_review.answer_mode = 'recall'\n",
              "\t\t\t  and previous_review.answer_mode = 'recall'\n\t\t\t  and (previous_review.session_kind = 'review' or previous_review.session_kind is null)\n",
              "retained previous process guard",
          )
          repo_path.write_text(repo)

          progress_path = Path("frontend/lib/progress.ts")
          progress = progress_path.read_text()
          progress = replace_once(
              progress,
              'export type ScenarioRecommendationReason =\n',
              '''export type ProcessRetentionEvidence = {\n  attempts: number;\n  successful: number;\n  rate: number;\n};\n\nexport type LearningProcessEvidence = {\n  weekStart: string;\n  weekEnd: string;\n  newLearned: number;\n  dueReviewed: number;\n  remediationReviewed: number;\n  reviewBacklog: number;\n  lapses: number;\n  retention: ProcessRetentionEvidence;\n};\n\nexport type ScenarioRecommendationReason =\n''',
              "frontend process types",
          )
          progress = replace_once(
              progress,
              '  weekly?: WeeklyProgressEvidence;\n  scenarios?: ScenarioProgressEvidence;\n',
              '  weekly?: WeeklyProgressEvidence;\n  processes?: LearningProcessEvidence;\n  scenarios?: ScenarioProgressEvidence;\n',
              "frontend progress processes field",
          )
          progress = replace_once(
              progress,
              'export function dueReviewLessonCount(dueNow: number): number {\n',
              '''export function normalizedLearningProcessEvidence(progress: ProgressSummary): LearningProcessEvidence {\n  if (progress.processes) return progress.processes;\n  const weekly = normalizedWeeklyEvidence(progress);\n  return {\n    weekStart: weekly.weekStart,\n    weekEnd: weekly.weekEnd,\n    newLearned: 0,\n    dueReviewed: 0,\n    remediationReviewed: 0,\n    reviewBacklog: 0,\n    lapses: 0,\n    retention: { attempts: 0, successful: 0, rate: 0 },\n  };\n}\n\nexport function dueReviewLessonCount(dueNow: number): number {\n''',
              "frontend process normalization",
          )
          progress_path.write_text(progress)

          resources_path = Path("frontend/lib/account-resources.ts")
          resources = resources_path.read_text()
          resources = replace_once(
              resources,
              'function isScenarioRecommendation(value: unknown): boolean {\n',
              '''function isProcessRetentionEvidence(value: unknown): boolean {\n  return isRecord(value)\n    && isNonNegativeNumber(value.attempts)\n    && isNonNegativeNumber(value.successful)\n    && value.successful <= value.attempts\n    && isPercentage(value.rate);\n}\n\nfunction isLearningProcessEvidence(value: unknown): boolean {\n  return isRecord(value)\n    && isDateOnly(value.weekStart)\n    && isDateOnly(value.weekEnd)\n    && isNonNegativeNumber(value.newLearned)\n    && isNonNegativeNumber(value.dueReviewed)\n    && isNonNegativeNumber(value.remediationReviewed)\n    && isNonNegativeNumber(value.reviewBacklog)\n    && isNonNegativeNumber(value.lapses)\n    && isProcessRetentionEvidence(value.retention);\n}\n\nfunction isScenarioRecommendation(value: unknown): boolean {\n''',
              "frontend process validator",
          )
          resources = replace_once(
              resources,
              '  if (value.weekly !== undefined && !isWeeklyProgressEvidence(value.weekly)) return false;\n  if (value.scenarios !== undefined && !isScenarioProgressEvidence(value.scenarios)) return false;\n',
              '  if (value.weekly !== undefined && !isWeeklyProgressEvidence(value.weekly)) return false;\n  if (value.processes !== undefined && !isLearningProcessEvidence(value.processes)) return false;\n  if (value.scenarios !== undefined && !isScenarioProgressEvidence(value.scenarios)) return false;\n',
              "frontend progress validator hook",
          )
          resources_path.write_text(resources)

          account_test_path = Path("frontend/lib/account-resources.test.ts")
          account_test = account_test_path.read_text()
          account_test = replace_once(
              account_test,
              '  modes: {\n    study: MODE,\n    recall: MODE,\n    choice: MODE,\n    legacy: MODE,\n  },\n',
              '''  modes: {\n    study: MODE,\n    recall: MODE,\n    choice: MODE,\n    legacy: MODE,\n  },\n  processes: {\n    weekStart: "2026-07-13",\n    weekEnd: "2026-07-19",\n    newLearned: 2,\n    dueReviewed: 4,\n    remediationReviewed: 1,\n    reviewBacklog: 3,\n    lapses: 1,\n    retention: { attempts: 4, successful: 3, rate: 75 },\n  },\n''',
              "account test process fixture",
          )
          account_test = replace_once(
              account_test,
              '    expect(isProgressSummaryPayload({ ...PROGRESS, nextDueAt: "not-a-date" })).toBe(false);\n',
              '''    expect(isProgressSummaryPayload({ ...PROGRESS, nextDueAt: "not-a-date" })).toBe(false);\n    expect(isProgressSummaryPayload({\n      ...PROGRESS,\n      processes: { ...PROGRESS.processes, reviewBacklog: -1 },\n    })).toBe(false);\n    expect(isProgressSummaryPayload({\n      ...PROGRESS,\n      processes: { ...PROGRESS.processes, retention: { attempts: 2, successful: 3, rate: 100 } },\n    })).toBe(false);\n''',
              "account test malformed process evidence",
          )
          account_test_path.write_text(account_test)

          evidence_test_path = Path("frontend/lib/progress-evidence.test.ts")
          evidence_test = evidence_test_path.read_text()
          evidence_test = replace_once(
              evidence_test,
              '  normalizedWeeklyEvidence,\n',
              '  normalizedLearningProcessEvidence,\n  normalizedWeeklyEvidence,\n',
              "progress evidence import",
          )
          evidence_test = replace_once(
              evidence_test,
              '  weekly,\n  scenarios: {\n',
              '''  weekly,\n  processes: {\n    weekStart: "2026-07-20",\n    weekEnd: "2026-07-26",\n    newLearned: 3,\n    dueReviewed: 5,\n    remediationReviewed: 2,\n    reviewBacklog: 4,\n    lapses: 1,\n    retention: { attempts: 4, successful: 3, rate: 75 },\n  },\n  scenarios: {\n''',
              "progress evidence process fixture",
          )
          evidence_test = replace_once(
              evidence_test,
              '    expect(normalizedWeeklyEvidence(progress)).toEqual(weekly);\n    expect(isProgressSummaryPayload(progress)).toBe(true);\n',
              '''    expect(normalizedWeeklyEvidence(progress)).toEqual(weekly);\n    expect(normalizedLearningProcessEvidence(progress)).toEqual(progress.processes);\n    expect(isProgressSummaryPayload(progress)).toBe(true);\n''',
              "progress evidence process assertion",
          )
          evidence_test = replace_once(
              evidence_test,
              '    expect(isProgressSummaryPayload({ ...progress, scenarios: undefined })).toBe(true);\n',
              '''    expect(isProgressSummaryPayload({ ...progress, scenarios: undefined })).toBe(true);\n    expect(normalizedLearningProcessEvidence({ ...progress, processes: undefined })).toEqual({\n      weekStart: weekly.weekStart,\n      weekEnd: weekly.weekEnd,\n      newLearned: 0,\n      dueReviewed: 0,\n      remediationReviewed: 0,\n      reviewBacklog: 0,\n      lapses: 0,\n      retention: { attempts: 0, successful: 0, rate: 0 },\n    });\n''',
              "progress evidence process fallback",
          )
          evidence_test_path.write_text(evidence_test)

          integration_path = Path("backend/integration/process_progress_analytics_test.go")
          integration_path.write_text(r'''//go:build integration

package integration

import (
    "context"
    "fmt"
    "io"
    "log/slog"
    "net/http"
    "net/http/httptest"
    "testing"
    "time"

    "github.com/Dja-tiger/LexiGo/backend/internal/catalog"
    "github.com/Dja-tiger/LexiGo/backend/internal/config"
    "github.com/Dja-tiger/LexiGo/backend/internal/platform/migrate"
    postgresplatform "github.com/Dja-tiger/LexiGo/backend/internal/platform/postgres"
    redisplatform "github.com/Dja-tiger/LexiGo/backend/internal/platform/redis"
    "github.com/Dja-tiger/LexiGo/backend/internal/server"
)

func TestProcessProgressAnalyticsUsesExplicitSessionAttribution(t *testing.T) {
    ctx, cancel := context.WithTimeout(context.Background(), 45*time.Second)
    defer cancel()

    pgDSN := requiredEnv(t, "TEST_POSTGRES_DSN")
    pg, err := postgresplatform.Open(ctx, pgDSN)
    if err != nil {
        t.Fatal(err)
    }
    defer pg.Close()
    if err := migrate.Up(ctx, pg); err != nil {
        t.Fatalf("migrate.Up() error = %v", err)
    }
    if _, err := pg.Exec(ctx, "truncate table lesson_session_items, lesson_sessions, user_learning_preferences, review_events, user_words, refresh_tokens, words, users restart identity cascade"); err != nil {
        t.Fatalf("truncate test data: %v", err)
    }
    if _, err := catalog.Seed(ctx, pg); err != nil {
        t.Fatalf("catalog.Seed() error = %v", err)
    }

    redisAddr := requiredEnv(t, "TEST_REDIS_ADDR")
    rdb, err := redisplatform.Open(ctx, config.Redis{Addr: redisAddr})
    if err != nil {
        t.Fatal(err)
    }
    defer rdb.Close()
    if err := rdb.FlushDB(ctx).Err(); err != nil {
        t.Fatalf("flush redis: %v", err)
    }

    cfg := config.Config{
        AppEnv:            "test",
        HTTPAddr:          ":0",
        LogLevel:          "error",
        CORSAllowedOrigin: "http://test.local",
        PostgresDSN:       pgDSN,
        Redis:             config.Redis{Addr: redisAddr},
        JWTSecret:         "integration-test-secret-with-at-least-32-bytes",
        AccessTokenTTL:    15 * time.Minute,
        RefreshTokenTTL:   24 * time.Hour,
    }
    app, err := server.New(cfg, slog.New(slog.NewTextHandler(io.Discard, nil)), pg, rdb)
    if err != nil {
        t.Fatalf("server.New() error = %v", err)
    }
    testServer := httptest.NewServer(app.Handler())
    defer testServer.Close()

    registered := postJSON[integrationAuthResponse](t, testServer.URL+"/api/v1/auth/register", map[string]string{
        "email":       fmt.Sprintf("process-progress-%d@example.com", time.Now().UnixNano()),
        "password":    "strong-password",
        "displayName": "Process Progress Learner",
    }, http.StatusCreated)

    rows, err := pg.Query(ctx, `
        select word_id
        from user_words
        where user_id = $1::uuid
        order by word_id
        limit 6
    `, registered.User.ID)
    if err != nil {
        t.Fatalf("query assigned learning items: %v", err)
    }
    var wordIDs []int64
    for rows.Next() {
        var wordID int64
        if err := rows.Scan(&wordID); err != nil {
            rows.Close()
            t.Fatalf("scan learning item: %v", err)
        }
        wordIDs = append(wordIDs, wordID)
    }
    rows.Close()
    if len(wordIDs) < 6 {
        t.Fatalf("assigned items = %d, want at least 6", len(wordIDs))
    }

    if _, err := pg.Exec(ctx, `
        update user_words
        set status = 'review', due_at = case word_id
            when $2 then now() - interval '1 hour'
            when $3 then now() + interval '1 day'
            else due_at
        end
        where user_id = $1::uuid and word_id in ($2, $3)
    `, registered.User.ID, wordIDs[0], wordIDs[1]); err != nil {
        t.Fatalf("prepare review backlog: %v", err)
    }

    insertEvent := func(wordID int64, reviewedAt string, grade int, rating, answerMode string, correct any, effectiveRating, sessionKind, reason string) {
        t.Helper()
        if _, err := pg.Exec(ctx, `
            insert into review_events(
                user_id, word_id, grade, reviewed_at, rating, answer_mode, correct,
                answer_revealed, event_schema_version, effective_rating, session_kind, selection_reason
            ) values (
                $1::uuid, $2, $3, `+reviewedAt+`, $4, $5, $6,
                false, 2, $7, $8, $9
            )
        `, registered.User.ID, wordID, grade, rating, answerMode, correct, effectiveRating, sessionKind, reason); err != nil {
            t.Fatalf("insert %s/%s event: %v", sessionKind, answerMode, err)
        }
    }

    // Explicit Study + new + known counts as newly learned.
    insertEvent(wordIDs[2], "now()", 5, "known", "study", nil, "known", "study", "new")
    // Study retrieval evidence must never inflate Review retention.
    insertEvent(wordIDs[3], "now() - interval '8 days'", 5, "known", "recall", true, "known", "study", "manual")
    insertEvent(wordIDs[3], "now()", 5, "known", "recall", true, "known", "study", "manual")
    // Review retrieval: one retained success and one lapse.
    insertEvent(wordIDs[4], "now() - interval '8 days'", 5, "known", "recall", true, "known", "review", "due")
    insertEvent(wordIDs[4], "now()", 5, "known", "recall", true, "known", "review", "due")
    insertEvent(wordIDs[5], "now()", 1, "again", "recall", false, "again", "review", "recent_failure")
    // Remediation remains a distinct process even with an objective answer mode.
    insertEvent(wordIDs[2], "now()", 3, "almost", "choice", true, "almost", "remediation", "repeated_almost")

    var progress struct {
        RetainedItemsWeek int `json:"retainedItemsWeek"`
        Processes struct {
            WeekStart           string `json:"weekStart"`
            WeekEnd             string `json:"weekEnd"`
            NewLearned          int    `json:"newLearned"`
            DueReviewed         int    `json:"dueReviewed"`
            RemediationReviewed int    `json:"remediationReviewed"`
            ReviewBacklog       int    `json:"reviewBacklog"`
            Lapses              int    `json:"lapses"`
            Retention struct {
                Attempts   int `json:"attempts"`
                Successful int `json:"successful"`
                Rate       int `json:"rate"`
            } `json:"retention"`
        } `json:"processes"`
    }
    getAuthenticatedJSON(t, testServer.URL+"/api/v1/progress?timezoneOffsetMinutes=0", registered.Tokens.AccessToken, http.StatusOK, &progress)

    if progress.Processes.WeekStart == "" || progress.Processes.WeekEnd == "" {
        t.Fatalf("process week bounds are empty: %+v", progress.Processes)
    }
    if progress.Processes.NewLearned != 1 {
        t.Fatalf("newLearned = %d, want 1", progress.Processes.NewLearned)
    }
    if progress.Processes.DueReviewed != 2 {
        t.Fatalf("dueReviewed = %d, want 2", progress.Processes.DueReviewed)
    }
    if progress.Processes.RemediationReviewed != 1 {
        t.Fatalf("remediationReviewed = %d, want 1", progress.Processes.RemediationReviewed)
    }
    if progress.Processes.ReviewBacklog != 1 {
        t.Fatalf("reviewBacklog = %d, want 1 due non-new item", progress.Processes.ReviewBacklog)
    }
    if progress.Processes.Lapses != 1 {
        t.Fatalf("lapses = %d, want 1", progress.Processes.Lapses)
    }
    if progress.Processes.Retention.Attempts != 2 || progress.Processes.Retention.Successful != 1 || progress.Processes.Retention.Rate != 50 {
        t.Fatalf("process retention = %+v, want 1/2 = 50%%", progress.Processes.Retention)
    }
    if progress.RetainedItemsWeek != 1 {
        t.Fatalf("retainedItemsWeek = %d, want explicit Review item only", progress.RetainedItemsWeek)
    }
}
''')

          openapi_path = Path("api/openapi.yaml")
          openapi = openapi_path.read_text()
          if "    LearningProcessEvidence:\n" in openapi:
              raise SystemExit("OpenAPI process schema already exists")
          progress_match = re.search(r'(?ms)^    ProgressSummary:\n.*?(?=^    [A-Za-z][A-Za-z0-9_-]*:\n|\Z)', openapi)
          if not progress_match:
              raise SystemExit("OpenAPI ProgressSummary schema not found")
          block = progress_match.group(0)
          lines = block.splitlines()
          try:
              required_index = lines.index("      required:")
          except ValueError as exc:
              raise SystemExit("OpenAPI ProgressSummary required list not found") from exc
          insert_index = required_index + 1
          while insert_index < len(lines) and lines[insert_index].startswith("        - "):
              insert_index += 1
          lines.insert(insert_index, "        - processes")
          if "      properties:" not in lines:
              raise SystemExit("OpenAPI ProgressSummary properties not found")
          lines.extend([
              "        processes:",
              '          $ref: "#/components/schemas/LearningProcessEvidence"',
          ])
          new_block = "\n".join(lines) + "\n"
          process_schemas = '''    ProcessRetentionEvidence:\n      type: object\n      required: [attempts, successful, rate]\n      properties:\n        attempts:\n          type: integer\n          minimum: 0\n        successful:\n          type: integer\n          minimum: 0\n        rate:\n          type: integer\n          minimum: 0\n          maximum: 100\n    LearningProcessEvidence:\n      type: object\n      description: Current-week process evidence from immutable lesson session attribution; reviewBacklog is the current due non-new queue size.\n      required: [weekStart, weekEnd, newLearned, dueReviewed, remediationReviewed, reviewBacklog, lapses, retention]\n      properties:\n        weekStart:\n          type: string\n          format: date\n        weekEnd:\n          type: string\n          format: date\n        newLearned:\n          type: integer\n          minimum: 0\n          description: Distinct explicit Study/new items with effective known evidence in the current week.\n        dueReviewed:\n          type: integer\n          minimum: 0\n          description: Review-session events in the current week.\n        remediationReviewed:\n          type: integer\n          minimum: 0\n          description: Remediation-session events in the current week.\n        reviewBacklog:\n          type: integer\n          minimum: 0\n          description: Current non-new items whose due_at has arrived.\n        lapses:\n          type: integer\n          minimum: 0\n          description: Current-week Review events whose effective rating is again.\n        retention:\n          $ref: "#/components/schemas/ProcessRetentionEvidence"\n'''
          openapi = openapi[:progress_match.start()] + process_schemas + new_block + openapi[progress_match.end():]
          openapi_path.write_text(openapi)
          PY

          gofmt -w backend/internal/learning/model.go backend/internal/learning/repository.go backend/integration/process_progress_analytics_test.go
          git rm .github/workflows/issue-651-stage6b-helper.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/internal/learning/model.go backend/internal/learning/repository.go backend/integration/process_progress_analytics_test.go api/openapi.yaml frontend/lib/progress.ts frontend/lib/account-resources.ts frontend/lib/account-resources.test.ts frontend/lib/progress-evidence.test.ts
          git diff --cached --check
          git commit -m "feat(learning): add process-aware progress analytics"
          git push origin HEAD:feat/issue-651-process-analytics
