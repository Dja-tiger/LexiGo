name: Trigger issue 47 semantic patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/issue-47-semantic-controls' && github.actor != 'github-actions[bot]'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-47-semantic-controls
          fetch-depth: 0

      - name: Extract and apply prepared semantic patch
        shell: bash
        run: |
          sed -n "/python - <<'PY'/,/^[[:space:]]*PY$/p" .github/workflows/issue47-apply.yml \
            | sed '1d;$d' \
            | sed 's/^          //' \
            > /tmp/issue47-apply.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path("/tmp/issue47-apply.py")
          source = path.read_text()
          original = '''def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              source = file.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              file.write_text(source.replace(old, new, 1))'''
          replacement = '''def shifted_multiline(value: str, amount: int) -> str:
              if amount == 0 or "\\n" not in value:
                  return value
              lines = value.splitlines(keepends=True)
              prefix = " " * amount
              return lines[0] + "".join(
                  line[amount:] if line.startswith(prefix) else line
                  for line in lines[1:]
              )

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              source = file.read_text()
              for amount in range(17):
                  candidate = shifted_multiline(old, amount)
                  count = source.count(candidate)
                  if count == 1:
                      file.write_text(source.replace(candidate, shifted_multiline(new, amount), 1))
                      return
              raise SystemExit(f"{path}: no unique indentation variant: {old[:300]!r}")'''
          if source.count(original) != 1:
              raise SystemExit("replace_once implementation was not found in extracted patch")
          path.write_text(source.replace(original, replacement, 1))
          PY
          set +e
          python3 /tmp/issue47-apply.py 2> /tmp/issue47-error.txt
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cp /tmp/issue47-error.txt issue47-patch-error.txt
            git add issue47-patch-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: capture issue 47 patch error"
            git push origin HEAD:fix/issue-47-semantic-controls
            exit "$status"
          fi

      - name: Commit implementation and remove temporary tooling
        shell: bash
        run: |
          git rm .github/workflows/issue47-apply.yml .github/workflows/issue47-trigger.yml
          git add frontend/components/lexigo-premium-app.tsx frontend/e2e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(a11y): implement semantic learning controls"
          git push origin HEAD:fix/issue-47-semantic-controls
