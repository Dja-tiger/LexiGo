name: Self Review Issue 43

on:
  pull_request:

permissions:
  contents: write

jobs:
  self-review:
    if: >-
      github.head_ref == 'fix/issue-43-public-auth-recovery' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 40
    env:
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.61.1-noble
      FRONTEND_CI_VOLUME: lexigo-issue43-review-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-43-public-auth-recovery
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: backend/go.sum
      - name: Apply deterministic self-review fixes
        run: |
          python3 scripts/self_review_issue_43.py
          gofmt -w backend/internal/auth backend/integration/password_recovery_test.go
          git diff --check
      - name: Verify backend unit contracts
        working-directory: backend
        run: |
          go test ./internal/auth ./internal/config ./internal/httpx ./internal/server
          go test -run '^$' -tags=integration ./integration
      - name: Prepare isolated frontend workspace
        working-directory: frontend
        run: bash ../scripts/ci/frontend-container.sh prepare
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: bash ../scripts/ci/frontend-container.sh exec npm ci --no-audit --no-fund
      - name: Verify frontend and browser contracts
        working-directory: frontend
        run: |
          bash ../scripts/ci/frontend-container.sh exec npm run lint
          bash ../scripts/ci/frontend-container.sh exec npm run typecheck
          bash ../scripts/ci/frontend-container.sh exec npm test
          bash ../scripts/ci/frontend-container.sh exec npm run build
          bash ../scripts/ci/frontend-container.sh exec npm run test:e2e:ui
      - name: Extract browser diagnostics
        if: failure()
        working-directory: frontend
        run: bash ../scripts/ci/frontend-container.sh extract
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: issue-43-self-review-diagnostics
          path: frontend/ci-artifacts
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit reviewed product diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/internal/auth/password_recovery_sender.go \
            docs/password-recovery.md \
            frontend/components/lexigo-premium-app.tsx \
            frontend/e2e/auth-flow.spec.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(auth): keep reset bearer tokens out of requests"
          git push origin HEAD:fix/issue-43-public-auth-recovery
      - name: Cleanup isolated frontend workspace
        if: always()
        working-directory: frontend
        run: bash ../scripts/ci/frontend-container.sh cleanup
