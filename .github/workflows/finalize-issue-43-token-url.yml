name: Finalize Issue 43 Token URL

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.head_ref == 'fix/issue-43-public-auth-recovery' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 30
    env:
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.61.1-noble
      FRONTEND_CI_VOLUME: lexigo-issue43-token-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-43-public-auth-recovery
      - name: Apply deterministic token cleanup
        run: |
          python3 scripts/finalize_issue_43_token_url.py
          git diff --check
      - name: Prepare isolated frontend workspace
        working-directory: frontend
        run: bash ../scripts/ci/frontend-container.sh prepare
      - name: Install locked dependencies
        working-directory: frontend
        run: bash ../scripts/ci/frontend-container.sh exec npm ci --no-audit --no-fund
      - name: Verify frontend and auth browser contracts
        working-directory: frontend
        run: |
          bash ../scripts/ci/frontend-container.sh exec npm run lint
          bash ../scripts/ci/frontend-container.sh exec npm run typecheck
          bash ../scripts/ci/frontend-container.sh exec npm test
          bash ../scripts/ci/frontend-container.sh exec npm run build
          bash ../scripts/ci/frontend-container.sh exec npx playwright test e2e/auth-flow.spec.ts
      - name: Extract browser diagnostics
        if: failure()
        working-directory: frontend
        run: bash ../scripts/ci/frontend-container.sh extract
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: issue-43-token-url-diagnostics
          path: frontend/ci-artifacts
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit token cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/password-recovery.md \
            frontend/components/lexigo-premium-app.tsx \
            frontend/e2e/auth-flow.spec.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(auth): remove reset credentials from browser history"
          git push origin HEAD:fix/issue-43-public-auth-recovery
      - name: Cleanup isolated frontend workspace
        if: always()
        working-directory: frontend
        run: bash ../scripts/ci/frontend-container.sh cleanup
