name: PR 184 shard diagnostics

on:
  pull_request:
    paths:
      - ".github/workflows/pr-184-shard-diagnostics.yml"
      - "frontend/**"
      - "scripts/ci/frontend-container.sh"

permissions:
  contents: read
  issues: write

concurrency:
  group: pr-184-shard-diagnostics-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Diagnose UI shard 1/2
    if: github.event.pull_request.head.ref == 'agent/issue-183-application-shell-home'
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    env:
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.61.1-noble
      FRONTEND_CI_VOLUME: lexigo-frontend-pr184-shard-${{ github.run_id }}-${{ github.run_attempt }}
      FRONTEND_CI_SLOT: pr184-shard-diagnostics
      APP_BUILD_ID: ${{ github.sha }}
      NEXT_PUBLIC_RUM_SAMPLE_RATE: "1"
      FRONTEND_HOST_LOCK: /tmp/lexigo-frontend-resource.lock
      DIAGNOSTIC_INNER_LOCK: /tmp/lexigo-pr184-diagnostic-inner.lock
    steps:
      - uses: actions/checkout@v7

      - name: Prepare isolated frontend workspace
        run: bash ../scripts/ci/frontend-container.sh prepare

      - name: Install locked dependencies
        run: bash ../scripts/ci/frontend-container.sh exec npm ci --no-audit --no-fund

      - name: Production build
        run: bash ../scripts/ci/frontend-container.sh exec npm run build

      - name: Run exact failing shard with JSON reporter
        run: |
          flock --exclusive --timeout 1200 "$FRONTEND_HOST_LOCK" \
            env FRONTEND_RESOURCE_LOCK="$DIAGNOSTIC_INNER_LOCK" \
            bash ../scripts/ci/frontend-container.sh shell <<'CONTAINER_SCRIPT'
          set -Eeuo pipefail
          mkdir -p test-results/pr184-shard-diagnostics
          set +e
          npx playwright test \
            e2e/app-router-routes.spec.ts \
            e2e/dictionary-route-island.spec.ts \
            e2e/mobile-home-priority.spec.ts \
            e2e/adaptive-knowledge-coach-home.spec.ts \
            e2e/interface-copy.spec.ts \
            e2e/ui-ownership.spec.ts \
            e2e/account-hydration.spec.ts \
            e2e/auth-flow.spec.ts \
            e2e/logout-flow.spec.ts \
            e2e/async-states.spec.ts \
            e2e/accessibility-keyboard.spec.ts \
            e2e/route-focus-management.spec.ts \
            e2e/calendar-dialog-accessibility.spec.ts \
            e2e/apple-calendar-pwa.spec.ts \
            e2e/adaptive-navigation.spec.ts \
            e2e/speech-player.spec.ts \
            e2e/catalog-pagination.spec.ts \
            e2e/legal-pages.spec.ts \
            e2e/account-security.spec.ts \
            e2e/account-data.spec.ts \
            e2e/account-email-change.spec.ts \
            e2e/security-headers.spec.ts \
            --shard=1/2 \
            --reporter=json \
            > test-results/pr184-shard-diagnostics/report.json
          shard_status=$?
          set -e
          printf '%s\n' "$shard_status" > test-results/pr184-shard-diagnostics/status.txt
          CONTAINER_SCRIPT

      - name: Extract diagnostics
        if: always()
        run: bash ../scripts/ci/frontend-container.sh extract

      - name: Build exact failure summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("ci-artifacts/test-results/pr184-shard-diagnostics")
          report_path = root / "report.json"
          status_path = root / "status.txt"
          status = status_path.read_text(encoding="utf-8").strip() if status_path.exists() else "missing"
          failures = []

          def walk_suite(suite, parents=()):
              title = suite.get("title") or ""
              next_parents = parents + ((title,) if title else ())
              for spec in suite.get("specs", []):
                  spec_title = spec.get("title") or "unnamed spec"
                  for test in spec.get("tests", []):
                      results = test.get("results", [])
                      failed_results = [
                          result for result in results
                          if result.get("status") not in {"passed", "skipped"}
                      ]
                      if not failed_results:
                          continue
                      messages = []
                      for result in failed_results:
                          error = result.get("error") or {}
                          message = error.get("message") or error.get("stack") or result.get("status") or "unknown failure"
                          messages.append(str(message)[-6000:])
                      failures.append({
                          "title": " › ".join((*next_parents, spec_title)),
                          "project": test.get("projectName") or "unknown project",
                          "messages": messages,
                      })
              for child in suite.get("suites", []):
                  walk_suite(child, next_parents)

          parse_error = None
          if report_path.exists():
              try:
                  report = json.loads(report_path.read_text(encoding="utf-8", errors="replace"))
                  for suite in report.get("suites", []):
                      walk_suite(suite)
                  for error in report.get("errors", []):
                      failures.append({
                          "title": "Playwright global error",
                          "project": "global",
                          "messages": [str(error.get("message") or error.get("stack") or error)[-6000:]],
                      })
              except Exception as exc:
                  parse_error = repr(exc)
          else:
              parse_error = "report.json is missing"

          lines = [
              "<!-- pr-184-shard-diagnostics -->",
              "## PR #184 — exact UI shard 1/2 diagnostics",
              "",
              f"Commit: `{os.environ.get('GITHUB_SHA', 'unknown')}`",
              f"Exit status: `{status}`",
              "",
          ]
          if failures:
              for index, failure in enumerate(failures, start=1):
                  lines.extend([
                      f"### {index}. {failure['title']}",
                      f"Project: `{failure['project']}`",
                      "",
                      "```text",
                      "\n\n".join(failure["messages"])[-12000:],
                      "```",
                      "",
                  ])
          elif parse_error:
              lines.extend(["Diagnostic parsing failed:", "", "```text", parse_error, "```", ""])
          else:
              lines.append("No failed test was present in the JSON report.")

          Path("pr184-shard-comment.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Publish exact failures to PR 184
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          marker = "<!-- pr-184-shard-diagnostics -->"
          body = Path("pr184-shard-comment.md").read_text(encoding="utf-8")
          repository = os.environ["GITHUB_REPOSITORY"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "Content-Type": "application/json",
              "User-Agent": "lexigo-pr184-shard-diagnostics",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def call(method, path, payload=None):
              data = json.dumps(payload).encode("utf-8") if payload is not None else None
              request = urllib.request.Request(
                  f"https://api.github.com{path}",
                  data=data,
                  headers=headers,
                  method=method,
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else None

          comments = call("GET", f"/repos/{repository}/issues/184/comments?per_page=100") or []
          existing = next((item for item in comments if marker in item.get("body", "")), None)
          if existing:
              call("PATCH", f"/repos/{repository}/issues/comments/{existing['id']}", {"body": body})
          else:
              call("POST", f"/repos/{repository}/issues/184/comments", {"body": body})
          PY

      - name: Fail when shard failed
        if: always()
        run: test "$(cat ci-artifacts/test-results/pr184-shard-diagnostics/status.txt)" = "0"

      - name: Cleanup isolated frontend workspace
        if: always()
        run: bash ../scripts/ci/frontend-container.sh cleanup
