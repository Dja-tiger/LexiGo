name: Temporary fallback probe patch

on:
  push:
    branches:
      - test/issue-70-fallback-bundle-isolation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: test/issue-70-fallback-bundle-isolation
      - name: Replace invalid not-found probe
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/e2e/route-bundle-budget.spec.ts')
          source = path.read_text(encoding='utf-8')
          old = 'const COMPATIBILITY_PROBE_ROUTE = "/__compatibility-bundle-probe";'
          new = 'const COMPATIBILITY_PROBE_ROUTE = "/lesson/bundle-probe";'
          if source.count(old) != 1:
              raise SystemExit(f'expected one probe marker, found {source.count(old)}')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git diff --exit-code -- frontend/e2e/route-bundle-budget.spec.ts && exit 1 || true
      - name: Commit bounded patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/e2e/route-bundle-budget.spec.ts
          git commit -m "test(frontend): use valid fallback bundle probe"
          git push origin HEAD:test/issue-70-fallback-bundle-isolation
