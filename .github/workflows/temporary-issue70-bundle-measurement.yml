name: Temporary Issue 70 bundle measurement

on:
  push:
    branches:
      - refactor/issue-70-remove-phrases-compat
    paths:
      - .github/workflows/temporary-issue70-bundle-measurement.yml
  pull_request:
    branches:
      - main
    types:
      - synchronize

concurrency:
  group: temporary-issue70-bundle-measurement
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  measure:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.61.1-noble
      FRONTEND_CI_VOLUME: lexigo-issue70-bundle-${{ github.run_id }}-${{ github.run_attempt }}
      FRONTEND_CI_SLOT: issue70-bundle
      APP_BUILD_ID: ${{ github.sha }}
      NEXT_PUBLIC_RUM_SAMPLE_RATE: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Prepare isolated frontend workspace
        working-directory: frontend
        run: bash ../scripts/ci/frontend-container.sh prepare

      - name: Install locked dependencies
        working-directory: frontend
        run: bash ../scripts/ci/frontend-container.sh exec npm ci --no-audit --no-fund

      - name: Production build
        working-directory: frontend
        run: bash ../scripts/ci/frontend-container.sh exec npm run build

      - name: Measure canonical route bundles
        working-directory: frontend
        run: bash ../scripts/ci/frontend-container.sh exec npm run test:e2e:performance

      - name: Extract route bundle report
        working-directory: frontend
        run: bash ../scripts/ci/frontend-container.sh extract

      - name: Create compact measurement summary
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          report_path = Path("frontend/ci-artifacts/test-results/route-bundle-budget-report.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          results = [
              {
                  "route": result["route"],
                  "initialRequests": result["initialRequests"],
                  "javascriptBytes": result["javascriptBytes"],
                  "maxInitialRequests": report["budgets"][result["route"]]["maxInitialRequests"],
                  "maxJavascriptBytes": report["budgets"][result["route"]]["maxJavascriptBytes"],
              }
              for result in report["results"]
          ]
          summary = {
              "headSha": "${{ github.sha }}",
              "measurement": report["measurement"],
              "results": results,
          }
          Path("issue70-bundle-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload compact measurement summary
        uses: actions/upload-artifact@v7
        with:
          name: issue70-bundle-summary-${{ github.sha }}
          path: issue70-bundle-summary.json
          if-no-files-found: error
          retention-days: 1

      - name: Cleanup isolated frontend workspace
        if: always()
        working-directory: frontend
        run: bash ../scripts/ci/frontend-container.sh cleanup

  summarize:
    needs: [measure]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Download compact measurement summary
        uses: actions/download-artifact@v7
        with:
          name: issue70-bundle-summary-${{ github.sha }}

      - name: Print compact measurement summary
        run: cat issue70-bundle-summary.json
