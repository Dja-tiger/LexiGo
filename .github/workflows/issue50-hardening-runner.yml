name: Issue 50 hardening runner

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/issue-50-adaptive-navigation'
    runs-on: self-hosted
    steps:
      - name: Checkout branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          git init -q
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin feat/issue-50-adaptive-navigation
          git checkout -q -B feat/issue-50-adaptive-navigation FETCH_HEAD

      - name: Apply pending hardening patch
        shell: bash
        run: |
          test -f scripts/issue50-hardening.py
          python3 scripts/issue50-hardening.py
          rm -f scripts/issue50-hardening.py issue50-hardening-error.txt

          if git diff --quiet; then
            echo "Issue #50 hardening produced no diff" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(navigation): harden adaptive state and landscape behavior"
          git push -q origin HEAD:feat/issue-50-adaptive-navigation
