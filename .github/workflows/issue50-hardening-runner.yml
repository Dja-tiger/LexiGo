name: Issue 50 hardening runner

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/issue-50-adaptive-navigation'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/issue-50-adaptive-navigation
          fetch-depth: 0
          show-progress: false

      - name: Apply pending hardening patch
        shell: bash
        run: |
          test -f scripts/issue50-hardening.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          python3 scripts/issue50-hardening.py > issue50-hardening.log 2>&1
          status=$?
          set -e
          cat issue50-hardening.log

          if [[ $status -ne 0 ]]; then
            cp issue50-hardening.log issue50-hardening-error.txt
            if ! git diff --quiet -- issue50-hardening-error.txt; then
              git add issue50-hardening-error.txt
              git commit -m "chore: record issue 50 hardening failure"
              git push origin HEAD:feat/issue-50-adaptive-navigation
            fi
            exit "$status"
          fi

          rm -f scripts/issue50-hardening.py issue50-hardening.log issue50-hardening-error.txt
          if git diff --quiet; then
            echo "Issue #50 hardening produced no diff" >&2
            exit 1
          fi

          git add -A
          git commit -m "fix(navigation): harden adaptive state and landscape behavior"
          git push origin HEAD:feat/issue-50-adaptive-navigation
