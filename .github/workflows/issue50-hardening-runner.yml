name: Issue 50 hardening runner

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/issue-50-adaptive-navigation'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/issue-50-adaptive-navigation
          fetch-depth: 0

      - name: Apply pending hardening patch
        shell: bash
        run: |
          test -f scripts/issue50-hardening.py
          python3 scripts/issue50-hardening.py
          rm scripts/issue50-hardening.py

          if git diff --quiet; then
            echo "Issue #50 hardening produced no diff" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(navigation): harden adaptive state and landscape behavior"
          git push origin HEAD:feat/issue-50-adaptive-navigation
