name: Fix Issue 34 Integration Test

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/issue-34-secure-session-cookies'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Isolate integration HTTP clients
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('backend/integration/auth_flow_test.go')
          source = path.read_text()

          old_client = '''\tclient := testServer.Client()
          \tclient.Jar = jar
          \treturn client
          '''
          new_client = '''\tbaseClient := testServer.Client()
          \tclient := *baseClient
          \tclient.Jar = jar
          \treturn &client
          '''
          if source.count(old_client) != 1:
              raise SystemExit('newIntegrationClient target not found exactly once')
          source = source.replace(old_client, new_client)

          old_replay = '''\tresponse, err := testServer.Client().Do(request)
          '''
          new_replay = '''\tbaseClient := testServer.Client()
          \tclient := *baseClient
          \tclient.Jar = nil
          \tresponse, err := client.Do(request)
          '''
          if source.count(old_replay) != 1:
              raise SystemExit('replayRefreshToken target not found exactly once')
          source = source.replace(old_replay, new_replay)

          path.write_text(source)
          PY

          cd backend
          gofmt -w integration/auth_flow_test.go

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/integration/auth_flow_test.go
          git diff --cached --exit-code && exit 0
          git commit -m "test(auth): isolate integration cookie jars"
          git push origin HEAD:${{ github.head_ref }}
