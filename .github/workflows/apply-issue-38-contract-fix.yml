name: Apply Issue 38 Contract Fix

on:
  push:
    branches: [fix/issue-38-study-review-mode]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[issue-38-contract-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-38-study-review-mode
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Align OpenAPI objective metric description
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("api/openapi.yaml")
          source = path.read_text(encoding="utf-8")
          old = "          description: Recall, choice and legacy attempts; study is excluded."
          new = "          description: Verified schema-v2 recall and choice attempts; study and legacy events are excluded."
          if source.count(old) != 1:
              raise SystemExit(f"OpenAPI description anchor count={source.count(old)}")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY
          git diff --check
      - name: Commit contract correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/openapi.yaml
          git commit -m "[issue-38-contract-fix] align objective metrics documentation"
          git push origin HEAD:fix/issue-38-study-review-mode
