name: Update visual snapshots

on:
  push:
    branches:
      - agent/issue-162-progressive-lesson-composer
    paths:
      - .github/workflows/update-visual-snapshots.yml

permissions:
  contents: write

jobs:
  update-snapshots:
    name: Regenerate Issue 162 visual baselines
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.62.1-noble
      FRONTEND_CI_VOLUME: lexigo-frontend-visual-${{ github.run_id }}-${{ github.run_attempt }}
      FRONTEND_CI_SLOT: core
      APP_BUILD_ID: ${{ github.sha }}
      NEXT_PUBLIC_RUM_SAMPLE_RATE: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/issue-162-progressive-lesson-composer
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare isolated frontend workspace
        run: bash ../scripts/ci/frontend-container.sh prepare

      - name: Install locked dependencies
        run: bash ../scripts/ci/frontend-container.sh exec npm ci --no-audit --no-fund

      - name: Production build
        run: bash ../scripts/ci/frontend-container.sh exec npm run build

      - name: Regenerate visual snapshots
        run: bash ../scripts/ci/frontend-container.sh exec npm run test:e2e:visual:update

      - name: Extract updated snapshots from container
        run: |
          container=$(docker ps --filter "label=lexigo-slot=$FRONTEND_CI_SLOT" --format '{{.Names}}' | head -1)
          test -n "$container"
          docker cp "$container:/workspace/e2e/visual-regression.spec.ts-snapshots/." e2e/visual-regression.spec.ts-snapshots/

      - name: Cleanup container
        if: always()
        run: bash ../scripts/ci/frontend-container.sh cleanup

      - name: Commit Issue 162 baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            e2e/visual-regression.spec.ts-snapshots/lesson-composer-visual-compact-linux.png \
            e2e/visual-regression.spec.ts-snapshots/lesson-composer-visual-medium-linux.png \
            e2e/visual-regression.spec.ts-snapshots/lesson-composer-visual-desktop-linux.png
          if git diff --cached --quiet; then
            echo "Composer baselines already match."
          else
            git commit -m "test(visual): update Lesson Composer baselines"
            git push origin HEAD:agent/issue-162-progressive-lesson-composer
          fi
