name: Apply Issue 193 UI shard fixes

on:
  push:
    branches:
      - agent/issue-193-active-lesson
    paths:
      - .github/workflows/update-visual-snapshots.yml

permissions:
  contents: write

jobs:
  apply-ui-shard-fixes:
    name: Apply Active Lesson UI shard fixes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/issue-193-active-lesson
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Apply assertion-backed fixes
        run: python scripts/ci/apply-issue-193-ui-shard-fixes.py

      - name: Validate generated diff
        run: |
          git diff --check
          grep -Fq 'judgementReason: "study_exposure"' frontend/e2e/ui-ownership.spec.ts
          grep -Fq 'filter({ hasText: "Email изменён" })' frontend/e2e/account-email-change.spec.ts
          grep -Fq 'UI ownership journey не синхронизировал review API mock' .agents/AGENTS.md

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/e2e/ui-ownership.spec.ts \
            frontend/e2e/account-email-change.spec.ts \
            .agents/AGENTS.md
          git commit -m "test(e2e): synchronize Active Lesson UI journeys"
          git push origin HEAD:agent/issue-193-active-lesson
