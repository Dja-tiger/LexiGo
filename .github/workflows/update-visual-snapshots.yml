name: Apply Issue 193 test migration

on:
  push:
    branches:
      - agent/issue-193-active-lesson
    paths:
      - .github/workflows/update-visual-snapshots.yml

permissions:
  contents: write

jobs:
  migrate-active-lesson-tests:
    name: Migrate Active Lesson assertions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/issue-193-active-lesson
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Apply assertion-backed test migration
        run: python scripts/ci/apply-issue-193-test-migration.py

      - name: Validate generated diff
        run: |
          git diff --check
          grep -Fq 'aria-valuetext", "2 из 2 элементов"' frontend/e2e/lesson-flow.spec.ts
          grep -Fq 'document.body.style.setProperty("zoom", "2")' frontend/e2e/active-lesson-figma.spec.ts

      - name: Commit migrated assertions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/e2e/lesson-flow.spec.ts frontend/e2e/active-lesson-figma.spec.ts
          git commit -m "test(e2e): migrate Active Lesson assertions"
          git push origin HEAD:agent/issue-193-active-lesson

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend unit tests
        working-directory: frontend
        run: npm test
