name: Apply Issue 193 integration

on:
  push:
    branches:
      - agent/issue-193-active-lesson
    paths:
      - .github/workflows/update-visual-snapshots.yml

permissions:
  contents: write

jobs:
  integrate-active-lesson:
    name: Integrate canonical Active Lesson
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/issue-193-active-lesson
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Apply assertion-backed integration patch
        run: python scripts/ci/apply-issue-193.py

      - name: Validate generated diff
        run: |
          git diff --check
          grep -Fq 'ActiveLessonPresentation' frontend/components/lexigo-premium-app.tsx
          ! grep -Fq '<section className="lx-lesson-page">' frontend/components/lexigo-premium-app.tsx

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/components/lexigo-premium-app.tsx
          git commit -m "feat(frontend): integrate canonical Active Lesson"
          git push origin HEAD:agent/issue-193-active-lesson

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Production build
        working-directory: frontend
        run: npm run build
