name: Apply Issue 193 server-position assertion fix

on:
  push:
    branches:
      - agent/issue-193-active-lesson
    paths:
      - .github/workflows/update-visual-snapshots.yml

permissions:
  contents: write

jobs:
  apply-server-position-fix:
    name: Apply Active Lesson server-position assertion fix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/issue-193-active-lesson
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Apply assertion-backed fix
        run: python scripts/ci/apply-issue-193-server-position-assertion.py

      - name: Validate generated diff
        run: |
          git diff --check
          grep -Fq 'name: "Zulu cache"' frontend/e2e/ui-ownership.spec.ts
          grep -Fq 'server-provided position' .agents/AGENTS.md

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/e2e/ui-ownership.spec.ts .agents/AGENTS.md
          git commit -m "test(e2e): assert server-provided lesson position"
          git push origin HEAD:agent/issue-193-active-lesson
