name: Update visual snapshots

# Temporary guarded codemod for PR #192. Restored after the source commit lands.
on:
  push:
    branches:
      - agent/issue-162-progressive-lesson-composer
    paths:
      - .github/workflows/update-visual-snapshots.yml

permissions:
  contents: write

jobs:
  align-accessibility-contracts:
    name: Align Issue 162 accessibility contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/issue-162-progressive-lesson-composer
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply guarded test transformations
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              source = path.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              path.write_text(source.replace(old, new, 1))

          keyboard = Path("frontend/e2e/accessibility-keyboard.spec.ts")
          replace_once(
              keyboard,
              '''  await page.getByRole("radio", { name: /Простое изучение слов/ }).press("Space");
          await page.getByRole("button", { name: "Начать урок" }).press("Enter");''',
              '''  const studyMode = page.getByRole("radio", { name: /Простое изучение слов/ });
          await studyMode.press("Space");
          await expect(studyMode).toHaveAttribute("aria-checked", "true");

          const startLesson = page.getByRole("button", { name: "Начать урок", exact: true });
          await expect(startLesson).toBeEnabled();
          await startLesson.press("Enter");''',
          )
          replace_once(
              keyboard,
              '''  await expect(study).toHaveAttribute("aria-checked", "true");
          await study.focus();
          await study.press("ArrowDown");
          await expect(recall).toBeFocused();
          await expect(recall).toHaveAttribute("aria-checked", "true");''',
              '''  await expect(recall).toHaveAttribute("aria-checked", "true");
          await recall.focus();
          await recall.press("ArrowUp");
          await expect(study).toBeFocused();
          await expect(study).toHaveAttribute("aria-checked", "true");''',
          )

          composer = Path("frontend/e2e/adaptive-lesson-composer.spec.ts")
          replace_once(
              composer,
              '    await expect(page.getByRole("radio", { name: /Воспроизведение/ })).toHaveAttribute("aria-checked", "true");',
              '    await expect(page.getByRole("radio", { name: /Вспомнить самостоятельно/ })).toHaveAttribute("aria-checked", "true");',
          )
          PY

          git diff --check

      - name: Commit aligned tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/e2e/accessibility-keyboard.spec.ts frontend/e2e/adaptive-lesson-composer.spec.ts
          git commit -m "test(frontend): align composer accessibility contracts"
          git push origin HEAD:agent/issue-162-progressive-lesson-composer
