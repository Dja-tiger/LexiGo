name: Apply Issue 193 core fixes

on:
  push:
    branches:
      - agent/issue-193-active-lesson
    paths:
      - .github/workflows/update-visual-snapshots.yml

permissions:
  contents: write

jobs:
  apply-active-lesson-core-fixes:
    name: Apply Active Lesson core fixes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/issue-193-active-lesson
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Apply assertion-backed fixes
        run: python scripts/ci/apply-issue-193-core-fixes.py

      - name: Validate generated diff
        run: |
          git diff --check
          ! grep -Fq 'document.addEventListener("keydown"' frontend/components/active-lesson-presentation.tsx
          grep -Fq 'onKeyDown={handleDialogKeyDown}' frontend/components/active-lesson-presentation.tsx
          grep -Fq 'cssWithoutComments' frontend/app/active-lesson.test.ts

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/components/active-lesson-presentation.tsx \
            frontend/components/lexigo-premium-app.tsx \
            frontend/app/active-lesson.test.ts
          git commit -m "fix(frontend): preserve React ownership in Active Lesson"
          git push origin HEAD:agent/issue-193-active-lesson

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend unit tests
        working-directory: frontend
        run: npm test
