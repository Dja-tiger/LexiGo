name: OpenPencil issue 201 commit

on:
  push:
    branches:
      - design/issue-201-first-use-openpencil
    paths:
      - .github/workflows/openpencil-issue-201-commit.yml

permissions:
  contents: write
  actions: read

jobs:
  commit-reviewed-source:
    if: github.ref == 'refs/heads/design/issue-201-first-use-openpencil'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      REPAIR_ARTIFACT_ID: '9262446242'
      REPAIRED_SHA: 6d73b785aaeb7dda35a53c9c5f16edfc9cbef1092dbce992183538f16505520e
      OLD_SOURCE_SHA: 5380a0468d4e369d91ac190b829e01f60ff43493f6a76c9300c6b58d0b34d664
      EXPECTED_PARENT: c764f6553d2c67fa4e02ce4cc1321a4817da4552
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Guard exact lineage and old source
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/design/issue-201-first-use-openpencil
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(sha256sum 'design/openpencil/LexiGo Design System.op' | cut -d' ' -f1)" = "$OLD_SOURCE_SHA"

      - name: Materialize exact reviewed OpenPencil artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/op201-reviewed"
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$REPAIR_ARTIFACT_ID/zip" \
            -o "$RUNNER_TEMP/op201-reviewed.zip"
          unzip -q "$RUNNER_TEMP/op201-reviewed.zip" -d "$RUNNER_TEMP/op201-reviewed"
          test "$(sha256sum "$RUNNER_TEMP/op201-reviewed/repaired.op" | cut -d' ' -f1)" = "$REPAIRED_SHA"
          cp "$RUNNER_TEMP/op201-reviewed/repaired.op" 'design/openpencil/LexiGo Design System.op'
          test "$(sha256sum 'design/openpencil/LexiGo Design System.op' | cut -d' ' -f1)" = "$REPAIRED_SHA"

      - name: Commit only the reviewed design source
        run: |
          set -Eeuo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = 'design/openpencil/LexiGo Design System.op'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'design/openpencil/LexiGo Design System.op'
          test "$(git diff --cached --name-only)" = 'design/openpencil/LexiGo Design System.op'
          git commit -m 'design(openpencil): add First Use production states'
          git push origin HEAD:design/issue-201-first-use-openpencil
