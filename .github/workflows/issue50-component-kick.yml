name: Issue 50 component patch bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/issue-50-adaptive-navigation'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/issue-50-adaptive-navigation
          fetch-depth: 0

      - name: Execute indentation-safe component patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/issue50-component-patch.yml').read_text().splitlines()
          marker = '        run: |'
          start = workflow.index(marker) + 1
          script_lines = []
          for line in workflow[start:]:
              if line.startswith('          '):
                  script_lines.append(line[10:])
              elif not line.strip():
                  script_lines.append('')
              else:
                  raise SystemExit(f'unexpected workflow indentation: {line!r}')

          script = '\n'.join(script_lines) + '\n'
          script = script.replace(
              'def block(value: str) -> str:\n    return dedent(value).strip("\\n")',
              '''def block(value: str) -> str:
    lines = value.strip("\\n").splitlines()
    normalized = []
    for line in lines:
        if line and not line.startswith("    "):
            raise SystemExit(f"unexpected patch block indentation: {line!r}")
        normalized.append(line[4:] if line else "")
    return "\\n".join(normalized)''',
          )
          script = script.replace(
              'rm .github/workflows/issue50-component-patch.yml',
              'rm .github/workflows/issue50-component-patch.yml .github/workflows/issue50-component-kick.yml',
          )
          script = script.replace(
              'git add frontend/components/lexigo-premium-app.tsx .github/workflows/issue50-component-patch.yml',
              'git add frontend/components/lexigo-premium-app.tsx .github/workflows/issue50-component-patch.yml .github/workflows/issue50-component-kick.yml',
          )
          Path('/tmp/issue50-component-patch.sh').write_text(script)
          PY
          bash /tmp/issue50-component-patch.sh
