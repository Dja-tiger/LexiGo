name: Dispatch Production Apple Calendar Hotfix

on:
  push:
    paths:
      - .github/workflows/dispatch-prod-apple-calendar-hotfix.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Start production deployment
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-prod.yml',
              ref: 'main',
              inputs: {
                image_tag: 'fa3e5608d0f6a26c740d9f0878010232448bfcb9'
              }
            });
