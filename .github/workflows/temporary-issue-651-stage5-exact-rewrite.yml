name: Temporary Issue 651 Stage 5 exact rewrite

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temporary-issue-651-stage5-exact-rewrite.yml

permissions:
  contents: write

jobs:
  exact-rewrite:
    if: github.event.pull_request.number == 669 && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/issue-651-process-continuation
          fetch-depth: 0

      - name: Repair restored-lesson continuation fixture
        shell: bash
        run: |
          set -Eeuo pipefail

          expected_parent="ca79c6633080043b5ac53317c069ef42f144d24a"
          actual_parent="$(git rev-parse HEAD^)"
          if [ "$actual_parent" != "$expected_parent" ]; then
            echo "Unexpected helper parent: $actual_parent (expected $expected_parent)" >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path("frontend/e2e/support/lesson-result-fixture.ts")
          text = path.read_text()
          old = "      const nextRequest = lessonCreateCount > 0;"
          new = "      const nextRequest = lessonCreateCount > 0 || Boolean(options.resumeWithReviewedItem);"
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one fixture anchor, found {text.count(old)}")
          text = text.replace(old, new, 1)
          if text.count(new) != 1:
              raise SystemExit("replacement verification failed")
          path.write_text(text)
          PY

          mapfile -t changed < <(git diff --name-only | sort)
          expected=(frontend/e2e/support/lesson-result-fixture.ts)
          if [ "${changed[*]}" != "${expected[*]}" ]; then
            printf 'Unexpected changed paths:\n%s\n' "${changed[*]}" >&2
            exit 1
          fi

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- frontend/e2e/support/lesson-result-fixture.ts
          git commit -m "test(learning): model resumed lesson continuation"
          git push origin HEAD:feat/issue-651-process-continuation
