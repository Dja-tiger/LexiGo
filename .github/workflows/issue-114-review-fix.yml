name: Apply Issue 114 review fixes

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened

permissions:
  contents: write

jobs:
  apply:
    name: Apply and verify review fixes
    if: github.head_ref == 'agent/issue-114-phrase-slug-deep-links'
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 45
    env:
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.61.1-noble
      FRONTEND_CI_VOLUME: lexigo-issue114-review-${{ github.run_id }}-${{ github.run_attempt }}
      APP_BUILD_ID: ${{ github.sha }}
      NEXT_PUBLIC_RUM_SAMPLE_RATE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/issue-114-phrase-slug-deep-links
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: false

      - name: Apply self-review fixes
        run: python3 scripts/issue114_review_fix.py

      - name: Verify backend additions
        working-directory: backend
        run: |
          set -Eeuo pipefail
          gofmt -w integration/phrase_slug_lookup_test.go
          go test -count=1 ./internal/words ./internal/server
          go vet ./internal/words ./internal/server

      - name: Verify frontend additions
        working-directory: frontend
        run: |
          set -Eeuo pipefail
          bash ../scripts/ci/frontend-container.sh prepare
          cleanup() {
            bash ../scripts/ci/frontend-container.sh cleanup >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          bash ../scripts/ci/frontend-container.sh exec npm ci --no-audit --no-fund
          bash ../scripts/ci/frontend-container.sh exec npm run lint
          bash ../scripts/ci/frontend-container.sh exec npm run typecheck
          bash ../scripts/ci/frontend-container.sh exec npm run test

      - name: Commit verified fixes
        run: |
          set -Eeuo pipefail
          rm -f scripts/issue114_review_fix.py .github/workflows/issue-114-review-fix.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(catalog): harden phrase slug deep links"
          git push origin HEAD:agent/issue-114-phrase-slug-deep-links
