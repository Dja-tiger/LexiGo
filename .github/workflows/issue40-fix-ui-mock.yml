name: Fix Issue 40 UI Mock

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.head_ref == 'fix/issue-40-mixed-lesson-composer' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-40-mixed-lesson-composer
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Update server-composed lesson mock
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("frontend/e2e/ui-ownership.spec.ts")
          source = path.read_text(encoding="utf-8")
          old = '''      const input = request.postDataJSON() as { source: string; studyMode: string; lessonSize: string; wordIds: number[] };
                const selected = WORDS.filter((item) => input.wordIds.includes(item.id));
          '''
          new = '''      const input = request.postDataJSON() as { source: string; studyMode: string; lessonSize: string; wordIds?: number[] };
                const selected = input.wordIds
                  ? WORDS.filter((item) => input.wordIds?.includes(item.id))
                  : [WORDS[0], PHRASES[0]];
          '''
          if source.count(old) != 1:
              raise SystemExit(f"lesson mock occurrences: {source.count(old)}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check
      - name: Verify React-owned UI matrix
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npx playwright install --with-deps chromium webkit
          npm run test:e2e:ui
      - name: Commit UI mock only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/e2e/ui-ownership.spec.ts
          git commit -m "test(ui): support server-composed lesson responses"
          git push origin HEAD:fix/issue-40-mixed-lesson-composer
