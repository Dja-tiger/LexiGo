name: Patch Actions storage CI

on:
  push:
    branches:
      - agent/actions-storage-cleanup
    paths:
      - ".github/workflows/patch-actions-storage-ci.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/actions-storage-cleanup

      - name: Make artifact uploads storage-safe
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')

          upload_marker = '        uses: actions/upload-artifact@v7\n        with:'
          safe_upload_marker = '        uses: actions/upload-artifact@v7\n        continue-on-error: true\n        with:'
          upload_count = text.count(upload_marker)
          if upload_count != 6:
              raise SystemExit(f'Expected 6 artifact upload steps, found {upload_count}')
          text = text.replace(upload_marker, safe_upload_marker)

          performance_condition = "        if: always() && matrix.suite == 'ui-runtime' && steps.performance.outcome != 'skipped'\n        uses: actions/upload-artifact@v7"
          performance_replacement = "        if: failure() && matrix.suite == 'ui-runtime' && steps.performance.outcome != 'skipped'\n        uses: actions/upload-artifact@v7"
          if text.count(performance_condition) != 1:
              raise SystemExit('Performance artifact condition was not found exactly once')
          text = text.replace(performance_condition, performance_replacement)

          text = text.replace('          retention-days: 30', '          retention-days: 3')
          text = text.replace('          retention-days: 7', '          retention-days: 3')
          path.write_text(text, encoding='utf-8')

          Path('.github/workflows/patch-actions-storage-ci.yml').unlink()
          PY

          git diff --check
          grep -Fq "if: failure() && matrix.suite == 'ui-runtime'" .github/workflows/ci.yml
          test "$(grep -c 'continue-on-error: true' .github/workflows/ci.yml)" -eq 6
          test "$(grep -c 'retention-days: 3' .github/workflows/ci.yml)" -eq 6

      - name: Commit storage-safe CI policy
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ci.yml .github/workflows/patch-actions-storage-ci.yml
          git commit -m "ci: make artifact uploads storage-safe"
          git push origin HEAD:agent/actions-storage-cleanup
