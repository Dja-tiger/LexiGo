name: Temporary runner workspace cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  cleanup-generated-workspaces:
    if: github.head_ref == 'codex/security-production-dependency-audit'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Remove root-owned frontend build residue from all runner workspaces
        run: |
          set -eu
          docker run --rm \
            -v /opt:/host-opt \
            alpine:3.20 \
            sh -euc '
              for workspace in \
                /host-opt/actions-runner/_work/LexiGo/LexiGo \
                /host-opt/actions-runner-2/_work/LexiGo/LexiGo \
                /host-opt/actions-runner-3/_work/LexiGo/LexiGo
              do
                [ -d "$workspace" ] || continue
                rm -rf \
                  "$workspace/frontend/node_modules" \
                  "$workspace/frontend/.next" \
                  "$workspace/frontend/ci-artifacts" \
                  "$workspace/frontend/test-results" \
                  "$workspace/frontend/playwright-report" \
                  "$workspace/frontend/coverage"
              done
            '
