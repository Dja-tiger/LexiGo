name: Diagnose Persistent Phrases

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/diagnose-persistent-phrases.yml"

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Capture gofmt patch
        run: |
          mkdir -p diagnostics
          gofmt -w backend
          git diff -- backend > diagnostics/gofmt.patch
      - name: Capture TypeScript diagnostics
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck > ../diagnostics/tsc.log 2>&1 || true
      - uses: actions/upload-artifact@v6
        with:
          name: persistent-phrase-diagnostics
          path: diagnostics
          if-no-files-found: error
