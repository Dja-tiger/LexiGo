name: Apply frontend browser serialization

on:
  push:
    branches:
      - fix/serialize-frontend-browser-suites
    paths:
      - ".github/workflows/apply-frontend-browser-serialization.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/serialize-frontend-browser-suites
          fetch-depth: 0

      - name: Serialize browser suites on the shared host
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          old = '''      # Three runner services share the host. Keep one balanced browser group
      # per runner after the core job has completed.
      max-parallel: 3
'''
          new = '''      # The three runner services share one 4 vCPU / 8 GB host. Run browser
      # suites sequentially so Next.js servers and Playwright workers cannot
      # exhaust the same physical CPU and memory pool.
      max-parallel: 1
'''
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one frontend browser parallelism block')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          grep -Fq 'max-parallel: 1' .github/workflows/ci.yml
          ! grep -Fq 'max-parallel: 3' .github/workflows/ci.yml

      - name: Commit the focused CI fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-frontend-browser-serialization.yml
          git add .github/workflows/ci.yml
          git commit -m "fix(ci): serialize frontend browser suites on shared host"
          git push origin HEAD:fix/serialize-frontend-browser-suites
