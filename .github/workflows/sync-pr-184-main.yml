name: Sync PR 184 with main

on:
  push:
    branches:
      - agent/issue-183-application-shell-home
    paths:
      - ".github/workflows/sync-pr-184-main.yml"

permissions:
  contents: write

concurrency:
  group: sync-pr-184-main
  cancel-in-progress: true

jobs:
  sync:
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/issue-183-application-shell-home
          fetch-depth: 0

      - name: Merge current main with an explicit conflict contract
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Merge conflicts:\n%s\n' "${conflicts[*]:-none}"

            if [ "${#conflicts[@]}" -ne 1 ] || [ "${conflicts[0]}" != "frontend/package.json" ]; then
              echo "Unexpected merge conflict set; refusing automatic resolution" >&2
              git merge --abort || true
              exit 1
            fi

            # The branch version was prepared immediately before this merge and
            # already contains both the Adaptive Knowledge Coach UI spec and the
            # process-isolated iOS PWA scripts from current main.
            git checkout --ours frontend/package.json
            git add frontend/package.json
          fi

          git rm .github/workflows/sync-pr-184-main.yml
          git add -A

          if git diff --cached --quiet; then
            echo "Merge produced no staged changes" >&2
            exit 1
          fi

          git commit -m "merge: sync Adaptive Knowledge Coach with main"
          git push origin HEAD:agent/issue-183-application-shell-home
