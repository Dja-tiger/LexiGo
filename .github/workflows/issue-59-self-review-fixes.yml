name: Issue 59 self-review fixes

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/issue-59-performance-budgets
      - name: Apply reviewed fixes
        run: |
          set -Eeuo pipefail
          python3 scripts/issue59_self_review.py
          rm scripts/issue59_self_review.py
          rm .github/workflows/issue-59-self-review-fixes.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(performance): harden telemetry privacy and API contract"
          git push origin HEAD:agent/issue-59-performance-budgets
