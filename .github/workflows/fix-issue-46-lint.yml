name: Fix issue 46 refs lint

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply React refs lint correction
        run: python3 scripts/ci/fix-issue-46-lint.py
      - name: Commit correction and remove temporary tooling
        run: |
          git rm scripts/ci/fix-issue-46-lint.py .github/workflows/fix-issue-46-lint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/components/lexigo-premium-app.tsx
          git commit -m "fix(a11y): keep route refs inside lifecycle effects [issue-46-lint]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
