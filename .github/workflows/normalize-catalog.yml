name: Normalize Catalog Go Files

on:
  pull_request:

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - name: Format catalog changes
        run: |
          gofmt -w \
            backend/cmd/api/main.go \
            backend/integration/auth_flow_test.go \
            backend/integration/dependencies_test.go \
            backend/internal/catalog/catalog.go \
            backend/internal/catalog/catalog_data.go \
            backend/internal/catalog/catalog_test.go \
            backend/internal/words/model.go \
            backend/internal/words/repository.go
      - name: Commit formatting
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "style: format catalog integration"
          git push origin "HEAD:$HEAD_BRANCH"
