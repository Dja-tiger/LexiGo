name: Temporary Issue 70 edit

on:
  push:
    branches:
      - refactor/issue-70-remove-phrases-compat
    paths:
      - .github/workflows/temporary-issue70-edit.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

concurrency:
  group: temporary-issue70-edit-refactor-issue-70-remove-phrases-compat
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  transform:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/issue-70-remove-phrases-compat
          fetch-depth: 0

      - name: Recover and correct the fail-closed transformer
        run: |
          python3 <<'PYEXTRACT'
          from pathlib import Path
          import subprocess

          workflow_path = ".github/workflows/temporary-issue70-edit.yml"
          original_commit = "24f1babb302c039d842d249f9046267a4ef59a32"
          original = subprocess.check_output(
              ["git", "show", f"{original_commit}:{workflow_path}"],
              text=True,
          )
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n"
          if original.count(start_marker) != 1 or original.count(end_marker) != 1:
              raise SystemExit("unable to recover exactly one transformer body from original workflow")
          body = original.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = body.splitlines()
          if any(line and not line.startswith("          ") for line in lines):
              raise SystemExit("unexpected transformer indentation in original workflow")
          script = "\n".join(line[10:] if line else "" for line in lines) + "\n"

          wrong_required = 'navigation.view === "phrases" ? "phrases" : "learn"'
          correct_required = 'source === "phrases" ? "phrases" : "learn"'
          if script.count(wrong_required) != 1:
              raise SystemExit(f"expected one incorrect required marker, found {script.count(wrong_required)}")
          script = script.replace(wrong_required, correct_required, 1)

          old_derived = """source = regex_once(
              source,
              r'  const phraseTopics = useMemo\\(\\(\\) => \\{.*?  const sortedAllItems = items;\\n  const successRate = objectiveSuccessRate\\(progress\\);',
              '  const sortedAllItems = items;\\n  const successRate = objectiveSuccessRate(progress);',
              \"Phrases derived route values\",
          )"""
          new_derived = """source = regex_once(
              source,
              r'  const phraseTopics = useMemo\\(\\(\\) => \\{.*?  const activePhrasePageInfo = session \\? phraseCatalogPageInfo : guestPhrasePage\\.info;\\n',
              \"\",
              \"Phrases derived catalog values\",
          )
          source = regex_once(
              source,
              r'  const selectedPhrase = navigation\\.detail\\n.*?    : undefined;\\n',
              \"\",
              \"Phrases derived detail value\",
          )"""
          if script.count(old_derived) != 1:
              raise SystemExit(f"expected one obsolete derived-value transform, found {script.count(old_derived)}")
          script = script.replace(old_derived, new_derived, 1)
          Path("/tmp/issue70-transform.py").write_text(script, encoding="utf-8")
          PYEXTRACT

      - name: Apply transformation and publish result
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! grep -Fq 'const [phraseCatalog, setPhraseCatalog]' frontend/components/lexigo-premium-app.tsx; then
            echo "Phrases compatibility runtime is already absent; no additional commit is required."
            exit 0
          fi

          set +e
          python3 /tmp/issue70-transform.py > /tmp/issue70-transform.log 2>&1
          status=$?
          set -e
          cat /tmp/issue70-transform.log

          if [ "$status" -ne 0 ]; then
            {
              printf '\n## 2026-07-28 temporary transformer diagnostic\n\n'
              printf 'The fail-closed runtime transformation was rejected before a source commit. Diagnostic:\n\n```text\n'
              tail -n 40 /tmp/issue70-transform.log
              printf '\n```\n'
            } >> .agents/current/PROGRESS.md
            git add .agents/current/PROGRESS.md
            git commit -m "docs(agent): record Issue 70 transformer rejection"
            git push origin HEAD:refactor/issue-70-remove-phrases-compat
            exit "$status"
          fi

          git diff --check
          git diff --stat
          git add frontend/components/lexigo-premium-app.tsx frontend/components/phrases-route-island-source.test.ts
          git commit -m "refactor(frontend): remove Phrases compatibility runtime"
          git push origin HEAD:refactor/issue-70-remove-phrases-compat
