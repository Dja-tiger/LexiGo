name: Deploy Stage

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: deploy-stage
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  issues: write

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 40
    environment: stage
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -Eeuo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"
          RESPONSE="$response" python3 - <<'PY'
          import json
          import os
          payload = json.loads(os.environ["RESPONSE"])
          if payload.get("success") is not True or payload.get("result", {}).get("status") != "active":
              raise SystemExit("Cloudflare API token is not active")
          PY

      - name: Deploy stage
        id: deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/deploy-over-ssh.sh stage "$IMAGE_TAG"

      - name: Report stage deployment
        if: always()
        uses: actions/github-script@v9
        env:
          DEPLOY_STATUS: ${{ job.status }}
          IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.run_id }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOY_LOG: ${{ runner.temp }}/lexigo-stage-deploy.log
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync(process.env.DEPLOY_LOG)
              ? fs.readFileSync(process.env.DEPLOY_LOG, 'utf8').slice(-6000)
              : 'deploy log was not created';
            const body = [
              '# LexiGo current deployment status',
              '',
              `## Stage: **${process.env.DEPLOY_STATUS}**`,
              `- image SHA: \`${process.env.IMAGE_SHA}\``,
              `- run_id: \`${process.env.RUN_ID}\``,
              `- deploy: \`${process.env.DEPLOY_OUTCOME}\``,
              '',
              '```text',
              log,
              '```'
            ].join('\n');
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 12,
              body
            });

      - name: Cleanup deployment log
        if: always()
        run: rm -f -- "$RUNNER_TEMP/lexigo-stage-deploy.log"
