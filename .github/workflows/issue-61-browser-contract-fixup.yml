name: Align Issue 61 browser contracts

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  fixup:
    name: Align and verify browser contracts
    if: github.head_ref == 'agent/issue-61-information-architecture'
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 60
    env:
      FRONTEND_CI_VOLUME: lexigo-issue61-browser-${{ github.run_id }}-${{ github.run_attempt }}
      NEXT_PUBLIC_RUM_SAMPLE_RATE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/issue-61-information-architecture
          fetch-depth: 0
          show-progress: false

      - id: align
        name: Align stale browser scenarios with the new IA
        continue-on-error: true
        run: |
          set +e
          python3 scripts/issue61_browser_fix_v4.py > issue61-browser-fixup.log 2>&1
          status=$?
          git diff --check >> issue61-browser-fixup.log 2>&1
          diff_status=$?
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          exit "$diff_status"

      - name: Upload browser migration diagnostics
        if: steps.align.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: issue61-browser-fixup-log
          path: issue61-browser-fixup.log
          if-no-files-found: error
          retention-days: 7

      - name: Stop after browser migration failure
        if: steps.align.outcome == 'failure'
        run: |
          cat issue61-browser-fixup.log
          exit 1

      - id: browser
        name: Verify focused browser contracts
        if: steps.align.outcome == 'success'
        continue-on-error: true
        working-directory: frontend
        run: |
          set +e
          bash ../scripts/ci/frontend-container.sh prepare > ../issue61-browser-tests.log 2>&1
          prepare_status=$?
          if [ "$prepare_status" -ne 0 ]; then
            exit "$prepare_status"
          fi
          cleanup() {
            bash ../scripts/ci/frontend-container.sh cleanup >> ../issue61-browser-tests.log 2>&1 || true
          }
          trap cleanup EXIT
          {
            bash ../scripts/ci/frontend-container.sh exec npm ci --no-audit --no-fund &&
            bash ../scripts/ci/frontend-container.sh exec npm run lint &&
            bash ../scripts/ci/frontend-container.sh exec npm run typecheck &&
            bash ../scripts/ci/frontend-container.sh exec npm run test &&
            bash ../scripts/ci/frontend-container.sh exec npm run build &&
            bash ../scripts/ci/frontend-container.sh exec npx playwright test \
              e2e/information-architecture.spec.ts \
              e2e/accessibility-keyboard.spec.ts \
              e2e/route-focus-management.spec.ts \
              e2e/app-router-routes.spec.ts \
              e2e/ui-ownership.spec.ts \
              e2e/account-hydration.spec.ts \
              e2e/adaptive-navigation.spec.ts \
              e2e/dictionary-pwa.spec.ts \
              --project=desktop-chromium \
              --project=desktop-webkit \
              --project=ios-webkit
          } >> ../issue61-browser-tests.log 2>&1
          exit $?

      - name: Upload focused browser diagnostics
        if: steps.browser.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: issue61-focused-browser-diagnostics
          path: |
            issue61-browser-tests.log
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: warn
          retention-days: 7

      - name: Stop after focused browser failure
        if: steps.browser.outcome == 'failure'
        run: |
          tail -n 160 issue61-browser-tests.log
          exit 1

      - name: Commit verified browser contracts
        if: steps.align.outcome == 'success' && steps.browser.outcome == 'success'
        run: |
          set -Eeuo pipefail
          rm -f issue61-browser-fixup.log issue61-browser-tests.log scripts/issue61_browser_fix.py scripts/issue61_browser_fix_v2.py scripts/issue61_browser_fix_v3.py scripts/issue61_browser_fix_v4.py .github/workflows/issue-61-browser-contract-fixup.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(ux): align browser contracts with focused IA"
          git push origin HEAD:agent/issue-61-information-architecture
