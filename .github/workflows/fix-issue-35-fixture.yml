name: Fix Issue 35 Fixture

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'fix/issue-35-lesson-state-machine'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Use a public API lesson size
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/integration/lesson_resume_test.go')
          source = path.read_text()
          old = '"lessonSize": "3"'
          if source.count(old) != 1:
              raise SystemExit(f'target count={source.count(old)}')
          path.write_text(source.replace(old, '"lessonSize": "15"'))
          PY
          cd backend && gofmt -w integration/lesson_resume_test.go
      - name: Commit fixture correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/integration/lesson_resume_test.go
          git commit -m "test(lesson): use supported lesson size"
          git push origin HEAD:${{ github.head_ref }}
