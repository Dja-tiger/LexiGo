name: Setup Issue 35 Playwright

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  setup:
    if: github.head_ref == 'fix/issue-35-lesson-state-machine'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and lock Playwright
        working-directory: frontend
        run: npm install --save-dev @playwright/test --no-audit --no-fund

      - name: Commit Playwright dependency
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          git diff --cached --exit-code && exit 0
          git commit -m "test(e2e): lock Playwright dependency"
          git push origin HEAD:${{ github.head_ref }}
