name: Refine issue 45 mobile test

on:
  push:
    branches:
      - fix/issue-45-keyboard-focus

permissions:
  contents: write

jobs:
  refine:
    if: ${{ !contains(github.event.head_commit.message, '[issue-45-refined]') }}
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-45-keyboard-focus
          fetch-depth: 0
      - name: Use the visible calendar entry point in every viewport
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("frontend/e2e/accessibility-keyboard.spec.ts")
          content = path.read_text()
          old = '''test("axe keyboard baseline: calendar dialog", async ({ page }) => {
            await page.goto("/");
            await expect(page.getByRole("heading", { name: /Продолжайте учиться/ })).toBeVisible();
            await page.getByRole("button", { name: "Уведомления" }).click();
            await expect(page.getByRole("dialog", { name: "Напоминание об английском" })).toBeVisible();
            await expectKeyboardAxeBaseline(page);
            await expectNoPositiveTabIndex(page);
          });'''
          new = '''test("axe keyboard baseline: calendar dialog", async ({ page }) => {
            await page.goto("/?view=progress");
            await expect(page.getByRole("heading", { name: "Смотрите, что действительно сохранилось" })).toBeVisible();

            const headerTrigger = page.getByRole("button", { name: "Уведомления" });
            const cardTrigger = page.getByRole("button", { name: "Настроить календарь" });
            if (await headerTrigger.isVisible()) await headerTrigger.click();
            else await cardTrigger.click();

            await expect(page.getByRole("dialog", { name: "Напоминание об английском" })).toBeVisible();
            await expectKeyboardAxeBaseline(page);
            await expectNoPositiveTabIndex(page);
          });'''
          if old not in content:
              raise SystemExit("expected calendar test block was not found")
          path.write_text(content.replace(old, new))
          PY
          git rm .github/workflows/refine-issue-45-mobile-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/e2e/accessibility-keyboard.spec.ts
          git commit -m "test(a11y): cover visible mobile calendar entry [issue-45-refined]"
          git push origin HEAD:fix/issue-45-keyboard-focus
