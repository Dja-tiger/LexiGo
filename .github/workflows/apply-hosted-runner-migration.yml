name: Apply generated GitHub-hosted runner migration

on:
  push:
    branches: [ci/github-hosted-public-repo]
    paths:
      - ".github/workflows/apply-hosted-runner-migration.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: write

concurrency:
  group: apply-public-hosted-runners
  cancel-in-progress: true

jobs:
  apply:
    name: Commit generated hosted runner files
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ci/github-hosted-public-repo
          fetch-depth: 0

      - name: Download validated migration artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: "8582914279"
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/hosted-runner-migration /tmp/hosted-runner-migration.zip
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output /tmp/hosted-runner-migration.zip
          mkdir -p /tmp/hosted-runner-migration
          unzip -q /tmp/hosted-runner-migration.zip -d /tmp/hosted-runner-migration

      - name: Apply and validate generated files
        run: |
          set -Eeuo pipefail
          cp /tmp/hosted-runner-migration/.github/workflows/ci.yml .github/workflows/ci.yml
          cp /tmp/hosted-runner-migration/.github/workflows/actions-storage-cleanup.yml .github/workflows/actions-storage-cleanup.yml
          cp /tmp/hosted-runner-migration/.github/workflows/runner-resource-cleanup.yml .github/workflows/runner-resource-cleanup.yml
          cp /tmp/hosted-runner-migration/scripts/ci/runner_policy_test.py scripts/ci/runner_policy_test.py
          cp /tmp/hosted-runner-migration/docs/github-actions-runners.md docs/github-actions-runners.md

          rm -- \
            .github/workflows/migrate-public-hosted-runners.yml \
            .github/workflows/apply-hosted-runner-migration.yml

          python3 scripts/ci/runner_policy_test.py
          python3 scripts/ci/actions_storage_policy_test.py

      - name: Commit hosted runner profile
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "ci: use GitHub-hosted runners for public repository"
          git push origin HEAD:ci/github-hosted-public-repo
