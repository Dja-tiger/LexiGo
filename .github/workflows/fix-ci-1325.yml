name: Fix CI 1325

on:
  push:
    branches:
      - agent/issue-178-academic-technical-english

permissions:
  contents: write

jobs:
  fix:
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/issue-178-academic-technical-english
          fetch-depth: 0
      - name: Patch navigation and database contracts
        shell: bash
        run: |
          if [ -f backend/internal/platform/migrate/migrations/000014_academic_technical_english_lessons.up.sql ]; then
            echo "CI 1325 fix is already applied."
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old!r}")
              target.write_text(text.replace(old, new))

          replace_once(
              "frontend/lib/navigation.ts",
              '    | "data-engineering"\n    | "backend";',
              '    | "data-engineering"\n    | "backend"\n    | "academic-technical-english";',
          )
          replace_once(
              "frontend/lib/navigation.ts",
              '  "data-engineering",\n  "backend",\n]);',
              '  "data-engineering",\n  "backend",\n  "academic-technical-english",\n]);',
          )
          replace_once(
              "frontend/lib/navigation.test.ts",
              '    for (const source of ["daily-life", "travel", "data-engineering", "backend"] as const) {',
              '    for (const source of ["daily-life", "travel", "data-engineering", "backend", "academic-technical-english"] as const) {',
          )
          replace_once(
              "frontend/lib/navigation.test.ts",
              '    ["backend", "/learn?source=backend"],\n',
              '    ["backend", "/learn?source=backend"],\n    ["academic-technical-english", "/learn?source=academic-technical-english"],\n',
          )

          migration = Path("backend/internal/platform/migrate/migrations/000014_academic_technical_english_lessons.up.sql")
          migration.write_text("""alter table lesson_sessions
    drop constraint if exists lesson_sessions_source_chk;

alter table lesson_sessions
    add constraint lesson_sessions_source_chk
        check (source in (
            'mixed',
            'noun',
            'verb',
            'adjective',
            'phrases',
            'daily-life',
            'travel',
            'data-engineering',
            'backend',
            'academic-technical-english'
        )) not valid;

alter table lesson_sessions
    validate constraint lesson_sessions_source_chk;
""")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/lib/navigation.ts frontend/lib/navigation.test.ts backend/internal/platform/migrate/migrations/000014_academic_technical_english_lessons.up.sql
          git commit -m "fix(learning): align academic lesson contracts"
          git push origin HEAD:agent/issue-178-academic-technical-english
