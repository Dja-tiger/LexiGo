name: Apply Issue 61 patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    name: Apply and verify
    if: github.head_ref == 'agent/issue-61-information-architecture'
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 50
    env:
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.61.1-noble
      FRONTEND_CI_VOLUME: lexigo-issue61-${{ github.run_id }}-${{ github.run_attempt }}
      APP_BUILD_ID: ${{ github.sha }}
      NEXT_PUBLIC_RUM_SAMPLE_RATE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/issue-61-information-architecture
          fetch-depth: 0

      - name: Apply deterministic patch
        run: |
          set -uo pipefail
          python3 scripts/issue61_fixup.py
          if ! python3 scripts/issue61_apply.py > issue61-patch.log 2>&1; then
            tail -n 80 issue61-patch.log
            exit 1
          fi
          tail -n 5 issue61-patch.log

      - name: Upload patch diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: issue61-patch-diagnostic-${{ github.run_id }}
          path: issue61-patch.log
          if-no-files-found: error
          retention-days: 3

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: false

      - name: Format and verify backend
        working-directory: backend
        run: |
          set -Eeuo pipefail
          gofmt -w internal/performance internal/server integration/product_navigation_test.go
          go mod verify
          go test -count=1 ./internal/performance ./internal/server
          go vet ./internal/performance ./internal/server

      - name: Verify frontend contracts
        working-directory: frontend
        run: |
          set -Eeuo pipefail
          : > ../issue61-frontend.log
          bash ../scripts/ci/frontend-container.sh prepare 2>&1 | tee -a ../issue61-frontend.log
          cleanup() {
            bash ../scripts/ci/frontend-container.sh cleanup >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for command in \
            "npm ci --no-audit --no-fund" \
            "npm run lint" \
            "npm run typecheck" \
            "npm run test" \
            "npm run build"
          do
            printf '\n=== %s ===\n' "$command" | tee -a ../issue61-frontend.log
            bash ../scripts/ci/frontend-container.sh exec bash -lc "$command" 2>&1 | tee -a ../issue61-frontend.log
          done

      - name: Upload frontend diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: issue61-frontend-diagnostic-${{ github.run_id }}
          path: issue61-frontend.log
          if-no-files-found: warn
          retention-days: 3

      - name: Verify generated diff
        run: |
          set -Eeuo pipefail
          git diff --check
          test -f backend/internal/platform/migrate/migrations/000014_product_navigation.up.sql
          test -f frontend/e2e/information-architecture.spec.ts
          grep -q '/api/v1/product/journey' api/openapi.yaml
          grep -q 'home_next_action' frontend/components/lexigo-premium-app.tsx
          grep -q 'CatalogKindNavigation' frontend/components/dictionary-catalog.tsx
          grep -q 'product_navigation_daily' docs/information-architecture-usability-validation.md

      - name: Commit verified implementation
        run: |
          set -Eeuo pipefail
          rm -f scripts/issue61_apply.py scripts/issue61_fixup.py .github/workflows/issue-61-apply.yml issue61-patch.log issue61-frontend.log
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(ux): clarify home catalog and learning intents"
          git push origin HEAD:agent/issue-61-information-architecture
