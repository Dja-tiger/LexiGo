name: Repair WebKit Recall synchronization

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/issue-194-lesson-result'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/issue-194-lesson-result
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Synchronize canonical Recall input before submit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('frontend/e2e/lesson-flow.spec.ts')
          source = path.read_text()
          old_exact = '  await page.getByRole("textbox", { name: "Введите ответ" }).fill("абсолютный");'
          new_exact = '\n'.join([
              '  const answer = page.getByRole("textbox", { name: "Введите ответ" });',
              '  await answer.focus();',
              '  await answer.fill("абсолютный");',
              '  await expect(answer).toHaveValue("абсолютный");',
              '  await expect(page.getByRole("button", { name: "Сверить ответ", exact: true })).toBeEnabled();',
          ])
          if source.count(old_exact) != 2:
              raise RuntimeError(f'expected 2 exact Recall fills, found {source.count(old_exact)}')
          source = source.replace(old_exact, new_exact)

          old_wrong = '  await page.getByRole("textbox", { name: "Введите ответ" }).fill("непринятый вариант");'
          new_wrong = '\n'.join([
              '  const answer = page.getByRole("textbox", { name: "Введите ответ" });',
              '  await answer.focus();',
              '  await answer.fill("непринятый вариант");',
              '  await expect(answer).toHaveValue("непринятый вариант");',
              '  await expect(page.getByRole("button", { name: "Сверить ответ", exact: true })).toBeEnabled();',
          ])
          if source.count(old_wrong) != 1:
              raise RuntimeError(f'expected 1 rejected Recall fill, found {source.count(old_wrong)}')
          path.write_text(source.replace(old_wrong, new_wrong, 1))

          agents = Path('.agents/AGENTS.md')
          guidance = agents.read_text()
          marker = '### 2026-07-24 — WebKit submit начался до синхронизации controlled textbox'
          if marker not in guidance:
              guidance += (
                  '\n\n' + marker + '\n\n'
                  '- **Симптом:** `Lesson completion` зависал на disabled `Сверить ответ` в desktop WebKit и iOS WebKit; trace показывал пустой canonical textbox после вызова `fill`.\n'
                  '- **Первопричина:** journey сразу переходил от программного `fill` к submit и не подтверждал, что focus/input state дошёл до React-controlled field перед проверкой disabled-состояния.\n'
                  '- **Профилактика:** для controlled textbox в cross-browser E2E сначала установить focus, выполнить `fill`, подтвердить `toHaveValue`, затем подтвердить enabled primary action и только после этого submit. Timeout увеличивать запрещено.\n'
                  '- **Обязательная проверка:** Recall и mixed-practice scenarios проходят в desktop Chromium/WebKit, Android Chromium и iOS WebKit; trace не содержит пустой textbox перед submit.\n'
                  '- **Область действия:** controlled inputs, React route transitions, WebKit/iOS WebKit и objective Recall journeys.\n'
              )
              agents.write_text(guidance)
          PY

      - name: Restore workflow and commit source fix
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/actions-storage-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test(frontend): synchronize Recall input before submit'
          git push origin HEAD:agent/issue-194-lesson-result
