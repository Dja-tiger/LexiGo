name: Actions storage cleanup

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/workflows/patch-actions-storage-policy.yml"
      - "scripts/ci/actions_storage_cleanup.py"
      - "scripts/ci/actions_storage_cleanup_test.py"
      - "scripts/ci/actions_storage_policy_test.py"
      - "scripts/ci/runner_policy_test.py"
      - "scripts/ci/patch_actions_storage_policy.py"
      - "docs/github-actions-storage.md"
  push:
    branches:
      - main
      - agent/issue-195-progress-evidence
    paths:
      - ".github/workflows/**"
      - ".github/workflows/patch-actions-storage-policy.yml"
      - "scripts/.issue195-fix-trigger"
      - "scripts/ci/actions_storage_cleanup.py"
      - "scripts/ci/actions_storage_cleanup_test.py"
      - "scripts/ci/actions_storage_policy_test.py"
      - "scripts/ci/runner_policy_test.py"
      - "scripts/ci/patch_actions_storage_policy.py"
      - "docs/github-actions-storage.md"
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview candidates or remove them"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      artifact_retention_days:
        description: "Keep repository artifacts created within this many days"
        required: true
        default: 3
        type: number
      delete_all_caches:
        description: "Delete all repository Actions caches"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: lexigo-actions-storage-cleanup-${{ github.event_name }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  repair-progress:
    name: Apply confirmed Progress ownership repairs
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/issue-195-progress-evidence'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/issue-195-progress-evidence
          fetch-depth: 0

      - name: Apply deterministic repair and restore workflow policy
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app = Path('frontend/components/lexigo-premium-app.tsx')
          source = app.read_text(encoding='utf-8')
          old = '''import {
            type AnswerMode,
            type ProgressSummary,
            type ReviewRating,
          } from "../lib/progress";'''
          new = '''import {
            goalPercent,
            type AnswerMode,
            type ProgressSummary,
            type ReviewRating,
          } from "../lib/progress";'''
          if source.count(old) != 1:
              raise SystemExit(f'unexpected progress import count: {source.count(old)}')
          app.write_text(source.replace(old, new), encoding='utf-8')

          schema = Path('api/openapi.yaml')
          source = schema.read_text(encoding='utf-8')
          start = source.index('ProgressSummary:\n')
          end = source.index('    Error:\n', start)
          block = source[start:end]
          indented = '\n'.join(f'    {line}' if line else line for line in block.splitlines()) + '\n'
          schema.write_text(source[:start] + indented + source[end:], encoding='utf-8')

          agents = Path('.agents/AGENTS.md')
          source = agents.read_text(encoding='utf-8')
          marker = '### 2026-07-25 — Feature extraction removed a helper still owned by Home'
          incident = '''

### 2026-07-25 — Feature extraction removed a helper still owned by Home

- **Симптом:** `Frontend core quality` упал на typecheck: `goalPercent` не найден в Home progress panel после замены отдельного Progress screen.
- **Первопричина:** import cleanup был выполнен по новому feature owner, но repository-wide symbol usage не подтвердил, что helper остаётся consumer другого экрана.
- **Почему не обнаружено раньше:** impact map учитывал `/progress`, но не соседний Home evidence panel в том же legacy container.
- **Профилактика:** перед удалением import или helper выполнять symbol-level search по всему production graph и разделять route presentation ownership от shared calculation ownership.
- **Regression gate:** полный `npm run typecheck` должен выполняться до первого PR push после extraction; targeted test не заменяет cross-route compile contract.
- **Область действия:** shared helpers, route extraction и крупные client containers.

### 2026-07-25 — OpenAPI replacement потерял schema indentation

- **Симптом:** новый `ProgressSummary` оказался на корневом уровне YAML вместо `components.schemas`, хотя textual replacement сохранил содержимое блока.
- **Первопричина:** текстовый fragment был нормализован без восстановления indentation его semantic owner.
- **Почему не обнаружено раньше:** проверялась структура полей, но не итоговая YAML hierarchy непосредственно в изменённом файле.
- **Профилактика:** YAML/JSON replacement обязан проходить parser-level validation и проверку canonical parent path, а не только `git diff --check`.
- **Regression gate:** OpenAPI validation и source contract подтверждают `components.schemas.ProgressSummary.weekly`.
- **Область действия:** OpenAPI, workflow-generated config и любые indentation-sensitive formats.
'''
          if marker not in source:
              agents.write_text(source.rstrip() + incident + '\n', encoding='utf-8')
          PY

          git fetch origin main
          git show origin/main:.github/workflows/actions-storage-cleanup.yml > .github/workflows/actions-storage-cleanup.yml
          rm -f .github/workflows/issue-195-fix-core.yml scripts/.issue195-fix-trigger
          git diff --check

          git config user.name "Dja-tiger"
          git config user.email "117261349+Dja-tiger@users.noreply.github.com"
          git add -A
          git commit -m "fix(progress): preserve shared helper and API schema ownership"
          git push origin HEAD:agent/issue-195-progress-evidence

  validate:
    name: Validate Actions storage cleanup
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test cleanup planner
        run: python3 scripts/ci/actions_storage_cleanup_test.py

      - name: Validate Actions storage policy
        run: python3 scripts/ci/actions_storage_policy_test.py

      - name: Validate CI runner policy
        run: python3 scripts/ci/runner_policy_test.py

      - name: Preview current storage candidates
        env:
          ACTIONS_STORAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/ci/actions_storage_cleanup.py \
            --repository "$GITHUB_REPOSITORY" \
            --artifact-retention-days 3 \
            --delete-all-caches \
            --dry-run \
            --summary-file "$RUNNER_TEMP/actions-storage-cleanup.json" \
            --github-step-summary "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: Reclaim Actions storage
    if: github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref == 'refs/heads/agent/issue-195-progress-evidence')
    permissions:
      contents: read
      actions: write
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test cleanup planner
        run: python3 scripts/ci/actions_storage_cleanup_test.py

      - name: Validate Actions storage policy
        run: python3 scripts/ci/actions_storage_policy_test.py

      - name: Validate CI runner policy
        run: python3 scripts/ci/runner_policy_test.py

      - name: Resolve cleanup policy
        id: policy
        env:
          DISPATCH_MODE: ${{ inputs.mode }}
          DISPATCH_ARTIFACT_RETENTION_DAYS: ${{ inputs.artifact_retention_days }}
          DISPATCH_DELETE_ALL_CACHES: ${{ inputs.delete_all_caches }}
        run: |
          set -Eeuo pipefail

          mode=apply
          artifact_retention_days=3
          delete_all_caches=true

          if [ "$GITHUB_EVENT_NAME" = "push" ] && git log -1 --pretty=%B | grep -Fq '[actions-storage-emergency]'; then
            artifact_retention_days=0
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            mode="${DISPATCH_MODE:-dry-run}"
            artifact_retention_days="${DISPATCH_ARTIFACT_RETENTION_DAYS:-3}"
            delete_all_caches="${DISPATCH_DELETE_ALL_CACHES:-true}"
          fi

          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"
          printf 'artifact_retention_days=%s\n' "$artifact_retention_days" >> "$GITHUB_OUTPUT"
          printf 'delete_all_caches=%s\n' "$delete_all_caches" >> "$GITHUB_OUTPUT"

      - name: Reclaim repository Actions storage
        env:
          ACTIONS_STORAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLEANUP_MODE: ${{ steps.policy.outputs.mode }}
          ARTIFACT_RETENTION_DAYS: ${{ steps.policy.outputs.artifact_retention_days }}
          DELETE_ALL_CACHES: ${{ steps.policy.outputs.delete_all_caches }}
        run: |
          set -Eeuo pipefail

          args=(
            --repository "$GITHUB_REPOSITORY"
            --artifact-retention-days "$ARTIFACT_RETENTION_DAYS"
            --summary-file "$RUNNER_TEMP/actions-storage-cleanup.json"
            --github-step-summary "$GITHUB_STEP_SUMMARY"
          )

          if [ "$DELETE_ALL_CACHES" = "true" ]; then
            args+=(--delete-all-caches)
          fi
          if [ "$CLEANUP_MODE" = "dry-run" ]; then
            args+=(--dry-run)
          fi

          python3 scripts/ci/actions_storage_cleanup.py "${args[@]}"
