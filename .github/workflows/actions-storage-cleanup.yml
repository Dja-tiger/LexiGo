name: Actions storage cleanup

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/workflows/patch-actions-storage-policy.yml"
      - "scripts/ci/actions_storage_cleanup.py"
      - "scripts/ci/actions_storage_cleanup_test.py"
      - "scripts/ci/actions_storage_policy_test.py"
      - "scripts/ci/runner_policy_test.py"
      - "scripts/ci/patch_actions_storage_policy.py"
      - "docs/github-actions-storage.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/workflows/patch-actions-storage-policy.yml"
      - "scripts/ci/actions_storage_cleanup.py"
      - "scripts/ci/actions_storage_cleanup_test.py"
      - "scripts/ci/actions_storage_policy_test.py"
      - "scripts/ci/runner_policy_test.py"
      - "scripts/ci/patch_actions_storage_policy.py"
      - "docs/github-actions-storage.md"
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview candidates or remove them"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      artifact_retention_days:
        description: "Keep repository artifacts created within this many days"
        required: true
        default: 3
        type: number
      delete_all_caches:
        description: "Delete all repository Actions caches"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: lexigo-actions-storage-cleanup-${{ github.event_name }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Actions storage cleanup
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test cleanup planner
        run: python3 scripts/ci/actions_storage_cleanup_test.py

      - name: Validate Actions storage policy
        run: python3 scripts/ci/actions_storage_policy_test.py

      - name: Validate CI runner policy
        run: python3 scripts/ci/runner_policy_test.py

      - name: Preview current storage candidates
        env:
          ACTIONS_STORAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/ci/actions_storage_cleanup.py \
            --repository "$GITHUB_REPOSITORY" \
            --artifact-retention-days 3 \
            --delete-all-caches \
            --dry-run \
            --summary-file "$RUNNER_TEMP/actions-storage-cleanup.json" \
            --github-step-summary "$GITHUB_STEP_SUMMARY"

  patch-navigation-scroll:
    name: Apply dictionary history scroll fix
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 189
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Patch component and regression scenario
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          dictionary_path = Path("frontend/components/lexigo-dictionary-app.tsx")
          e2e_path = Path("frontend/e2e/dictionary-pwa.spec.ts")

          dictionary = dictionary_path.read_text(encoding="utf-8")
          import_anchor = 'import { createScrollSnapshotScheduler } from "../lib/navigation-scroll-snapshot";\n'
          import_line = 'import { scheduleNavigationScrollRestoration } from "../lib/navigation-scroll-restoration";\n'
          if import_line not in dictionary:
              if dictionary.count(import_anchor) != 1:
                  raise SystemExit("dictionary import anchor was not found exactly once")
              dictionary = dictionary.replace(import_anchor, import_anchor + import_line, 1)

          old_effect = '''  useLayoutEffect(() => {
            navigationRef.current = navigation;
            if (!pendingNavigation || pendingNavigation.identity !== navigationIdentity(navigation)) return;
            const frame = window.requestAnimationFrame(() => {
              mainContentRef.current?.focus({ preventScroll: true });
              window.scrollTo({
                left: pendingNavigation.scroll.x,
                top: pendingNavigation.scroll.y,
                behavior: "auto",
              });
            });
            return () => window.cancelAnimationFrame(frame);
          }, [navigation, pendingNavigation]);
          '''
          new_effect = '''  useLayoutEffect(() => {
            navigationRef.current = navigation;
            if (!pendingNavigation || pendingNavigation.identity !== navigationIdentity(navigation)) return;

            const pending = pendingNavigation;
            mainContentRef.current?.focus({ preventScroll: true });
            return scheduleNavigationScrollRestoration(
              pending.scroll,
              {
                readPosition: () => ({ x: window.scrollX, y: window.scrollY }),
                writePosition: (position) => {
                  window.scrollTo({
                    left: position.x,
                    top: position.y,
                    behavior: "auto",
                  });
                },
                requestFrame: (callback) => window.requestAnimationFrame(callback),
                cancelFrame: (frameID) => window.cancelAnimationFrame(frameID),
              },
              () => {
                setPendingNavigation((current) => (current === pending ? null : current));
              },
            );
          }, [navigation, pendingNavigation]);
          '''
          if old_effect in dictionary:
              dictionary = dictionary.replace(old_effect, new_effect, 1)
          elif new_effect not in dictionary:
              raise SystemExit("dictionary scroll restoration effect did not match expected source")
          dictionary_path.write_text(dictionary, encoding="utf-8")

          e2e = e2e_path.read_text(encoding="utf-8")
          e2e = e2e.replace(
              'test("iOS standalone dictionary restores filters and result scroll across relaunch", async ({ context, page }, testInfo) => {',
              'test("iOS standalone dictionary restores result scroll on history return and filters across relaunch", async ({ context, page }, testInfo) => {',
              1,
          )
          scroll_anchor = '  const scrollBefore = await page.evaluate(() => window.scrollY);\n'
          scroll_assertion = '  expect(scrollBefore).toBeGreaterThan(0);\n'
          if scroll_assertion not in e2e:
              if e2e.count(scroll_anchor) != 1:
                  raise SystemExit("dictionary PWA scroll snapshot anchor was not found exactly once")
              e2e = e2e.replace(scroll_anchor, scroll_anchor + scroll_assertion, 1)

          history_anchor = '''  await expect(page).toHaveURL(/status=review/);
            await expect.poll(() => page.evaluate(() => window.scrollY)).toBeGreaterThanOrEqual(scrollBefore);
          '''
          history_replacement = '''  await expect(page).toHaveURL(/status=review/);
            await expect(page.getByRole("listitem")).toHaveCount(12);
            await expect.poll(() => page.evaluate(() => window.scrollY)).toBeGreaterThanOrEqual(scrollBefore);
          '''
          if history_anchor in e2e:
              e2e = e2e.replace(history_anchor, history_replacement, 1)
          elif history_replacement not in e2e:
              raise SystemExit("dictionary PWA history assertion anchor was not found")
          e2e_path.write_text(e2e, encoding="utf-8")
          PY

      - name: Validate targeted regression
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run test -- lib/navigation-scroll-restoration.test.ts
          npm run typecheck

      - name: Commit source-only fix
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet; then
            echo "Dictionary scroll restoration fix is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/components/lexigo-dictionary-app.tsx \
            frontend/e2e/dictionary-pwa.spec.ts
          git commit -m "fix(frontend): restore dictionary scroll after async history return"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  cleanup:
    name: Reclaim Actions storage
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      actions: write
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test cleanup planner
        run: python3 scripts/ci/actions_storage_cleanup_test.py

      - name: Validate Actions storage policy
        run: python3 scripts/ci/actions_storage_policy_test.py

      - name: Validate CI runner policy
        run: python3 scripts/ci/runner_policy_test.py

      - name: Resolve cleanup policy
        id: policy
        env:
          DISPATCH_MODE: ${{ inputs.mode }}
          DISPATCH_ARTIFACT_RETENTION_DAYS: ${{ inputs.artifact_retention_days }}
          DISPATCH_DELETE_ALL_CACHES: ${{ inputs.delete_all_caches }}
        run: |
          set -Eeuo pipefail

          mode=apply
          artifact_retention_days=3
          delete_all_caches=true

          if [ "$GITHUB_EVENT_NAME" = "push" ] && git log -1 --pretty=%B | grep -Fq '[actions-storage-emergency]'; then
            artifact_retention_days=0
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            mode="${DISPATCH_MODE:-dry-run}"
            artifact_retention_days="${DISPATCH_ARTIFACT_RETENTION_DAYS:-3}"
            delete_all_caches="${DISPATCH_DELETE_ALL_CACHES:-true}"
          fi

          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"
          printf 'artifact_retention_days=%s\n' "$artifact_retention_days" >> "$GITHUB_OUTPUT"
          printf 'delete_all_caches=%s\n' "$delete_all_caches" >> "$GITHUB_OUTPUT"

      - name: Reclaim repository Actions storage
        env:
          ACTIONS_STORAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLEANUP_MODE: ${{ steps.policy.outputs.mode }}
          ARTIFACT_RETENTION_DAYS: ${{ steps.policy.outputs.artifact_retention_days }}
          DELETE_ALL_CACHES: ${{ steps.policy.outputs.delete_all_caches }}
        run: |
          set -Eeuo pipefail

          args=(
            --repository "$GITHUB_REPOSITORY"
            --artifact-retention-days "$ARTIFACT_RETENTION_DAYS"
            --summary-file "$RUNNER_TEMP/actions-storage-cleanup.json"
            --github-step-summary "$GITHUB_STEP_SUMMARY"
          )

          if [ "$DELETE_ALL_CACHES" = "true" ]; then
            args+=(--delete-all-caches)
          fi
          if [ "$CLEANUP_MODE" = "dry-run" ]; then
            args+=(--dry-run)
          fi

          python3 scripts/ci/actions_storage_cleanup.py "${args[@]}"
