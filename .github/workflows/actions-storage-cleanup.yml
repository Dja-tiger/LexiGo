name: Actions storage cleanup

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/workflows/patch-actions-storage-policy.yml"
      - "scripts/ci/actions_storage_cleanup.py"
      - "scripts/ci/actions_storage_cleanup_test.py"
      - "scripts/ci/actions_storage_policy_test.py"
      - "scripts/ci/runner_policy_test.py"
      - "scripts/ci/patch_actions_storage_policy.py"
      - "docs/github-actions-storage.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/workflows/patch-actions-storage-policy.yml"
      - "scripts/ci/actions_storage_cleanup.py"
      - "scripts/ci/actions_storage_cleanup_test.py"
      - "scripts/ci/actions_storage_policy_test.py"
      - "scripts/ci/runner_policy_test.py"
      - "scripts/ci/patch_actions_storage_policy.py"
      - "docs/github-actions-storage.md"
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview candidates or remove them"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      artifact_retention_days:
        description: "Keep repository artifacts created within this many days"
        required: true
        default: 3
        type: number
      delete_all_caches:
        description: "Delete all repository Actions caches"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: lexigo-actions-storage-cleanup-${{ github.event_name }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Actions storage cleanup
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test cleanup planner
        run: python3 scripts/ci/actions_storage_cleanup_test.py

      - name: Validate Actions storage policy
        run: python3 scripts/ci/actions_storage_policy_test.py

      - name: Validate CI runner policy
        run: python3 scripts/ci/runner_policy_test.py

      - name: Preview current storage candidates
        env:
          ACTIONS_STORAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/ci/actions_storage_cleanup.py \
            --repository "$GITHUB_REPOSITORY" \
            --artifact-retention-days 3 \
            --delete-all-caches \
            --dry-run \
            --summary-file "$RUNNER_TEMP/actions-storage-cleanup.json" \
            --github-step-summary "$GITHUB_STEP_SUMMARY"

  generate-lesson-result-visual-baselines:
    name: Generate Lesson Result visual baselines
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'agent/issue-194-lesson-result' &&
      github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.61.1-noble
      FRONTEND_CI_VOLUME: lexigo-frontend-visual-baseline-${{ github.run_id }}-${{ github.run_attempt }}
      FRONTEND_CI_SLOT: visual-baseline
      APP_BUILD_ID: ${{ github.event.pull_request.head.sha }}
      NEXT_PUBLIC_RUM_SAMPLE_RATE: "1"
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Prepare isolated frontend workspace
        run: bash scripts/ci/frontend-container.sh prepare

      - name: Install locked dependencies
        run: bash scripts/ci/frontend-container.sh exec npm ci --no-audit --no-fund

      - name: Production build
        run: bash scripts/ci/frontend-container.sh exec npm run build

      - name: Generate Linux visual baselines
        run: bash scripts/ci/frontend-container.sh exec npm run test:e2e:visual -- --update-snapshots

      - name: Extract generated baselines
        run: bash scripts/ci/frontend-container.sh extract

      - name: Commit only approved Lesson Result baselines
        shell: bash
        run: |
          set -Eeuo pipefail

          source_dir="frontend/ci-artifacts/e2e/visual-regression.spec.ts-snapshots"
          target_dir="frontend/e2e/visual-regression.spec.ts-snapshots"
          files=(
            lesson-result-next-compact-visual-compact-linux.png
            lesson-result-due-desktop-visual-desktop-linux.png
            lesson-result-daily-goal-dark-desktop-visual-desktop-linux.png
          )

          mkdir -p "$target_dir"
          for file in "${files[@]}"; do
            test -s "$source_dir/$file"
            cp "$source_dir/$file" "$target_dir/$file"
          done

          git add -- "${files[@]/#/$target_dir/}"

          mapfile -t actual < <(git diff --cached --name-only | sort)
          expected=(
            "$target_dir/lesson-result-daily-goal-dark-desktop-visual-desktop-linux.png"
            "$target_dir/lesson-result-due-desktop-visual-desktop-linux.png"
            "$target_dir/lesson-result-next-compact-visual-compact-linux.png"
          )
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | sort)

          if [[ "${actual[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected staged files:\n%s\n' "${actual[*]}" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(frontend): add Lesson Result Linux baselines"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Cleanup isolated frontend workspace
        if: always()
        run: bash scripts/ci/frontend-container.sh cleanup

  cleanup:
    name: Reclaim Actions storage
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      actions: write
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test cleanup planner
        run: python3 scripts/ci/actions_storage_cleanup_test.py

      - name: Validate Actions storage policy
        run: python3 scripts/ci/actions_storage_policy_test.py

      - name: Validate CI runner policy
        run: python3 scripts/ci/runner_policy_test.py

      - name: Resolve cleanup policy
        id: policy
        env:
          DISPATCH_MODE: ${{ inputs.mode }}
          DISPATCH_ARTIFACT_RETENTION_DAYS: ${{ inputs.artifact_retention_days }}
          DISPATCH_DELETE_ALL_CACHES: ${{ inputs.delete_all_caches }}
        run: |
          set -Eeuo pipefail

          mode=apply
          artifact_retention_days=3
          delete_all_caches=true

          if [ "$GITHUB_EVENT_NAME" = "push" ] && git log -1 --pretty=%B | grep -Fq '[actions-storage-emergency]'; then
            artifact_retention_days=0
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            mode="${DISPATCH_MODE:-dry-run}"
            artifact_retention_days="${DISPATCH_ARTIFACT_RETENTION_DAYS:-3}"
            delete_all_caches="${DISPATCH_DELETE_ALL_CACHES:-true}"
          fi

          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"
          printf 'artifact_retention_days=%s\n' "$artifact_retention_days" >> "$GITHUB_OUTPUT"
          printf 'delete_all_caches=%s\n' "$delete_all_caches" >> "$GITHUB_OUTPUT"

      - name: Reclaim repository Actions storage
        env:
          ACTIONS_STORAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLEANUP_MODE: ${{ steps.policy.outputs.mode }}
          ARTIFACT_RETENTION_DAYS: ${{ steps.policy.outputs.artifact_retention_days }}
          DELETE_ALL_CACHES: ${{ steps.policy.outputs.delete_all_caches }}
        run: |
          set -Eeuo pipefail

          args=(
            --repository "$GITHUB_REPOSITORY"
            --artifact-retention-days "$ARTIFACT_RETENTION_DAYS"
            --summary-file "$RUNNER_TEMP/actions-storage-cleanup.json"
            --github-step-summary "$GITHUB_STEP_SUMMARY"
          )

          if [ "$DELETE_ALL_CACHES" = "true" ]; then
            args+=(--delete-all-caches)
          fi
          if [ "$CLEANUP_MODE" = "dry-run" ]; then
            args+=(--dry-run)
          fi

          python3 scripts/ci/actions_storage_cleanup.py "${args[@]}"
