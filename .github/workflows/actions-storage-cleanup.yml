name: Actions storage cleanup

on:
  pull_request:
    paths:
      - ".github/workflows/actions-storage-cleanup.yml"
      - ".github/workflows/patch-actions-storage-policy.yml"
      - "scripts/ci/actions_storage_cleanup.py"
      - "scripts/ci/actions_storage_cleanup_test.py"
      - "scripts/ci/patch_actions_storage_policy.py"
      - "docs/github-actions-storage.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/actions-storage-cleanup.yml"
      - ".github/workflows/patch-actions-storage-policy.yml"
      - "scripts/ci/actions_storage_cleanup.py"
      - "scripts/ci/actions_storage_cleanup_test.py"
      - "scripts/ci/patch_actions_storage_policy.py"
      - "docs/github-actions-storage.md"
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview candidates or remove them"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      artifact_retention_days:
        description: "Keep repository artifacts created within this many days"
        required: true
        default: 3
        type: number
      delete_all_caches:
        description: "Delete all repository Actions caches"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: lexigo-actions-storage-cleanup
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Actions storage cleanup
    if: github.event_name == 'pull_request'
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test cleanup planner
        run: python3 scripts/ci/actions_storage_cleanup_test.py

      - name: Preview current storage candidates
        env:
          ACTIONS_STORAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/ci/actions_storage_cleanup.py \
            --repository "$GITHUB_REPOSITORY" \
            --artifact-retention-days 3 \
            --delete-all-caches \
            --dry-run \
            --summary-file "$RUNNER_TEMP/actions-storage-cleanup.json" \
            --github-step-summary "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: Reclaim Actions storage
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      actions: write
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test cleanup planner
        run: python3 scripts/ci/actions_storage_cleanup_test.py

      - name: Resolve cleanup policy
        id: policy
        env:
          DISPATCH_MODE: ${{ inputs.mode }}
          DISPATCH_ARTIFACT_RETENTION_DAYS: ${{ inputs.artifact_retention_days }}
          DISPATCH_DELETE_ALL_CACHES: ${{ inputs.delete_all_caches }}
        run: |
          set -Eeuo pipefail

          mode=apply
          artifact_retention_days=3
          delete_all_caches=true

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            mode="${DISPATCH_MODE:-dry-run}"
            artifact_retention_days="${DISPATCH_ARTIFACT_RETENTION_DAYS:-3}"
            delete_all_caches="${DISPATCH_DELETE_ALL_CACHES:-true}"
          fi

          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"
          printf 'artifact_retention_days=%s\n' "$artifact_retention_days" >> "$GITHUB_OUTPUT"
          printf 'delete_all_caches=%s\n' "$delete_all_caches" >> "$GITHUB_OUTPUT"

      - name: Reclaim repository Actions storage
        env:
          ACTIONS_STORAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLEANUP_MODE: ${{ steps.policy.outputs.mode }}
          ARTIFACT_RETENTION_DAYS: ${{ steps.policy.outputs.artifact_retention_days }}
          DELETE_ALL_CACHES: ${{ steps.policy.outputs.delete_all_caches }}
        run: |
          set -Eeuo pipefail

          args=(
            --repository "$GITHUB_REPOSITORY"
            --artifact-retention-days "$ARTIFACT_RETENTION_DAYS"
            --summary-file "$RUNNER_TEMP/actions-storage-cleanup.json"
            --github-step-summary "$GITHUB_STEP_SUMMARY"
          )

          if [ "$DELETE_ALL_CACHES" = "true" ]; then
            args+=(--delete-all-caches)
          fi
          if [ "$CLEANUP_MODE" = "dry-run" ]; then
            args+=(--dry-run)
          fi

          python3 scripts/ci/actions_storage_cleanup.py "${args[@]}"

  # BEGIN TEMP STORAGE POLICY PATCH
  patch-storage-policy:
    name: Generate bounded Actions storage policy
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'fix/actions-storage-policy' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Apply storage policy patch
        run: python3 scripts/ci/patch_actions_storage_policy.py

      - name: Remove temporary bootstrap job
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/actions-storage-cleanup.yml')
          text = path.read_text(encoding='utf-8')
          start = text.index('\n  # BEGIN TEMP STORAGE POLICY PATCH\n')
          end_marker = '\n  # END TEMP STORAGE POLICY PATCH\n'
          end = text.index(end_marker, start) + len(end_marker)
          path.write_text(text[:start] + '\n', encoding='utf-8')
          PY

      - name: Validate generated changes
        id: generated_validation
        continue-on-error: true
        run: |
          status=0
          : > storage-policy-validation.log
          python3 scripts/ci/actions_storage_policy_test.py >> storage-policy-validation.log 2>&1 || status=$?
          python3 scripts/ci/actions_storage_cleanup_test.py >> storage-policy-validation.log 2>&1 || status=$?
          git diff --check >> storage-policy-validation.log 2>&1 || status=$?
          cat storage-policy-validation.log
          exit "$status"

      - name: Stage generated snapshots
        if: always()
        run: |
          set -Eeuo pipefail
          snapshot_temp="$RUNNER_TEMP/storage-policy-generated"
          rm -rf -- "$snapshot_temp"
          mkdir -p "$snapshot_temp/files"

          git add -A
          git diff --cached --name-only --diff-filter=ACM \
            | grep -v '^storage-policy-validation.log$' \
            > "$snapshot_temp/manifest.txt"
          git reset

          while IFS= read -r target; do
            test -n "$target"
            install -d "$snapshot_temp/files/$(dirname "$target")"
            cp -- "$target" "$snapshot_temp/files/$target"
          done < "$snapshot_temp/manifest.txt"
          cp -- storage-policy-validation.log "$snapshot_temp/validation.log"

          git reset --hard HEAD
          git clean -ffd
          rm -rf storage-policy-generated
          cp -a "$snapshot_temp" storage-policy-generated

      - name: Commit generated snapshots
        if: always()
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add storage-policy-generated
          git commit -m "ci: stage validated Actions storage policy"
          git push origin HEAD:fix/actions-storage-policy
  # END TEMP STORAGE POLICY PATCH
