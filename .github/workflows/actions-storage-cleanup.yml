name: Actions storage cleanup

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/workflows/patch-actions-storage-policy.yml"
      - "scripts/ci/actions_storage_cleanup.py"
      - "scripts/ci/actions_storage_cleanup_test.py"
      - "scripts/ci/actions_storage_policy_test.py"
      - "scripts/ci/runner_policy_test.py"
      - "scripts/ci/patch_actions_storage_policy.py"
      - "docs/github-actions-storage.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/workflows/patch-actions-storage-policy.yml"
      - "scripts/ci/actions_storage_cleanup.py"
      - "scripts/ci/actions_storage_cleanup_test.py"
      - "scripts/ci/actions_storage_policy_test.py"
      - "scripts/ci/runner_policy_test.py"
      - "scripts/ci/patch_actions_storage_policy.py"
      - "docs/github-actions-storage.md"
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview candidates or remove them"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      artifact_retention_days:
        description: "Keep repository artifacts created within this many days"
        required: true
        default: 3
        type: number
      delete_all_caches:
        description: "Delete all repository Actions caches"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: lexigo-actions-storage-cleanup-${{ github.event_name }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Actions storage cleanup
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test cleanup planner
        run: python3 scripts/ci/actions_storage_cleanup_test.py

      - name: Validate Actions storage policy
        run: python3 scripts/ci/actions_storage_policy_test.py

      - name: Validate CI runner policy
        run: python3 scripts/ci/runner_policy_test.py

      - name: Preview current storage candidates
        env:
          ACTIONS_STORAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/ci/actions_storage_cleanup.py \
            --repository "$GITHUB_REPOSITORY" \
            --artifact-retention-days 3 \
            --delete-all-caches \
            --dry-run \
            --summary-file "$RUNNER_TEMP/actions-storage-cleanup.json" \
            --github-step-summary "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: Reclaim Actions storage
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      actions: write
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test cleanup planner
        run: python3 scripts/ci/actions_storage_cleanup_test.py

      - name: Validate Actions storage policy
        run: python3 scripts/ci/actions_storage_policy_test.py

      - name: Validate CI runner policy
        run: python3 scripts/ci/runner_policy_test.py

      - name: Resolve cleanup policy
        id: policy
        env:
          DISPATCH_MODE: ${{ inputs.mode }}
          DISPATCH_ARTIFACT_RETENTION_DAYS: ${{ inputs.artifact_retention_days }}
          DISPATCH_DELETE_ALL_CACHES: ${{ inputs.delete_all_caches }}
        run: |
          set -Eeuo pipefail

          mode=apply
          artifact_retention_days=3
          delete_all_caches=true

          if [ "$GITHUB_EVENT_NAME" = "push" ] && git log -1 --pretty=%B | grep -Fq '[actions-storage-emergency]'; then
            artifact_retention_days=0
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            mode="${DISPATCH_MODE:-dry-run}"
            artifact_retention_days="${DISPATCH_ARTIFACT_RETENTION_DAYS:-3}"
            delete_all_caches="${DISPATCH_DELETE_ALL_CACHES:-true}"
          fi

          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"
          printf 'artifact_retention_days=%s\n' "$artifact_retention_days" >> "$GITHUB_OUTPUT"
          printf 'delete_all_caches=%s\n' "$delete_all_caches" >> "$GITHUB_OUTPUT"

      - name: Reclaim repository Actions storage
        env:
          ACTIONS_STORAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLEANUP_MODE: ${{ steps.policy.outputs.mode }}
          ARTIFACT_RETENTION_DAYS: ${{ steps.policy.outputs.artifact_retention_days }}
          DELETE_ALL_CACHES: ${{ steps.policy.outputs.delete_all_caches }}
        run: |
          set -Eeuo pipefail

          args=(
            --repository "$GITHUB_REPOSITORY"
            --artifact-retention-days "$ARTIFACT_RETENTION_DAYS"
            --summary-file "$RUNNER_TEMP/actions-storage-cleanup.json"
            --github-step-summary "$GITHUB_STEP_SUMMARY"
          )

          if [ "$DELETE_ALL_CACHES" = "true" ]; then
            args+=(--delete-all-caches)
          fi
          if [ "$CLEANUP_MODE" = "dry-run" ]; then
            args+=(--dry-run)
          fi

          python3 scripts/ci/actions_storage_cleanup.py "${args[@]}"

  patch_issue_70_phrases:
    name: Patch Issue 70 Phrases compatibility family
    if: >-
      github.event_name == 'pull_request' &&
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.ref == 'refactor/issue-70-remove-phrases-compatibility'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v7
        with:
          ref: refactor/issue-70-remove-phrases-compatibility
          fetch-depth: 0

      - name: Apply exact source deletion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("frontend/components/lexigo-premium-app.tsx")
          source = path.read_text(encoding="utf-8")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              return text.replace(old, new, 1)

          def sub_once(text: str, pattern: str, replacement: str, label: str) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.DOTALL)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return updated

          source = replace_once(source, 'import { sortCatalogEntries, type CatalogSortMode } from "../lib/catalog-sort";', 'import type { CatalogSortMode } from "../lib/catalog-sort";', "catalog-sort import")
          for line, label in [
              ('import { phraseCatalogFilters, phraseCatalogTarget } from "../lib/phrase-navigation";\n', "phrase navigation import"),
              ('import { CatalogKindNavigation } from "./catalog-kind-navigation";\n', "catalog kind navigation import"),
              ('import { SpeechPlayerButton } from "./speech-player-button";\n', "speech player import"),
              ('type CatalogKind = "phrases" | "all-items";\n', "catalog kind type"),
              ('  | "volume"\n', "volume icon type"),
              ('  if (name === "volume") return <svg {...common}><path d="M5 10v4h4l5 4V6L9 10H5Z"/><path d="M17 9c1.4 1.5 1.4 4.5 0 6M19.5 6.5c3.1 3 3.1 8 0 11"/></svg>;\n', "volume icon branch"),
          ]:
              source = replace_once(source, line, "", label)

          source = sub_once(
              source,
              r'function CatalogSortControl\(\{.*?\n\}\n\nfunction isStandaloneDisplayMode',
              '''function CatalogSortControl({
  mode,
  onChange,
}: {
  mode: CatalogSortMode;
  onChange: (mode: CatalogSortMode) => void;
}) {
  return (
    <div className="lx-catalog-sort" data-lexigo-sort-for="all-items">
      <div><strong>Сортировка</strong><small>Упорядочить слова по английскому алфавиту</small></div>
      <label>
        <span className="lx-visually-hidden">Выберите порядок сортировки</span>
        <select
          aria-label="Сортировка каталога"
          value={mode}
          onChange={(event) => onChange(event.target.value as CatalogSortMode)}
        >
          <option value="default">Порядок обучения</option>
          <option value="az">A–Z</option>
          <option value="za">Z–A</option>
        </select>
      </label>
    </div>
  );
}

function readStoredCatalogSort(): CatalogSortMode {
  try {
    const value = window.localStorage.getItem(`${SORT_STORAGE_PREFIX}all-items`);
    return value === "az" || value === "za" ? value : "default";
  } catch {
    return "default";
  }
}

function isStandaloneDisplayMode''',
              "catalog sorting helpers",
          )
          source = sub_once(source, r'\nfunction itemKey\(item: LearningItem\): string \{\n  return item\.slug \|\| item\.id;\n\}\n', '\n', "itemKey helper")
          source = sub_once(source, r'  const \[phraseCatalog, setPhraseCatalog\].*?  const \[phraseSearch, setPhraseSearch\] = useState\(""\);\n\n', '', "phrase route state")
          source = sub_once(source, r'  const \[phraseTopic, setPhraseTopic\] = useState\("all"\);\n  const \[phraseSortMode, setPhraseSortMode\] = useState<CatalogSortMode>\("default"\);\n', '', "phrase filter state")
          source = sub_once(
              source,
              r'  useEffect\(\(\) => \{\n    const storageTimer = window\.setTimeout\(\(\) => \{\n      setPhraseSortMode\(readStoredCatalogSort\("phrases"\)\);\n      setAllItemsSortMode\(readStoredCatalogSort\("all-items"\)\);\n    \}, 0\);\n    return \(\) => window\.clearTimeout\(storageTimer\);\n  \}, \[\]\);',
              '''  useEffect(() => {
    const storageTimer = window.setTimeout(() => {
      setAllItemsSortMode(readStoredCatalogSort());
    }, 0);
    return () => window.clearTimeout(storageTimer);
  }, []);''',
              "stored sort effect",
          )
          source = sub_once(source, r'\n  useEffect\(\(\) => \{\n    if \(navigation\.view !== "phrases"\) return;.*?\n  \}, \[navigation\]\);\n', '\n', "phrase URL synchronization")
          source = sub_once(source, r'  const phraseTopics = useMemo\(\(\) => \{.*?  const successRate = objectiveSuccessRate\(progress\);', '  const sortedAllItems = items;\n  const successRate = objectiveSuccessRate(progress);', "phrase derived values")
          source = sub_once(source, r'  const loadPhraseCatalogResource = useCallback\(async \(.*?\n  const loadActiveLessonResource = useCallback', '  const loadActiveLessonResource = useCallback', "phrase loaders")
          source = sub_once(
              source,
              r'      setPhraseCatalog\(\[\]\);\n      setRemotePhraseDetail\(null\);\n      setPhraseDetailStatus\(\{ slug: "", status: idleResourceStatus\(\) \}\);\n      setPhraseCatalogPageInfo\(paginateCatalogEntries\(DEFAULT_PHRASE_CATALOG, 1\)\.info\);\n      setPhrasePage\(1\);\n      setPhraseCatalogStatus\(idleResourceStatus\(\)\);\n',
              '',
              "hydration phrase resets",
          )
          source = sub_once(
              source,
              r'  useEffect\(\(\) => \{\n    if \(!session \|\| navigation\.view !== "phrases" \|\| navigation\.detail\) return;.*?\n  \}, \[\n    loadPhraseDetailResource,.*?\n  \]\);\n\n',
              '',
              "phrase catalog/detail effects",
          )
          source = sub_once(
              source,
              r'  function updateCatalogSort\(kind: CatalogKind, mode: CatalogSortMode\) \{.*?\n  \}\n\n  function selectRovingControl',
              '''  function updateAllItemsSort(mode: CatalogSortMode) {
    setAllItemsSortMode(mode);
    try {
      window.localStorage.setItem(`${SORT_STORAGE_PREFIX}all-items`, mode);
    } catch {
      // Sorting remains available for the current session when storage is restricted.
    }
  }

  function selectRovingControl''',
              "catalog sort mutation",
          )
          source = sub_once(
              source,
              r'      setPhraseCatalog\(\[\]\);\n      setRemotePhraseDetail\(null\);\n      setPhraseDetailStatus\(\{ slug: "", status: idleResourceStatus\(\) \}\);\n      setPhraseCatalogPageInfo\(paginateCatalogEntries\(DEFAULT_PHRASE_CATALOG, 1\)\.info\);\n      setPhrasePage\(1\);\n      setPhraseSearchInput\(""\);\n      setPhraseSearch\(""\);\n      setPhraseCatalogStatus\(idleResourceStatus\(\)\);\n',
              '',
              "logout phrase resets",
          )
          source = sub_once(source, r'  function openPhraseDetail\(phrase: LearningItem\) \{.*?\n  async function changeAllItemsPage', '  async function changeAllItemsPage', "phrase handlers")
          source = replace_once(source, '    updateCatalogSort("all-items", mode);', '    updateAllItemsSort(mode);', "all-items sort call")
          source = sub_once(source, r'  function renderPhrases\(\) \{.*?\n  function renderLibrary\(\) \{', '  function renderLibrary() {', "phrase presentation")
          source = replace_once(source, '<CatalogSortControl kind="all-items" mode={allItemsSortMode} onChange={changeAllItemsSort} />', '<CatalogSortControl mode={allItemsSortMode} onChange={changeAllItemsSort} />', "all-items sort control")
          source = sub_once(
              source,
              r'  const view = navigation\.view === "home" \? renderHome\(\)\n    : navigation\.view === "learn" \? renderLearn\(\)\n      : navigation\.view === "phrases" \? renderPhrases\(\)\n        : navigation\.view === "library" \? renderLibrary\(\)',
              '  const view = navigation.view === "home" ? renderHome()\n    : navigation.view === "learn" ? renderLearn()\n      : navigation.view === "library" ? renderLibrary()',
              "view selection",
          )
          source = sub_once(source, r'          <AsyncResourceNotice label="Каталог фраз"[^\n]+\n', '', "phrase resource notice")

          banned = [
              "const [phraseCatalog, setPhraseCatalog]",
              "const [phraseCatalogStatus, setPhraseCatalogStatus]",
              "const [remotePhraseDetail, setRemotePhraseDetail]",
              "const [phraseDetailStatus, setPhraseDetailStatus]",
              "const [phraseCatalogPageInfo, setPhraseCatalogPageInfo]",
              "const [phrasePage, setPhrasePage]",
              "const [phraseSearchInput, setPhraseSearchInput]",
              "const [phraseSearch, setPhraseSearch]",
              "const [phraseTopic, setPhraseTopic]",
              "const [phraseSortMode, setPhraseSortMode]",
              "loadPhraseCatalogResource",
              "loadPhraseDetailResource",
              "function renderPhrases",
              "phraseCatalogFilters",
              "phraseCatalogTarget",
              "CatalogKindNavigation",
              "SpeechPlayerButton",
              "sortLearningItems",
          ]
          required = [
              'type LessonSource = WordSection | "phrases";',
              '{ value: "phrases", label: "Технические фразы"',
              "const DEFAULT_PHRASE_CATALOG",
              "? DEFAULT_PHRASE_CATALOG.find",
              "mixedLessonFallbackMessage",
              'exerciseKind: currentItem.kind === "phrase" ? "cloze" : "translation"',
              'source === "phrases" ? "phrases" : "learn"',
          ]
          remaining = [marker for marker in banned if marker in source]
          missing = [marker for marker in required if marker not in source]
          if remaining:
              raise SystemExit(f"retired markers remain: {remaining}")
          if missing:
              raise SystemExit(f"shared phrase contracts missing: {missing}")

          path.write_text(source, encoding="utf-8")
          PY

          git diff --check
          mapfile -t changed < <(git diff --name-only)
          [[ "${#changed[@]}" -eq 1 ]]
          [[ "${changed[0]}" == "frontend/components/lexigo-premium-app.tsx" ]]

      - name: Commit exact source patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/components/lexigo-premium-app.tsx
          git commit -m "refactor(frontend): remove Phrases compatibility route family"
          git push origin HEAD:refactor/issue-70-remove-phrases-compatibility
