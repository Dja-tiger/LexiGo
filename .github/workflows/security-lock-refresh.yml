name: Security lock refresh

on:
  push:
    branches:
      - fix/security-nanoid-postcss-audit

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Refresh frontend lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile refresh
        run: |
          set -Eeuo pipefail
          git diff --check
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(security): refresh patched frontend lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
