name: Refresh compact home baseline

on:
  push:
    branches:
      - agent/issue-63-compact-mobile-home
    paths:
      - .github/workflows/refresh-compact-home-baseline.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: refresh-compact-home-baseline
  cancel-in-progress: true

jobs:
  refresh:
    name: Commit verified compact baseline
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download visual diagnostics from CI run 1214
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "8537962268"
        run: |
          set -Eeuo pipefail
          artifact_dir="$RUNNER_TEMP/compact-home-baseline"
          artifact_zip="$RUNNER_TEMP/compact-home-baseline.zip"
          rm -rf -- "$artifact_dir" "$artifact_zip"
          mkdir -p "$artifact_dir"

          curl --fail --silent --show-error --location \
            --retry 3 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output "$artifact_zip"

          unzip -q "$artifact_zip" -d "$artifact_dir"
          printf 'BASELINE_ARTIFACT_DIR=%s\n' "$artifact_dir" >> "$GITHUB_ENV"

      - name: Validate and install deterministic full-page actual
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import os
          import shutil
          import struct
          import zlib
          from pathlib import Path

          artifact_dir = Path(os.environ["BASELINE_ARTIFACT_DIR"])
          candidates = sorted(
              artifact_dir.glob(
                  "test-results/visual-regression-critical-visual-baselines-home-visual-compact*/home-actual.png"
              )
          )
          if len(candidates) != 2:
              raise SystemExit(f"expected two deterministic actual screenshots, found {len(candidates)}")

          payloads = [candidate.read_bytes() for candidate in candidates]
          digests = [hashlib.sha256(payload).hexdigest() for payload in payloads]
          if len(set(digests)) != 1:
              raise SystemExit(f"retry screenshots differ: {digests}")
          if digests[0] != "3d07e4ab644605df560839ddf9c5a1d0f95848b59bdfca09e60328ed30b174e6":
              raise SystemExit(f"unexpected screenshot digest: {digests[0]}")

          payload = payloads[0]
          if payload[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("invalid PNG signature")

          cursor = 8
          ihdr = None
          compressed = bytearray()
          saw_iend = False
          while cursor < len(payload):
              if cursor + 12 > len(payload):
                  raise SystemExit("truncated PNG chunk")
              length = struct.unpack(">I", payload[cursor : cursor + 4])[0]
              chunk_type = payload[cursor + 4 : cursor + 8]
              data_start = cursor + 8
              data_end = data_start + length
              crc_end = data_end + 4
              if crc_end > len(payload):
                  raise SystemExit(f"truncated {chunk_type!r} chunk")
              chunk_data = payload[data_start:data_end]
              expected_crc = struct.unpack(">I", payload[data_end:crc_end])[0]
              actual_crc = zlib.crc32(chunk_type + chunk_data) & 0xFFFFFFFF
              if expected_crc != actual_crc:
                  raise SystemExit(f"CRC mismatch in {chunk_type!r}")
              if chunk_type == b"IHDR":
                  ihdr = struct.unpack(">IIBBBBB", chunk_data)
              elif chunk_type == b"IDAT":
                  compressed.extend(chunk_data)
              elif chunk_type == b"IEND":
                  saw_iend = True
                  if crc_end != len(payload):
                      raise SystemExit("unexpected bytes after IEND")
                  break
              cursor = crc_end

          if not saw_iend or ihdr is None:
              raise SystemExit("PNG is missing IHDR or IEND")
          width, height, bit_depth, color_type, compression, filtering, interlace = ihdr
          expected_ihdr = (390, 1665, 8, 2, 0, 0, 0)
          if ihdr != expected_ihdr:
              raise SystemExit(f"unexpected IHDR: {ihdr}, expected {expected_ihdr}")

          raw = zlib.decompress(bytes(compressed))
          channels = 3
          row_bytes = (width * channels * bit_depth + 7) // 8
          expected_size = height * (row_bytes + 1)
          if len(raw) != expected_size:
              raise SystemExit(f"unexpected decoded size: {len(raw)}, expected {expected_size}")
          invalid_filters = [row for row in range(height) if raw[row * (row_bytes + 1)] > 4]
          if invalid_filters:
              raise SystemExit(f"invalid PNG row filters at rows: {invalid_filters[:10]}")

          destination = Path(
              "frontend/e2e/visual-regression.spec.ts-snapshots/home-visual-compact-linux.png"
          )
          shutil.copyfile(candidates[0], destination)
          print(f"installed {destination} ({digests[0]})")
          PY

      - name: Commit baseline and remove one-shot workflow
        run: |
          set -Eeuo pipefail
          workflow_path=".github/workflows/refresh-compact-home-baseline.yml"
          baseline_path="frontend/e2e/visual-regression.spec.ts-snapshots/home-visual-compact-linux.png"

          rm -- "$workflow_path"
          git add -- "$baseline_path" "$workflow_path"
          git diff --cached --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(visual): regenerate compact home baseline"
          git push origin "HEAD:${GITHUB_REF_NAME}"
