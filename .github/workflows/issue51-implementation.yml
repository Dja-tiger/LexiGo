name: Issue 51 implementation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'fix/issue-51-reliable-speech'
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-51-reliable-speech
          fetch-depth: 0

      - name: Apply deterministic speech navigation test
        shell: bash
        run: |
          test -f scripts/issue51-e2e-fix.py
          python3 scripts/issue51-e2e-fix.py
          rm scripts/issue51-e2e-fix.py
          rm .github/workflows/issue51-implementation.yml
          git diff --check

          if git diff --quiet; then
            echo "Issue #51 e2e fix produced no diff" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(speech): use deterministic navigation locator"
          git push origin HEAD:fix/issue-51-reliable-speech
