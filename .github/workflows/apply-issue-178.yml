name: Apply issue 178 implementation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/issue-178-academic-technical-english'
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: false
      - name: Apply production code and tests
        shell: bash
        run: |
          if [ -f backend/integration/academic_technical_english_lesson_test.go ]; then
            echo "Issue 178 implementation is already present."
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old[:100]!r}")
              target.write_text(text.replace(old, new))

          replace_once(
              'backend/internal/learning/lesson_http.go',
              'case "mixed", "noun", "verb", "adjective", "phrases", "daily-life", "travel", "data-engineering", "backend":',
              'case "mixed", "noun", "verb", "adjective", "phrases", "daily-life", "travel", "data-engineering", "backend", "academic-technical-english":',
          )

          replace_once(
              'backend/internal/learning/lesson_composer.go',
              '\t"time"\n\n\t"github.com/jackc/pgx/v5"',
              '\t"time"\n\n\t"github.com/Dja-tiger/LexiGo/backend/internal/catalog"\n\t"github.com/jackc/pgx/v5"',
          )
          replace_once(
              'backend/internal/learning/lesson_composer.go',
              "\t\t      or ($2 = 'backend' and word.kind = 'word' and word.topic = 'Backend Development')\n",
              "\t\t      or ($2 = 'backend' and word.kind = 'word' and word.topic = 'Backend Development')\n\t\t      or ($2 = 'academic-technical-english' and word.kind = 'word' and word.source = $5)\n",
          )
          replace_once(
              'backend/internal/learning/lesson_composer.go',
              '\t`, userID, source, dueOnly, strings.TrimSpace(topic))',
              '\t`, userID, source, dueOnly, strings.TrimSpace(topic), catalog.Source)',
          )

          replace_once(
              'backend/internal/words/metadata.go',
              '\t"time"\n\n\t"github.com/jackc/pgx/v5"',
              '\t"time"\n\n\t"github.com/Dja-tiger/LexiGo/backend/internal/catalog"\n\t"github.com/jackc/pgx/v5"',
          )
          replace_once(
              'backend/internal/words/metadata.go',
              '\tDataEngineering int `json:"dataEngineering"`\n\tBackend         int `json:"backend"`',
              '\tDataEngineering        int `json:"dataEngineering"`\n\tBackend                int `json:"backend"`\n\tAcademicTechnicalEnglish int `json:"academicTechnicalEnglish"`',
          )
          replace_once(
              'backend/internal/words/metadata.go',
              "\t\t       count(*) filter (where kind = 'word' and topic = 'Backend Development')::int,\n\t\t       coalesce(max(updated_at), to_timestamp(0))",
              "\t\t       count(*) filter (where kind = 'word' and topic = 'Backend Development')::int,\n\t\t       count(*) filter (where kind = 'word' and source = $1)::int,\n\t\t       coalesce(max(updated_at), to_timestamp(0))",
          )
          replace_once(
              'backend/internal/words/metadata.go',
              '\t\t&metadata.Sources.Backend,\n\t\t&metadata.UpdatedAt,\n\t); err != nil {',
              '\t\t&metadata.Sources.Backend,\n\t\t&metadata.Sources.AcademicTechnicalEnglish,\n\t\t&metadata.UpdatedAt,\n\t); err != nil {',
          )
          replace_once(
              'backend/internal/words/metadata.go',
              '\t\t&metadata.UpdatedAt,\n\t); err != nil {',
              '\t\t&metadata.UpdatedAt,\n\t, catalog.Source); err != nil {',
          )
          replace_once(
              'backend/internal/words/metadata.go',
              '"%s|%d|%d|%d|%d|%d|%d|%d|%d|%d|%d",',
              '"%s|%d|%d|%d|%d|%d|%d|%d|%d|%d|%d|%d",',
          )
          replace_once(
              'backend/internal/words/metadata.go',
              '\t\tmetadata.Sources.Backend,\n\t)',
              '\t\tmetadata.Sources.Backend,\n\t\tmetadata.Sources.AcademicTechnicalEnglish,\n\t)',
          )

          replace_once(
              'backend/internal/learning/lesson_source_test.go',
              '\t\t"backend",\n',
              '\t\t"backend",\n\t\t"academic-technical-english",\n',
          )

          replace_once(
              'backend/internal/words/metadata_test.go',
              '\t\t\tDailyLife: 1, Travel: 1, DataEngineering: 1, Backend: 1,\n',
              '\t\t\tDailyLife: 1, Travel: 1, DataEngineering: 1, Backend: 1, AcademicTechnicalEnglish: 2,\n',
          )
          replace_once(
              'backend/internal/words/metadata_test.go',
              '\tchangedTopic := metadata\n',
              '\tchangedAcademic := metadata\n\tchangedAcademic.Sources.AcademicTechnicalEnglish++\n\tif catalogMetadataVersion(changedAcademic) == first {\n\t\tt.Fatal("catalog version did not change after academic source total changed")\n\t}\n\n\tchangedTopic := metadata\n',
          )

          replace_once(
              'backend/integration/catalog_metadata_test.go',
              '\tDataEngineering int `json:"dataEngineering"`\n\tBackend         int `json:"backend"`',
              '\tDataEngineering          int `json:"dataEngineering"`\n\tBackend                  int `json:"backend"`\n\tAcademicTechnicalEnglish int `json:"academicTechnicalEnglish"`',
          )
          replace_once(
              'backend/integration/catalog_metadata_test.go',
              "\t\t       count(*) filter (where kind = 'word' and topic = 'Backend Development')::int\n",
              "\t\t       count(*) filter (where kind = 'word' and topic = 'Backend Development')::int,\n\t\t       count(*) filter (where kind = 'word' and source = $1)::int\n",
          )
          replace_once(
              'backend/integration/catalog_metadata_test.go',
              '\t\t&expectedSources.Backend,\n\t); err != nil {',
              '\t\t&expectedSources.Backend,\n\t\t&expectedSources.AcademicTechnicalEnglish,\n\t, catalog.Source); err != nil {',
          )
          replace_once(
              'backend/integration/catalog_metadata_test.go',
              '\tif first.Totals.Words != catalog.ExpectedCount || first.Totals.Items != first.Totals.Words+first.Totals.Phrases {',
              '\tif first.Sources.AcademicTechnicalEnglish != catalog.ExpectedCount {\n\t\tt.Fatalf("academic source count = %d, want %d", first.Sources.AcademicTechnicalEnglish, catalog.ExpectedCount)\n\t}\n\tif first.Totals.Words != catalog.ExpectedCount || first.Totals.Items != first.Totals.Words+first.Totals.Phrases {',
          )

          replace_once(
              'frontend/lib/learning.ts',
              'export type WordCollection = "daily-life" | "travel" | "data-engineering" | "backend";',
              'export type WordCollection = "daily-life" | "travel" | "data-engineering" | "backend" | "academic-technical-english";',
          )
          replace_once(
              'frontend/lib/learning.ts',
              '  backend: "Backend Development",\n};',
              '  backend: "Backend Development",\n  "academic-technical-english": "academic-technical-english",\n};',
          )

          replace_once(
              'frontend/lib/catalog-metadata.ts',
              '  | "data-engineering"\n  | "backend";',
              '  | "data-engineering"\n  | "backend"\n  | "academic-technical-english";',
          )
          replace_once(
              'frontend/lib/catalog-metadata.ts',
              '    dataEngineering: number;\n    backend: number;',
              '    dataEngineering: number;\n    backend: number;\n    academicTechnicalEnglish: number;',
          )
          replace_once(
              'frontend/lib/catalog-metadata.ts',
              '  if (source === "data-engineering") return metadata.sources.dataEngineering;\n  return metadata.sources[source];',
              '  if (source === "data-engineering") return metadata.sources.dataEngineering;\n  if (source === "academic-technical-english") return metadata.sources.academicTechnicalEnglish;\n  return metadata.sources[source];',
          )
          replace_once(
              'frontend/lib/catalog-metadata.ts',
              '    "dataEngineering",\n    "backend",',
              '    "dataEngineering",\n    "backend",\n    "academicTechnicalEnglish",',
          )

          replace_once(
              'frontend/lib/account-resources.ts',
              '  "data-engineering",\n  "backend",',
              '  "data-engineering",\n  "backend",\n  "academic-technical-english",',
          )

          replace_once(
              'frontend/components/lexigo-premium-app.tsx',
              'type CollectionSource = Extract<WordSection, "daily-life" | "travel" | "data-engineering" | "backend">;',
              'type CollectionSource = Extract<WordSection, "daily-life" | "travel" | "data-engineering" | "backend" | "academic-technical-english">;',
          )
          replace_once(
              'frontend/components/lexigo-premium-app.tsx',
              '''  {
    source: "backend",
    label: "Backend-разработка",
    shortLabel: "Backend",
    description: "API, архитектура, базы данных, конкурентность и надёжность",
    symbol: "</>",
  },
];''',
              '''  {
    source: "backend",
    label: "Backend-разработка",
    shortLabel: "Backend",
    description: "API, архитектура, базы данных, конкурентность и надёжность",
    symbol: "</>",
  },
  {
    source: "academic-technical-english",
    label: "Academic Technical English",
    shortLabel: "Academic English",
    description: "Академическая техническая лексика для документации, исследований и инженерной коммуникации",
    symbol: "AC",
  },
];''',
          )

          replace_once(
              'frontend/lib/catalog-metadata.test.ts',
              'sources: { mixed: 923, noun: 383, verb: 179, adjective: 193, phrases: 124, dailyLife: 55, travel: 55, dataEngineering: 55, backend: 55 },',
              'sources: { mixed: 923, noun: 383, verb: 179, adjective: 193, phrases: 124, dailyLife: 55, travel: 55, dataEngineering: 55, backend: 55, academicTechnicalEnglish: 579 },',
          )
          replace_once(
              'frontend/lib/catalog-metadata.test.ts',
              '    expect(catalogSourceCount(metadata, "backend")).toBe(55);\n',
              '    expect(catalogSourceCount(metadata, "backend")).toBe(55);\n    expect(catalogSourceCount(metadata, "academic-technical-english")).toBe(579);\n',
          )

          replace_once(
              'frontend/lib/learning.test.ts',
              '  it("filters the four product collections by their catalog topic", () => {',
              '  it("filters all product collections by their catalog topic", () => {',
          )
          replace_once(
              'frontend/lib/learning.test.ts',
              '    expect(prepareWordItems(items, "backend").map((entry) => entry.id)).toEqual(["middleware"]);\n',
              '    expect(prepareWordItems(items, "backend").map((entry) => entry.id)).toEqual(["middleware"]);\n    expect(prepareWordItems(items, "academic-technical-english").map((entry) => entry.id)).toEqual(["academic"]);\n',
          )

          openapi = Path('api/openapi.yaml')
          text = openapi.read_text()
          marker = '    LessonCreateRequest:\n'
          if text.count(marker) != 1:
              raise SystemExit('OpenAPI LessonCreateRequest marker is not unique')
          lesson_source = '''    LessonSource:
      type: string
      description: Stable lesson-composer source identifier. Academic Technical English maps to the curated hakui-technical-english-2020 catalog source.
      enum: [mixed, noun, verb, adjective, phrases, daily-life, travel, data-engineering, backend, academic-technical-english]
'''
          text = text.replace(marker, lesson_source + marker)
          create_block = '''    LessonCreateRequest:
      type: object
      required: [source, studyMode, lessonSize]
      properties:
        source: { type: string }
'''
          create_replacement = '''    LessonCreateRequest:
      type: object
      required: [source, studyMode, lessonSize]
      properties:
        source:
          $ref: "#/components/schemas/LessonSource"
'''
          if text.count(create_block) != 1:
              raise SystemExit('OpenAPI create source block was not found')
          text = text.replace(create_block, create_replacement)
          preview_block = '''    LessonPreviewRequest:
      type: object
      required: [source, studyMode, lessonSize]
      properties:
        source: { type: string }
'''
          preview_replacement = '''    LessonPreviewRequest:
      type: object
      required: [source, studyMode, lessonSize]
      properties:
        source:
          $ref: "#/components/schemas/LessonSource"
'''
          if text.count(preview_block) != 1:
              raise SystemExit('OpenAPI preview source block was not found')
          text = text.replace(preview_block, preview_replacement)
          text = text.replace('        source: { type: string }\n        studyMode:', '        source:\n          $ref: "#/components/schemas/LessonSource"\n        studyMode:', 2)
          openapi.write_text(text)

          replace_once(
              'frontend/package.json',
              '"test:e2e:lesson": "playwright test e2e/lesson-flow.spec.ts e2e/next-lesson-progression.spec.ts e2e/offline-review-outbox.spec.ts e2e/review-outbox-auth-lifecycle.spec.ts",',
              '"test:e2e:lesson": "playwright test e2e/lesson-flow.spec.ts e2e/next-lesson-progression.spec.ts e2e/academic-technical-english.spec.ts e2e/offline-review-outbox.spec.ts e2e/review-outbox-auth-lifecycle.spec.ts",',
          )
          PY

          cat > backend/integration/academic_technical_english_lesson_test.go <<'EOF'
          //go:build integration

          package integration

          import (
          	"context"
          	"fmt"
          	"io"
          	"log/slog"
          	"net/http"
          	"net/http/httptest"
          	"testing"
          	"time"

          	"github.com/Dja-tiger/LexiGo/backend/internal/catalog"
          	"github.com/Dja-tiger/LexiGo/backend/internal/config"
          	"github.com/Dja-tiger/LexiGo/backend/internal/platform/migrate"
          	postgresplatform "github.com/Dja-tiger/LexiGo/backend/internal/platform/postgres"
          	redisplatform "github.com/Dja-tiger/LexiGo/backend/internal/platform/redis"
          	"github.com/Dja-tiger/LexiGo/backend/internal/server"
          )

          func TestAcademicTechnicalEnglishLessonUsesOnlyCuratedCatalogSource(t *testing.T) {
          	ctx, cancel := context.WithTimeout(context.Background(), 45*time.Second)
          	defer cancel()

          	pg, err := postgresplatform.Open(ctx, requiredEnv(t, "TEST_POSTGRES_DSN"))
          	if err != nil {
          		t.Fatal(err)
          	}
          	defer pg.Close()
          	if err := migrate.Up(ctx, pg); err != nil {
          		t.Fatalf("migrate.Up() error = %v", err)
          	}
          	if _, err := pg.Exec(ctx, "truncate table lesson_session_items, lesson_sessions, review_events, user_learning_preferences, user_words, refresh_tokens, words, users restart identity cascade"); err != nil {
          		t.Fatalf("truncate test data: %v", err)
          	}
          	if _, err := catalog.Seed(ctx, pg); err != nil {
          		t.Fatalf("catalog.Seed() error = %v", err)
          	}

          	rdb, err := redisplatform.Open(ctx, config.Redis{Addr: requiredEnv(t, "TEST_REDIS_ADDR")})
          	if err != nil {
          		t.Fatal(err)
          	}
          	defer rdb.Close()
          	if err := rdb.FlushDB(ctx).Err(); err != nil {
          		t.Fatalf("flush redis: %v", err)
          	}

          	cfg := config.Config{
          		AppEnv: "test", HTTPAddr: ":0", LogLevel: "error", CORSAllowedOrigin: "http://test.local",
          		PostgresDSN: requiredEnv(t, "TEST_POSTGRES_DSN"), Redis: config.Redis{Addr: requiredEnv(t, "TEST_REDIS_ADDR")},
          		JWTSecret: "integration-test-secret-with-at-least-32-bytes", AccessTokenTTL: 15 * time.Minute, RefreshTokenTTL: 24 * time.Hour,
          	}
          	app, err := server.New(cfg, slog.New(slog.NewTextHandler(io.Discard, nil)), pg, rdb)
          	if err != nil {
          		t.Fatalf("server.New() error = %v", err)
          	}
          	testServer := httptest.NewServer(app.Handler())
          	defer testServer.Close()

          	email := fmt.Sprintf("academic-lesson-%d@example.com", time.Now().UnixNano())
          	registered := postJSON[integrationAuthResponse](t, testServer.URL+"/api/v1/auth/register", map[string]string{
          		"email": email, "password": "strong-password", "displayName": "Academic Learner",
          	}, http.StatusCreated)

          	type previewPayload struct {
          		Source      string `json:"source"`
          		Composition struct {
          			Total          int `json:"total"`
          			AvailableWords int `json:"availableWords"`
          			Phrases        int `json:"phrases"`
          		} `json:"composition"`
          	}
          	request := map[string]any{"source": "academic-technical-english", "studyMode": "study", "lessonSize": "15"}
          	var preview previewPayload
          	postAuthenticatedJSON(t, testServer.URL+"/api/v1/lessons/preview", registered.Tokens.AccessToken, request, http.StatusOK, &preview)
          	if preview.Source != "academic-technical-english" || preview.Composition.Total != 15 || preview.Composition.AvailableWords != catalog.ExpectedCount || preview.Composition.Phrases != 0 {
          		t.Fatalf("unexpected academic preview: %+v", preview)
          	}

          	type lessonItem struct {
          		ID    int64  `json:"id"`
          		Kind  string `json:"kind"`
          		Topic string `json:"topic"`
          	}
          	var lesson struct {
          		ID     string       `json:"id"`
          		Source string       `json:"source"`
          		Items  []lessonItem `json:"items"`
          	}
          	postAuthenticatedJSON(t, testServer.URL+"/api/v1/lessons", registered.Tokens.AccessToken, request, http.StatusCreated, &lesson)
          	if lesson.ID == "" || lesson.Source != "academic-technical-english" || len(lesson.Items) != 15 {
          		t.Fatalf("unexpected academic lesson: %+v", lesson)
          	}
          	ids := make([]int64, 0, len(lesson.Items))
          	for _, item := range lesson.Items {
          		if item.Kind != "word" || item.Topic != catalog.Topic {
          			t.Fatalf("unexpected academic lesson item: %+v", item)
          		}
          		ids = append(ids, item.ID)
          	}
          	var matching int
          	if err := pg.QueryRow(ctx, "select count(*)::int from words where id = any($1::bigint[]) and source = $2", ids, catalog.Source).Scan(&matching); err != nil {
          		t.Fatalf("query academic lesson sources: %v", err)
          	}
          	if matching != len(ids) {
          		t.Fatalf("academic source matches = %d, want %d", matching, len(ids))
          	}
          }
          EOF

          cat > frontend/e2e/academic-technical-english.spec.ts <<'EOF'
          import { expect, test } from "@playwright/test";

          const SESSION = {
            user: { id: "00000000-0000-0000-0000-000000000178", email: "academic@example.com", displayName: "Academic Learner", createdAt: "2026-01-01T00:00:00Z" },
            tokens: { accessToken: "academic-token", tokenType: "Bearer", expiresIn: 900 },
          };
          const MODE = { attemptsToday: 0, successfulToday: 0, attemptsTotal: 0, successfulTotal: 0 };
          const PROGRESS = {
            dueNow: 0, dueWords: 0, duePhrases: 0, totalWords: 579, totalPhrases: 0, newWords: 579, learningWords: 0,
            reviewWords: 0, masteredWords: 0, masteredPhrases: 0, reviewsToday: 0, successfulToday: 0,
            objectiveReviewsToday: 0, objectiveSuccessfulToday: 0, reviewsTotal: 0, dailyGoal: 15, currentStreak: 0,
            longestStreak: 0, retainedItemsWeek: 0, retainedWordsWeek: 0, retainedPhrasesWeek: 0, eventSchemaVersion: 2,
            modes: { study: MODE, recall: MODE, choice: MODE, legacy: MODE },
          };
          const ITEMS = [
            { id: 701, kind: "word", position: 0, lemma: "abstract", translation: "абстрактный", phonetic: "", partOfSpeech: "adjective", topic: "academic-technical-english", examples: ["The model uses an abstract representation."], note: "", status: "new" },
            { id: 702, kind: "word", position: 0, lemma: "accurate", translation: "точный", phonetic: "", partOfSpeech: "adjective", topic: "academic-technical-english", examples: ["The estimate must be accurate."], note: "", status: "new" },
          ];

          test("Academic Technical English is selectable and preserved for the next block", async ({ page }) => {
            test.setTimeout(45_000);
            const createSources: string[] = [];
            const previewSources: string[] = [];
            await page.context().addCookies([{ name: "lexigo_csrf", value: "academic-csrf", url: "http://127.0.0.1:3000", sameSite: "Lax" }]);
            await page.route("**/api/v1/**", async (route) => {
              const request = route.request();
              const url = new URL(request.url());
              const path = url.pathname;
              if (path === "/api/v1/auth/refresh") return route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify(SESSION) });
              if (path === "/api/v1/progress") return route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify(PROGRESS) });
              if (path === "/api/v1/catalog/metadata") return route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify({
                catalogVersion: "sha256:academic", updatedAt: "2026-07-23T00:00:00Z",
                totals: { items: 579, words: 579, phrases: 0 },
                sources: { mixed: 579, noun: 200, verb: 120, adjective: 180, phrases: 0, dailyLife: 0, travel: 0, dataEngineering: 0, backend: 0, academicTechnicalEnglish: 579 },
                topics: [{ topic: "academic-technical-english", count: 579, words: 579, phrases: 0 }],
              }) });
              if (path === "/api/v1/words" || path === "/api/v1/words/due") return route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify({ items: ITEMS, count: ITEMS.length }) });
              if (path === "/api/v1/lessons/active") return route.fulfill({ status: 404, contentType: "application/json", body: JSON.stringify({ error: { code: "active_lesson_not_found", message: "none" } }) });
              if (path === "/api/v1/lessons/preview") {
                const body = request.postDataJSON() as { source: string; studyMode: string; lessonSize: string };
                previewSources.push(body.source);
                return route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify({ source: body.source, studyMode: body.studyMode, lessonSize: body.lessonSize, composition: { total: 1, words: 1, phrases: 0, due: 0, new: 1, scheduled: 0, availableWords: 579, availablePhrases: 0 } }) });
              }
              if (path === "/api/v1/lessons" && request.method() === "POST") {
                const body = request.postDataJSON() as { source: string };
                createSources.push(body.source);
                const index = Math.min(createSources.length - 1, ITEMS.length - 1);
                return route.fulfill({ status: 201, contentType: "application/json", body: JSON.stringify({ id: `00000000-0000-0000-0000-00000000018${index}`, source: body.source, studyMode: "study", lessonSize: "15", currentIndex: 0, version: 1, status: "active", items: [ITEMS[index]], createdAt: "2026-07-23T00:00:00Z", updatedAt: "2026-07-23T00:00:00Z" }) });
              }
              if (path.endsWith("/review")) return route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify({ wordId: 701, status: "learning", easiness: 2.5, intervalDays: 0, repetitions: 0, dueAt: "2026-07-24T00:00:00Z", lastReviewedAt: "2026-07-23T00:00:00Z", requestedRating: "known", effectiveRating: "known", judgementSource: "study", judgementReason: "passive_exposure", reviewEventId: 1, suggestionAvailable: false, lessonId: "00000000-0000-0000-0000-000000000180", lessonCurrentIndex: 1, lessonVersion: 2, lessonCompleted: true, lessonReviewedItems: 1, lessonSkippedItems: 0, lessonTotalItems: 1 }) });
              return route.fulfill({ status: 404, contentType: "application/json", body: JSON.stringify({ error: { code: "not_mocked", message: path } }) });
            });

            await page.goto("/learn");
            const academic = page.locator('[data-lexigo-source="academic-technical-english"]');
            await expect(academic).toContainText("Academic Technical English");
            await expect(academic).toContainText("579");
            await academic.click();
            await expect(academic).toHaveAttribute("aria-checked", "true");
