name: Fix Container Cache Export

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.head_ref == 'fix/issue-43-public-auth-recovery' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-43-public-auth-recovery
      - name: Keep image validation independent from optional cache export
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          old = '          cache-to: type=gha,mode=max,scope=${{ matrix.component }}\n'
          new = '          cache-to: type=gha,mode=max,scope=${{ matrix.component }},ignore-error=true\n'
          if text.count(old) != 1:
              raise SystemExit(f'cache exporter marker count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f \
            .github/workflows/debug-issue-43-web-build.yml \
            .github/workflows/fix-container-cache-export.yml
          git diff --check
      - name: Commit final CI reliability fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git add -u .github/workflows
          git commit -m "ci: ignore optional build cache export failures"
          git push origin HEAD:fix/issue-43-public-auth-recovery
