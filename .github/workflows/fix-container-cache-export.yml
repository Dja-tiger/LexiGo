name: Fix Container Cache Export

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.head_ref == 'fix/issue-43-public-auth-recovery' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-43-public-auth-recovery
      - name: Keep image validation independent from optional cache export
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          matches = [index for index, line in enumerate(lines) if line.strip().startswith('cache-to: type=gha,mode=max,scope=')]
          if len(matches) != 1:
              raise SystemExit(f'cache exporter marker count: {len(matches)}')
          index = matches[0]
          if 'ignore-error=true' not in lines[index]:
              lines[index] = lines[index].rstrip('\n') + ',ignore-error=true\n'
          path.write_text(''.join(lines), encoding='utf-8')
          PY
          rm -f \
            .github/workflows/debug-issue-43-web-build.yml \
            .github/workflows/fix-container-cache-export.yml
          git diff --check
      - name: Commit final CI reliability fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git add -u .github/workflows
          git commit -m "ci: ignore optional build cache export failures"
          git push origin HEAD:fix/issue-43-public-auth-recovery
