name: Normalize Generated Files

on:
  pull_request:

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Normalize Go sources and dependencies
        working-directory: backend
        run: |
          go mod tidy
          gofmt -w .
      - name: Generate deterministic npm lock file
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated files
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet && test -f backend/go.sum && test -f frontend/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend frontend
          git commit -m "chore: normalize generated files"
          git push origin "HEAD:$HEAD_BRANCH"
