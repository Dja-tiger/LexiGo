name: Verify Issue 66 Shared Copy Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/issue-66-shared-copy-test-fix.yml
      - scripts/apply_issue_66_shared_copy_test_fix.py

concurrency:
  group: issue-66-shared-copy-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 35
    env:
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.61.1-noble
      FRONTEND_CI_VOLUME: lexigo-issue-66-test-fix-${{ github.run_id }}-${{ github.run_attempt }}
      FRONTEND_CI_SLOT: issue-66-test-fix
      APP_BUILD_ID: ${{ github.sha }}
      NEXT_PUBLIC_RUM_SAMPLE_RATE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/issue-66-core-interface-copy

      - name: Apply guarded test transformation
        run: python3 scripts/apply_issue_66_shared_copy_test_fix.py

      - name: Prepare isolated frontend workspace
        run: bash scripts/ci/frontend-container.sh prepare

      - name: Install locked dependencies
        run: cd frontend && bash ../scripts/ci/frontend-container.sh exec npm ci --no-audit --no-fund

      - name: Lint
        run: cd frontend && bash ../scripts/ci/frontend-container.sh exec npm run lint

      - name: Type check
        run: cd frontend && bash ../scripts/ci/frontend-container.sh exec npm run typecheck

      - name: Unit tests
        run: cd frontend && bash ../scripts/ci/frontend-container.sh exec npm run test

      - name: Production build
        run: cd frontend && bash ../scripts/ci/frontend-container.sh exec npm run build

      - id: focused-browser
        name: Focused browser regression tests
        run: |
          cd frontend
          bash ../scripts/ci/frontend-container.sh shell <<'CONTAINER_SCRIPT'
          set -o pipefail
          npx playwright test \
            e2e/accessibility-keyboard.spec.ts \
            e2e/mobile-home-priority.spec.ts \
            --project=desktop-chromium \
            --project=desktop-webkit \
            --reporter=line 2>&1 | tee issue-66-focused-browser.log
          CONTAINER_SCRIPT

      - name: Extract focused browser diagnostics
        if: failure() && steps.focused-browser.outcome == 'failure'
        run: cd frontend && bash ../scripts/ci/frontend-container.sh extract

      - name: Upload focused browser diagnostics
        if: failure() && steps.focused-browser.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: issue-66-shared-copy-browser-${{ github.sha }}
          path: frontend/ci-artifacts
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup isolated frontend workspace
        if: always()
        run: bash scripts/ci/frontend-container.sh cleanup

      - name: Verify focused diff
        run: |
          set -Eeuo pipefail
          rm -rf frontend/ci-artifacts
          git diff --check
          changed="$(git status --short | awk '{print $2}')"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(frontend/e2e/accessibility-keyboard\.spec\.ts|frontend/e2e/mobile-home-priority\.spec\.ts|scripts/apply_issue_66_shared_copy_test_fix\.py|\.github/workflows/issue-66-shared-copy-test-fix\.yml)$' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected changed files:\n%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Commit verified test fix
        run: |
          set -Eeuo pipefail
          rm -f \
            scripts/apply_issue_66_shared_copy_test_fix.py \
            .github/workflows/issue-66-shared-copy-test-fix.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(frontend): align browser contracts with shared copy"
          git push origin HEAD:agent/issue-66-core-interface-copy
