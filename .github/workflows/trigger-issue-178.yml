name: Trigger issue 178 implementation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  trigger:
    if: github.event.pull_request.head.ref == 'agent/issue-178-academic-technical-english'
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: false
      - name: Execute prepared implementation
        shell: bash
        run: |
          if [ -f backend/integration/academic_technical_english_lesson_test.go ]; then
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path

          lines = Path('.github/workflows/apply-issue-178.yml').read_text().splitlines()
          start = next(index for index, line in enumerate(lines) if line == '        run: |') + 1
          Path('/tmp/apply-issue-178.sh').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:]) + '\n')
          PY
          bash -euo pipefail /tmp/apply-issue-178.sh
