name: Clean Issue 39 Browser Artifacts

on:
  pull_request:

permissions:
  contents: write

jobs:
  clean:
    if: ${{ github.head_ref == 'fix/issue-39-lesson-concurrency' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-39-lesson-concurrency
          fetch-depth: 0
      - name: Remove generated browser artifacts
        run: |
          git fetch origin main
          git checkout origin/main -- frontend/next-env.d.ts frontend/tsconfig.json
          rm -rf frontend/playwright-report frontend/test-results
          rm -f frontend/tsconfig.tsbuildinfo
          rm -f scripts/fix_issue_39_playwright_locator.py
          rm -f .github/workflows/fix-issue-39-playwright.yml
          git diff --check
      - name: Commit clean product diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "[issue-39-cleanup] remove browser artifacts"
          git push origin HEAD:fix/issue-39-lesson-concurrency
