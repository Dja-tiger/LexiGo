name: Fix Issue 39 Playwright Locator

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.head_ref == 'fix/issue-39-lesson-concurrency' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-39-lesson-concurrency
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply deterministic locator fix
        run: |
          if grep -Fq '.lx-error[role="alert"]' frontend/e2e/lesson-flow.spec.ts; then
            echo "Issue 39 Playwright locator fix is already applied"
          else
            python scripts/fix_issue_39_playwright_locator.py
          fi
          git diff --check
      - name: Verify lesson browser matrix
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
          npm run test:e2e:lesson
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: issue-39-playwright-diagnostics
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: error
          retention-days: 7
      - name: Commit locator fix
        run: |
          if git diff --quiet; then
            echo "No locator changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "[issue-39-playwright] scope stale-device alert locator"
          git push origin HEAD:fix/issue-39-lesson-concurrency
