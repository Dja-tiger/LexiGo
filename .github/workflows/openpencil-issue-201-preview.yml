                  if resume: c.append(frm('Resume note',24,586,342,64,p['mint'],[txt('Resume copy','Прогресс сохранён. Продолжите с текущего термина.',14,17,314,34,12,600,p['muted'])],14))
                  return mobile_root(name,p,c)
              inner=[txt('Counter','5 из 12' if resume else '1 из 12',32,28,656,18,12,700,p['success']),txt('Term',word,32,64,656,38,28,700,p['text']),txt('Context',context,32,114,656,46,15,400,p['muted'])]
              if reveal:
                  inner += [rect('Divider',32,178,656,1,p['border'],0),txt('Translation','эволюция схемы',32,202,656,30,20,700,p['text']),txt('Selected','Вы отметили: Не уверен',32,246,656,18,12,700,p['success']),choice('Не уверен',32,286,656,p,True),btn('Продолжить',32,356,656,p,True)]
              else:
                  inner += [choice('Знаю',32,190,204,p,False),choice('Не уверен',258,190,204,p,resume),choice('Новое',484,190,204,p,False)]
                  if resume: inner.append(frm('Resume note',32,260,656,74,p['mint'],[txt('Resume copy','Прогресс сохранён: 4 ответа. Этот термин — следующий.',18,20,620,34,13,600,p['muted'])],14))
                  inner += [btn('Сохранить отметку',32,360,656,p,True),txt('Skip','Пропустить диагностику',32,430,656,18,13,600,p['muted'],'center')]
              title='Продолжим диагностику' if resume else ('Перевод открыт после отметки' if reveal else 'Что уже знакомо?')
              return desktop_root(name,p,desktop_shell(p,title,'ШАГ 2 ИЗ 3','До выбора ответ скрыт. Диагностика не оценивает вас как экзамен.',inner))

          def message_screen(form,p,theme,kind):
              specs={
                'Skip Confirm':('Пропустить диагностику?','Вы сможете начать обучение сразу. Пропуск не меняет scheduler и не блокирует дальнейшие уроки.','Продолжить без диагностики','Вернуться к диагностике'),
                'Skipped':('Диагностика пропущена','Настройка сохранена. Первый урок будет собран без диагностических отметок.','Перейти к первому уроку',None),
                'Complete':('Персональная очередь готова','Мы учли рабочий контекст и ваши отметки. Начните с короткой практики — настройки можно изменить позже.','Начать первый урок',None),
                'Error':('Не удалось продолжить','Текущий выбор сохранён. Повторите запрос — диагностическая позиция не потеряется.','Повторить','Вернуться назад')}
              title,body,primary,secondary=specs[kind]
              name=f'First Use / {kind} / {form} / {theme}'
              if form=='Mobile':
                  icon='✓' if kind in ('Skipped','Complete') else ('!' if kind=='Error' else '→')
                  c=[status(p),brand(p),frm('State icon',151,160,88,88,p['subtle'],[txt('Icon',icon,0,24,88,42,32,700,p['success'] if kind in ('Skipped','Complete') else p['danger'] if kind=='Error' else p['primary'],'center')],99),txt('Title',title,24,282,342,70,28,700,p['text'],'center'),txt('Body',body,36,366,318,82,14,400,p['muted'],'center')]
                  if kind=='Complete': c.append(frm('Queue note',24,476,342,92,p['mint'],[txt('Queue label','ГОТОВО',16,14,310,16,12,700,p['success']),txt('Queue body','Стартовая очередь собрана без fake progress.',16,40,310,34,13,400,p['muted'])],16))
                  c.append(btn(primary,24,610,342,p,True))
                  if secondary: c.append(btn(secondary,24,674,342,p,False))
                  return mobile_root(name,p,c)
              inner=[frm('State icon',300,36,88,88,p['subtle'],[txt('Icon','✓' if kind in ('Skipped','Complete') else ('!' if kind=='Error' else '→'),0,24,88,42,32,700,p['success'] if kind in ('Skipped','Complete') else p['danger'] if kind=='Error' else p['primary'],'center')],99),txt('State title',title,60,148,600,44,28,700,p['text'],'center'),txt('State body',body,80,210,560,70,15,400,p['muted'],'center'),btn(primary,80,330,560,p,True)]
              if secondary: inner.append(btn(secondary,80,394,560,p,False))
              if kind=='Complete': inner.append(frm('Queue note',80,470,560,58,p['mint'],[txt('Queue copy','Очередь подготовлена; реальные progress cards появятся после практики.',16,17,528,30,12,600,p['muted'],'center')],14))
              return desktop_root(name,p,desktop_shell(p,title,'FIRST USE','Состояние связано напрямую с серверным onboarding contract.',inner))

          def loading(form,p,theme):
              name=f'First Use / Loading / {form} / {theme}'
              if form=='Mobile':
                  c=[status(p),brand(p),txt('Title','Подготавливаем диагностику',24,146,342,70,28,700,p['text']),txt('Body','Загружаем текущую позицию и сохраняем безопасный resume.',24,228,342,52,14,400,p['muted'])]
                  y=330
                  for w in [342,286,318,250]: c.append(rect('Skeleton',24,y,w,18,p['subtle'],99)); y+=42
                  c.append(frm('Loading note',24,542,342,90,p['mint'],[txt('Loading copy','Никакие ответы не раскрываются во время загрузки.',16,22,310,48,13,600,p['muted'])],16))
                  return mobile_root(name,p,c)
              inner=[]; y=64
              for w in [620,540,656,470,590]: inner.append(rect('Skeleton',32,y,w,18,p['subtle'],99)); y+=50
              inner.append(frm('Loading note',32,348,656,74,p['mint'],[txt('Loading copy','Восстанавливаем текущую позицию без раскрытия будущих ответов.',18,20,620,34,13,600,p['muted'])],14))
              return desktop_root(name,p,desktop_shell(p,'Подготавливаем диагностику','ЗАГРУЗКА','Восстанавливаем first-use state и текущую диагностическую позицию.',inner))

          # Page 17 is the production destination.
          pages_text,pages,_=tool('list_pages'); plist=pages['pages']; idx=next(i for i,v in enumerate(plist) if v.get('id')==PAGE); tool('set_active_page',{'index':idx})

          # Existing canonical Mobile/Light role frame remains the source; add explicit skip on the disposable copy.
          existing='fig_4282'
          tool('insert_node',{'parent':existing,'pageId':PAGE,'data':json.dumps(txt('Skip','Пропустить настройку',24,772,342,18,13,600,LIGHT['muted'],'center'),ensure_ascii=False)})

          variants=[]
          states=[('Guest Home',guest),('Diagnostic Pre-reveal',lambda f,p,t: diagnostic(f,p,t,False,False)),('Diagnostic Reveal',lambda f,p,t: diagnostic(f,p,t,True,False)),('Diagnostic Resume',lambda f,p,t: diagnostic(f,p,t,False,True)),('Skip Confirm',lambda f,p,t: message_screen(f,p,t,'Skip Confirm')),('Skipped',lambda f,p,t: message_screen(f,p,t,'Skipped')),('Complete',lambda f,p,t: message_screen(f,p,t,'Complete')),('Loading',loading),('Error',lambda f,p,t: message_screen(f,p,t,'Error'))]
          for form in ('Mobile','Desktop'):
              for theme,pal in (('Light',LIGHT),('Dark',DARK)):
                  if not (form=='Mobile' and theme=='Light'):
                      variants.append(role(form,pal,theme))
                  for _,builder in states:
                      variants.append(builder(form,pal,theme))

          # Place roots on an explicit page grid without overlapping accepted source frames.
          m=0; d=0
          expected=[]
          for tree in variants:
              is_mobile=tree['width']==390
              if is_mobile:
                  tree['x']=48+(m%4)*430; tree['y']=2200+(m//4)*900; m+=1
              else:
                  tree['x']=48+(d%2)*1480; tree['y']=7200+(d//2)*960; d+=1
              expected.append(tree['name'])
              tool('insert_node',{'parent':'0','pageId':PAGE,'data':json.dumps(tree,ensure_ascii=False,separators=(',',':'))})

          # Read back exact IDs and render every canonical state.
          found={'First Use / Onboarding Role / Mobile / Light':{'nodeId':existing,'existing':True}}
          names=['First Use / Onboarding Role / Mobile / Light']+expected
          for name in names:
              if name.endswith('Onboarding Role / Mobile / Light'):
                  node_id=existing
              else:
                  text,_,err=tool('find_node_by_name',{'name':name},allow=True)
                  if err: raise AssertionError(f'cannot resolve {name}: {text}')
                  ids=re.findall(r'(?:fig_|node_|n)[A-Za-z0-9_-]+',text)
                  if not ids: raise AssertionError(f'no id for {name}: {text}')
                  node_id=ids[0]
              _,shot,_=tool('get_screenshot',{'nodeId':node_id})
              if not isinstance(shot,dict) or not shot.get('image_base64'): raise AssertionError(f'no screenshot for {name}')
              png=base64.b64decode(shot['image_base64'])
              slug=re.sub(r'[^a-z0-9]+','-',name.lower()).strip('-')
              (OUT/f'{slug}.png').write_bytes(png)
              tree_text,_,_=tool('read_nodes',{'nodeIds':[node_id],'depth':2})
              (OUT/f'{slug}.txt').write_text(tree_text,encoding='utf-8')
              found[name]={'nodeId':node_id,'sha256':hashlib.sha256(png).hexdigest(),'existing':node_id==existing}

          generated=Path(os.environ['OPENPENCIL_WORKTREE'])/'design/openpencil/LexiGo Design System.op'
          manifest={'pageId':PAGE,'sourceSha256':'5380a0468d4e369d91ac190b829e01f60ff43493f6a76c9300c6b58d0b34d664','generatedSha256':hashlib.sha256(generated.read_bytes()).hexdigest(),'canonicalCount':len(found),'nodes':found,'themeDecision':{'Light':LIGHT,'Dark':DARK}}
          (OUT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'generated.op').write_bytes(generated.read_bytes())
          print(json.dumps({'canonicalCount':len(found),'generatedSha256':manifest['generatedSha256']},indent=2))
          if len(found)!=40: raise AssertionError(f'expected 40 canonical states, got {len(found)}')
          PY

      - name: Prove repository source stayed untouched
        run: |
          set -Eeuo pipefail
          test "$(sha256sum 'design/openpencil/LexiGo Design System.op' | awk '{print $1}')" = 5380a0468d4e369d91ac190b829e01f60ff43493f6a76c9300c6b58d0b34d664
          test -z "$(git status --porcelain -- 'design/openpencil/LexiGo Design System.op')"

      - name: Upload preview evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openpencil-issue-201-preview-${{ github.sha }}
          path: .tmp/openpencil-issue-201-preview/
          if-no-files-found: warn
          retention-days: 3

      - name: Cleanup disposable runtime
        if: always()
        run: |
          set +e
          docker compose -p "$OPENPENCIL_COMPOSE_PROJECT" -f deploy/openpencil/compose.yml --profile agent down --volumes --remove-orphans
          rm -rf "$OPENPENCIL_WORKTREE" "$OPENPENCIL_STATE_DIR" "$OPENPENCIL_BACKUP_DIR"
