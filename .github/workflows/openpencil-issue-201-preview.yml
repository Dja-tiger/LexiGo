                  c.append(frm('Diagnostic card',24,304,342,242 if reveal else 150,p['surface'],card_children,18,p['border']))
                  if not reveal:
                      y=478
                      for l in ['Знаю','Не уверен','Новое']: c.append(choice(l,24,y,342,p,resume and l=='Не уверен')); y+=58
                      c += [txt('Skip','Пропустить диагностику',24,670,342,18,13,600,p['muted'],'center'),btn('Сохранить отметку',24,704,342,p,True)]
                  else:
