                  c=[status(p),brand(p),txt('Step','2 из 3',306,68,60,16,12,500,p['muted'],'right'),*progress(p,2,3,24,106,342),txt('Diagnostic counter','5 из 12' if resume else '1 из 12',24,142,342,18,12,700,p['success']),txt('Title','Продолжим диагностику' if resume else 'Что уже знакомо?',24,174,342,44,28,700,p['text']),txt('Rule','Сначала отметьте знакомство. Перевод появится только после выбора.',24,228,342,52,14,400,p['muted'])]
                  card_children=[txt('Term',word,18,20,306,34,24,700,p['text']),txt('Context',context,18,70,306,58,14,400,p['muted'])]
