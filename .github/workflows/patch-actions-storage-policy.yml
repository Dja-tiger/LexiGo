name: Patch Actions storage policy

on:
  push:
    branches:
      - fix/actions-storage-policy
    paths:
      - ".github/workflows/patch-actions-storage-policy.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/actions-storage-policy

      - name: Apply bounded Actions storage policy
        run: python3 scripts/ci/patch_actions_storage_policy.py

      - name: Validate generated policy
        run: |
          python3 scripts/ci/actions_storage_policy_test.py
          python3 scripts/ci/actions_storage_cleanup_test.py
          git diff --check

      - name: Commit generated changes
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "ci: enforce bounded Actions storage policy"
          git push origin HEAD:fix/actions-storage-policy
