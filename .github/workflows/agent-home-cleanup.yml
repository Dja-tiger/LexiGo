name: Temporary Home compatibility cleanup

on:
  push:
    branches:
      - refactor/issue-70-remove-home-compatibility
    paths:
      - .github/workflows/agent-home-cleanup.yml

permissions:
  contents: write

concurrency:
  group: agent-home-cleanup
  cancel-in-progress: false

jobs:
  patch:
    name: Apply asserted Home cleanup patch
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/issue-70-remove-home-compatibility
          fetch-depth: 0

      - name: Apply exact source replacements
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("frontend/components/lexigo-premium-app.tsx")
          source = path.read_text(encoding="utf-8")

          exact_replacements = {
              "  russianPlural,\n": "",
              "  goalPercent,\n": "",
              'const RETAINED_COPY = learningTermCopy("retained");\n': "",
              '''const WORD_PREVIEW = {
            prompt: "incident",
            phonetic: "/ˈɪnsɪdənt/",
            answer: "инцидент, происшествие",
            example: "We need to identify the cause of the incident.",
          };
          ''': "",
          }

          for old, new in exact_replacements.items():
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one occurrence of {old!r}, found {count}")
              source = source.replace(old, new, 1)

          home_start = "  function renderHome() {\n"
          next_function = "  function selectLessonSource(nextSource: LessonSource) {\n"
          if source.count(home_start) != 1 or source.count(next_function) != 1:
              raise SystemExit("Home function boundary markers are not unique")
          start = source.index(home_start)
          end = source.index(next_function, start)
          source = source[:start] + source[end:]

          old_dispatch = '''  const view = navigation.view === "home" ? renderHome()
            : navigation.view === "learn" ? renderLearn()
              : navigation.view === "library" ? renderLibrary()
                : navigation.view === "profile" ? renderProfile()
                  : renderLesson();
          '''
          new_dispatch = '''  const view = navigation.view === "learn" ? renderLearn()
            : navigation.view === "library" ? renderLibrary()
              : navigation.view === "profile" ? renderProfile()
                : renderLesson();
          '''
          if source.count(old_dispatch) != 1:
              raise SystemExit("compatibility dispatch marker is missing or non-unique")
          source = source.replace(old_dispatch, new_dispatch, 1)

          absent = [
              "function renderHome()",
              'navigation.view === "home" ? renderHome()',
              'className="lx-home-next-action"',
              'className="lx-home-paths"',
              "WORD_PREVIEW",
              "goalPercent",
              "russianPlural",
              "RETAINED_COPY",
          ]
          preserved = [
              "function renderResumeStrip()",
              "function renderLearn()",
              "function renderLibrary()",
              "function renderProfile()",
              "function renderLesson()",
              "loadProgressResource",
              "resumeLesson",
              "startLesson",
              "requestAuthentication",
              'const [navigation, setNavigation] = useState<NavigationTarget>({ view: "home" })',
              'navigate({ view: "home" })',
          ]
          for marker in absent:
              if marker in source:
                  raise SystemExit(f"retired Home marker remains: {marker}")
          for marker in preserved:
              if marker not in source:
                  raise SystemExit(f"shared compatibility marker was lost: {marker}")

          path.write_text(source, encoding="utf-8")
          PY

          rm -- .github/workflows/agent-home-cleanup.yml

          git diff --check
          git diff --exit-code -- .agents/current/TASK.md >/dev/null || true
          test ! -e .github/workflows/agent-home-cleanup.yml
          ! grep -Fq 'function renderHome()' frontend/components/lexigo-premium-app.tsx
          ! grep -Fq 'navigation.view === "home" ? renderHome()' frontend/components/lexigo-premium-app.tsx
          grep -Fq 'function renderLearn()' frontend/components/lexigo-premium-app.tsx
          grep -Fq 'function renderLesson()' frontend/components/lexigo-premium-app.tsx

      - name: Commit bounded patch and self-removal
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/components/lexigo-premium-app.tsx .github/workflows/agent-home-cleanup.yml
          git commit -m "refactor(frontend): remove legacy Home presentation"
          git push origin HEAD:refactor/issue-70-remove-home-compatibility
