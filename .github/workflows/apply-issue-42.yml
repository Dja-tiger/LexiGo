name: Apply Issue 42

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.head_ref == 'fix/issue-42-session-hydration' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-42-session-hydration
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply deterministic product patch
        run: |
          set -o pipefail
          {
            python3 scripts/apply_issue_42.py
            python3 scripts/finalize_issue_42_product.py
            git diff --check
          } 2>&1 | tee issue42.log
      - name: Verify frontend contracts
        working-directory: frontend
        run: |
          set -o pipefail
          {
            npm ci --no-audit --no-fund
            npm run lint
            npm run typecheck
            npm test
            npm run build
          } 2>&1 | tee -a ../issue42.log
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: issue-42-apply-diagnostics
          path: issue42.log
      - name: Commit product diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(session): isolate account hydration failures"
          git push origin HEAD:fix/issue-42-session-hydration
