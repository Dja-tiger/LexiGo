name: Issue 59 gofmt

on:
  push:
    branches: [agent/issue-59-performance-budgets]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/issue-59-performance-budgets
      - name: Apply gofmt
        run: |
          set -Eeuo pipefail
          gofmt -w \
            backend/internal/httpx/json.go \
            backend/internal/performance/*.go \
            backend/internal/server/server.go \
            backend/integration/performance_rum_test.go
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "style(go): format performance implementation"
          git push origin HEAD:agent/issue-59-performance-budgets
