name: Deployment scripts check

on:
  pull_request:
    paths:
      - ".github/workflows/deploy-stage.yml"
      - ".github/workflows/deploy-prod.yml"
      - ".github/workflows/deploy-scripts-check.yml"
      - "deploy/Caddyfile"
      - "deploy/caddy/Dockerfile"
      - "deploy/compose/docker-compose.stage.yml"
      - "deploy/compose/docker-compose.prod.yml"
      - "deploy/certificate-health.sh"
      - "deploy/systemd/**"
      - "scripts/ci/deploy-over-ssh.sh"
      - "scripts/ci/public-smoke.sh"
      - "scripts/ci/public-smoke.test.sh"
      - "scripts/remote-deploy.sh"
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-stage.yml"
      - ".github/workflows/deploy-prod.yml"
      - ".github/workflows/deploy-scripts-check.yml"
      - "deploy/Caddyfile"
      - "deploy/caddy/Dockerfile"
      - "deploy/compose/docker-compose.stage.yml"
      - "deploy/compose/docker-compose.prod.yml"
      - "deploy/certificate-health.sh"
      - "deploy/systemd/**"
      - "scripts/ci/deploy-over-ssh.sh"
      - "scripts/ci/public-smoke.sh"
      - "scripts/ci/public-smoke.test.sh"
      - "scripts/remote-deploy.sh"

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Bash syntax
        run: |
          bash -n scripts/ci/deploy-over-ssh.sh
          bash -n scripts/ci/public-smoke.sh
          bash -n scripts/ci/public-smoke.test.sh
          bash -n scripts/remote-deploy.sh
          bash -n deploy/certificate-health.sh

      - name: Test public endpoint smoke checks
        run: bash scripts/ci/public-smoke.test.sh

      - name: Validate deployment security and readiness invariants
        run: |
          set -Eeuo pipefail

          grep -Fq 'CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}' .github/workflows/deploy-stage.yml
          grep -Fq 'CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}' .github/workflows/deploy-prod.yml
          grep -Fq 'API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}' .github/workflows/deploy-stage.yml
          grep -Fq 'API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}' .github/workflows/deploy-prod.yml
          grep -Fq 'ACME_EMAIL: ${{ vars.ACME_EMAIL }}' .github/workflows/deploy-stage.yml
          grep -Fq 'ACME_EMAIL: ${{ vars.ACME_EMAIL }}' .github/workflows/deploy-prod.yml

          grep -Fq 'SESSION_COOKIE_SECURE=true' scripts/remote-deploy.sh
          grep -Fq 'upsert_env "$APP_ENV_FILE" SESSION_COOKIE_SECURE "true"' scripts/remote-deploy.sh
          grep -Fq 'deploy/env/stage.caddy.env' scripts/remote-deploy.sh
          grep -Fq 'deploy/env/prod.caddy.env' scripts/remote-deploy.sh
          grep -Fq 'install -m 0600 "$CADDY_ENV_TEMP" "$CADDY_ENV_FILE"' scripts/remote-deploy.sh
          grep -Fq 'printf '\''%s\n%s\n'\'' "$GHCR_TOKEN" "$CLOUDFLARE_API_TOKEN"' scripts/ci/deploy-over-ssh.sh

          grep -Fq 'PREVIOUS_IMAGE_TAG=' scripts/remote-deploy.sh
          grep -Fq 'rollback_to_previous_image()' scripts/remote-deploy.sh
          grep -Fq 'upsert_env "$APP_ENV_FILE" IMAGE_TAG "$PREVIOUS_IMAGE_TAG"' scripts/remote-deploy.sh
          grep -Fq 'if ! wait_for_readiness; then' scripts/remote-deploy.sh
          grep -Fq 'previous image $PREVIOUS_IMAGE_TAG was restored' scripts/remote-deploy.sh

          grep -Fq 'check_frontend_endpoint()' scripts/remote-deploy.sh
          grep -Fq '"https://$SITE_HOST/?lexigo_readiness=$REQUESTED_IMAGE_TAG"' scripts/remote-deploy.sh
          grep -Fq "grep -Fq 'LexiGo'" scripts/remote-deploy.sh
          grep -Fq 'check_api_endpoint()' scripts/remote-deploy.sh
          grep -Fq 'print_http_diagnostic "frontend root"' scripts/remote-deploy.sh

          grep -Fq 'name: Verify public stage endpoints' .github/workflows/deploy-stage.yml
          grep -Fq 'name: Verify public production endpoints' .github/workflows/deploy-prod.yml
          grep -Fq 'bash scripts/ci/public-smoke.sh "$PUBLIC_URL" "$API_PUBLIC_URL"' .github/workflows/deploy-stage.yml
          grep -Fq 'bash scripts/ci/public-smoke.sh "$PUBLIC_URL" "$API_PUBLIC_URL"' .github/workflows/deploy-prod.yml
          grep -Fq 'PUBLIC_SMOKE_OUTCOME: ${{ steps.public_smoke.outcome }}' .github/workflows/deploy-stage.yml
          grep -Fq 'PUBLIC_SMOKE_OUTCOME: ${{ steps.public_smoke.outcome }}' .github/workflows/deploy-prod.yml

          if grep -R --line-number -E 'CLOUDFLARE_API_TOKEN=[A-Za-z0-9_-]+' deploy scripts .github --exclude='deploy-scripts-check.yml'; then
            echo 'A Cloudflare token-like value must never be committed.' >&2
            exit 1
          fi

      - name: Validate Compose rendering
        run: |
          set -Eeuo pipefail
          trap 'rm -f deploy/env/stage.env deploy/env/prod.env deploy/env/stage.caddy.env deploy/env/prod.caddy.env' EXIT
          mkdir -p deploy/env

          for environment in stage prod; do
            cat > "deploy/env/${environment}.env" <<EOF
          APP_ENV=${environment}
          IMAGE_TAG=test
          POSTGRES_DB=lexigo_${environment}
          POSTGRES_USER=lexigo_${environment}
          POSTGRES_PASSWORD=test-password
          POSTGRES_DSN=postgres://lexigo_${environment}:test-password@postgres:5432/lexigo_${environment}?sslmode=disable
          REDIS_PASSWORD=test-password
          EOF
            cat > "deploy/env/${environment}.caddy.env" <<EOF
          CADDY_SITE_ADDRESS=lexigo-${environment}.example.com
          CADDY_API_ADDRESS=api.lexigo-${environment}.example.com
          ACME_EMAIL=operations@example.com
          CLOUDFLARE_API_TOKEN=test-token
          EOF
          done

          docker compose --env-file deploy/env/stage.env -f deploy/compose/docker-compose.stage.yml config >/dev/null
          docker compose --env-file deploy/env/prod.env -f deploy/compose/docker-compose.prod.yml config >/dev/null

      - name: Build custom Caddy
        run: |
          set -Eeuo pipefail
          set -o pipefail
          docker build --progress=plain \
            -t lexigo-caddy:2.11.4-cloudflare \
            -f deploy/caddy/Dockerfile \
            deploy \
            2>&1 | tee caddy-build.log

      - name: Verify Cloudflare DNS module
        run: |
          docker run --rm --entrypoint caddy lexigo-caddy:2.11.4-cloudflare list-modules \
            | tee caddy-modules.log \
            | grep -Fxq 'dns.providers.cloudflare'

      - name: Validate Caddyfile
        run: |
          docker run --rm \
            -e CADDY_SITE_ADDRESS=lexigo.example.com \
            -e CADDY_API_ADDRESS=api.lexigo.example.com \
            -e ACME_EMAIL=operations@example.com \
            -e CLOUDFLARE_API_TOKEN=test-token \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            --entrypoint caddy \
            lexigo-caddy:2.11.4-cloudflare \
            validate --config /etc/caddy/Caddyfile --adapter caddyfile \
            2>&1 | tee caddy-validate.log

      - name: Validate systemd units
        run: |
          set -Eeuo pipefail
          if command -v systemd-analyze >/dev/null 2>&1; then
            unit_dir="$(mktemp -d)"
            trap 'rm -rf -- "$unit_dir"' EXIT
            install -m 0755 deploy/certificate-health.sh "$unit_dir/lexigo-certificate-health"
            sed \
              "s#/usr/local/sbin/lexigo-certificate-health#$unit_dir/lexigo-certificate-health#" \
              deploy/systemd/lexigo-certificate-health@.service \
              > "$unit_dir/lexigo-certificate-health@.service"
            cp deploy/systemd/lexigo-certificate-health@.timer "$unit_dir/lexigo-certificate-health@.timer"
            systemd-analyze verify \
              "$unit_dir/lexigo-certificate-health@.service" \
              "$unit_dir/lexigo-certificate-health@.timer"
          fi

      - name: Upload Caddy diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: caddy-deployment-diagnostics
          path: |
            caddy-build.log
            caddy-modules.log
            caddy-validate.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup Caddy test image
        if: always()
        run: docker image rm -f lexigo-caddy:2.11.4-cloudflare >/dev/null 2>&1 || true
