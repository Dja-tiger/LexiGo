name: Issue 50 patch bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/issue-50-adaptive-navigation'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/issue-50-adaptive-navigation
          fetch-depth: 0

      - name: Execute prepared patch and remove bootstrap workflows
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/issue50-apply.yml').read_text().splitlines()
          marker = '        run: |'
          start = workflow.index(marker) + 1
          script_lines = []
          for line in workflow[start:]:
              if line.startswith('          '):
                  script_lines.append(line[10:])
              elif not line.strip():
                  script_lines.append('')
              else:
                  raise SystemExit(f'unexpected workflow indentation: {line!r}')

          script = '\n'.join(script_lines) + '\n'
          script = script.replace(
              'rm .github/workflows/issue50-apply.yml',
              'rm .github/workflows/issue50-apply.yml .github/workflows/issue50-kick.yml',
          )
          script = script.replace(
              'git add frontend/components/lexigo-premium-app.tsx .github/workflows/issue50-apply.yml',
              'git add frontend/components/lexigo-premium-app.tsx .github/workflows/issue50-apply.yml .github/workflows/issue50-kick.yml',
          )
          Path('/tmp/issue50-apply.sh').write_text(script)
          PY
          bash /tmp/issue50-apply.sh
