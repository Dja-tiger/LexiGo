name: Apply Issue 40 Composer

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'fix/issue-40-mixed-lesson-composer' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-40-mixed-lesson-composer
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply product patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/issue40_apply.py")
          source = path.read_text(encoding="utf-8")
          old = "source = source.replace(marker, handler + marker)"
          new = "source = source.replace(marker, handler + marker, 1)"
          if source.count(old) != 1:
              raise SystemExit(f"expected one preview insertion expression, found {source.count(old)}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          set -o pipefail
          {
            python scripts/issue40_apply.py
            python - <<'PY'
          from pathlib import Path
          path = Path("frontend/components/lexigo-premium-app.tsx")
          source = path.read_text(encoding="utf-8")

          guard_start = source.find('    if (!session || navigation.view !== "learn" || studyMode === "all") {')
          guard_end = source.find("    let cancelled = false;", guard_start)
          if guard_start < 0 or guard_end < 0:
              raise SystemExit("preview guard markers not found")
          source = source[:guard_start] + '    if (!session || navigation.view !== "learn" || studyMode === "all") return;\n' + source[guard_end:]

          preview_start = source.find('      }).then((result) => {', guard_start)
          preview_end = source.find('      }).catch(() => {', preview_start)
          if preview_start < 0 or preview_end < 0:
              raise SystemExit("preview promise markers not found")
          preview_block = source[preview_start:preview_end]
          old_session = "        setSession(result.activeSession);"
          new_session = "        setSession((current) => current?.tokens.accessToken === result.activeSession.tokens.accessToken ? current : result.activeSession);"
          if preview_block.count(old_session) != 1:
              raise SystemExit(f"preview session updates: {preview_block.count(old_session)}")
          preview_block = preview_block.replace(old_session, new_session, 1)
          source = source[:preview_start] + preview_block + source[preview_end:]

          helper_start = source.find("  function resolveSelectedPhrases")
          helper_end = source.find("  async function startLesson", helper_start)
          if helper_start < 0 or helper_end < 0:
              raise SystemExit("resolveSelectedPhrases block not found")
          source = source[:helper_start] + source[helper_end:]
          path.write_text(source, encoding="utf-8")
          PY
          } 2>&1 | tee issue40-patch.log
      - name: Upload patch diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: issue40-patch-diagnostics
          path: issue40-patch.log
          if-no-files-found: error
      - name: Format and verify backend
        working-directory: backend
        run: |
          gofmt -w internal/learning/lesson.go internal/learning/lesson_composer.go internal/learning/lesson_composer_test.go internal/learning/lesson_http.go internal/learning/lesson_repository.go internal/server/server.go integration/mixed_lesson_composer_test.go
          go test ./...
      - name: Verify frontend
        id: frontend
        working-directory: frontend
        run: |
          set -o pipefail
          {
            npm ci --no-audit --no-fund
            npm run lint
            npm run typecheck
            npm test
            npm run build
          } 2>&1 | tee ../issue40-frontend.log
      - name: Upload frontend diagnostics
        if: steps.frontend.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: issue40-frontend-diagnostics
          path: issue40-frontend.log
          if-no-files-found: error
      - name: Verify diff
        run: |
          git diff --check
          git status --short
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            api/openapi.yaml \
            backend/internal/learning/lesson.go \
            backend/internal/learning/lesson_composer.go \
            backend/internal/learning/lesson_composer_test.go \
            backend/internal/learning/lesson_http.go \
            backend/internal/learning/lesson_repository.go \
            backend/internal/server/server.go \
            backend/integration/mixed_lesson_composer_test.go \
            docs/lesson-composer.md \
            docs/issue-40-design.md \
            frontend/app/premium-ui.css \
            frontend/components/lexigo-premium-app.tsx \
            frontend/e2e/lesson-flow.spec.ts \
            frontend/e2e/ui-ownership.spec.ts \
            frontend/e2e/dictionary-pwa.spec.ts \
            frontend/lib/lesson-composition.ts \
            frontend/lib/lesson-composition.test.ts
          git commit -m "fix(lesson): compose mixed word and phrase sessions"
          git push origin HEAD:fix/issue-40-mixed-lesson-composer
