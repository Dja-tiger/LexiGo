name: Issue 54 repair controller

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

concurrency:
  group: issue-54-repair-controller
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.issue.number == 54 &&
      github.event.comment.body == '/run-issue-54-repair'
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/issue-54-catalog-pagination
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply bounded catalog fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              content = target.read_text(encoding="utf-8")
              matches = content.count(old)
              if matches != 1:
                  raise SystemExit(f"{path}: expected one match, found {matches}: {old[:120]!r}")
              target.write_text(content.replace(old, new, 1), encoding="utf-8")

          app = "frontend/components/lexigo-premium-app.tsx"
          replace_once(app, dedent("""\
            prepareWordItems,
            takeLessonBlock,
          """), "")
          replace_once(app, dedent("""\
            const lessonAdvanceRef = useRef<HTMLButtonElement | null>(null);
            const phraseListScrollRef = useRef<NavigationScrollPosition>({ x: 0, y: 0 });
          """), dedent("""\
            const lessonAdvanceRef = useRef<HTMLButtonElement | null>(null);
          """))
          replace_once(app, dedent("""\
                setProgress(null);
                setActiveLesson(null);
                setPhraseCatalog(DEFAULT_PHRASE_CATALOG);
                void Promise.all([
          """), dedent("""\
                setProgress(null);
                setActiveLesson(null);
                setPhraseCatalog([]);
                setPhraseCatalogPageInfo(paginateCatalogEntries(DEFAULT_PHRASE_CATALOG, 1).info);
                setPhrasePage(1);
                setPhraseCatalogStatus(idleResourceStatus());
                void Promise.all([
          """))
          replace_once(app, "      let currentSession = activeSession;\n", "      const currentSession = activeSession;\n")
          replace_once(app, dedent("""\
            function openPhraseDetail(phrase: LearningItem) {
              phraseListScrollRef.current = { x: window.scrollX, y: window.scrollY };
              navigate({ view: "phrases", detail: itemKey(phrase) });
            }

            function backToPhraseCatalog() {
              navigate({ view: "phrases" }, true, { scroll: phraseListScrollRef.current });
            }
          """), dedent("""\
            function openPhraseDetail(phrase: LearningItem) {
              navigate({ view: "phrases", detail: itemKey(phrase) });
            }

            function backToPhraseCatalog() {
              const destination = navigationTabs.destination("phrases");
              navigate({ view: "phrases" }, true, { scroll: destination.scroll });
            }
          """))

          e2e = "frontend/e2e/catalog-pagination.spec.ts"
          replace_once(e2e, dedent("""\
            const requestedLimits: number[] = [];
            await installAPI(context, requestedLimits);
            const errors = captureErrors(page);
          """), dedent("""\
            const requestedLimits: number[] = [];
            await context.addInitScript(() => {
              const updateMaximum = () => {
                const current = document.querySelectorAll(".lx-phrase-grid [role=listitem]").length;
                const previous = Number(document.documentElement.dataset.lexigoMaxCatalogItems ?? "0");
                document.documentElement.dataset.lexigoMaxCatalogItems = String(Math.max(previous, current));
              };
              new MutationObserver(updateMaximum).observe(document, { childList: true, subtree: true });
            });
            await installAPI(context, requestedLimits);
            const errors = captureErrors(page);
          """))
          replace_once(e2e, dedent("""\
            expect(requestedLimits.length).toBeGreaterThan(0);
            expect(requestedLimits.every((limit) => limit <= 48)).toBe(true);
          """), dedent("""\
            expect(requestedLimits.length).toBeGreaterThan(0);
            expect(requestedLimits.every((limit) => limit <= 48)).toBe(true);
            expect(await page.evaluate(() => Number(document.documentElement.dataset.lexigoMaxCatalogItems ?? "0"))).toBeLessThanOrEqual(48);
          """))

          replace_once("frontend/app/catalog-pagination.css", dedent("""\
            .lx-phrase-grid > [role="listitem"] {
              display: contents;
            }
          """), dedent("""\
            .lx-phrase-grid > [role="listitem"] {
              min-width: 0;
            }

            .lx-phrase-grid > [role="listitem"] > button {
              width: 100%;
              height: 100%;
            }
          """))

          fixture = "backend/integration/catalog_pagination_test.go"
          replace_once(
              fixture,
              "\t\tinsert into words (lemma, translation, part_of_speech, topic, examples, note, source, kind, slug)\n",
              "\t\tinsert into words (lemma, translation, part_of_speech, topic, examples, note, source, kind, slug, cloze, cloze_answer)\n",
          )
          replace_once(
              fixture,
              "\t\t       format('page-phrase-%s', lpad(series::text, 3, '0'))\n\t\tfrom generate_series(1, 125) as series\n",
              "\t\t       format('page-phrase-%s', lpad(series::text, 3, '0')),\n\t\t       format('page phrase _____ %s', lpad(series::text, 3, '0')),\n\t\t       'test'\n\t\tfrom generate_series(1, 125) as series\n",
          )

          package_path = Path("frontend/package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          package["scripts"]["lint"] = "eslint ."
          package["scripts"]["test:e2e:lesson"] = "playwright test e2e/lesson-flow.spec.ts e2e/offline-review-outbox.spec.ts e2e/review-outbox-auth-lifecycle.spec.ts"
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          gofmt -w backend/integration/catalog_pagination_test.go
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git rm -f .github/workflows/issue-54-pr-apply.yml

      - name: Verify backend
        working-directory: backend
        run: |
          go test ./...
          go test -run '^$' -tags=integration ./integration

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm run test

      - name: Publish feature repair
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "LexiGo CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            backend/integration/catalog_pagination_test.go \
            frontend/app/catalog-pagination.css \
            frontend/components/lexigo-premium-app.tsx \
            frontend/e2e/catalog-pagination.spec.ts \
            frontend/package.json
          git diff --cached --check
          git commit -m "fix(catalog): satisfy bounded rendering gates"
          git push origin HEAD:agent/issue-54-catalog-pagination
