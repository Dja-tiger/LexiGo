name: Temporary cancel stale PR 145 run

on:
  pull_request:
    branches:
      - main

permissions:
  actions: write
  contents: write

jobs:
  cancel-stale-run:
    if: github.head_ref == 'codex/issue-65-reduced-motion'
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 10
    env:
      FEATURE_BRANCH: codex/issue-65-reduced-motion
      STALE_RUN_ID: '29887017292'
    steps:
      - name: Force-cancel stale workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          status="$({
            curl --silent --show-error --location \
              --output /tmp/cancel-response.json \
              --write-out '%{http_code}' \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${STALE_RUN_ID}/force-cancel"
          })"
          if [ "$status" != '202' ] && [ "$status" != '409' ]; then
            cat /tmp/cancel-response.json
            exit 1
          fi

      - name: Clone branch and remove temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          workdir="${RUNNER_TEMP}/lexigo-cancel-stale-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$workdir"
          git clone \
            --branch "$FEATURE_BRANCH" \
            --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$workdir"
          cd "$workdir"
          rm .github/workflows/temp-force-cancel-stale-pr145-run.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/temp-force-cancel-stale-pr145-run.yml
          git diff --cached --check
          git commit -m 'ci: remove stale PR 145 run cancellation workflow'
          git push origin "HEAD:${FEATURE_BRANCH}"
          rm -rf "$workdir"
