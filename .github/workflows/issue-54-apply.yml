name: Apply Issue 54 implementation

on:
  push:
    branches: [agent/issue-54-catalog-pagination]
    paths: [.github/workflows/issue-54-apply.yml]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'apply issue 54 implementation')
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/issue-54-catalog-pagination
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: backend/go.sum
      - name: Apply implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          def write(path: str, content: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {text.count(old)} for {old[:80]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_between(path: str, start: str, end: str, replacement: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              start_index = text.find(start)
              if start_index < 0:
                  raise SystemExit(f"{path}: start marker not found: {start!r}")
              end_index = text.find(end, start_index)
              if end_index < 0:
                  raise SystemExit(f"{path}: end marker not found: {end!r}")
              target.write_text(text[:start_index] + replacement + text[end_index:], encoding="utf-8")

          write("backend/internal/words/repository.go", r'''package words

import (
	"context"
	"encoding/json"
	"fmt"

	"github.com/jackc/pgx/v5"
	"github.com/jackc/pgx/v5/pgxpool"
)

const catalogListFilter = `
		from user_words uw
		join words w on w.id = uw.word_id
		where uw.user_id = $1::uuid
		  and ($2 = '' or w.kind = $2)
		  and (not $3 or uw.due_at <= now())
		  and (
		      $4 = ''
		      or $4 = 'mixed'
		      or ($4 = 'phrases' and w.kind = 'phrase')
		      or ($4 = 'noun' and w.kind = 'word' and lower(w.part_of_speech) = 'noun')
		      or ($4 = 'verb' and w.kind = 'word' and lower(w.part_of_speech) = 'verb')
		      or ($4 = 'adjective' and w.kind = 'word' and lower(w.part_of_speech) = 'adjective')
		      or ($4 = 'daily-life' and w.kind = 'word' and w.topic = 'Daily Life')
		      or ($4 = 'travel' and w.kind = 'word' and w.topic = 'Travel')
		      or ($4 = 'data-engineering' and w.kind = 'word' and w.topic = 'Data Engineering')
		      or ($4 = 'backend' and w.kind = 'word' and w.topic = 'Backend Development')
		  )
		  and ($5 = '' or w.topic = $5)
		  and (
		      $6 = ''
		      or lower(w.lemma) like ('%' || lower($6) || '%')
		      or lower(w.translation) like ('%' || lower($6) || '%')
		      or lower(w.topic) like ('%' || lower($6) || '%')
		  )
`

type Repository struct{ pool *pgxpool.Pool }

func NewRepository(pool *pgxpool.Pool) *Repository { return &Repository{pool: pool} }

type ListOptions struct {
	Page   int
	Limit  int
	Kind   string
	Source string
	Topic  string
	Query  string
	Sort   string
}

type Page struct {
	Items       []UserWord `json:"items"`
	Count       int        `json:"count"`
	Total       int        `json:"total"`
	Page        int        `json:"page"`
	PageSize    int        `json:"pageSize"`
	TotalPages  int        `json:"totalPages"`
	HasPrevious bool       `json:"hasPrevious"`
	HasNext     bool       `json:"hasNext"`
}

func (r *Repository) ListPage(ctx context.Context, userID string, options ListOptions) (Page, error) {
	return r.listPage(ctx, userID, options, false)
}

func (r *Repository) ListDuePage(ctx context.Context, userID string, options ListOptions) (Page, error) {
	return r.listPage(ctx, userID, options, true)
}

func (r *Repository) listPage(ctx context.Context, userID string, options ListOptions, dueOnly bool) (Page, error) {
	if options.Page <= 0 {
		options.Page = 1
	}
	if options.Limit <= 0 {
		options.Limit = 30
	}
	if options.Limit > 100 {
		options.Limit = 100
	}
	if options.Sort == "" {
		options.Sort = "default"
	}

	tx, err := r.pool.BeginTx(ctx, pgx.TxOptions{IsoLevel: pgx.RepeatableRead, AccessMode: pgx.ReadOnly})
	if err != nil {
		return Page{}, fmt.Errorf("begin catalog page snapshot: %w", err)
	}
	defer func() { _ = tx.Rollback(ctx) }()

	args := []any{userID, options.Kind, dueOnly, options.Source, options.Topic, options.Query}
	var total int
	if err := tx.QueryRow(ctx, "select count(*)::int "+catalogListFilter, args...).Scan(&total); err != nil {
		return Page{}, fmt.Errorf("count learning items: %w", err)
	}

	totalPages := 0
	if total > 0 {
		totalPages = (total + options.Limit - 1) / options.Limit
		if options.Page > totalPages {
			options.Page = totalPages
		}
	} else {
		options.Page = 1
	}
	offset := (options.Page - 1) * options.Limit

	rows, err := tx.Query(ctx, `
		select w.id, w.kind, coalesce(w.slug, ''), w.lemma, w.translation, w.phonetic,
		       w.part_of_speech, w.topic, w.examples, w.note, w.cloze, w.cloze_answer,
		       uw.status, uw.easiness::float8, uw.interval_days, uw.repetitions,
		       uw.due_at, uw.last_reviewed_at
	`+catalogListFilter+`
		order by
		  case when $7 = 'az' then lower(w.lemma) end asc,
		  case when $7 = 'za' then lower(w.lemma) end desc,
		  case when $7 = 'default' and $3 then uw.due_at end asc,
		  case when $7 = 'default' then w.topic end asc,
		  w.id asc
		limit $8 offset $9
	`, userID, options.Kind, dueOnly, options.Source, options.Topic, options.Query, options.Sort, options.Limit, offset)
	if err != nil {
		return Page{}, fmt.Errorf("query learning items page: %w", err)
	}
	defer rows.Close()

	items := make([]UserWord, 0, options.Limit)
	for rows.Next() {
		var item UserWord
		var examples []byte
		if err := rows.Scan(
			&item.ID, &item.Kind, &item.Slug, &item.Lemma, &item.Translation, &item.Phonetic,
			&item.PartOfSpeech, &item.Topic, &examples, &item.Note, &item.Cloze, &item.ClozeAnswer,
			&item.Status, &item.Easiness, &item.IntervalDays, &item.Repetitions,
			&item.DueAt, &item.LastReviewedAt,
		); err != nil {
			return Page{}, fmt.Errorf("scan learning item: %w", err)
		}
		if err := json.Unmarshal(examples, &item.Examples); err != nil {
			return Page{}, fmt.Errorf("decode examples: %w", err)
		}
		items = append(items, item)
	}
	if err := rows.Err(); err != nil {
		return Page{}, fmt.Errorf("iterate learning items: %w", err)
	}
	if err := tx.Commit(ctx); err != nil {
		return Page{}, fmt.Errorf("commit catalog page snapshot: %w", err)
	}

	return Page{
		Items:       items,
		Count:       len(items),
		Total:       total,
		Page:        options.Page,
		PageSize:    options.Limit,
		TotalPages:  totalPages,
		HasPrevious: options.Page > 1,
		HasNext:     totalPages > 0 && options.Page < totalPages,
	}, nil
}
''')

          write("backend/internal/words/http.go", r'''package words

import (
	"net/http"
	"strconv"
	"strings"

	"github.com/Dja-tiger/New-project/backend/internal/httpx"
)

const maxCatalogFilterLength = 120

type Handler struct{ repository *Repository }

func NewHandler(repository *Repository) *Handler { return &Handler{repository: repository} }

func (h *Handler) All(w http.ResponseWriter, r *http.Request) {
	h.list(w, r, false)
}

func (h *Handler) Due(w http.ResponseWriter, r *http.Request) {
	h.list(w, r, true)
}

func (h *Handler) list(w http.ResponseWriter, r *http.Request, dueOnly bool) {
	userID, ok := httpx.UserID(r.Context())
	if !ok {
		httpx.WriteError(w, http.StatusUnauthorized, "unauthorized", "authorization context is missing")
		return
	}

	queryValues := r.URL.Query()
	page, ok := positiveQueryInteger(queryValues.Get("page"), 1, 1_000_000)
	if !ok {
		httpx.WriteError(w, http.StatusUnprocessableEntity, "invalid_page", "page must be a positive integer")
		return
	}
	limit, ok := positiveQueryInteger(queryValues.Get("limit"), 30, 100)
	if !ok {
		httpx.WriteError(w, http.StatusUnprocessableEntity, "invalid_limit", "limit must be between 1 and 100")
		return
	}

	kind := strings.TrimSpace(queryValues.Get("kind"))
	if kind == "" {
		kind = "word"
	}
	if kind != "word" && kind != "phrase" && kind != "all" {
		httpx.WriteError(w, http.StatusUnprocessableEntity, "invalid_kind", "kind must be word, phrase or all")
		return
	}
	if kind == "all" {
		kind = ""
	}

	source := strings.TrimSpace(queryValues.Get("source"))
	if !validCatalogSource(source) {
		httpx.WriteError(w, http.StatusUnprocessableEntity, "invalid_source", "source must be a supported catalog section")
		return
	}
	topic := strings.TrimSpace(queryValues.Get("topic"))
	search := strings.TrimSpace(queryValues.Get("query"))
	if search == "" {
		search = strings.TrimSpace(queryValues.Get("q"))
	}
	if len(topic) > maxCatalogFilterLength || len(search) > maxCatalogFilterLength {
		httpx.WriteError(w, http.StatusUnprocessableEntity, "invalid_catalog_filter", "topic and query must contain at most 120 characters")
		return
	}
	sortMode := strings.TrimSpace(queryValues.Get("sort"))
	if sortMode == "" {
		sortMode = "default"
	}
	if sortMode != "default" && sortMode != "az" && sortMode != "za" {
		httpx.WriteError(w, http.StatusUnprocessableEntity, "invalid_sort", "sort must be default, az or za")
		return
	}

	options := ListOptions{
		Page: page, Limit: limit, Kind: kind, Source: source,
		Topic: topic, Query: search, Sort: sortMode,
	}
	var result Page
	var err error
	if dueOnly {
		result, err = h.repository.ListDuePage(r.Context(), userID, options)
	} else {
		result, err = h.repository.ListPage(r.Context(), userID, options)
	}
	if err != nil {
		httpx.WriteError(w, http.StatusInternalServerError, "internal_error", "internal server error")
		return
	}
	httpx.WriteJSON(w, http.StatusOK, result)
}

func positiveQueryInteger(raw string, defaultValue, maximum int) (int, bool) {
	if strings.TrimSpace(raw) == "" {
		return defaultValue, true
	}
	value, err := strconv.Atoi(raw)
	if err != nil || value <= 0 || value > maximum {
		return 0, false
	}
	return value, true
}

func validCatalogSource(value string) bool {
	switch value {
	case "", "mixed", "noun", "verb", "adjective", "phrases", "daily-life", "travel", "data-engineering", "backend":
		return true
	default:
		return false
	}
}
''')

