name: Apply issue 177 implementation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/issue-177-next-lesson-progression'
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply code and tests
        shell: bash
        run: |
          if [ -f backend/internal/learning/lesson_progression.go ]; then
            echo "Issue 177 implementation is already present."
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('frontend/components/lexigo-premium-app.tsx')
          app = app_path.read_text()
          replacements = [
              (
                  '  const reviewInFlightRef = useRef(false);\n',
                  '  const reviewInFlightRef = useRef(false);\n  const lessonCreateInFlightRef = useRef(false);\n',
              ),
              (
                  '  async function startLesson(activeSession = session, overrides: StartOverrides = {}) {\n',
                  '  async function startLesson(activeSession = session, overrides: StartOverrides = {}) {\n    if (lessonCreateInFlightRef.current) return;\n',
              ),
              (
                  '    setBusy(true);\n    setError("");\n    setLessonQueueNotice("");\n    try {\n      const currentSession = activeSession;\n',
                  '    lessonCreateInFlightRef.current = true;\n    setBusy(true);\n    setError("");\n    setLessonQueueNotice("");\n    try {\n      const currentSession = activeSession;\n',
              ),
              (
                  '    } finally {\n      setBusy(false);\n    }\n  }\n  function clearAuthFieldError(field: AuthField) {\n',
                  '    } finally {\n      lessonCreateInFlightRef.current = false;\n      setBusy(false);\n    }\n  }\n  function clearAuthFieldError(field: AuthField) {\n',
              ),
          ]
          for old, new in replacements:
              if app.count(old) != 1:
                  raise SystemExit(f'frontend replacement count for {old[:60]!r}: {app.count(old)}')
              app = app.replace(old, new)
          app_path.write_text(app)

          http_path = Path('backend/internal/learning/lesson_http.go')
          http = http_path.read_text()
          old = 'lesson, err := h.repository.CreateLesson(r.Context(), userID, request)'
          new = 'lesson, err := h.repository.CreateProgressiveLesson(r.Context(), userID, request)'
          if http.count(old) != 1:
              raise SystemExit(f'lesson handler replacement count: {http.count(old)}')
          http_path.write_text(http.replace(old, new))

          composer_path = Path('backend/internal/learning/lesson_composer.go')
          composer = composer_path.read_text()
          old = '''\tdueOnly := studyMode == AnswerModeRecall || studyMode == AnswerModeChoice
\trows, err := tx.Query(ctx, `
'''
          new = '''\texcludedWordIDs, err := recentCompletedLessonWordIDs(ctx, tx, userID, source, studyMode)
\tif err != nil {
\t\treturn nil, err
\t}
\tdueOnly := studyMode == AnswerModeRecall || studyMode == AnswerModeChoice
\trows, err := tx.Query(ctx, `
'''
          if composer.count(old) != 1:
              raise SystemExit('composer query insertion point was not found')
          composer = composer.replace(old, new)
          old = '''\tif err := rows.Err(); err != nil {
\t\treturn nil, fmt.Errorf("iterate lesson candidates: %w", err)
\t}
\treturn candidates, nil
}

func composeLessonCandidates'''
          new = '''\tif err := rows.Err(); err != nil {
\t\treturn nil, fmt.Errorf("iterate lesson candidates: %w", err)
\t}
\treturn excludeLessonCandidates(candidates, excludedWordIDs), nil
}

const immediateLessonContinuationWindow = 30 * time.Minute

func recentCompletedLessonWordIDs(
\tctx context.Context,
\ttx pgx.Tx,
\tuserID string,
\tsource string,
\tstudyMode AnswerMode,
) (map[int64]struct{}, error) {
\trows, err := tx.Query(ctx, `
\t\twith latest_completed as (
\t\t\tselect id
\t\t\tfrom lesson_sessions
\t\t\twhere user_id = $1::uuid
\t\t\t  and status = 'completed'
\t\t\t  and source = $2
\t\t\t  and study_mode = $3
\t\t\t  and completed_at >= now() - ($4::bigint * interval '1 second')
\t\t\torder by completed_at desc, id desc
\t\t\tlimit 1
\t\t)
\t\tselect item.word_id
\t\tfrom latest_completed completed
\t\tjoin lesson_session_items item on item.session_id = completed.id
\t`, userID, source, studyMode, int64(immediateLessonContinuationWindow/time.Second))
\tif err != nil {
\t\treturn nil, fmt.Errorf("query recent completed lesson items: %w", err)
\t}
\tdefer rows.Close()

\texcluded := make(map[int64]struct{})
\tfor rows.Next() {
\t\tvar wordID int64
\t\tif err := rows.Scan(&wordID); err != nil {
\t\t\treturn nil, fmt.Errorf("scan recent completed lesson item: %w", err)
\t\t}
\t\texcluded[wordID] = struct{}{}
\t}
\tif err := rows.Err(); err != nil {
\t\treturn nil, fmt.Errorf("iterate recent completed lesson items: %w", err)
\t}
\treturn excluded, nil
}

func excludeLessonCandidates(candidates []lessonCandidate, excluded map[int64]struct{}) []lessonCandidate {
\tif len(excluded) == 0 {
\t\treturn candidates
\t}
\tfiltered := make([]lessonCandidate, 0, len(candidates))
\tfor _, candidate := range candidates {
\t\tif _, found := excluded[candidate.WordID]; found {
\t\t\tcontinue
\t\t}
\t\tfiltered = append(filtered, candidate)
\t}
\treturn filtered
}

func composeLessonCandidates'''
          if composer.count(old) != 1:
              raise SystemExit('composer helper insertion point was not found')
          composer_path.write_text(composer.replace(old, new))

          test_path = Path('backend/internal/learning/lesson_composer_test.go')
          tests = test_path.read_text()
          tests += r'''

func TestExcludeLessonCandidatesPreservesQueueOrderAndMetadata(t *testing.T) {
	now := time.Date(2026, 7, 23, 9, 0, 0, 0, time.UTC)
	candidates := []lessonCandidate{
		{WordID: 10, Kind: "word", Status: "learning", DueAt: now, Due: true},
		{WordID: 11, Kind: "phrase", Status: "new", DueAt: now.Add(time.Hour)},
		{WordID: 12, Kind: "word", Status: "review", DueAt: now.Add(2 * time.Hour)},
	}

	filtered := excludeLessonCandidates(candidates, map[int64]struct{}{10: {}, 12: {}})
	if len(filtered) != 1 {
		t.Fatalf("filtered candidates = %d, want 1", len(filtered))
	}
	if !reflect.DeepEqual(filtered[0], candidates[1]) {
		t.Fatalf("filtered candidate = %+v, want %+v", filtered[0], candidates[1])
	}
}

func TestExcludeLessonCandidatesWithoutPreviousLessonReturnsOriginalQueue(t *testing.T) {
	candidates := []lessonCandidate{{WordID: 1}, {WordID: 2}}
	filtered := excludeLessonCandidates(candidates, nil)
	if len(filtered) != 2 || &filtered[0] != &candidates[0] {
		t.Fatal("queue without exclusions should be returned unchanged")
	}
}
'''
          test_path.write_text(tests)
          PY

          cat > backend/internal/learning/lesson_progression.go <<'EOF'
          package learning

          import (
          	"context"
          	"errors"
          	"fmt"
          	"strings"
          	"time"

          	"github.com/jackc/pgx/v5"
          )

          const duplicateLessonCreationWindow = 10 * time.Second

          // CreateProgressiveLesson makes lesson creation safe for double taps and
          // transport retries. Candidate selection separately excludes the most
          // recently completed block during the immediate continuation window.
          func (r *Repository) CreateProgressiveLesson(
          	ctx context.Context,
          	userID string,
          	request LessonCreateRequest,
          ) (LessonSession, error) {
          	tx, err := r.pool.Begin(ctx)
          	if err != nil {
          		return LessonSession{}, fmt.Errorf("begin progressive lesson transaction: %w", err)
          	}
          	defer func() { _ = tx.Rollback(ctx) }()

          	if _, err := tx.Exec(ctx, `
          		select pg_advisory_xact_lock(hashtextextended('lesson-create:' || $1, 0))
          	`, userID); err != nil {
          		return LessonSession{}, fmt.Errorf("lock lesson creation: %w", err)
          	}

          	activeLessonID, err := matchingRecentActiveLessonID(ctx, tx, userID, request)
          	if err != nil {
          		return LessonSession{}, err
          	}
          	if activeLessonID != "" {
          		if err := tx.Commit(ctx); err != nil {
          			return LessonSession{}, fmt.Errorf("commit duplicate lesson lookup: %w", err)
          		}
          		return r.lessonByID(ctx, userID, activeLessonID, "active")
          	}

          	wordIDs := request.WordIDs
          	if wordIDs == nil {
          		candidates, candidateErr := queryLessonCandidates(ctx, tx, userID, request.Source, request.StudyMode, request.Topic)
          		if candidateErr != nil {
          			return LessonSession{}, candidateErr
          		}
          		selected, _ := composeLessonCandidates(candidates, request.Source, lessonSizeLimit(request.LessonSize))
          		if len(selected) == 0 {
          			return LessonSession{}, ErrLessonQueueEmpty
          		}
          		wordIDs = make([]int64, 0, len(selected))
          		for _, candidate := range selected {
          			wordIDs = append(wordIDs, candidate.WordID)
          		}
          	} else {
          		var assigned int
          		if err := tx.QueryRow(ctx, `
          			select count(*)::int
          			from user_words
          			where user_id = $1::uuid and word_id = any($2::bigint[])
          		`, userID, wordIDs).Scan(&assigned); err != nil {
          			return LessonSession{}, fmt.Errorf("validate lesson words: %w", err)
          		}
          		if assigned != len(wordIDs) {
          			return LessonSession{}, ErrInvalidLessonWords
          		}
          	}

          	if _, err := tx.Exec(ctx, `
          		update lesson_sessions
          		set status = 'discarded', version = version + 1, updated_at = now()
          		where user_id = $1::uuid and status = 'active'
          	`, userID); err != nil {
          		return LessonSession{}, fmt.Errorf("discard previous lesson: %w", err)
          	}

          	var lessonID string
          	if err := tx.QueryRow(ctx, `
          		insert into lesson_sessions(user_id, source, study_mode, lesson_size)
          		values ($1::uuid, $2, $3, $4)
          		returning id::text
          	`, userID, request.Source, request.StudyMode, request.LessonSize).Scan(&lessonID); err != nil {
          		return LessonSession{}, fmt.Errorf("insert progressive lesson: %w", err)
          	}

          	if _, err := tx.Exec(ctx, `
          		insert into lesson_session_items(session_id, position, word_id)
          		select $1::uuid, (ordinality - 1)::int, word_id
          		from unnest($2::bigint[]) with ordinality as selected(word_id, ordinality)
          	`, lessonID, wordIDs); err != nil {
          		return LessonSession{}, fmt.Errorf("insert progressive lesson items: %w", err)
          	}

          	if err := tx.Commit(ctx); err != nil {
          		return LessonSession{}, fmt.Errorf("commit progressive lesson transaction: %w", err)
          	}
          	return r.lessonByID(ctx, userID, lessonID, "active")
          }

          func matchingRecentActiveLessonID(
          	ctx context.Context,
          	tx pgx.Tx,
          	userID string,
          	request LessonCreateRequest,
          ) (string, error) {
          	var lessonID string
          	err := tx.QueryRow(ctx, `
          		select lesson.id::text
          		from lesson_sessions lesson
          		where lesson.user_id = $1::uuid
          		  and lesson.status = 'active'
          		  and lesson.source = $2
          		  and lesson.study_mode = $3
          		  and lesson.lesson_size = $4
          		  and lesson.created_at >= now() - ($5::bigint * interval '1 second')
          		  and (
          		      $6 = ''
          		      or not exists (
          		          select 1
          		          from lesson_session_items item
          		          join words word on word.id = item.word_id
          		          where item.session_id = lesson.id and word.topic <> $6
          		      )
          		  )
          		  and (
          		      $7::bigint[] is null
          		      or coalesce((
          		          select array_agg(item.word_id order by item.position)
          		          from lesson_session_items item
          		          where item.session_id = lesson.id
          		      ), '{}'::bigint[]) = $7::bigint[]
          		  )
          		order by lesson.updated_at desc
          		limit 1
          		for update
          	`,
          		userID,
          		request.Source,
          		request.StudyMode,
          		request.LessonSize,
          		int64(duplicateLessonCreationWindow/time.Second),
          		strings.TrimSpace(request.Topic),
          		request.WordIDs,
          	).Scan(&lessonID)
          	if errors.Is(err, pgx.ErrNoRows) {
          		return "", nil
          	}
          	if err != nil {
          		return "", fmt.Errorf("query recent matching active lesson: %w", err)
          	}
          	return lessonID, nil
          }
          EOF

          cat > backend/integration/next_lesson_progression_test.go <<'EOF'
          //go:build integration

          package integration

          import (
          	"context"
          	"fmt"
          	"io"
          	"log/slog"
          	"net/http"
          	"net/http/httptest"
          	"testing"
          	"time"

          	"github.com/Dja-tiger/LexiGo/backend/internal/catalog"
          	"github.com/Dja-tiger/LexiGo/backend/internal/config"
          	"github.com/Dja-tiger/LexiGo/backend/internal/platform/migrate"
          	postgresplatform "github.com/Dja-tiger/LexiGo/backend/internal/platform/postgres"
          	redisplatform "github.com/Dja-tiger/LexiGo/backend/internal/platform/redis"
          	"github.com/Dja-tiger/LexiGo/backend/internal/server"
          )

          func TestNextLessonExcludesCompletedBlockAndDeduplicatesRapidCreate(t *testing.T) {
          	ctx, cancel := context.WithTimeout(context.Background(), 45*time.Second)
          	defer cancel()

          	pg, err := postgresplatform.Open(ctx, requiredEnv(t, "TEST_POSTGRES_DSN"))
          	if err != nil {
          		t.Fatal(err)
          	}
          	defer pg.Close()
          	if err := migrate.Up(ctx, pg); err != nil {
          		t.Fatalf("migrate.Up() error = %v", err)
          	}
          	if _, err := pg.Exec(ctx, "truncate table lesson_session_items, lesson_sessions, review_events, user_learning_preferences, user_words, refresh_tokens, words, users restart identity cascade"); err != nil {
          		t.Fatalf("truncate test data: %v", err)
          	}
          	if _, err := catalog.Seed(ctx, pg); err != nil {
          		t.Fatalf("catalog.Seed() error = %v", err)
          	}

          	rdb, err := redisplatform.Open(ctx, config.Redis{Addr: requiredEnv(t, "TEST_REDIS_ADDR")})
          	if err != nil {
          		t.Fatal(err)
          	}
          	defer rdb.Close()
          	if err := rdb.FlushDB(ctx).Err(); err != nil {
          		t.Fatalf("flush redis: %v", err)
          	}

          	cfg := config.Config{
          		AppEnv: "test", HTTPAddr: ":0", LogLevel: "error", CORSAllowedOrigin: "http://test.local",
          		PostgresDSN: requiredEnv(t, "TEST_POSTGRES_DSN"), Redis: config.Redis{Addr: requiredEnv(t, "TEST_REDIS_ADDR")},
          		JWTSecret: "integration-test-secret-with-at-least-32-bytes", AccessTokenTTL: 15 * time.Minute, RefreshTokenTTL: 24 * time.Hour,
          	}
          	app, err := server.New(cfg, slog.New(slog.NewTextHandler(io.Discard, nil)), pg, rdb)
          	if err != nil {
          		t.Fatalf("server.New() error = %v", err)
          	}
          	testServer := httptest.NewServer(app.Handler())
          	defer testServer.Close()

          	email := fmt.Sprintf("next-lesson-%d@example.com", time.Now().UnixNano())
          	registered := postJSON[integrationAuthResponse](t, testServer.URL+"/api/v1/auth/register", map[string]string{
          		"email": email, "password": "strong-password", "displayName": "Learner",
          	}, http.StatusCreated)

          	var userID string
          	if err := pg.QueryRow(ctx, "select id::text from users where email = $1", email).Scan(&userID); err != nil {
          		t.Fatalf("query registered user: %v", err)
          	}
          	rows, err := pg.Query(ctx, "select word_id from user_words where user_id = $1::uuid order by word_id limit 6", userID)
          	if err != nil {
          		t.Fatalf("query assigned words: %v", err)
          	}
          	wordIDs := make([]int64, 0, 6)
          	for rows.Next() {
          		var wordID int64
          		if err := rows.Scan(&wordID); err != nil {
          			t.Fatalf("scan assigned word: %v", err)
          		}
          		wordIDs = append(wordIDs, wordID)
          	}
          	rows.Close()
          	if len(wordIDs) < 6 {
          		t.Fatalf("assigned words = %d, want at least 6", len(wordIDs))
          	}
          	firstWordIDs := append([]int64(nil), wordIDs[:3]...)
          	if _, err := pg.Exec(ctx, `
          		update user_words
          		set status = 'learning', due_at = now() - interval '1 hour'
          		where user_id = $1::uuid and word_id = any($2::bigint[])
          	`, userID, firstWordIDs); err != nil {
          		t.Fatalf("prepare due study block: %v", err)
          	}

          	type lessonItem struct {
          		ID int64 `json:"id"`
          	}
          	type lessonPayload struct {
          		ID      string       `json:"id"`
          		Version int64        `json:"version"`
          		Items   []lessonItem `json:"items"`
          	}
          	var first lessonPayload
          	postAuthenticatedJSON(t, testServer.URL+"/api/v1/lessons", registered.Tokens.AccessToken, map[string]any{
          		"source": "mixed", "studyMode": "study", "lessonSize": "15", "wordIds": firstWordIDs,
          	}, http.StatusCreated, &first)
          	if first.ID == "" || len(first.Items) != 3 {
          		t.Fatalf("unexpected first lesson: %+v", first)
          	}

          	version := first.Version
          	for index, item := range first.Items {
          		var result struct {
          			LessonVersion   int64 `json:"lessonVersion"`
          			LessonCompleted bool  `json:"lessonCompleted"`
          		}
          		postAuthenticatedJSON(t,
          			fmt.Sprintf("%s/api/v1/lessons/%s/words/%d/review", testServer.URL, first.ID, item.ID),
          			registered.Tokens.AccessToken,
          			map[string]any{
          				"lessonVersion": version, "rating": "known", "responseMs": 200,
          				"answerMode": "study", "answerRevealed": true, "timezoneOffsetMinutes": 0,
          			},
          			http.StatusOK,
          			&result,
          		)
          		version = result.LessonVersion
          		if result.LessonCompleted != (index == len(first.Items)-1) {
          			t.Fatalf("completion after item %d = %v", index, result.LessonCompleted)
          		}
          	}

          	createPayload := map[string]any{"source": "mixed", "studyMode": "study", "lessonSize": "15"}
          	var next lessonPayload
          	postAuthenticatedJSON(t, testServer.URL+"/api/v1/lessons", registered.Tokens.AccessToken, createPayload, http.StatusCreated, &next)
          	if next.ID == "" || next.ID == first.ID || len(next.Items) == 0 {
          		t.Fatalf("unexpected next lesson: %+v", next)
          	}
          	completed := make(map[int64]struct{}, len(first.Items))
          	for _, item := range first.Items {
          		completed[item.ID] = struct{}{}
          	}
          	for _, item := range next.Items {
          		if _, repeated := completed[item.ID]; repeated {
          			t.Fatalf("next lesson repeated completed word %d", item.ID)
          		}
          	}

          	var duplicate lessonPayload
          	postAuthenticatedJSON(t, testServer.URL+"/api/v1/lessons", registered.Tokens.AccessToken, createPayload, http.StatusCreated, &duplicate)
          	if duplicate.ID != next.ID {
          		t.Fatalf("rapid duplicate created lesson %s, want existing %s", duplicate.ID, next.ID)
          	}
          	var activeCount int
          	if err := pg.QueryRow(ctx, "select count(*)::int from lesson_sessions where user_id = $1::uuid and status = 'active'", userID).Scan(&activeCount); err != nil {
          		t.Fatalf("count active lessons: %v", err)
          	}
          	if activeCount != 1 {
          		t.Fatalf("active lesson count = %d, want 1", activeCount)
          	}
          }
          EOF

