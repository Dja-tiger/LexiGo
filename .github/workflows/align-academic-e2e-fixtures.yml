name: Align academic E2E fixtures

on:
  push:
    branches:
      - agent/issue-178-academic-technical-english

permissions:
  contents: write

jobs:
  align:
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/issue-178-academic-technical-english
          fetch-depth: 0
      - name: Update all metadata mocks and collection contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed_paths = []
          sources_pattern = re.compile(r"sources\s*:\s*\{[^{}]*\}", re.DOTALL)
          backend_pattern = re.compile(r"(\bbackend\s*:\s*[^,}\n]+)(,?)")

          for path in sorted(Path('frontend/e2e').rglob('*.ts')):
              text = path.read_text()

              def align_sources(match: re.Match[str]) -> str:
                  block = match.group(0)
                  if 'dataEngineering' not in block or 'academicTechnicalEnglish' in block:
                      return block
                  updated, count = backend_pattern.subn(
                      lambda backend: f"{backend.group(1)}, academicTechnicalEnglish: 0{backend.group(2)}",
                      block,
                      count=1,
                  )
                  if count != 1:
                      raise SystemExit(f'{path}: metadata sources block has no backend counter')
                  return updated

              updated = sources_pattern.sub(align_sources, text)
              if path.as_posix() == 'frontend/e2e/ui-ownership.spec.ts':
                  old = "await expect(page.locator('[data-lexigo-collection]')).toHaveCount(4);"
                  new = "await expect(page.locator('[data-lexigo-collection]')).toHaveCount(5);"
                  if old not in updated and new not in updated:
                      raise SystemExit('ui-ownership collection count contract not found')
                  updated = updated.replace(old, new)

              if updated != text:
                  path.write_text(updated)
                  changed_paths.append(path.as_posix())

          if not changed_paths:
              raise SystemExit('no E2E fixtures required alignment')
          print('\n'.join(changed_paths))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/e2e
          git commit -m "test(frontend): align academic metadata fixtures"
          git push origin HEAD:agent/issue-178-academic-technical-english
