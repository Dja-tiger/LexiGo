name: Apply Issue 54 from PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/issue-54-catalog-pagination'
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Inspect bootstrap payload
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf bootstrap-repo
          git clone --quiet --depth 1 --branch agent/issue-54-catalog-pagination \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" bootstrap-repo
          cd bootstrap-repo
          python3 - <<'PY'
          import base64
          from pathlib import Path

          source = Path('.github/workflows/apply-issue-54.yml').read_text()
          payload = source.split('payload = """', 1)[1].split('"""', 1)[0]
          Path('/tmp/issue-54-payload.bin').write_bytes(base64.b64decode(payload))
          PY
          wc -c /tmp/issue-54-payload.bin
          file /tmp/issue-54-payload.bin
          printf '%s\n' '--- first 32 bytes ---'
          od -An -tx1 -N32 /tmp/issue-54-payload.bin
          printf '%s\n' '--- last 32 bytes ---'
          tail -c 32 /tmp/issue-54-payload.bin | od -An -tx1
          exit 1
