name: Apply Issue 54 from PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/issue-54-catalog-pagination'
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Apply bounded catalog pagination
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf bootstrap-repo
          git clone --quiet --depth 1 --branch agent/issue-54-catalog-pagination \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" bootstrap-repo
          cd bootstrap-repo

          if [[ ! -f .github/scripts/issue54.payload.ready ]]; then
            echo 'Issue 54 payload is not complete yet; skipping bootstrap.'
            exit 0
          fi

          mkdir -p .github/scripts
          cat .github/scripts/issue54.payload.?? > /tmp/issue54.payload.b64
          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          payload = Path('/tmp/issue54.payload.b64').read_text().strip()
          script = gzip.decompress(base64.b64decode(payload))
          Path('.github/scripts/apply_issue54.py').write_bytes(script)
          PY

          if ! python3 .github/scripts/apply_issue54.py > /tmp/issue-54-bootstrap.log 2>&1; then
            cat /tmp/issue-54-bootstrap.log
            exit 1
          fi

          gofmt -w \
            backend/internal/words/repository.go \
            backend/internal/words/http.go \
            backend/internal/learning/lesson.go \
            backend/internal/learning/lesson_http.go \
            backend/internal/learning/lesson_composer.go \
            backend/internal/learning/lesson_repository.go \
            backend/integration/catalog_pagination_test.go
          git diff --check
          rm -f .github/scripts/apply_issue54.py
          git rm --force \
            .github/workflows/apply-issue-54.yml \
            .github/workflows/apply-issue-54-pr.yml \
            .github/scripts/issue54.payload.00 \
            .github/scripts/issue54.payload.01 \
            .github/scripts/issue54.payload.02 \
            .github/scripts/issue54.payload.03 \
            .github/scripts/issue54.payload.ready \
            .issue-54-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m 'feat(catalog): paginate large vocabulary views'
          git push origin HEAD:agent/issue-54-catalog-pagination
