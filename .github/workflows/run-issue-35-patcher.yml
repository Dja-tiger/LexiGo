name: Run Issue 35 Patcher

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/issue-35-lesson-state-machine'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply source changes
        run: python3 scripts/apply_issue_35.py

      - name: Format Go sources
        run: cd backend && gofmt -w internal/learning/lesson.go internal/learning/lesson_http.go internal/learning/lesson_repository.go

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/learning frontend/components/lexigo-premium-app.tsx frontend/app/premium-ui.css
          git diff --cached --exit-code && exit 0
          git commit -m "fix(lesson): require persisted reviews before advancing"
          git push origin HEAD:${{ github.head_ref }}
