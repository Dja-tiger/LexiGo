name: Visual baseline finalizer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: visual-baseline-finalizer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize-comparison-gate:
    name: Finalize visual comparison gate
    if: >-
      github.repository == 'Dja-tiger/LexiGo' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/issue-58-quality-gates'
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Switch CI to comparison-only mode
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          old = '''      - name: Generate visual regression baselines
                run: bash ../scripts/ci/frontend-container.sh exec npm run test:e2e:visual:update

              - name: Extract generated visual baselines
                run: bash ../scripts/ci/frontend-container.sh extract

              - name: Upload generated visual baselines
                uses: actions/upload-artifact@v7
                with:
                  name: visual-regression-baselines-${{ github.sha }}
                  path: frontend/ci-artifacts/e2e/visual-regression.spec.ts-snapshots
                  if-no-files-found: error
                  retention-days: 7
          '''
          new = '''      - name: Visual regression comparison
                run: bash ../scripts/ci/frontend-container.sh exec npm run test:e2e:visual
          '''

          occurrences = text.count(old)
          if occurrences != 1:
              raise SystemExit(f'expected exactly one visual bootstrap block, found {occurrences}')

          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          rm -- .github/workflows/visual-baseline-bootstrap.yml
          git add -- .github/workflows/ci.yml .github/workflows/visual-baseline-bootstrap.yml
          git diff --cached --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ci): enforce visual baseline comparison"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
