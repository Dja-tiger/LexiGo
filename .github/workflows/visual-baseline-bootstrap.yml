name: Visual baseline finalizer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: visual-baseline-finalizer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize-comparison-gate:
    name: Finalize visual comparison gate
    if: >-
      github.repository == 'Dja-tiger/LexiGo' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/issue-58-quality-gates'
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Switch CI to comparison-only mode
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          start_marker = '      - name: Generate visual regression baselines\n'
          end_marker = '      - name: Dictionary navigation browser smoke\n'

          try:
              start = lines.index(start_marker)
              end = lines.index(end_marker, start + 1)
          except ValueError as error:
              raise SystemExit(f'visual bootstrap markers were not found: {error}') from error

          replacement = [
              '      - name: Visual regression comparison\n',
              '        run: bash ../scripts/ci/frontend-container.sh exec npm run test:e2e:visual\n',
              '\n',
          ]
          path.write_text(''.join(lines[:start] + replacement + lines[end:]), encoding='utf-8')
          PY

          rm -- .github/workflows/visual-baseline-bootstrap.yml
          git add -- .github/workflows/ci.yml .github/workflows/visual-baseline-bootstrap.yml
          git diff --cached --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ci): enforce visual baseline comparison"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
