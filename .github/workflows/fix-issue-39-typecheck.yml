name: Fix Issue 39 Typecheck

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.head_ref == 'fix/issue-39-lesson-concurrency' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-39-lesson-concurrency
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply response contract fix
        run: |
          if grep -q 'lastReviewedAt: string;' frontend/components/lexigo-premium-app.tsx; then
            echo "Issue 39 typecheck fix is already applied"
          else
            python scripts/fix_issue_39_typecheck.py
          fi
          git diff --check
      - name: Verify frontend contract
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run typecheck
      - name: Commit contract fix
        run: |
          if git diff --quiet; then
            echo "No typecheck changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "[issue-39-typecheck] align lesson review response"
          git push origin HEAD:fix/issue-39-lesson-concurrency
