name: Temporary stabilize answer suggestion WebKit test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.head_ref == 'codex/test-stabilize-answer-suggestion-webkit'
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      FEATURE_BRANCH: codex/test-stabilize-answer-suggestion-webkit
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - name: Clone feature branch into isolated runner temp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          workdir="${RUNNER_TEMP}/lexigo-webkit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$workdir"
          git clone \
            --branch "$FEATURE_BRANCH" \
            --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$workdir"
          printf 'FEATURE_WORKDIR=%s\n' "$workdir" >> "$GITHUB_ENV"

      - name: Apply exact test-only stabilization
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path

          path = Path("${{ env.FEATURE_WORKDIR }}/frontend/e2e/lesson-flow.spec.ts")
          source = path.read_text()
          old = '''  await page.getByRole("button", { name: "Мой вариант тоже верный", exact: true }).click();
            await expect(page.getByText(/Вариант отправлен на проверку/)).toBeVisible();
            await expect.poll(() => api.suggestionRequests().length).toBe(1);
          '''
          new = '''  const suggestionButton = page.getByRole("button", {
              name: "Мой вариант тоже верный",
              exact: true,
            });
            await suggestionButton.evaluate((element) => {
              (element as HTMLButtonElement).click();
            });
            await expect.poll(() => api.suggestionRequests().length).toBe(1);
            await expect(page.getByText(/Вариант отправлен на проверку/)).toBeVisible();
          '''
          if source.count(old) != 1:
              raise SystemExit("expected answer-suggestion test block was not found exactly once")
          path.write_text(source.replace(old, new))
          PY

      - name: Run focused WebKit regression in official image
        run: |
          set -eu
          mkdir -p "$FEATURE_WORKDIR/frontend/ci-artifacts"
          docker run --rm \
            -e APP_BUILD_ID="${GITHUB_SHA}" \
            -e NEXT_PUBLIC_RUM_SAMPLE_RATE=1 \
            -v "$FEATURE_WORKDIR:/repo" \
            -w /repo/frontend \
            "$PLAYWRIGHT_IMAGE" \
            bash -lc '
              set -euo pipefail
              {
                npm ci --no-audit --no-fund
                npm run typecheck
                npm run build
                npx playwright test e2e/lesson-flow.spec.ts \
                  --project=desktop-webkit \
                  --grep "wrong confidence cannot master an item and supports a safe answer suggestion"
              } 2>&1 | tee ci-artifacts/webkit-answer-suggestion.log
            '

      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webkit-answer-suggestion-${{ github.run_id }}
          path: ${{ env.FEATURE_WORKDIR }}/frontend/ci-artifacts
          if-no-files-found: error
          retention-days: 7

      - name: Commit patch and remove temporary workflow
        run: |
          set -eu
          cd "$FEATURE_WORKDIR"
          rm .github/workflows/temp-stabilize-answer-suggestion-webkit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/e2e/lesson-flow.spec.ts .github/workflows/temp-stabilize-answer-suggestion-webkit.yml
          git diff --cached --check
          git commit -m "test: stabilize answer suggestion click in WebKit"
          git push origin "HEAD:${FEATURE_BRANCH}"

      - name: Cleanup isolated runner temp
        if: always()
        run: |
          if [ -n "${FEATURE_WORKDIR:-}" ] && [ -d "$FEATURE_WORKDIR" ]; then
            docker run --rm \
              -v "$FEATURE_WORKDIR:/repo" \
              alpine:3.20 \
              sh -lc 'rm -rf /repo/frontend/node_modules /repo/frontend/.next'
            rm -rf "$FEATURE_WORKDIR"
          fi
