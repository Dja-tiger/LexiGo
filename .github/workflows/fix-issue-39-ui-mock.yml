name: Fix Issue 39 UI Mock Version

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.head_ref == 'fix/issue-39-lesson-concurrency' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-39-lesson-concurrency
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply deterministic UI mock fix
        run: |
          if grep -q '          version: 1,' frontend/e2e/ui-ownership.spec.ts; then
            echo "Issue 39 UI mock version is already present"
          else
            python scripts/fix_issue_39_ui_mock_version.py
          fi
          git diff --check
      - name: Verify React-owned UI matrix
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx playwright install --with-deps chromium webkit
          npm run test:e2e:ui
      - name: Commit UI mock fix only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/e2e/ui-ownership.spec.ts
          if git diff --cached --quiet; then
            echo "No UI mock changes"
            exit 0
          fi
          git commit -m "[issue-39-ui] version lesson ownership fixture"
          git push origin HEAD:fix/issue-39-lesson-concurrency
