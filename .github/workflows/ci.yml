name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  change-scope:
    name: Classify change scope
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      agent_docs_only: ${{ steps.scope.outputs.agent_docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        name: Classify changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          base_sha="$PUSH_BEFORE_SHA"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          fi
          python3 scripts/ci/agent_docs_scope.py classify \
            --repo "$GITHUB_WORKSPACE" \
            --base-sha "$base_sha" \
            --head-sha "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT" \
            --artifact "$RUNNER_TEMP/lexigo-ci-scope/scope.json"
      - name: Validate Agent Docs routing contract
        run: python3 scripts/ci/agent_docs_scope_test.py
      - name: Publish CI scope
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: ci-scope-${{ github.sha }}
          path: ${{ runner.temp }}/lexigo-ci-scope/scope.json
          if-no-files-found: error
          retention-days: 1

  agent-docs:
    name: Agent Harness validation
    needs: [change-scope]
    if: >-
      needs.change-scope.outputs.agent_docs_only == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate Agent Harness
        run: bash scripts/ci/check-agent-harness.sh

  backend-unit:
    name: Backend unit and security
    needs: [change-scope]
    if: >-
      needs.change-scope.outputs.agent_docs_only != 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: false
      - name: Verify dependency files
        run: |
          expected_module="github.com/Dja-tiger/LexiGo/backend"
          actual_module="$(go list -m)"
          if [ "$actual_module" != "$expected_module" ]; then
            echo "Unexpected backend module path: $actual_module (expected $expected_module)" >&2
            exit 1
          fi
          if git grep -n --fixed-strings 'github.com/Dja-tiger/New-project/backend' -- '*.go' go.mod; then
            echo "Legacy backend module path must not be used" >&2
            exit 1
          fi
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Static analysis
        run: go vet ./...
      - id: unit-tests
        name: Unit tests with race detector
        run: |
          set -o pipefail
          go test -race -count=1 -coverprofile=coverage.out ./... 2>&1 | tee unit-test.log

      - name: Upload backend unit diagnostics
        if: always() && steps.unit-tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: backend-unit-test-log
          path: backend/unit-test.log
          if-no-files-found: error
          retention-days: 3
      - name: Coverage summary
        run: go tool cover -func=coverage.out
      - name: Vulnerability scan
        run: |
          install -d "$RUNNER_TEMP/gobin"
          GOBIN="$RUNNER_TEMP/gobin" go install golang.org/x/vuln/cmd/govulncheck@latest
          "$RUNNER_TEMP/gobin/govulncheck" ./...

  backend-integration:
    name: Backend integration
    needs: [change-scope]
    if: >-
      needs.change-scope.outputs.agent_docs_only != 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      POSTGRES_CONTAINER: lexigo-postgres-${{ github.run_id }}-${{ github.run_attempt }}
      REDIS_CONTAINER: lexigo-redis-${{ github.run_id }}-${{ github.run_attempt }}
      CI_LEASE_CONTAINER: lexigo-backend-lease-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: false

      - name: Start isolated integration services
        run: |
          set -Eeuo pipefail

          cleanup_container() {
            docker rm --force "$1" >/dev/null 2>&1 || true
          }

          wait_for_healthy() {
            local container="$1"
            local status

            for _ in $(seq 1 60); do
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$container" 2>/dev/null || true)"
              case "$status" in
                healthy)
                  return 0
                  ;;
                unhealthy)
                  docker logs "$container" || true
                  return 1
                  ;;
              esac
              sleep 1
            done

            docker logs "$container" || true
            return 1
          }

          cleanup_container "$POSTGRES_CONTAINER"
          cleanup_container "$REDIS_CONTAINER"
          cleanup_container "$CI_LEASE_CONTAINER"

          docker run --detach --rm \
            --name "$CI_LEASE_CONTAINER" \
            --label "com.lexigo.ci=true" \
            --label "com.lexigo.ci.repository=${GITHUB_REPOSITORY}" \
            --label "com.lexigo.ci.run=${GITHUB_RUN_ID}" \
            --label "com.lexigo.ci.attempt=${GITHUB_RUN_ATTEMPT}" \
            --label "com.lexigo.ci.job=${GITHUB_JOB}" \
            --label "com.lexigo.ci.kind=lease" \
            --entrypoint sleep \
            postgres:18.4-alpine \
            1500 >/dev/null

          docker run --detach --rm \
            --name "$POSTGRES_CONTAINER" \
            --label "com.lexigo.ci=true" \
            --label "com.lexigo.ci.repository=${GITHUB_REPOSITORY}" \
            --label "com.lexigo.ci.run=${GITHUB_RUN_ID}" \
            --label "com.lexigo.ci.attempt=${GITHUB_RUN_ATTEMPT}" \
            --label "com.lexigo.ci.job=${GITHUB_JOB}" \
            --label "com.lexigo.ci.kind=service" \
            --env POSTGRES_DB=lexigo_test \
            --env POSTGRES_USER=lexigo \
            --env POSTGRES_PASSWORD=lexigo_test \
            --publish 127.0.0.1::5432 \
            --health-cmd "pg_isready -U lexigo -d lexigo_test" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 20 \
            postgres:18.4-alpine >/dev/null

          docker run --detach --rm \
            --name "$REDIS_CONTAINER" \
            --label "com.lexigo.ci=true" \
            --label "com.lexigo.ci.repository=${GITHUB_REPOSITORY}" \
            --label "com.lexigo.ci.run=${GITHUB_RUN_ID}" \
            --label "com.lexigo.ci.attempt=${GITHUB_RUN_ATTEMPT}" \
            --label "com.lexigo.ci.job=${GITHUB_JOB}" \
            --label "com.lexigo.ci.kind=service" \
            --publish 127.0.0.1::6379 \
            --health-cmd "redis-cli ping" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 20 \
            redis:8.0-alpine >/dev/null

          wait_for_healthy "$POSTGRES_CONTAINER"
          wait_for_healthy "$REDIS_CONTAINER"

          postgres_port="$(docker port "$POSTGRES_CONTAINER" 5432/tcp | awk -F: 'END { print $NF }')"
          redis_port="$(docker port "$REDIS_CONTAINER" 6379/tcp | awk -F: 'END { print $NF }')"

          test -n "$postgres_port"
          test -n "$redis_port"

          {
            printf 'TEST_POSTGRES_DSN=postgres://lexigo:lexigo_test@127.0.0.1:%s/lexigo_test?sslmode=disable\n' "$postgres_port"
            printf 'TEST_REDIS_ADDR=127.0.0.1:%s\n' "$redis_port"
          } >> "$GITHUB_ENV"

      - name: Integration tests with race detector
        run: |
          set -o pipefail
          go test -race -count=1 -tags=integration ./... 2>&1 | tee integration-test.log

      - name: Upload integration diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: integration-test-log
          path: backend/integration-test.log
          if-no-files-found: error
          retention-days: 3
      - name: Cleanup integration services
        if: always()
        run: |
          for container in "$POSTGRES_CONTAINER" "$REDIS_CONTAINER" "$CI_LEASE_CONTAINER"; do
            docker rm --force "$container" >/dev/null 2>&1 || true
          done

  frontend-core:
    name: Frontend core quality
    needs: [change-scope]
    if: >-
      needs.change-scope.outputs.agent_docs_only != 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.62.1-noble
      FRONTEND_CI_VOLUME: lexigo-frontend-core-${{ github.run_id }}-${{ github.run_attempt }}
      FRONTEND_CI_SLOT: core
      APP_BUILD_ID: ${{ github.sha }}
      NEXT_PUBLIC_RUM_SAMPLE_RATE: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Validate CI runner policy
        run: python3 ../scripts/ci/runner_policy_test.py

      - name: Prepare isolated frontend workspace
        run: bash ../scripts/ci/frontend-container.sh prepare

      - name: Install locked dependencies
        run: bash ../scripts/ci/frontend-container.sh exec npm ci --no-audit --no-fund

      - name: Lint
        run: |
          bash ../scripts/ci/frontend-container.sh shell <<'CONTAINER_SCRIPT'
          set -o pipefail
          npm run lint 2>&1 | tee eslint.log
          CONTAINER_SCRIPT

      - name: Type check
        run: bash ../scripts/ci/frontend-container.sh exec npm run typecheck

      - name: Unit tests
        run: bash ../scripts/ci/frontend-container.sh exec npm run test

      - name: Production build
        run: bash ../scripts/ci/frontend-container.sh exec npm run build

      - name: Production dependency audit
        run: bash ../scripts/ci/frontend-container.sh exec npm audit --omit=dev --audit-level=high

      - name: Extract frontend core diagnostics
        if: failure()
        run: bash ../scripts/ci/frontend-container.sh extract

      - name: Upload frontend core diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: frontend-core-diagnostics
          path: frontend/ci-artifacts
          if-no-files-found: ignore
          retention-days: 3
      - name: Cleanup isolated frontend workspace
        if: always()
        run: bash ../scripts/ci/frontend-container.sh cleanup

  frontend-browser:
    name: Frontend E2E (${{ matrix.name }})
    needs: [change-scope, frontend-core]
    if: >-
      needs.change-scope.outputs.agent_docs_only != 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ui-1
            name: "UI tests (shard 1/2)"
            cmd: npm run test:e2e:ui -- --shard=1/2
          - id: ui-2
            name: "UI tests (shard 2/2)"
            cmd: npm run test:e2e:ui -- --shard=2/2
          - id: lesson
            name: "Lesson completion"
            cmd: npm run test:e2e:lesson
          - id: security
            name: "Content security"
            cmd: npm run test:e2e:security
          - id: pwa
            name: "iOS PWA dictionary"
            cmd: npm run test:e2e:pwa
          - id: axe
            name: "Accessibility audit"
            cmd: npm run test:e2e:axe
          - id: sw
            name: "Controlled service worker"
            cmd: npm run test:e2e:sw
          - id: visual
            name: "Visual regression"
            cmd: npm run test:e2e:visual
          - id: perf
            name: "Performance budgets"
            cmd: npm run test:e2e:performance
          - id: smoke
            name: "Dictionary smoke"
            cmd: smoke
    env:
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.62.1-noble
      FRONTEND_CI_VOLUME: lexigo-frontend-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
      FRONTEND_CI_SLOT: ${{ matrix.id }}
      APP_BUILD_ID: ${{ github.sha }}
      NEXT_PUBLIC_RUM_SAMPLE_RATE: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Prepare isolated frontend workspace
        run: bash ../scripts/ci/frontend-container.sh prepare

      - name: Install locked dependencies
        run: bash ../scripts/ci/frontend-container.sh exec npm ci --no-audit --no-fund

      - name: Production build
        run: bash ../scripts/ci/frontend-container.sh exec npm run build

      - name: Run E2E tests
        if: matrix.id != 'smoke'
        run: bash ../scripts/ci/frontend-container.sh exec ${{ matrix.cmd }}

      - id: performance
        name: Upload performance budget report
        if: failure() && matrix.id == 'perf'
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: performance-budget-${{ github.sha }}
          path: frontend/ci-artifacts/test-results/performance-budget-report.json
          if-no-files-found: error
          retention-days: 3

      - name: Extract performance report
        if: always() && matrix.id == 'perf' && steps.performance.outcome != 'skipped'
        run: bash ../scripts/ci/frontend-container.sh extract

      - name: Dictionary navigation browser smoke
        if: matrix.id == 'smoke'
        run: |
          bash ../scripts/ci/frontend-container.sh shell <<'CONTAINER_SCRIPT'
          npm run start -- --hostname 127.0.0.1 > next-start.log 2>&1 &
          app_pid=$!
          cleanup() {
            kill "$app_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 60); do
            if node -e '
              fetch("http://127.0.0.1:3000/")
                .then((response) => process.exit(response.ok ? 0 : 1))
                .catch(() => process.exit(1));
            '; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat next-start.log
            exit 1
          fi

          chromium_path="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')"
          test -x "$chromium_path"
          ln -s "$chromium_path" /usr/local/bin/chromium

          bash scripts/dictionary-navigation-smoke.sh
          CONTAINER_SCRIPT

      - name: Extract frontend diagnostics
        if: failure()
        run: bash ../scripts/ci/frontend-container.sh extract

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: frontend-playwright-report-${{ matrix.id }}
          path: frontend/ci-artifacts
          if-no-files-found: ignore
          retention-days: 3

      - name: Cleanup isolated frontend workspace
        if: always()
        run: bash ../scripts/ci/frontend-container.sh cleanup

  frontend:
    name: Frontend quality
    needs: [change-scope, frontend-core, frontend-browser]
    if: >-
      always() &&
      needs.change-scope.result == 'success' &&
      needs.change-scope.outputs.agent_docs_only != 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Verify all frontend groups passed
        env:
          CORE_RESULT: ${{ needs['frontend-core'].result }}
          BROWSER_RESULT: ${{ needs['frontend-browser'].result }}
        run: |
          set -Eeuo pipefail
          test "$CORE_RESULT" = success
          test "$BROWSER_RESULT" = success

  container-build:
    name: Container build (${{ matrix.component }})
    needs: [change-scope, backend-unit, backend-integration, frontend]
    if: >-
      needs.change-scope.outputs.agent_docs_only != 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      BUILDER_NAME: lexigo-buildx-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.component }}
      CI_LEASE_CONTAINER: lexigo-buildx-lease-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.component }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [api, web]
        include:
          - component: api
            context: backend
          - component: web
            context: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Start bounded cleanup lease
        run: |
          set -Eeuo pipefail
          docker rm --force "$CI_LEASE_CONTAINER" >/dev/null 2>&1 || true
          docker run --detach --rm \
            --name "$CI_LEASE_CONTAINER" \
            --label "com.lexigo.ci=true" \
            --label "com.lexigo.ci.repository=${GITHUB_REPOSITORY}" \
            --label "com.lexigo.ci.run=${GITHUB_RUN_ID}" \
            --label "com.lexigo.ci.attempt=${GITHUB_RUN_ATTEMPT}" \
            --label "com.lexigo.ci.job=${GITHUB_JOB}" \
            --label "com.lexigo.ci.kind=lease" \
            --entrypoint sleep \
            alpine:3.22 \
            2100 >/dev/null
      - id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          name: ${{ env.BUILDER_NAME }}
          cleanup: true
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and optionally publish
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          build-args: ${{ matrix.component == 'web' && format('APP_BUILD_ID={0}', github.sha) || '' }}
          tags: |
            ghcr.io/dja-tiger/lexigo-${{ matrix.component }}:${{ github.sha }}
            ghcr.io/dja-tiger/lexigo-${{ matrix.component }}:main
          provenance: mode=max
          sbom: true

      - name: Cleanup Buildx builder
        if: always()
        run: |
          if [ -n "${BUILDER_NAME:-}" ]; then
            docker buildx rm --force "$BUILDER_NAME" >/dev/null 2>&1 || true
          fi

      - name: Stop bounded cleanup lease
        if: always()
        run: docker rm --force "$CI_LEASE_CONTAINER" >/dev/null 2>&1 || true

  caddy-image:
    name: Publish deployment Caddy
    needs: [change-scope, container-build]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.change-scope.outputs.agent_docs_only != 'true' &&
      needs.container-build.result == 'success'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      CADDY_IMAGE: ghcr.io/dja-tiger/lexigo-caddy:2.11.4-cloudflare-v0.2.4
      BUILDER_NAME: lexigo-buildx-${{ github.run_id }}-${{ github.run_attempt }}-caddy
      CI_LEASE_CONTAINER: lexigo-buildx-lease-${{ github.run_id }}-${{ github.run_attempt }}-caddy
      CADDY_MODULES_CONTAINER: lexigo-caddy-modules-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Start bounded cleanup lease
        run: |
          set -Eeuo pipefail
          docker rm --force "$CI_LEASE_CONTAINER" >/dev/null 2>&1 || true
          docker run --detach --rm \
            --name "$CI_LEASE_CONTAINER" \
            --label "com.lexigo.ci=true" \
            --label "com.lexigo.ci.repository=${GITHUB_REPOSITORY}" \
            --label "com.lexigo.ci.run=${GITHUB_RUN_ID}" \
            --label "com.lexigo.ci.attempt=${GITHUB_RUN_ATTEMPT}" \
            --label "com.lexigo.ci.job=${GITHUB_JOB}" \
            --label "com.lexigo.ci.kind=lease" \
            --entrypoint sleep \
            alpine:3.22 \
            2100 >/dev/null

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: caddy-registry
        name: Resolve pinned Caddy image
        run: |
          set -Eeuo pipefail
          if docker pull "$CADDY_IMAGE" >/dev/null 2>&1; then
            echo 'build_required=false' >> "$GITHUB_OUTPUT"
          else
            echo 'build_required=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up owned Caddy builder
        if: steps.caddy-registry.outputs.build_required == 'true'
        uses: docker/setup-buildx-action@v4
        with:
          name: ${{ env.BUILDER_NAME }}
          cleanup: true

      - name: Build and publish pinned Caddy
        if: steps.caddy-registry.outputs.build_required == 'true'
        uses: docker/build-push-action@v7
        with:
          context: deploy
          file: deploy/caddy/Dockerfile
          push: true
          tags: ${{ env.CADDY_IMAGE }}
          provenance: mode=max
          sbom: true

      - name: Verify published Cloudflare DNS module
        run: |
          set -Eeuo pipefail
          docker pull "$CADDY_IMAGE"
          docker run --rm \
            --name "$CADDY_MODULES_CONTAINER" \
            --label "com.lexigo.ci=true" \
            --label "com.lexigo.ci.repository=${GITHUB_REPOSITORY}" \
            --label "com.lexigo.ci.run=${GITHUB_RUN_ID}" \
            --label "com.lexigo.ci.attempt=${GITHUB_RUN_ATTEMPT}" \
            --label "com.lexigo.ci.job=${GITHUB_JOB}" \
            --label "com.lexigo.ci.kind=validation" \
            --entrypoint caddy \
            "$CADDY_IMAGE" list-modules \
            | grep -Fxq 'dns.providers.cloudflare'

      - name: Cleanup owned Caddy resources
        if: always()
        run: |
          docker rm --force "$CADDY_MODULES_CONTAINER" "$CI_LEASE_CONTAINER" >/dev/null 2>&1 || true
          docker image rm "$CADDY_IMAGE" >/dev/null 2>&1 || true
          if docker buildx inspect "$BUILDER_NAME" >/dev/null 2>&1; then
            docker buildx rm --force "$BUILDER_NAME" >/dev/null 2>&1 || true
          fi
