name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair-canonical-e2e:
    name: Repair canonical Lesson Result E2E contracts
    if: github.event.pull_request.head.ref == 'agent/issue-194-lesson-result'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/issue-194-lesson-result
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Patch stale selectors and prevention guidance
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lesson = Path('frontend/e2e/lesson-flow.spec.ts')
          text = lesson.read_text()
          old = 'page.locator("#premium-answer")'
          new = 'page.getByRole("textbox", { name: "Введите ответ" })'
          if text.count(old) != 3:
              raise RuntimeError(f'expected 3 stale answer selectors, found {text.count(old)}')
          lesson.write_text(text.replace(old, new))

          academic = Path('frontend/e2e/academic-technical-english.spec.ts')
          text = academic.read_text()
          old = 'name: "Следующий блок", exact: true'
          new = 'name: "Следующий урок", exact: true'
          if text.count(old) != 1:
              raise RuntimeError(f'expected 1 stale continuation CTA, found {text.count(old)}')
          academic.write_text(text.replace(old, new, 1))

          agents = Path('.agents/AGENTS.md')
          text = agents.read_text()
          marker = '### 2026-07-25 — Canonical controls нельзя искать по legacy ID или state-copy'
          if marker not in text:
              text += (
                  '\n\n' + marker + '\n\n'
                  '- **Симптом:** Lesson completion и UI shards зависали на disabled `Сверить ответ` и не находили продолжение Academic Technical English после результата.\n'
                  '- **Первопричина:** тесты заполняли удалённый `#premium-answer` вместо видимого canonical textbox и использовали название состояния «Следующий блок» как accessible name CTA, хотя кнопка называется «Следующий урок».\n'
                  '- **Профилактика:** интерактивные canonical controls выбирать через `getByRole` с фактическим accessible name; state heading, eyebrow и CTA label считать разными контрактами. Legacy ID запрещено использовать, если пользователь взаимодействует с другой видимой control.\n'
                  '- **Обязательная проверка:** `e2e/lesson-flow.spec.ts` и `e2e/academic-technical-english.spec.ts` проходят во всех configured Playwright projects и repository search не находит `#premium-answer` или CTA `Следующий блок`.\n'
                  '- **Область действия:** Active Lesson, Lesson Result, responsive Lesson Composer и все E2E после canonical redesign.\n'
              )
              agents.write_text(text)
          PY

      - name: Restore workflows and commit source fix
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git checkout origin/main -- \
            .github/workflows/ci.yml \
            .github/workflows/actions-storage-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test(frontend): use canonical Lesson Result controls'
          git push origin HEAD:agent/issue-194-lesson-result
