name: CI

on:
  pull_request:

concurrency:
  group: issue-54-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  issue-54-repair:
    if: github.event.pull_request.head.ref == 'agent/issue-54-catalog-pagination'
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply, verify and commit the final Issue 54 repair
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              content = target.read_text(encoding="utf-8")
              matches = content.count(old)
              if matches != 1:
                  raise SystemExit(f"{path}: expected one match, found {matches}: {old[:100]!r}")
              target.write_text(content.replace(old, new, 1), encoding="utf-8")

          app = "frontend/components/lexigo-premium-app.tsx"
          replace_once(app, """  prepareWordItems,
  takeLessonBlock,
""", "")
          replace_once(app, """  const lessonAdvanceRef = useRef<HTMLButtonElement | null>(null);
  const phraseListScrollRef = useRef<NavigationScrollPosition>({ x: 0, y: 0 });
""", """  const lessonAdvanceRef = useRef<HTMLButtonElement | null>(null);
""")
          replace_once(app, """      setProgress(null);
      setActiveLesson(null);
      setPhraseCatalog(DEFAULT_PHRASE_CATALOG);
      void Promise.all([
""", """      setProgress(null);
      setActiveLesson(null);
      setPhraseCatalog([]);
      setPhraseCatalogPageInfo(paginateCatalogEntries(DEFAULT_PHRASE_CATALOG, 1).info);
      setPhrasePage(1);
      setPhraseCatalogStatus(idleResourceStatus());
      void Promise.all([
""")
          replace_once(app, "      let currentSession = activeSession;\n", "      const currentSession = activeSession;\n")
          replace_once(app, """  function openPhraseDetail(phrase: LearningItem) {
    phraseListScrollRef.current = { x: window.scrollX, y: window.scrollY };
    navigate({ view: "phrases", detail: itemKey(phrase) });
  }

  function backToPhraseCatalog() {
    navigate({ view: "phrases" }, true, { scroll: phraseListScrollRef.current });
  }
""", """  function openPhraseDetail(phrase: LearningItem) {
    navigate({ view: "phrases", detail: itemKey(phrase) });
  }

  function backToPhraseCatalog() {
    const destination = navigationTabs.destination("phrases");
    navigate({ view: "phrases" }, true, { scroll: destination.scroll });
  }
""")

          replace_once(
              "backend/integration/catalog_pagination_test.go",
              """\t\tinsert into words (lemma, translation, part_of_speech, topic, examples, note, source, kind, slug)
\t\tselect format('page phrase %s', lpad(series::text, 3, '0')),
\t\t       format('страничная фраза %s', series),
\t\t       'phrase',
\t\t       'Pagination Test',
\t\t       '[]'::jsonb,
\t\t       '',
\t\t       'integration-pagination',
\t\t       'phrase',
\t\t       format('page-phrase-%s', lpad(series::text, 3, '0'))
""",
              """\t\tinsert into words (lemma, translation, part_of_speech, topic, examples, note, source, kind, slug, cloze, cloze_answer)
\t\tselect format('page phrase %s', lpad(series::text, 3, '0')),
\t\t       format('страничная фраза %s', series),
\t\t       'phrase',
\t\t       'Pagination Test',
\t\t       '[]'::jsonb,
\t\t       '',
\t\t       'integration-pagination',
\t\t       'phrase',
\t\t       format('page-phrase-%s', lpad(series::text, 3, '0')),
\t\t       format('page phrase _____ %s', lpad(series::text, 3, '0')),
\t\t       'test'
""",
          )

          replace_once(
              "frontend/app/catalog-pagination.css",
              """.lx-phrase-grid > [role="listitem"] {
  display: contents;
}
""",
              """.lx-phrase-grid > [role="listitem"] {
  min-width: 0;
}

.lx-phrase-grid > [role="listitem"] > button {
  width: 100%;
  height: 100%;
}
""",
          )

          e2e = "frontend/e2e/catalog-pagination.spec.ts"
          replace_once(e2e, """  const requestedLimits: number[] = [];
  await installAPI(context, requestedLimits);
  const errors = captureErrors(page);
""", """  const requestedLimits: number[] = [];
  await context.addInitScript(() => {
    const updateMaximum = () => {
      const current = document.querySelectorAll(".lx-phrase-grid [role=listitem]").length;
      const previous = Number(document.documentElement.dataset.lexigoMaxCatalogItems ?? "0");
      document.documentElement.dataset.lexigoMaxCatalogItems = String(Math.max(previous, current));
    };
    new MutationObserver(updateMaximum).observe(document, { childList: true, subtree: true });
  });
  await installAPI(context, requestedLimits);
  const errors = captureErrors(page);
""")
          replace_once(e2e, """  expect(requestedLimits.length).toBeGreaterThan(0);
  expect(requestedLimits.every((limit) => limit <= 48)).toBe(true);
""", """  expect(requestedLimits.length).toBeGreaterThan(0);
  expect(requestedLimits.every((limit) => limit <= 48)).toBe(true);
  expect(await page.evaluate(() => Number(document.documentElement.dataset.lexigoMaxCatalogItems ?? "0"))).toBeLessThanOrEqual(48);
""")

          package_path = Path("frontend/package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          package["scripts"]["lint"] = "eslint ."
          package["scripts"]["test:e2e:lesson"] = "playwright test e2e/lesson-flow.spec.ts e2e/offline-review-outbox.spec.ts e2e/review-outbox-auth-lifecycle.spec.ts"
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          gofmt -w backend/integration/catalog_pagination_test.go

          (
            cd backend
            go test ./...
            go test -run '^$' -tags=integration ./integration
          )

          (
            cd frontend
            npm ci --no-audit --no-fund
            npm run lint
            npm run typecheck
            npm run test
          )

          git config user.name "LexiGo CI"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git rm --ignore-unmatch .github/workflows/issue-54-pr-apply.yml
          git add \
            backend/integration/catalog_pagination_test.go \
            frontend/app/catalog-pagination.css \
            frontend/components/lexigo-premium-app.tsx \
            frontend/e2e/catalog-pagination.spec.ts \
            frontend/package.json \
            .github/workflows/ci.yml
          git diff --cached --check
          git commit -m "fix(catalog): satisfy bounded rendering gates"
          git push origin HEAD:agent/issue-54-catalog-pagination
