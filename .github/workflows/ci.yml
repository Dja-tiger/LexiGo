name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-unit:
    name: Backend unit and security
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: false
      - name: Verify dependency files
        run: |
          expected_module="github.com/Dja-tiger/LexiGo/backend"
          actual_module="$(go list -m)"
          if [ "$actual_module" != "$expected_module" ]; then
            echo "Unexpected backend module path: $actual_module (expected $expected_module)" >&2
            exit 1
          fi
          if git grep -n --fixed-strings 'github.com/Dja-tiger/New-project/backend' -- '*.go' go.mod; then
            echo "Legacy backend module path must not be used" >&2
            exit 1
          fi
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Static analysis
        run: go vet ./...
      - id: unit-tests
        name: Unit tests with race detector
        run: |
          set -o pipefail
          go test -race -count=1 -coverprofile=coverage.out ./... 2>&1 | tee unit-test.log

      - name: Upload backend unit diagnostics
        if: always() && steps.unit-tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: backend-unit-test-log
          path: backend/unit-test.log
          if-no-files-found: error
          retention-days: 3
      - name: Coverage summary
        run: go tool cover -func=coverage.out
      - name: Vulnerability scan
        run: |
          install -d "$RUNNER_TEMP/gobin"
          GOBIN="$RUNNER_TEMP/gobin" go install golang.org/x/vuln/cmd/govulncheck@latest
          "$RUNNER_TEMP/gobin/govulncheck" ./...

  backend-integration:
    name: Backend integration
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      POSTGRES_CONTAINER: lexigo-postgres-${{ github.run_id }}-${{ github.run_attempt }}
      REDIS_CONTAINER: lexigo-redis-${{ github.run_id }}-${{ github.run_attempt }}
      CI_LEASE_CONTAINER: lexigo-backend-lease-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: false

      - name: Start isolated integration services
        run: |
          set -Eeuo pipefail

          cleanup_container() {
            docker rm --force "$1" >/dev/null 2>&1 || true
          }

          wait_for_healthy() {
            local container="$1"
            local status

            for _ in $(seq 1 60); do
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$container" 2>/dev/null || true)"
              case "$status" in
                healthy)
                  return 0
                  ;;
                unhealthy)
                  docker logs "$container" || true
                  return 1
                  ;;
              esac
              sleep 1
            done

            docker logs "$container" || true
            return 1
          }

          cleanup_container "$POSTGRES_CONTAINER"
          cleanup_container "$REDIS_CONTAINER"
          cleanup_container "$CI_LEASE_CONTAINER"

          docker run --detach --rm \
            --name "$CI_LEASE_CONTAINER" \
            --label "com.lexigo.ci=true" \
            --label "com.lexigo.ci.repository=${GITHUB_REPOSITORY}" \
            --label "com.lexigo.ci.run=${GITHUB_RUN_ID}" \
            --label "com.lexigo.ci.attempt=${GITHUB_RUN_ATTEMPT}" \
            --label "com.lexigo.ci.job=${GITHUB_JOB}" \
            --label "com.lexigo.ci.kind=lease" \
            --entrypoint sleep \
            postgres:18.4-alpine \
            1500 >/dev/null

          docker run --detach --rm \
            --name "$POSTGRES_CONTAINER" \
            --label "com.lexigo.ci=true" \
            --label "com.lexigo.ci.repository=${GITHUB_REPOSITORY}" \
            --label "com.lexigo.ci.run=${GITHUB_RUN_ID}" \
            --label "com.lexigo.ci.attempt=${GITHUB_RUN_ATTEMPT}" \
            --label "com.lexigo.ci.job=${GITHUB_JOB}" \
            --label "com.lexigo.ci.kind=service" \
            --env POSTGRES_DB=lexigo_test \
            --env POSTGRES_USER=lexigo \
            --env POSTGRES_PASSWORD=lexigo_test \
            --publish 127.0.0.1::5432 \
            --health-cmd "pg_isready -U lexigo -d lexigo_test" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 20 \
            postgres:18.4-alpine >/dev/null

          docker run --detach --rm \
            --name "$REDIS_CONTAINER" \
            --label "com.lexigo.ci=true" \
            --label "com.lexigo.ci.repository=${GITHUB_REPOSITORY}" \
            --label "com.lexigo.ci.run=${GITHUB_RUN_ID}" \
            --label "com.lexigo.ci.attempt=${GITHUB_RUN_ATTEMPT}" \
            --label "com.lexigo.ci.job=${GITHUB_JOB}" \
            --label "com.lexigo.ci.kind=service" \
            --publish 127.0.0.1::6379 \
            --health-cmd "redis-cli ping" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 20 \
            redis:8.0-alpine >/dev/null

          wait_for_healthy "$POSTGRES_CONTAINER"
          wait_for_healthy "$REDIS_CONTAINER"

          postgres_port="$(docker port "$POSTGRES_CONTAINER" 5432/tcp | awk -F: 'END { print $NF }')"
          redis_port="$(docker port "$REDIS_CONTAINER" 6379/tcp | awk -F: 'END { print $NF }')"

          test -n "$postgres_port"
          test -n "$redis_port"

          {
            printf 'TEST_POSTGRES_DSN=postgres://lexigo:lexigo_test@127.0.0.1:%s/lexigo_test?sslmode=disable\n' "$postgres_port"
            printf 'TEST_REDIS_ADDR=127.0.0.1:%s\n' "$redis_port"
          } >> "$GITHUB_ENV"

      - name: Integration tests with race detector
        run: |
          set -o pipefail
          go test -race -count=1 -tags=integration ./... 2>&1 | tee integration-test.log

      - name: Upload integration diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: integration-test-log
          path: backend/integration-test.log
          if-no-files-found: error
          retention-days: 3
      - name: Cleanup integration services
        if: always()
        run: |
          for container in "$POSTGRES_CONTAINER" "$REDIS_CONTAINER" "$CI_LEASE_CONTAINER"; do
            docker rm --force "$container" >/dev/null 2>&1 || true
          done

  frontend-core:
    name: Frontend core quality
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.61.1-noble
      FRONTEND_CI_VOLUME: lexigo-frontend-core-${{ github.run_id }}-${{ github.run_attempt }}
      FRONTEND_CI_SLOT: core
      APP_BUILD_ID: ${{ github.sha }}
      NEXT_PUBLIC_RUM_SAMPLE_RATE: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Prepare isolated frontend workspace
        run: bash ../scripts/ci/frontend-container.sh prepare

      - name: Install locked dependencies
        run: bash ../scripts/ci/frontend-container.sh exec npm ci --no-audit --no-fund

      - name: Lint
        run: |
          bash ../scripts/ci/frontend-container.sh shell <<'CONTAINER_SCRIPT'
          set -o pipefail
          npm run lint 2>&1 | tee eslint.log
          CONTAINER_SCRIPT

      - name: Type check
        run: bash ../scripts/ci/frontend-container.sh exec npm run typecheck

      - name: Unit tests
        run: bash ../scripts/ci/frontend-container.sh exec npm run test

      - name: Production build
        run: bash ../scripts/ci/frontend-container.sh exec npm run build

      - name: Production dependency audit
        run: bash ../scripts/ci/frontend-container.sh exec npm audit --omit=dev --audit-level=high

      - name: Extract frontend core diagnostics
        if: failure()
        run: bash ../scripts/ci/frontend-container.sh extract

      - name: Upload frontend core diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: frontend-core-diagnostics
          path: frontend/ci-artifacts
          if-no-files-found: ignore
          retention-days: 3
      - name: Cleanup isolated frontend workspace
        if: always()
        run: bash ../scripts/ci/frontend-container.sh cleanup

  frontend-browser:
    name: Frontend browser (${{ matrix.suite }})
    needs: [frontend-core]
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    strategy:
      fail-fast: false
      # Three runner services share the host. Keep one balanced browser group
      # per runner after the core job has completed.
      max-parallel: 3
      matrix:
        suite: [journeys, ui-accessibility, ui-runtime]
    env:
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.61.1-noble
      FRONTEND_CI_VOLUME: lexigo-frontend-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
      FRONTEND_CI_SLOT: ${{ matrix.suite }}
      APP_BUILD_ID: ${{ github.sha }}
      NEXT_PUBLIC_RUM_SAMPLE_RATE: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Prepare isolated frontend workspace
        run: bash ../scripts/ci/frontend-container.sh prepare

      - name: Install locked dependencies
        run: bash ../scripts/ci/frontend-container.sh exec npm ci --no-audit --no-fund

      - name: Production build
        run: bash ../scripts/ci/frontend-container.sh exec npm run build

      - name: Lesson completion browser tests
        if: matrix.suite == 'journeys'
        run: bash ../scripts/ci/frontend-container.sh exec npm run test:e2e:lesson

      - name: Content security browser journeys
        if: matrix.suite == 'journeys'
        run: bash ../scripts/ci/frontend-container.sh exec npm run test:e2e:security

      - name: iOS PWA dictionary tests
        if: matrix.suite == 'journeys'
        run: bash ../scripts/ci/frontend-container.sh exec npm run test:e2e:pwa

      - name: React-owned UI browser tests (shard 1/2)
        if: matrix.suite == 'ui-accessibility'
        run: bash ../scripts/ci/frontend-container.sh exec npm run test:e2e:ui -- --shard=1/2

      - name: Blocking accessibility audit
        if: matrix.suite == 'ui-accessibility'
        run: bash ../scripts/ci/frontend-container.sh exec npm run test:e2e:axe

      - name: React-owned UI browser tests (shard 2/2)
        if: matrix.suite == 'ui-runtime'
        run: bash ../scripts/ci/frontend-container.sh exec npm run test:e2e:ui -- --shard=2/2

      - name: Controlled service worker update tests
        if: matrix.suite == 'ui-runtime'
        run: bash ../scripts/ci/frontend-container.sh exec npm run test:e2e:sw

      - name: Visual regression comparison
        if: matrix.suite == 'ui-runtime'
        run: bash ../scripts/ci/frontend-container.sh exec npm run test:e2e:visual

      - id: performance
        name: Low-end mobile performance budgets
        if: matrix.suite == 'ui-runtime'
        run: bash ../scripts/ci/frontend-container.sh exec npm run test:e2e:performance

      - name: Extract performance report
        if: always() && matrix.suite == 'ui-runtime' && steps.performance.outcome != 'skipped'
        run: bash ../scripts/ci/frontend-container.sh extract

      - name: Upload performance budget report
        if: failure() && matrix.suite == 'ui-runtime' && steps.performance.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: performance-budget-${{ github.sha }}
          path: frontend/ci-artifacts/test-results/performance-budget-report.json
          if-no-files-found: error
          retention-days: 3
      - name: Dictionary navigation browser smoke
        if: matrix.suite == 'ui-runtime'
        run: |
          bash ../scripts/ci/frontend-container.sh shell <<'CONTAINER_SCRIPT'
          npm run start -- --hostname 127.0.0.1 > next-start.log 2>&1 &
          app_pid=$!
          cleanup() {
            kill "$app_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 60); do
            if node -e '
              fetch("http://127.0.0.1:3000/")
                .then((response) => process.exit(response.ok ? 0 : 1))
                .catch(() => process.exit(1));
            '; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat next-start.log
            exit 1
          fi

          chromium_path="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')"
          test -x "$chromium_path"
          ln -s "$chromium_path" /usr/local/bin/chromium

          bash scripts/dictionary-navigation-smoke.sh
          CONTAINER_SCRIPT

      - name: Extract frontend diagnostics
        if: failure()
        run: bash ../scripts/ci/frontend-container.sh extract

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: frontend-playwright-report-${{ matrix.suite }}
          path: frontend/ci-artifacts
          if-no-files-found: ignore
          retention-days: 3
      - name: Cleanup isolated frontend workspace
        if: always()
        run: bash ../scripts/ci/frontend-container.sh cleanup

  frontend:
    name: Frontend quality
    needs: [frontend-core, frontend-browser]
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 5
    steps:
      - name: Verify all frontend groups passed
        env:
          CORE_RESULT: ${{ needs['frontend-core'].result }}
          BROWSER_RESULT: ${{ needs['frontend-browser'].result }}
        run: |
          set -Eeuo pipefail
          test "$CORE_RESULT" = success
          test "$BROWSER_RESULT" = success

  container-build:
    name: Container build (${{ matrix.component }})
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 30
    needs: [backend-unit, backend-integration, frontend]
    env:
      BUILDER_NAME: lexigo-buildx-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.component }}
      CI_LEASE_CONTAINER: lexigo-buildx-lease-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.component }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # BuildKit jobs share one resource-constrained self-hosted host.
      # Serialize image builds to prevent host-wide memory pressure and runner loss.
      max-parallel: 1
      matrix:
        component: [api, web]
        include:
          - component: api
            context: backend
          - component: web
            context: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Start bounded cleanup lease
        run: |
          set -Eeuo pipefail
          docker rm --force "$CI_LEASE_CONTAINER" >/dev/null 2>&1 || true
          docker run --detach --rm \
            --name "$CI_LEASE_CONTAINER" \
            --label "com.lexigo.ci=true" \
            --label "com.lexigo.ci.repository=${GITHUB_REPOSITORY}" \
            --label "com.lexigo.ci.run=${GITHUB_RUN_ID}" \
            --label "com.lexigo.ci.attempt=${GITHUB_RUN_ATTEMPT}" \
            --label "com.lexigo.ci.job=${GITHUB_JOB}" \
            --label "com.lexigo.ci.kind=lease" \
            --entrypoint sleep \
            alpine:3.22 \
            2100 >/dev/null
      - id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          name: ${{ env.BUILDER_NAME }}
          cleanup: true
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and optionally publish
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          build-args: ${{ matrix.component == 'web' && format('APP_BUILD_ID={0}', github.sha) || '' }}
          tags: |
            ghcr.io/dja-tiger/lexigo-${{ matrix.component }}:${{ github.sha }}
            ghcr.io/dja-tiger/lexigo-${{ matrix.component }}:main
          provenance: mode=max
          sbom: true

      - name: Cleanup Buildx builder
        if: always()
        run: |
          if [ -n "${BUILDER_NAME:-}" ]; then
            docker buildx rm --force "$BUILDER_NAME" >/dev/null 2>&1 || true
          fi

      - name: Stop bounded cleanup lease
        if: always()
        run: docker rm --force "$CI_LEASE_CONTAINER" >/dev/null 2>&1 || true

  ci-resource-cleanup:
    name: Cleanup CI Docker resources
    if: always()
    needs: [backend-unit, backend-integration, frontend, container-build]
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test cleanup planner
        run: python3 scripts/ci/runner_resource_cleanup_test.py

      - name: Remove resources owned by this workflow run
        id: cleanup
        if: always()
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/runner_resource_cleanup.py \
            --repository "$GITHUB_REPOSITORY" \
            --target-run-id "$GITHUB_RUN_ID" \
            --target-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --summary-file "$RUNNER_TEMP/lexigo-runner-cleanup.json"

      - name: Upload cleanup summary
        if: always() && steps.cleanup.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: runner-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lexigo-runner-cleanup.json
          if-no-files-found: error
          retention-days: 3