name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26.5", cache-dependency-path: backend/go.mod }
      - run: go mod tidy
      - run: gofmt -w .
      - name: Upload Go 1.26 formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: backend-formatted-source
          path: backend
          include-hidden-files: true
          retention-days: 3
      - run: go vet ./...
      - run: go test -race -count=1 -coverprofile=coverage.out ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...

  backend-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: lexigo_test
          POSTGRES_USER: lexigo
          POSTGRES_PASSWORD: lexigo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lexigo -d lexigo_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8.0-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults: { run: { working-directory: backend } }
    env:
      TEST_POSTGRES_DSN: postgres://lexigo:lexigo_test@localhost:5432/lexigo_test?sslmode=disable
      TEST_REDIS_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26.5", cache-dependency-path: backend/go.mod }
      - name: Run integration tests
        run: go test -race -count=1 -tags=integration ./... 2>&1 | tee integration-test.log
      - name: Upload integration test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-log
          path: backend/integration-test.log
          if-no-files-found: error
          retention-days: 3

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend-unit, backend-integration, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        component: [api, web]
        include:
          - component: api
            context: backend
          - component: web
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/dja-tiger/new-project-${{ matrix.component }}:${{ github.sha }}
            ghcr.io/dja-tiger/new-project-${{ matrix.component }}:main
