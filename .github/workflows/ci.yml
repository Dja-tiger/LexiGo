name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  integrate-lesson-result:
    name: Integrate canonical Lesson Result
    if: github.event.pull_request.head.ref == 'agent/issue-194-lesson-result'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/issue-194-lesson-result
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Decode integration output
        run: |
          set -Eeuo pipefail
          base64 --decode .tmp/lesson-result-app.b64 > frontend/components/lexigo-premium-app.tsx
          test -s frontend/components/lexigo-premium-app.tsx
          grep -Fq 'LessonResultPresentation' frontend/components/lexigo-premium-app.tsx
          grep -Fq 'buildLessonResultSnapshot' frontend/components/lexigo-premium-app.tsx

      - name: Remove temporary scaffolding
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git checkout origin/main -- \
            .github/workflows/ci.yml \
            .github/workflows/actions-storage-cleanup.yml \
            .github/workflows/deploy-scripts-check.yml \
            .github/workflows/update-visual-snapshots.yml
          rm -f \
            .github/workflows/patch-lesson-result.yml \
            scripts/ci/patch-lesson-result.py \
            scripts/ci/patch-lesson-result-error.txt \
            scripts/ci/patch-lesson-result-workflow.txt \
            frontend/scripts/ci/patch-lesson-result.py \
            frontend/scripts/ci/run-patch-lesson-result.py \
            .tmp/lesson-result-app.b64 \
            .tmp/tree-base-test.txt \
            .tmp/tree-base-test-2.txt \
            .tmp/tree-base-test-3.txt \
            .tmp/tree-base-test-4.txt

      - name: Commit clean integration
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --name-status
          git commit -m 'feat(frontend): integrate canonical Lesson Result'
          git push origin HEAD:agent/issue-194-lesson-result
