name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-unit:
    name: Backend unit and security
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: backend/go.sum
      - name: Verify dependency files
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Static analysis
        run: go vet ./...
      - name: Unit tests with race detector
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out
      - name: Vulnerability scan
        run: |
          install -d "$RUNNER_TEMP/gobin"
          GOBIN="$RUNNER_TEMP/gobin" go install golang.org/x/vuln/cmd/govulncheck@latest
          "$RUNNER_TEMP/gobin/govulncheck" ./...

  backend-integration:
    name: Backend integration
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      POSTGRES_CONTAINER: lexigo-postgres-${{ github.run_id }}-${{ github.run_attempt }}
      REDIS_CONTAINER: lexigo-redis-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: backend/go.sum

      - name: Start isolated integration services
        run: |
          set -Eeuo pipefail

          cleanup_container() {
            docker rm --force "$1" >/dev/null 2>&1 || true
          }

          wait_for_healthy() {
            local container="$1"
            local status

            for _ in $(seq 1 60); do
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$container" 2>/dev/null || true)"
              case "$status" in
                healthy)
                  return 0
                  ;;
                unhealthy)
                  docker logs "$container" || true
                  return 1
                  ;;
              esac
              sleep 1
            done

            docker logs "$container" || true
            return 1
          }

          cleanup_container "$POSTGRES_CONTAINER"
          cleanup_container "$REDIS_CONTAINER"

          docker run --detach --rm \
            --name "$POSTGRES_CONTAINER" \
            --label "com.lexigo.ci=true" \
            --label "com.lexigo.ci.run=${GITHUB_RUN_ID}" \
            --env POSTGRES_DB=lexigo_test \
            --env POSTGRES_USER=lexigo \
            --env POSTGRES_PASSWORD=lexigo_test \
            --publish 127.0.0.1::5432 \
            --health-cmd "pg_isready -U lexigo -d lexigo_test" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 20 \
            postgres:18.4-alpine >/dev/null

          docker run --detach --rm \
            --name "$REDIS_CONTAINER" \
            --label "com.lexigo.ci=true" \
            --label "com.lexigo.ci.run=${GITHUB_RUN_ID}" \
            --publish 127.0.0.1::6379 \
            --health-cmd "redis-cli ping" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 20 \
            redis:8.0-alpine >/dev/null

          wait_for_healthy "$POSTGRES_CONTAINER"
          wait_for_healthy "$REDIS_CONTAINER"

          postgres_port="$(docker port "$POSTGRES_CONTAINER" 5432/tcp | awk -F: 'END { print $NF }')"
          redis_port="$(docker port "$REDIS_CONTAINER" 6379/tcp | awk -F: 'END { print $NF }')"

          test -n "$postgres_port"
          test -n "$redis_port"

          {
            printf 'TEST_POSTGRES_DSN=postgres://lexigo:lexigo_test@127.0.0.1:%s/lexigo_test?sslmode=disable\n' "$postgres_port"
            printf 'TEST_REDIS_ADDR=127.0.0.1:%s\n' "$redis_port"
          } >> "$GITHUB_ENV"

      - name: Integration tests with race detector
        run: |
          set -o pipefail
          go test -race -count=1 -tags=integration ./... 2>&1 | tee integration-test.log

      - name: Upload integration diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-log
          path: backend/integration-test.log
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup integration services
        if: always()
        run: |
          for container in "$POSTGRES_CONTAINER" "$REDIS_CONTAINER"; do
            docker rm --force "$container" >/dev/null 2>&1 || true
          done

  frontend:
    name: Frontend quality
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    env:
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.61.1-noble
      FRONTEND_CI_VOLUME: lexigo-frontend-${{ github.run_id }}-${{ github.run_attempt }}
      APP_BUILD_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Prepare isolated frontend workspace
        run: bash ../scripts/ci/frontend-container.sh prepare

      - name: Install locked dependencies
        run: bash ../scripts/ci/frontend-container.sh exec npm ci --no-audit --no-fund

      - name: Lint
        run: |
          bash ../scripts/ci/frontend-container.sh shell <<'CONTAINER_SCRIPT'
          set -o pipefail
          npm run lint 2>&1 | tee eslint.log
          CONTAINER_SCRIPT

      - name: Type check
        run: bash ../scripts/ci/frontend-container.sh exec npm run typecheck

      - name: Unit tests
        run: bash ../scripts/ci/frontend-container.sh exec npm run test

      - name: Production build
        run: bash ../scripts/ci/frontend-container.sh exec npm run build

      - name: Lesson completion browser tests
        run: bash ../scripts/ci/frontend-container.sh exec npm run test:e2e:lesson

      - name: React-owned UI browser tests
        run: bash ../scripts/ci/frontend-container.sh exec npm run test:e2e:ui

      - name: Blocking accessibility audit
        run: bash ../scripts/ci/frontend-container.sh exec npm run test:e2e:axe

      - name: iOS PWA dictionary tests
        run: bash ../scripts/ci/frontend-container.sh exec npm run test:e2e:pwa

      - name: Controlled service worker update tests
        run: bash ../scripts/ci/frontend-container.sh exec npm run test:e2e:sw

      - name: Generate visual regression baselines
        run: bash ../scripts/ci/frontend-container.sh exec npm run test:e2e:visual:update

      - name: Extract generated visual baselines
        run: bash ../scripts/ci/frontend-container.sh extract

      - name: Upload generated visual baselines
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-baselines-${{ github.sha }}
          path: frontend/ci-artifacts/e2e/visual-regression.spec.ts-snapshots
          if-no-files-found: error
          retention-days: 7

      - name: Dictionary navigation browser smoke
        run: |
          bash ../scripts/ci/frontend-container.sh shell <<'CONTAINER_SCRIPT'
          npm run start -- --hostname 127.0.0.1 > next-start.log 2>&1 &
          app_pid=$!
          cleanup() {
            kill "$app_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 60); do
            if node -e '
              fetch("http://127.0.0.1:3000/")
                .then((response) => process.exit(response.ok ? 0 : 1))
                .catch(() => process.exit(1));
            '; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat next-start.log
            exit 1
          fi

          chromium_path="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')"
          test -x "$chromium_path"
          ln -s "$chromium_path" /usr/local/bin/chromium

          bash scripts/dictionary-navigation-smoke.sh
          CONTAINER_SCRIPT

      - name: Production dependency audit
        run: bash ../scripts/ci/frontend-container.sh exec npm audit --omit=dev --audit-level=high

      - name: Extract frontend diagnostics
        if: failure()
        run: bash ../scripts/ci/frontend-container.sh extract

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-playwright-report
          path: frontend/ci-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup isolated frontend workspace
        if: always()
        run: bash ../scripts/ci/frontend-container.sh cleanup

  container-build:
    name: Container build (${{ matrix.component }})
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 30
    needs: [backend-unit, backend-integration, frontend]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # BuildKit jobs share one resource-constrained self-hosted host.
      # Serialize image builds to prevent host-wide memory pressure and runner loss.
      max-parallel: 1
      matrix:
        component: [api, web]
        include:
          - component: api
            context: backend
          - component: web
            context: frontend
    steps:
      - uses: actions/checkout@v7
      - id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          cleanup: true
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and optionally publish
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          build-args: ${{ matrix.component == 'web' && format('APP_BUILD_ID={0}', github.sha) || '' }}
          tags: |
            ghcr.io/dja-tiger/lexigo-${{ matrix.component }}:${{ github.sha }}
            ghcr.io/dja-tiger/lexigo-${{ matrix.component }}:main
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }},ignore-error=true
          provenance: mode=max
          sbom: true

      - name: Cleanup Buildx builder
        if: always()
        env:
          BUILDER_NAME: ${{ steps.buildx.outputs.name }}
        run: |
          if [ -n "${BUILDER_NAME:-}" ]; then
            docker buildx rm --force "$BUILDER_NAME" >/dev/null 2>&1 || true
          fi

  ci-resource-cleanup:
    name: Cleanup CI Docker resources
    if: always()
    needs: [backend-unit, backend-integration, frontend, container-build]
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 10
    env:
      FRONTEND_CI_VOLUME: lexigo-frontend-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Remove resources owned by this workflow run
        run: |
          set -Eeuo pipefail

          mapfile -t containers < <(
            docker ps --all --quiet --filter "label=com.lexigo.ci.run=${GITHUB_RUN_ID}"
          )
          if ((${#containers[@]} > 0)); then
            docker rm --force "${containers[@]}" >/dev/null 2>&1 || true
          fi

          docker volume rm --force "$FRONTEND_CI_VOLUME" >/dev/null 2>&1 || true
          docker volume prune --force \
            --filter "label=com.lexigo.ci.run=${GITHUB_RUN_ID}" >/dev/null 2>&1 || true

          printf 'Docker usage after run cleanup:\n'
          docker system df
