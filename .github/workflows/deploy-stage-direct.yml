name: Deploy Stage Direct

on:
  push:
    paths:
      - .github/workflows/deploy-stage-direct.yml

permissions:
  contents: read
  packages: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: stage
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload bundle
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          tar -czf /tmp/lexigo-deploy.tgz deploy scripts/remote-deploy.sh
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "install -d -m 755 '$DEPLOY_PATH'"
          scp /tmp/lexigo-deploy.tgz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/lexigo-deploy.tgz"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "tar -xzf /tmp/lexigo-deploy.tgz -C '$DEPLOY_PATH' && rm -f /tmp/lexigo-deploy.tgz"

      - name: Deploy
        id: deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          printf '%s' "$GHCR_TOKEN" | ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash '$DEPLOY_PATH/scripts/remote-deploy.sh' stage 'a6f990906877d27a931f8baecc96bfb2b95345f1' 'http://$DEPLOY_HOST' '${{ github.actor }}'" \
            2>&1 | tee /tmp/lexigo-direct-deploy.log

      - name: Report
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('/tmp/lexigo-direct-deploy.log')
              ? fs.readFileSync('/tmp/lexigo-direct-deploy.log', 'utf8').slice(-10000)
              : 'deploy log was not created';
            const body = [
              '# LexiGo direct stage diagnostic',
              '',
              `- result: **${process.env.RESULT}**`,
              `- run_id: \`${process.env.RUN_ID}\``,
              '',
              '```text',
              log,
              '```'
            ].join('\n');
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 12,
              body
            });
