name: Self Review Issue 42

on:
  pull_request:

permissions:
  contents: write

jobs:
  self-review:
    if: >-
      github.head_ref == 'fix/issue-42-session-hydration' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 35
    env:
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.61.1-noble
      FRONTEND_CI_VOLUME: lexigo-issue42-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-42-session-hydration
      - name: Apply deterministic self-review patch
        run: |
          python3 scripts/self_review_issue_42.py
          python3 scripts/fix_issue_42_hydration_race.py
          git diff --check
      - name: Prepare isolated frontend workspace
        working-directory: frontend
        run: bash ../scripts/ci/frontend-container.sh prepare
      - name: Install locked dependencies
        working-directory: frontend
        run: bash ../scripts/ci/frontend-container.sh exec npm ci --no-audit --no-fund
      - name: Verify frontend contracts
        working-directory: frontend
        run: |
          bash ../scripts/ci/frontend-container.sh exec npm run lint
          bash ../scripts/ci/frontend-container.sh exec npm run typecheck
          bash ../scripts/ci/frontend-container.sh exec npm test
          bash ../scripts/ci/frontend-container.sh exec npm run build
          bash ../scripts/ci/frontend-container.sh exec npm run test:e2e:ui
      - name: Extract browser diagnostics
        if: failure()
        working-directory: frontend
        run: bash ../scripts/ci/frontend-container.sh extract
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: issue-42-self-review-diagnostics
          path: frontend/ci-artifacts
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit reviewed product diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/components/lexigo-premium-app.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(session): render explicit hydration states"
          git push origin HEAD:fix/issue-42-session-hydration
      - name: Cleanup isolated frontend workspace
        if: always()
        working-directory: frontend
        run: bash ../scripts/ci/frontend-container.sh cleanup
