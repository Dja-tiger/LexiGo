name: Apply incident 118 scroll fix

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/incident-118-ios-scroll-history
          fetch-depth: 0

      - name: Apply bounded scroll snapshot patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              content = path.read_text()
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {count}")
              path.write_text(content.replace(old, new, 1))

          premium = Path("frontend/components/lexigo-premium-app.tsx")
          replace_once(
              premium,
              '} from "../lib/navigation-history";\n',
              '} from "../lib/navigation-history";\n'
              'import { createScrollSnapshotScheduler } from "../lib/navigation-scroll-snapshot";\n',
          )
          replace_once(premium, "    let scrollFrame = 0;\n\n", "")

          old_scheduler = (
              "    const scheduleScrollSnapshot = () => {\n"
              "      if (scrollFrame) return;\n"
              "      scrollFrame = window.requestAnimationFrame(() => {\n"
              "        scrollFrame = 0;\n"
              "        persistCurrentEntry();\n"
              "      });\n"
              "    };\n"
          )
          new_scheduler = (
              "    const scrollSnapshots = createScrollSnapshotScheduler(\n"
              "      persistCurrentEntry,\n"
              "      {\n"
              "        setTimeout: (callback, delayMilliseconds) => window.setTimeout(callback, delayMilliseconds),\n"
              "        clearTimeout: (timerID) => window.clearTimeout(timerID),\n"
              "      },\n"
              "    );\n"
              "    const scheduleScrollSnapshot = () => scrollSnapshots.schedule();\n"
              "    const flushScrollSnapshot = () => scrollSnapshots.flush();\n"
              "    const flushScrollSnapshotWhenHidden = () => {\n"
              "      if (document.visibilityState === \"hidden\") flushScrollSnapshot();\n"
              "    };\n"
          )
          replace_once(premium, old_scheduler, new_scheduler)

          old_listeners = (
              '    window.addEventListener("popstate", syncNavigationFromHistory);\n'
              '    window.addEventListener("scroll", scheduleScrollSnapshot, { passive: true });\n'
              '    return () => {\n'
              '      if (scrollFrame) window.cancelAnimationFrame(scrollFrame);\n'
              '      window.history.scrollRestoration = previousScrollRestoration;\n'
              '      window.removeEventListener("popstate", syncNavigationFromHistory);\n'
              '      window.removeEventListener("scroll", scheduleScrollSnapshot);\n'
              '    };\n'
          )
          new_listeners = (
              '    window.addEventListener("popstate", syncNavigationFromHistory);\n'
              '    window.addEventListener("scroll", scheduleScrollSnapshot, { passive: true });\n'
              '    window.addEventListener("pagehide", flushScrollSnapshot);\n'
              '    document.addEventListener("visibilitychange", flushScrollSnapshotWhenHidden);\n'
              '    return () => {\n'
              '      flushScrollSnapshot();\n'
              '      scrollSnapshots.cancel();\n'
              '      window.history.scrollRestoration = previousScrollRestoration;\n'
              '      window.removeEventListener("popstate", syncNavigationFromHistory);\n'
              '      window.removeEventListener("scroll", scheduleScrollSnapshot);\n'
              '      window.removeEventListener("pagehide", flushScrollSnapshot);\n'
              '      document.removeEventListener("visibilitychange", flushScrollSnapshotWhenHidden);\n'
              '    };\n'
          )
          replace_once(premium, old_listeners, new_listeners)

          routes = Path("frontend/e2e/app-router-routes.spec.ts")
          replace_once(
              routes,
              '  const errors: string[] = [];\n  page.on("pageerror", (error) => {\n',
              '  const errors: string[] = [];\n'
              '  page.on("crash", () => errors.push("pagecrash: WebKit renderer terminated"));\n'
              '  page.on("pageerror", (error) => {\n',
          )
          old_route_scroll = (
              '    await page.evaluate(() => window.scrollTo(0, document.documentElement.scrollHeight));\n'
              '    await page.waitForTimeout(1_250);\n'
              '    await expect(page.getByTestId("application-error-boundary")).toHaveCount(0);\n'
          )
          new_route_scroll = (
              '    await page.evaluate(async () => {\n'
              '      type CountedHistory = History & { __lexigoReplaceStateCalls?: number };\n'
              '      const countedHistory = window.history as CountedHistory;\n'
              '      const originalReplaceState = countedHistory.replaceState.bind(countedHistory);\n'
              '      countedHistory.__lexigoReplaceStateCalls = 0;\n'
              '      countedHistory.replaceState = (data, unused, url) => {\n'
              '        countedHistory.__lexigoReplaceStateCalls = (countedHistory.__lexigoReplaceStateCalls ?? 0) + 1;\n'
              '        originalReplaceState(data, unused, url);\n'
              '      };\n\n'
              '      const maximumScroll = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);\n'
              '      for (let index = 0; index < 48; index += 1) {\n'
              '        window.scrollTo({ top: index % 2 === 0 ? maximumScroll : 0, behavior: "auto" });\n'
              '        window.dispatchEvent(new Event("scroll"));\n'
              '        await new Promise<void>((resolve) => window.requestAnimationFrame(() => resolve()));\n'
              '      }\n'
              '    });\n'
              '    await page.waitForTimeout(750);\n'
              '    const historyWrites = await page.evaluate(() => (\n'
              '      window.history as History & { __lexigoReplaceStateCalls?: number }\n'
              '    ).__lexigoReplaceStateCalls ?? 0);\n'
              '    expect(historyWrites).toBeLessThanOrEqual(3);\n'
              '    await expect(page.getByTestId("application-error-boundary")).toHaveCount(0);\n'
          )
          replace_once(routes, old_route_scroll, new_route_scroll)

          public_smoke = Path("frontend/e2e/public-runtime-smoke.spec.ts")
          replace_once(
              public_smoke,
              '  const errors: string[] = [];\n'
              '  page.on("pageerror", (error) => errors.push(`pageerror: ${error.name}: ${error.message}`));\n',
              '  const errors: string[] = [];\n'
              '  page.on("crash", () => errors.push("pagecrash: browser renderer terminated"));\n'
              '  page.on("pageerror", (error) => errors.push(`pageerror: ${error.name}: ${error.message}`));\n',
          )
          old_public_scroll = (
              '    await page.evaluate(() => {\n'
              '      window.scrollTo({ top: document.documentElement.scrollHeight, behavior: "auto" });\n'
              '      window.dispatchEvent(new Event("scroll"));\n'
              '    });\n'
              '    await page.waitForTimeout(1_750);\n'
          )
          new_public_scroll = (
              '    await page.evaluate(async () => {\n'
              '      const maximumScroll = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);\n'
              '      for (let index = 0; index < 48; index += 1) {\n'
              '        window.scrollTo({ top: index % 2 === 0 ? maximumScroll : 0, behavior: "auto" });\n'
              '        window.dispatchEvent(new Event("scroll"));\n'
              '        await new Promise<void>((resolve) => window.requestAnimationFrame(() => resolve()));\n'
              '      }\n'
              '    });\n'
              '    await page.waitForTimeout(2_000);\n'
          )
          replace_once(public_smoke, old_public_scroll, new_public_scroll)
          PY

          git diff --check

      - name: Commit patch
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/components/lexigo-premium-app.tsx frontend/e2e/app-router-routes.spec.ts frontend/e2e/public-runtime-smoke.spec.ts
          git commit -m "fix(navigation): bound scroll history writes on WebKit"
          git push origin HEAD:agent/incident-118-ios-scroll-history
