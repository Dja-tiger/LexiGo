name: Apply Issue 36 Metadata Fix

on:
  push:
    branches: [fix/issue-36-react-owned-ui]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-36-react-owned-ui
          fetch-depth: 0
      - name: Preserve expanded phrase metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/components/lexigo-premium-app.tsx')
          text = path.read_text()
          old = '? TECHNICAL_PHRASES.find((phrase) => phrase.id === item.slug || phrase.prompt === item.lemma)'
          new = '? DEFAULT_PHRASE_CATALOG.find((phrase) => phrase.id === item.slug || phrase.prompt === item.lemma)'
          if text.count(old) != 1:
              raise SystemExit(f'expected one metadata fallback, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit metadata correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/components/lexigo-premium-app.tsx
          git commit -m "fix(phrases): preserve expanded catalog metadata"
          git push origin HEAD:fix/issue-36-react-owned-ui
