name: Finalize Issue 41

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.head_ref == 'fix/issue-41-catalog-metadata' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-41-catalog-metadata
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply self-review fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one marker, found {count}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          component = Path("frontend/components/lexigo-premium-app.tsx")
          component_text = component.read_text(encoding="utf-8")
          error_copy_count = component_text.count('"total недоступен"')
          if error_copy_count not in (0, 2):
              raise SystemExit(f"unexpected unavailable copy count: {error_copy_count}")
          component.write_text(component_text.replace('"total недоступен"', '"общее количество недоступно"'), encoding="utf-8")

          catalog_old = "\t\t\t\tsource = excluded.source,\n\t\t\t\tupdated_at = now()\n"
          catalog_new = "\t\t\t\tsource = excluded.source,\n\t\t\t\tupdated_at = now()\n\t\t\twhere (words.part_of_speech, words.topic, words.note, words.source)\n\t\t\t\tis distinct from (excluded.part_of_speech, excluded.topic, excluded.note, excluded.source)\n"
          replace_once("backend/internal/catalog/catalog.go", catalog_old, catalog_new, "idempotent catalog upsert")

          integration_old = "\tconditional.Header.Set(\"If-None-Match\", etag)\n\tread(conditional, http.StatusNotModified)\n\n\tif _, err := pg.Exec(ctx, `\n"
          integration_new = "\tconditional.Header.Set(\"If-None-Match\", etag)\n\tread(conditional, http.StatusNotModified)\n\n\tif _, err := catalog.Seed(ctx, pg); err != nil {\n\t\tt.Fatalf(\"repeat catalog.Seed() error = %v\", err)\n\t}\n\treseedRequest, err := http.NewRequest(http.MethodGet, testServer.URL+\"/api/v1/catalog/metadata\", nil)\n\tif err != nil {\n\t\tt.Fatalf(\"create reseeded metadata request: %v\", err)\n\t}\n\treseeded, reseededHeaders := read(reseedRequest, http.StatusOK)\n\tif reseeded.CatalogVersion != first.CatalogVersion || !reseeded.UpdatedAt.Equal(first.UpdatedAt) {\n\t\tt.Fatalf(\"idempotent seed changed catalog identity: before=%+v after=%+v\", first, reseeded)\n\t}\n\tif reseededHeaders.Get(\"ETag\") != etag {\n\t\tt.Fatalf(\"idempotent seed changed ETag: before=%q after=%q\", etag, reseededHeaders.Get(\"ETag\"))\n\t}\n\n\tif _, err := pg.Exec(ctx, `\n"
          replace_once("backend/integration/catalog_metadata_test.go", integration_old, integration_new, "stable metadata after idempotent seed")

          aliases_old = "  it(\"maps all product source aliases\", () => {\n    expect(catalogSourceCount(metadata, \"mixed\")).toBe(923);\n    expect(catalogSourceCount(metadata, \"daily-life\")).toBe(55);\n    expect(catalogSourceCount(metadata, \"data-engineering\")).toBe(55);\n    expect(catalogSourceCount(metadata, \"backend\")).toBe(55);\n  });\n"
          aliases_new = "  it(\"maps every product source alias\", () => {\n    expect(catalogSourceCount(metadata, \"mixed\")).toBe(923);\n    expect(catalogSourceCount(metadata, \"noun\")).toBe(383);\n    expect(catalogSourceCount(metadata, \"verb\")).toBe(179);\n    expect(catalogSourceCount(metadata, \"adjective\")).toBe(193);\n    expect(catalogSourceCount(metadata, \"phrases\")).toBe(124);\n    expect(catalogSourceCount(metadata, \"daily-life\")).toBe(55);\n    expect(catalogSourceCount(metadata, \"travel\")).toBe(55);\n    expect(catalogSourceCount(metadata, \"data-engineering\")).toBe(55);\n    expect(catalogSourceCount(metadata, \"backend\")).toBe(55);\n  });\n"
          replace_once("frontend/lib/catalog-metadata.test.ts", aliases_old, aliases_new, "all catalog source aliases")
          PY
          gofmt -w backend/internal/catalog/catalog.go backend/integration/catalog_metadata_test.go
          git diff --check
      - name: Verify focused contracts
        run: |
          (cd backend && go test ./internal/catalog ./internal/words ./internal/server && go test -run '^$' -tags=integration ./integration)
          (cd frontend && npm ci --no-audit --no-fund && npm run lint && npm run typecheck && npm test && npm run build)
      - name: Commit self-review fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/catalog/catalog.go backend/integration/catalog_metadata_test.go frontend/components/lexigo-premium-app.tsx frontend/lib/catalog-metadata.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(catalog): keep metadata identity stable"
          git push origin HEAD:fix/issue-41-catalog-metadata
