name: Apply Issue 66 Core Copy

on:
  push:
    branches:
      - agent/issue-66-core-interface-copy
    paths:
      - .github/workflows/issue-66-core-copy-apply.yml

concurrency:
  group: issue-66-core-copy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on:
      - self-hosted
      - linux
      - x64
      - lexigo-ci
    timeout-minutes: 45
    env:
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.61.1-noble
      FRONTEND_CI_VOLUME: lexigo-issue-66-copy-${{ github.run_id }}-${{ github.run_attempt }}
      FRONTEND_CI_SLOT: issue-66-copy
      APP_BUILD_ID: ${{ github.sha }}
      NEXT_PUBLIC_RUM_SAMPLE_RATE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/issue-66-core-interface-copy

      - name: Apply guarded source transformation
        run: python3 scripts/apply_issue_66_core_copy.py

      - name: Prepare isolated frontend workspace
        run: bash scripts/ci/frontend-container.sh prepare

      - name: Install locked dependencies
        run: cd frontend && bash ../scripts/ci/frontend-container.sh exec npm ci --no-audit --no-fund

      - name: Type check
        run: cd frontend && bash ../scripts/ci/frontend-container.sh exec npm run typecheck

      - name: Unit tests
        run: cd frontend && bash ../scripts/ci/frontend-container.sh exec npm run test

      - name: Production build
        run: cd frontend && bash ../scripts/ci/frontend-container.sh exec npm run build

      - name: Interface copy browser contract
        run: cd frontend && bash ../scripts/ci/frontend-container.sh exec npx playwright test e2e/interface-copy.spec.ts --project=desktop-chromium

      - name: Refresh deterministic visual baselines
        run: cd frontend && bash ../scripts/ci/frontend-container.sh exec npm run test:e2e:visual:update

      - name: Extract generated visual baselines
        run: cd frontend && bash ../scripts/ci/frontend-container.sh extract

      - name: Synchronize visual baselines
        run: |
          set -Eeuo pipefail
          source_dir="frontend/ci-artifacts/e2e/visual-regression.spec.ts-snapshots"
          target_dir="frontend/e2e/visual-regression.spec.ts-snapshots"
          test -d "$source_dir"
          cp -a "$source_dir"/. "$target_dir"/

      - name: Cleanup isolated frontend workspace
        if: always()
        run: bash scripts/ci/frontend-container.sh cleanup

      - name: Verify focused diff
        run: |
          set -Eeuo pipefail
          git diff --check

          allowed='^(frontend/components/lexigo-premium-app\.tsx|frontend/lib/interface-copy\.ts|frontend/lib/interface-copy\.test\.ts|frontend/lib/lesson-composition\.ts|frontend/lib/lesson-composition\.test\.ts|frontend/e2e/interface-copy\.spec\.ts|frontend/package\.json|frontend/e2e/visual-regression\.spec\.ts-snapshots/(home|lesson-composer|progress|calendar-dialog)-visual-(compact|medium|desktop)-linux\.png|scripts/apply_issue_66_core_copy\.py|\.github/workflows/issue-66-core-copy-apply\.yml)$'
          unexpected="$(git status --short | awk '{print $2}' | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected changed files:\n%s\n' "$unexpected" >&2
            exit 1
          fi

          git diff -- frontend/components/lexigo-premium-app.tsx

      - name: Commit verified source and tests
        run: |
          set -Eeuo pipefail
          rm -f scripts/apply_issue_66_core_copy.py .github/workflows/issue-66-core-copy-apply.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(frontend): unify core interface terminology"
          git push origin HEAD:agent/issue-66-core-interface-copy
