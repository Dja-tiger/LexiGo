name: One-shot remove legacy Learn

on:
  push:
    branches:
      - refactor/issue-70-remove-legacy-learn
    paths:
      - .github/workflows/one-shot-remove-legacy-learn.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/issue-70-remove-legacy-learn
          fetch-depth: 0
      - name: Remove bounded legacy Learn presentation
        shell: python
        run: |
          from pathlib import Path

          runtime_path = Path('frontend/components/lexigo-premium-app.tsx')
          runtime = runtime_path.read_text()
          start = runtime.index('  function renderLearn() {')
          end = runtime.index('  async function changeAllItemsPage', start)
          runtime = runtime[:start] + runtime[end:]
          old_dispatch = '''  const view = navigation.view === "learn" ? renderLearn()\n  : navigation.view === "library" ? renderLibrary()\n    : navigation.view === "profile" ? renderProfile()\n      : renderLesson();'''
          new_dispatch = '''  const view = navigation.view === "library" ? renderLibrary()\n    : navigation.view === "profile" ? renderProfile()\n      : renderLesson();'''
          if old_dispatch not in runtime:
              raise SystemExit('legacy Learn dispatch marker not found')
          runtime = runtime.replace(old_dispatch, new_dispatch, 1)
          runtime_path.write_text(runtime)

          test_path = Path('frontend/components/learn-route-island-source.test.ts')
          test = test_path.read_text()
          old_test = '''  it("renders the canonical Learn island before the compatibility fallback while preserving the bounded legacy candidate", () => {\n    const bootstrappedApp = readComponent("lexigo-bootstrapped-app.tsx");\n    const premiumApp = readComponent("lexigo-premium-app.tsx");\n\n    const learnBranch = bootstrappedApp.indexOf(") : useLearnIsland ? (");\n    const learnRender = bootstrappedApp.indexOf("<LexigoLearnApp", learnBranch);\n    const fallbackRender = bootstrappedApp.indexOf("<LexigoPremiumApp", learnRender);\n\n    expect(learnBranch).toBeGreaterThan(-1);\n    expect(learnRender).toBeGreaterThan(learnBranch);\n    expect(fallbackRender).toBeGreaterThan(learnRender);\n    expect(premiumApp).toContain("function renderLearn()");\n    expect(premiumApp).toContain('navigation.view === "learn" ? renderLearn()');\n    expect(premiumApp).toContain("async function startLesson(");\n    expect(premiumApp).toContain("requestAuthentication(");\n    expect(premiumApp).toContain("function renderLibrary()");\n    expect(premiumApp).toContain("function renderProfile()");\n    expect(premiumApp).toContain("function renderLesson()");\n  });'''
          new_test = '''  it("renders the canonical Learn island before the compatibility fallback while excluding the retired legacy presentation", () => {\n    const bootstrappedApp = readComponent("lexigo-bootstrapped-app.tsx");\n    const premiumApp = readComponent("lexigo-premium-app.tsx");\n\n    const learnBranch = bootstrappedApp.indexOf(") : useLearnIsland ? (");\n    const learnRender = bootstrappedApp.indexOf("<LexigoLearnApp", learnBranch);\n    const fallbackRender = bootstrappedApp.indexOf("<LexigoPremiumApp", learnRender);\n\n    expect(learnBranch).toBeGreaterThan(-1);\n    expect(learnRender).toBeGreaterThan(learnBranch);\n    expect(fallbackRender).toBeGreaterThan(learnRender);\n    expect(premiumApp).not.toContain("function renderLearn()");\n    expect(premiumApp).not.toContain('navigation.view === "learn" ? renderLearn()');\n    expect(premiumApp).toContain("async function startLesson(");\n    expect(premiumApp).toContain("requestAuthentication(");\n    expect(premiumApp).toContain("function renderLibrary()");\n    expect(premiumApp).toContain("function renderProfile()");\n    expect(premiumApp).toContain("function renderLesson()");\n  });'''
          if old_test not in test:
              raise SystemExit('Learn source-contract marker not found')
          test_path.write_text(test.replace(old_test, new_test, 1))
      - name: Verify bounded diff
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' frontend/components/learn-route-island-source.test.ts frontend/components/lexigo-premium-app.tsx | sort)"
          test "$changed" = "$expected"
          ! grep -q 'function renderLearn()' frontend/components/lexigo-premium-app.tsx
          ! grep -q 'navigation.view === "learn" ? renderLearn()' frontend/components/lexigo-premium-app.tsx
          grep -q 'async function startLesson' frontend/components/lexigo-premium-app.tsx
      - name: Commit bounded runtime deletion
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/components/lexigo-premium-app.tsx frontend/components/learn-route-island-source.test.ts
          git commit -m "refactor(frontend): remove legacy Learn presentation"
          git push origin HEAD:refactor/issue-70-remove-legacy-learn
