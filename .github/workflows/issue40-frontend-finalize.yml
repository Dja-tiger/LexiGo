name: Finalize Issue 40 Frontend

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.head_ref == 'fix/issue-40-mixed-lesson-composer' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-40-mixed-lesson-composer
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply frontend finalizer
        run: |
          python scripts/issue40_frontend_finalizer.py
          git diff --check
      - name: Verify frontend and lesson browser matrix
        working-directory: frontend
        run: |
          set -o pipefail
          {
            npm ci --no-audit --no-fund
            npm run lint
            npm run typecheck
            npm test
            npm run build
            npx playwright install --with-deps chromium webkit
            npm run test:e2e:lesson
          } 2>&1 | tee ../issue40-finalizer.log
      - name: Upload finalizer diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: issue40-frontend-finalizer-diagnostics
          path: |
            issue40-finalizer.log
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: warn
      - name: Commit product files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/components/lexigo-premium-app.tsx frontend/e2e/lesson-flow.spec.ts
          git commit -m "test(lesson): cover mixed home review composition"
          git push origin HEAD:fix/issue-40-mixed-lesson-composer
