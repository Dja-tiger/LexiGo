name: Fix issue 47 lesson selector assertion

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'fix/issue-47-semantic-controls' && github.actor != 'github-actions[bot]'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-47-semantic-controls
          fetch-depth: 0

      - name: Update remaining role locator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("frontend/e2e/lesson-flow.spec.ts")
          source = path.read_text()
          old = 'await page.getByRole("button", { name: /Вспомнить самому/ }).click();'
          new = 'await page.getByRole("radio", { name: /Вспомнить самому/ }).click();'
          if source.count(old) != 1:
              raise SystemExit(f"expected one remaining locator, found {source.count(old)}")
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Commit correction and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/issue47-fix-lesson-selector.yml
          git add frontend/e2e/lesson-flow.spec.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(a11y): use radio role in mixed lesson setup"
          git push origin HEAD:fix/issue-47-semantic-controls
