name: Adjust issue 48 accessibility assertion

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  adjust:
    if: github.head_ref == 'fix/issue-48-calendar-dialog-focus-trap' && github.actor != 'github-actions[bot]'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-48-calendar-dialog-focus-trap
          fetch-depth: 0

      - name: Update existing dialog focus assertion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('frontend/e2e/accessibility-keyboard.spec.ts')
          source = path.read_text()
          old = '''  const dialog = page.getByRole("dialog", { name: "Напоминание об английском" });
            await expect(dialog).toBeVisible();
            const close = dialog.getByRole("button", { name: "Закрыть" });
            const apple = dialog.getByRole("button", { name: /Apple Calendar/ });
            await expect(close).toBeFocused();
            await expectVisibleFocusRing(close);

            await page.keyboard.press("Shift+Tab");
            await expect(apple).toBeFocused();
            await page.keyboard.press("Tab");
            await expect(close).toBeFocused();'''
          new = '''  const dialog = page.getByRole("dialog", { name: "Напоминание об английском" });
            await expect(dialog).toBeVisible();
            const title = dialog.getByRole("heading", { name: "Напоминание об английском" });
            const close = dialog.getByRole("button", { name: "Закрыть" });
            const apple = dialog.getByRole("button", { name: /Apple Calendar/ });
            await expect(title).toBeFocused();
            await expectVisibleFocusRing(title);

            await page.keyboard.press("Tab");
            await expect(close).toBeFocused();
            await title.focus();
            await page.keyboard.press("Shift+Tab");
            await expect(apple).toBeFocused();
            await page.keyboard.press("Tab");
            await expect(close).toBeFocused();'''
          if source.count(old) != 1:
              raise SystemExit(f'expected one accessibility block, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Commit assertion and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/issue48-adjust-existing-a11y.yml
          git add frontend/e2e/accessibility-keyboard.spec.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(a11y): expect calendar dialog title focus"
          git push origin HEAD:fix/issue-48-calendar-dialog-focus-trap
