name: Rebuild Lesson Result integration

on:
  pull_request:
    paths:
      - .github/workflows/rebuild-lesson-result.yml
      - scripts/ci/patch-lesson-result.py

permissions:
  contents: write

jobs:
  rebuild:
    name: Rebuild canonical Lesson Result sources
    if: github.event.pull_request.head.ref == 'agent/issue-194-lesson-result'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/issue-194-lesson-result
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Restore canonical integration bases
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git checkout origin/main -- \
            frontend/components/lexigo-premium-app.tsx \
            frontend/app/layout.tsx \
            frontend/package.json \
            frontend/e2e/next-lesson-progression.spec.ts

      - name: Apply duplicate-safe deterministic codemod
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/ci/patch-lesson-result.py')
          source = path.read_text()
          helper_marker = '\ndef replace_regex(text: str, pattern: str, replacement: str, label: str) -> str:\n'
          helper = '''
def replace_first(text: str, old: str, new: str, label: str) -> str:
    if old not in text:
        raise RuntimeError(f"{label}: expected at least one match")
    return text.replace(old, new, 1)

'''
          if 'def replace_first(' not in source:
              if helper_marker not in source:
                  raise RuntimeError('replace_regex helper marker missing')
              source = source.replace(helper_marker, helper + helper_marker, 1)

          lines = source.splitlines()
          label_index = next(index for index, line in enumerate(lines) if '"progress resource ref"' in line)
          call_index = max(index for index in range(label_index) if lines[index] == 'app = replace_once(')
          lines[call_index] = 'app = replace_first('
          path.write_text('\n'.join(lines) + '\n')
          PY
          python3 scripts/ci/patch-lesson-result.py

      - name: Normalize changed test projection and verify full source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          spec_path = Path('frontend/e2e/next-lesson-progression.spec.ts')
          spec = spec_path.read_text()
          old = 'const WORDS = BLOCKS.flat().map(({ position: _position, ...item }) => item);'
          new = '''const WORDS = BLOCKS.flat().map(({ position, ...item }) => {
  void position;
  return item;
});'''
          if old in spec:
              spec = spec.replace(old, new, 1)
          spec_path.write_text(spec)
          PY
          test "$(wc -l < frontend/components/lexigo-premium-app.tsx)" -gt 3000
          grep -Fq 'export function LexigoPremiumApp' frontend/components/lexigo-premium-app.tsx
          grep -Fq 'LessonResultPresentation' frontend/components/lexigo-premium-app.tsx
          grep -Fq 'buildLessonResultSnapshot' frontend/components/lexigo-premium-app.tsx
          grep -Fq 'import "./lesson-result.css";' frontend/app/layout.tsx

      - name: Commit clean rebuilt integration
        run: |
          set -Eeuo pipefail
          rm .github/workflows/rebuild-lesson-result.yml scripts/ci/patch-lesson-result.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(frontend): rebuild complete Lesson Result integration'
          git push origin HEAD:agent/issue-194-lesson-result
