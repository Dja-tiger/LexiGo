name: OpenPencil issue 201 inspect

on:
  push:
    branches:
      - design/issue-201-first-use-openpencil
    paths:
      - .github/workflows/openpencil-issue-201-inspect.yml

permissions:
  contents: read

concurrency:
  group: openpencil-issue-201-inspect-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    if: github.ref == 'refs/heads/design/issue-201-first-use-openpencil'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      OPENPENCIL_IMAGE: ghcr.io/zseven-w/openpencil-web:v0.8.2@sha256:e13982f18ba3f87ef422c84738be261a337ceccd877aff6ea69a16354fce9775
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Guard branch and source identity
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/design/issue-201-first-use-openpencil
          test "$(sha256sum 'design/openpencil/LexiGo Design System.op' | awk '{print $1}')" = 5380a0468d4e369d91ac190b829e01f60ff43493f6a76c9300c6b58d0b34d664
          test "$(sha256sum 'design/openpencil/LexiGo Design Tokens.json' | awk '{print $1}')" = e603d86f3d4ef470c39fd72c31433e6a124bb9371da6f333567cd3aa796ae05c

      - name: Start disposable file-backed OpenPencil MCP
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/openpencil-201-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$root/worktree/design/openpencil" "$root/state" "$root/backups" .tmp/openpencil-issue-201
          cp 'design/openpencil/LexiGo Design System.op' "$root/worktree/design/openpencil/LexiGo Design System.op"
          cp 'design/openpencil/LexiGo Design Tokens.json' "$root/worktree/design/openpencil/LexiGo Design Tokens.json"
          export OPENPENCIL_WORKTREE="$root/worktree"
          export OPENPENCIL_STATE_DIR="$root/state"
          export OPENPENCIL_BACKUP_DIR="$root/backups"
          export OPENPENCIL_UID="$(id -u)"
          export OPENPENCIL_GID="$(id -g)"
          export OPENPENCIL_BACKUP_KEEP=1
          export OPENPENCIL_MCP_PORT="$((45000 + GITHUB_RUN_ID % 1000))"
          export OPENPENCIL_COMPOSE_PROJECT="lexigo-op-201-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "OPENPENCIL_WORKTREE=$OPENPENCIL_WORKTREE"
            echo "OPENPENCIL_STATE_DIR=$OPENPENCIL_STATE_DIR"
            echo "OPENPENCIL_BACKUP_DIR=$OPENPENCIL_BACKUP_DIR"
            echo "OPENPENCIL_UID=$OPENPENCIL_UID"
            echo "OPENPENCIL_GID=$OPENPENCIL_GID"
            echo "OPENPENCIL_BACKUP_KEEP=$OPENPENCIL_BACKUP_KEEP"
            echo "OPENPENCIL_MCP_PORT=$OPENPENCIL_MCP_PORT"
            echo "OPENPENCIL_COMPOSE_PROJECT=$OPENPENCIL_COMPOSE_PROJECT"
          } >> "$GITHUB_ENV"
          docker pull "$OPENPENCIL_IMAGE"
          docker compose -p "$OPENPENCIL_COMPOSE_PROJECT" -f deploy/openpencil/compose.yml --profile agent up -d mcp
          python3 - <<'PY'
          import json, os, time, urllib.request
          url=f"http://127.0.0.1:{os.environ['OPENPENCIL_MCP_PORT']}/mcp"
          body=json.dumps({"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"lexigo-issue-201-inspect","version":"1"}}}).encode()
          for _ in range(90):
              try:
                  req=urllib.request.Request(url,data=body,headers={"Content-Type":"application/json"},method="POST")
                  with urllib.request.urlopen(req,timeout=2) as response:
                      payload=json.loads(response.read().decode())
                  if "result" in payload:
                      break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("OpenPencil MCP readiness timeout")
          PY

      - name: Inspect First Use nodes and render source evidence
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          OUT=Path('.tmp/openpencil-issue-201')
          OUT.mkdir(parents=True, exist_ok=True)
          url=f"http://127.0.0.1:{os.environ['OPENPENCIL_MCP_PORT']}/mcp"
          next_id=10

          def rpc(method, params):
              global next_id
              next_id += 1
              body=json.dumps({"jsonrpc":"2.0","id":next_id,"method":method,"params":params},ensure_ascii=False).encode()
              req=urllib.request.Request(url,data=body,headers={"Content-Type":"application/json"},method="POST")
              with urllib.request.urlopen(req,timeout=20) as response:
                  payload=json.loads(response.read().decode())
              if "error" in payload:
                  raise RuntimeError(payload["error"])
              return payload

          def tool(name, args=None, allow_error=False):
              payload=rpc("tools/call",{"name":name,"arguments":args or {}})
              result=payload.get("result",{})
              content=result.get("content",[])
              text="\n".join(item.get("text","") for item in content if "text" in item)
              if result.get("isError") and not allow_error:
                  raise RuntimeError(f"{name}: {text}")
              try:
                  decoded=json.loads(text) if text else None
              except Exception:
                  decoded=text
              return text, decoded, bool(result.get("isError"))

          pages_text,pages_value,_=tool('list_pages')
          (OUT/'pages.json').write_text(json.dumps(pages_value,ensure_ascii=False,indent=2) if not isinstance(pages_value,str) else pages_value,encoding='utf-8')
          pages=pages_value.get('pages',[]) if isinstance(pages_value,dict) else []
          if len(pages)!=23:
              raise AssertionError(f"expected 23 pages, got {len(pages)}: {pages_text[:1000]}")

          targets=[
              'Mobile / Onboarding / Light',
              'Mobile / Home Loading / Dark',
              'Mobile / Error / Dark',
              'Desktop / Profile / Light',
              'Desktop / Offline / Dark',
              'Pattern/First Use/Mobile',
              'Section/First Use',
              'Prototype / Mobile / Onboarding / Light',
              'LexiGo / Product Screen Map',
          ]
          found={}
          for index,page in enumerate(pages):
              tool('set_active_page',{'index':index})
              for name in targets:
                  if name in found:
                      continue
                  text,_,is_error=tool('find_node_by_name',{'name':name},allow_error=True)
                  if is_error or not text:
                      continue
                  ids=re.findall(r'fig_\d+',text)
                  if not ids:
                      continue
                  node_id=ids[0]
                  node_text,_,_=tool('get_node',{'node_id':node_id})
                  tree_text,_,_=tool('read_nodes',{'nodeIds':[node_id],'depth':6})
                  key=re.sub(r'[^A-Za-z0-9]+','-',name).strip('-').lower()
                  (OUT/f'{key}-node.txt').write_text(node_text,encoding='utf-8')
                  (OUT/f'{key}-tree.txt').write_text(tree_text,encoding='utf-8')
                  _,shot_value,_=tool('get_screenshot',{'nodeId':node_id})
                  if isinstance(shot_value,dict) and shot_value.get('image_base64'):
                      png=base64.b64decode(shot_value['image_base64'])
                      (OUT/f'{key}.png').write_bytes(png)
                      png_sha=hashlib.sha256(png).hexdigest()
                  else:
                      png_sha=None
                  found[name]={
                      'pageIndex':index,
                      'pageId':page.get('id'),
                      'pageName':page.get('name'),
                      'nodeId':node_id,
                      'screenshotSha256':png_sha,
                  }

          required=['Mobile / Onboarding / Light','Mobile / Home Loading / Dark','Mobile / Error / Dark','Desktop / Profile / Light','Desktop / Offline / Dark']
          missing=[name for name in required if name not in found]
          manifest={
              'sourceSha256':hashlib.sha256(Path('design/openpencil/LexiGo Design System.op').read_bytes()).hexdigest(),
              'pageCount':len(pages),
              'found':found,
              'missingRequired':missing,
          }
          (OUT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          if missing:
              raise AssertionError(f"missing required imported source nodes: {missing}")
          PY

      - name: Prove inspection did not mutate source
        run: |
          set -Eeuo pipefail
          test "$(sha256sum 'design/openpencil/LexiGo Design System.op' | awk '{print $1}')" = 5380a0468d4e369d91ac190b829e01f60ff43493f6a76c9300c6b58d0b34d664
          test -z "$(git status --porcelain -- 'design/openpencil/LexiGo Design System.op' 'design/openpencil/LexiGo Design Tokens.json')"

      - name: Upload inspection evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openpencil-issue-201-inspect-${{ github.sha }}
          path: .tmp/openpencil-issue-201/
          if-no-files-found: warn
          retention-days: 3

      - name: Cleanup disposable runtime
        if: always()
        run: |
          set +e
          docker compose -p "$OPENPENCIL_COMPOSE_PROJECT" -f deploy/openpencil/compose.yml --profile agent down --volumes --remove-orphans
          rm -rf "$OPENPENCIL_WORKTREE" "$OPENPENCIL_STATE_DIR" "$OPENPENCIL_BACKUP_DIR"
